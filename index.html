<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - SAGE MINIMALIST</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=400;700;900&family=Rajdhani:wght=500;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        --panel-bg: rgba(10, 3, 1, 0.9); /* Transparan gelap agar gambar latar belakang tembus cantik */
        --kurama-orange: #ff4500;    
        --sage-gold: #ffaa00;        
        --shimmer-naruto: linear-gradient(135deg, #ff4500 0%, #ffaa00 50%, #ff4500 100%);
        --text-white: #ffffff;
    }

    body {
        font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: var(--text-white);
        
        /* SOLUSI PASTI: Menggunakan gambar aura chakra asli yang dijamin tembus di semua browser */
        background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-color: #000000; /* Cadangan jika internet lambat */
        position: relative;
    }

    /* Lapisan filter oranye di atas gambar agar nuansa Kurama/Sage Mode lebih pekat */
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, rgba(0, 0, 0, 0.85) 0%, rgba(255, 69, 0, 0.15) 100%);
        z-index: 1;
        pointer-events: none; /* Supaya klik mouse tembus ke tombol */
    }
    
    /* PANEL UTAMA - SAGE GLASSMORPHISM */
    .container {
        background: var(--panel-bg); 
        border: 2px solid rgba(255, 69, 0, 0.4); /* Bingkai menyala oranye */
        border-radius: 20px; 
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-sizing: border-box;
        backdrop-filter: blur(10px); 
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 
            0 25px 60px rgba(0, 0, 0, 0.9), 
            0 0 30px rgba(255, 69, 0, 0.3);
        position: relative;
        z-index: 10; /* Berada aman di atas background */
    }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: var(--text-white);
        font-size: 36px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 8px;
        margin: 0;
        text-shadow: 0 0 20px var(--kurama-orange);
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;
        background: var(--shimmer-naruto);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 6px;
        font-weight: 900;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 35px;
        animation: shine 2.5s linear infinite;
    }
    
    @keyframes shine {
        to { background-position: 200% center; }
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--sage-gold);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    
    /* INPUT AREA */
    textarea {
        width: 100%;
        height: 140px;
        background: rgba(0, 0, 0, 0.85);
        border: 1px solid rgba(255, 69, 0, 0.3); 
        border-radius: 10px;
        color: #ffffff;
        padding: 18px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 30px;
        box-shadow: inset 0 2px 8px rgba(0,0,0,0.9);
        transition: all 0.3s ease;
    }
    
    textarea:focus {
        outline: none;
        border-color: rgba(255, 69, 0, 0.7);
        box-shadow: inset 0 2px 8px rgba(0,0,0,1), 0 0 15px rgba(255, 69, 0, 0.4);
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 40px;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        padding: 18px; 
        font-size: 13px;   
        font-weight: 900;
        border: none;
        border-radius: 10px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2.5px;
        transition: all 0.2s ease;
    }
    
    .btn-submit { 
        background: var(--kurama-orange); 
        color: #ffffff; 
        box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
    }
    .btn-submit:hover {
        background: #ff6a1f;
        transform: translateY(-2px);
    }
    
    .btn-copy { 
        background: rgba(255, 255, 255, 0.03); 
        color: #ffffff; 
        border: 2px solid var(--sage-gold);
    }
    .btn-copy:hover { 
        background: var(--sage-gold);
        color: #000000;
        transform: translateY(-2px);
    }
    
    .btn-reset { 
        background: #230604; 
        color: var(--text-white); 
        border: 1px solid rgba(255, 69, 0, 0.2);
    }
    .btn-reset:hover { 
        background: #380b06;
        transform: translateY(-2px);
    }
    
    /* TABEL DATA */
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 12px;
        border: none; 
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: transparent; 
    }
    
    th, td {
        border: none; 
        padding: 16px 20px;
        text-align: left;
        font-size: 14px;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background-color: rgba(35, 9, 4, 0.9); 
        color: var(--sage-gold); 
        font-weight: 900; 
        letter-spacing: 2px;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(255, 69, 0, 0.3);
    }
    
    td {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        color: #e2e8f0;
    }

    td:nth-child(4) {
        color: #00ffcc; 
        font-weight: 900;
    }

    td:nth-child(5) {
        font-family: 'Orbitron', sans-serif;
        color: var(--sage-gold); 
        text-shadow: 0 0 8px rgba(255, 170, 0, 0.6);
        font-weight: 900;
    }
    
    tr:nth-child(even) {
        background-color: rgba(255, 255, 255, 0.02);
    }

    tr:hover {
        background-color: rgba(255, 69, 0, 0.08);
    }
</style>
</head>
<body>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">Sage Mode - Konoha Kasir v6.0</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="SAGE CHAKRA DETECTED... READY TO TRANSLATE LOGS..."></textarea>
    
    <div class="btn-group">
        <button id="btnSubmit" class="btn-submit" onclick="konversiLog()">Submit</button>
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let creditStatus = "CR"; 
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${creditStatus}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin! Silakan submit log terlebih dahulu.");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "JURUS COPY SUKSES!";
            btnCopy.style.background = "var(--kurama-orange)";
            btnCopy.style.color = "#ffffff";
            
            setTimeout(() => {
                btnCopy.innerText = teksAwal;
                btnCopy.style.background = "rgba(255, 255, 255, 0.03)";
                btnCopy.style.color = "#ffffff";
            }, 1500);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data, pastikan izin clipboard aktif.");
        });
    }
</script>
</body>
</html>
