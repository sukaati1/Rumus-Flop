<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - CYBERPUNK MATRIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=400;700;900&family=Rajdhani:wght=500;600;700&display=swap" rel="stylesheet">
    
<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #080711;
        overflow-x: hidden;
        font-family: 'Rajdhani', sans-serif;
        color: #ffffff;
    }

    /* Canvas Animation background */
    #cyberCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        pointer-events: none;
    }

    body {
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* Panel utama dengan efek Glassmorphism + Neon Glow */
    .container {
        background: rgba(15, 12, 30, 0.82); 
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 2px solid #ff0055; 
        border-radius: 16px; 
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-shadow: 0 0 35px rgba(255, 0, 85, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
        position: relative;
        z-index: 10;
        margin: auto;
    }

    /* Aksen sudut futuristik */
    .container::before, .container::after {
        content: '';
        position: absolute;
        width: 25px;
        height: 25px;
        border: 4px solid #00f0ff;
        z-index: 11;
        pointer-events: none;
        box-shadow: 0 0 15px #00f0ff;
    }
    .container::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 16px; }
    .container::after { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 16px; }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: #ffffff;
        font-size: 38px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 6px;
        margin: 0;
        text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 13px;
        color: #00f0ff; 
        letter-spacing: 4px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 35px;
        text-shadow: 0 0 12px #00f0ff;
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 12px;
        color: #ff0055; 
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-family: 'Orbitron', sans-serif;
    }
    
    textarea {
        width: 100%;
        height: 140px;
        background: rgba(8, 6, 18, 0.9);
        border: 2px solid rgba(0, 240, 255, 0.6); 
        border-radius: 8px;
        color: #00f0ff;
        padding: 18px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 30px;
    }
    textarea:focus {
        outline: none;
        border-color: #ff0055;
        box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
    }
    
    .btn-group {
        display: flex;
        gap: 20px;
        margin-bottom: 40px;
        flex-wrap: wrap;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        min-width: 120px;
        padding: 18px; 
        font-size: 14px;    
        font-weight: 900;
        border: none;
        border-radius: 8px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 3px;
        transition: all 0.2s ease;
    }
    
    .btn-copy { 
        background: linear-gradient(135deg, #ff0055 0%, #00f0ff 100%); 
        color: #ffffff; 
        box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
    }
    .btn-copy:hover { 
        box-shadow: 0 0 30px #00f0ff;
        transform: translateY(-2px);
    }
    
    .btn-reset { 
        background: rgba(25, 20, 45, 0.8); 
        color: #a0aec0; 
        border: 2px solid #ff0055;
    }
    .btn-reset:hover { 
        background: rgba(45, 30, 75, 0.9); 
        color: #fff;
        transform: translateY(-2px);
    }
    
    .table-container { 
        overflow-x: auto; 
        border-radius: 8px;
        border: 2px solid #00f0ff;
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(8, 6, 18, 0.9);
    }
    
    th, td {
        padding: 16px 20px;
        text-align: left;
        font-size: 15px;
        white-space: nowrap;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background: rgba(20, 15, 35, 0.95); 
        color: #ff0055; 
        font-weight: 700; 
        border-bottom: 3px solid #00f0ff;
    }
    
    td {
        font-weight: 700;
        color: #ffffff;
        border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    }
    
    tr:nth-child(even) {
        background-color: rgba(255, 0, 85, 0.05);
    }
    tr:hover td {
        color: #00f0ff;
        background-color: rgba(0, 240, 255, 0.15);
    }
</style>
</head>
<body>

<!-- Canvas Latar Belakang Animasi -->
<canvas id="cyberCanvas"></canvas>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">KONOHA KASIR - CYBERPUNK EDITION v10.1</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="Tempel log transaksi mentah di sini (Otomatis Terkonversi)..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
    
    <div class="btn-group">
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    /* =======================================================
       ANIMASI BACKGROUND CYBERPUNK NEON NETWORK
       ======================================================= */
    const canvas = document.getElementById('cyberCanvas');
    const ctx = canvas.getContext('2d');

    function resize() { 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
    }
    resize(); 
    window.addEventListener('resize', resize);

    // Membuat partikel neon bertema Merah & Cyan
    const particles = Array.from({length: 65}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        color: Math.random() > 0.5 ? '#ff0055' : '#00f0ff'
    }));

    function draw() {
        ctx.fillStyle = 'rgba(8, 7, 17, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach((p, i) => {
            p.x += p.vx; 
            p.y += p.vy;

            // Memantul jika mengenai pinggiran layar
            if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

            // Gambar titik neon
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 10; 
            ctx.shadowColor = p.color;
            ctx.fill();

            // Hubungkan titik-titik dengan garis neon
            for(let j = i + 1; j < particles.length; j++) {
                const p2 = particles[j];
                const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                if(dist < 130) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y); 
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = p.color;
                    ctx.globalAlpha = 1 - (dist / 130);
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }
            }
        });
        requestAnimationFrame(draw);
    }
    draw();

    /* =======================================================
       LOGIKA KASIR (TRANSAKSI KONVERSI)
       ======================================================= */
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n'); 
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let creditStatus = "-"; 
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin!");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "BERHASIL DISALIN!";
            setTimeout(() => { btnCopy.innerText = teksAwal; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data otomatis.");
        });
    }
</script>
</body>
</html>
