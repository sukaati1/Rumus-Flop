<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T'chat Module</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            color-scheme: only dark !important;
            --blue-electric: #00d2ff;
            --purple-neon: #a855f7;
            --purple-bright: #d8b4fe;
            --pink-neon: #ff007f;
            --cyan-neon: #00f0ff;
            --lavender-bg: rgba(147, 112, 219, 0.15); 
            --lavender-border: #c89eff;               
            --lavender-text: #e8d7ff;                 
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030308;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* OVERLAY MODAL UMUM */
        .chat-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        #profileModal, #registerModal, #friendsModal { z-index: 1002 !important; }
        #imageViewerModal { z-index: 1003 !important; }

        /* MODAL AUTH & FORM */
        .auth-modal {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: rgba(5, 5, 8, 0.95);
            border-radius: 20px;
            border: 2px solid var(--lavender-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form { display: flex; flex-direction: column; gap: 12px; }
        .auth-input-group { display: flex; flex-direction: column; gap: 5px; }

        .auth-input-group label {
            font-family: 'Orbitron', sans-serif;
            font-size: 9.5px;
            color: var(--purple-bright);
            letter-spacing: 1px;
        }

        .auth-input-group input {
            background: rgba(20, 20, 28, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            outline: none;
        }

        .auth-input-group input:focus {
            border-color: var(--cyan-neon);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .auth-close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: transparent; border: none;
            color: var(--pink-neon);
            font-size: 18px; font-weight: 900;
            cursor: pointer;
        }

        /* TOMBOL UTAMA */
        button {
            position: relative; overflow: hidden;
            padding: 12px; font-family: 'Orbitron', sans-serif;
            font-size: 11px; font-weight: 900; cursor: pointer;
            letter-spacing: 1.5px; text-transform: uppercase;
            border-radius: 15px; border: 2px solid var(--lavender-border);
            background: var(--lavender-bg); color: var(--lavender-text);
            transition: all 0.2s ease;
        }

        button:hover {
            background: rgba(147, 112, 219, 0.35);
            border-color: #ffffff;
            box-shadow: 0 0 15px #b57edc;
        }

        .btn-admin-reg {
            background: rgba(255, 0, 127, 0.2);
            border: 1px solid var(--pink-neon);
            color: #ffffff;
            margin-top: 5px;
        }

        /* PROFIL AVATAR EDIT */
        .avatar-selection-box {
            display: flex; flex-direction: column;
            align-items: center; gap: 10px;
        }

        .avatar-preview-img {
            width: 70px; height: 70px;
            border-radius: 50%; object-fit: cover;
            border: 2px solid var(--cyan-neon);
            box-shadow: 0 0 10px var(--cyan-neon);
        }

        /* CONTAINER UTAMA CHAT */
        .chat-modal {
            position: relative;
            width: 100%; max-width: 650px;
            height: 90vh; max-height: 720px;
            background: rgba(5, 5, 8, 0.95);
            border-radius: 20px;
            border: 2px solid var(--lavender-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
            padding: 20px;
            display: flex; flex-direction: column;
            gap: 10px; overflow: hidden;
        }

        .chat-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(200, 158, 255, 0.2);
            padding-bottom: 10px; flex-shrink: 0;
        }

        .chat-header h3 {
            margin: 0; font-family: 'Orbitron', sans-serif;
            font-weight: 900; font-size: 20px; letter-spacing: 3px;
            background: linear-gradient(90deg, var(--cyan-neon), var(--blue-electric), var(--pink-neon), var(--purple-neon), var(--cyan-neon));
            background-size: 200% auto;
            color: transparent; -webkit-background-clip: text; background-clip: text;
            animation: shineText 3s linear infinite;
        }

        @keyframes shineText { to { background-position: 200% center; } }

        .header-controls { display: flex; align-items: center; gap: 8px; }

        .btn-hdr-action {
            font-size: 9.5px; padding: 6px 14px;
            border-radius: 15px; flex: none;
        }

        .btn-reset-chat { background: rgba(255, 0, 127, 0.15); border: 1px solid rgba(255, 0, 127, 0.4); color: var(--pink-neon); }
        .btn-logout-chat { background: rgba(0, 210, 255, 0.15); border: 1px solid rgba(0, 210, 255, 0.4); color: var(--cyan-neon); }
        .btn-profile-chat { background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.4); color: var(--purple-bright); }
        .btn-friends-chat { background: rgba(0, 255, 136, 0.15); border: 1px solid rgba(0, 255, 136, 0.4); color: #00ff88; }
        .btn-close-chat { background: transparent; border: none; color: var(--pink-neon); font-size: 20px; font-weight: 900; cursor: pointer; }

        /* AREA BUBBLE PESAN */
        .chat-body {
            flex: 1; overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 12px;
            background: #09090d; display: flex;
            flex-direction: column; gap: 12px;
        }

        .chat-msg-wrapper { display: flex; gap: 10px; width: 100%; align-items: flex-start; }
        .chat-msg-wrapper.own-msg { flex-direction: row-reverse; }

        .msg-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            object-fit: cover; border: 1.5px solid var(--purple-bright);
            flex-shrink: 0; cursor: pointer; transition: transform 0.2s;
        }
        .msg-avatar:hover { transform: scale(1.1); border-color: var(--cyan-neon); }

        .msg-content-container { display: flex; flex-direction: column; max-width: 80%; }
        .chat-msg-wrapper.own-msg .msg-content-container { align-items: flex-end; }

        .msg-header-info { display: flex; align-items: center; gap: 6px; font-size: 10.5px; margin-bottom: 3px; }
        .chat-msg-wrapper.own-msg .msg-header-info { flex-direction: row-reverse; }
        .sender { font-weight: 800; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
        .time-stamp { color: rgba(255, 255, 255, 0.4); font-size: 9.5px; font-family: 'JetBrains Mono', monospace; }

        .msg-actions { display: flex; gap: 6px; opacity: 0.6; }
        .chat-msg-wrapper:hover .msg-actions { opacity: 1; }
        .btn-action-msg { color: rgba(255, 255, 255, 0.7); cursor: pointer; font-size: 11px; }
        .btn-action-msg:hover { color: var(--cyan-neon); transform: scale(1.2); }

        .chat-msg {
            position: relative; font-family: 'JetBrains Mono', monospace;
            font-size: 12px; padding: 8px 12px; border-radius: 12px;
            word-break: break-word; width: fit-content; line-height: 1.35;
        }

        .chat-msg-wrapper.other-msg .chat-msg { background: rgba(45, 45, 50, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); border-top-left-radius: 2px; }
        .chat-msg-wrapper.own-msg .chat-msg { background: rgba(65, 65, 72, 0.95); border: 1px solid rgba(255, 255, 255, 0.25); border-top-right-radius: 2px; }

        .chat-msg .chat-media-img { max-width: 220px; max-height: 220px; border-radius: 8px; cursor: pointer; margin-top: 4px; }
        .chat-msg .chat-media-video { max-width: 240px; max-height: 220px; border-radius: 8px; margin-top: 4px; }

        .msg-reactions-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .chat-msg-wrapper.own-msg .msg-reactions-container { justify-content: flex-end; }

        .reaction-badge {
            display: inline-flex; align-items: center; gap: 3px;
            background: rgba(20, 20, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; padding: 2px 6px; font-size: 11px; cursor: pointer;
        }
        .reaction-badge.active-user { background: rgba(0, 240, 255, 0.2); border-color: var(--cyan-neon); }
        .reaction-badge .reaction-count { font-size: 10px; color: var(--cyan-neon); font-weight: bold; }

        .reply-quote-box {
            background: rgba(0, 0, 0, 0.4); border-left: 3px solid var(--cyan-neon);
            padding: 3px 6px; border-radius: 4px; margin-bottom: 6px; font-size: 10px;
        }
        .reply-quote-box .reply-author { color: var(--cyan-neon); font-weight: bold; }

        .reply-preview-container {
            display: none; justify-content: space-between; align-items: center;
            background: rgba(0, 210, 255, 0.15); border-left: 3px solid var(--cyan-neon);
            padding: 4px 10px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
        }

        .sticker-picker-container {
            display: none; grid-template-columns: repeat(6, 1fr); gap: 8px;
            background: rgba(16, 16, 24, 0.95); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; padding: 8px; max-height: 100px; overflow-y: auto;
        }
        .sticker-item { font-size: 22px; text-align: center; cursor: pointer; border-radius: 6px; }
        .sticker-item:hover { background: rgba(0, 210, 255, 0.25); transform: scale(1.2); }

        /* FOOTER CHAT INPUT */
        .chat-footer { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .user-profile-thumb { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--cyan-neon); cursor: pointer; }

        .chat-footer input#chatUser {
            width: 100px; background: rgba(20, 20, 28, 0.9); border: 1px solid rgba(168, 85, 247, 0.4);
            color: var(--cyan-neon); padding: 8px 10px; border-radius: 12px;
            font-family: 'JetBrains Mono', monospace; font-size: 11.5px; height: 40px; text-transform: uppercase; font-weight: bold;
        }

        .chat-footer textarea#chatText {
            flex: 1; background: rgba(20, 20, 28, 0.9); border: 1px solid rgba(168, 85, 247, 0.4);
            color: #fff; padding: 8px 12px; border-radius: 12px;
            font-family: 'JetBrains Mono', monospace; font-size: 12px; outline: none; resize: none; height: 40px;
        }

        .btn-sticker-toggle, .btn-attach-media {
            width: 40px; padding: 0; border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.4); background: rgba(20, 20, 28, 0.9);
            color: #ffffff; font-size: 16px; height: 40px; display: flex; align-items: center; justify-content: center;
        }

        .btn-send-chat { height: 40px; padding: 0 16px; border-radius: 12px; font-size: 11px; }

        /* TAB SISTEM PERTEMANAN */
        .friends-nav-tabs { display: flex; gap: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 8px; font-size: 10px; border-radius: 10px; }
        .tab-btn.active { background: var(--cyan-neon); color: #000; border-color: #fff; }

        .friends-list-container { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
        .friend-card { display: flex; align-items: center; justify-content: space-between; background: rgba(20, 20, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 12px; border-radius: 10px; }
        .friend-info { display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: bold; }
        .btn-action-friend { padding: 4px 8px; font-size: 9px; border-radius: 8px; }

        /* FULL IMAGE VIEWER */
        .image-viewer-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); display: none;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .image-viewer-modal img { max-width: 85vw; max-height: 80vh; border-radius: 15px; border: 2px solid var(--cyan-neon); box-shadow: 0 0 30px rgba(0, 240, 255, 0.5); object-fit: contain; }
        .image-viewer-username { margin-top: 15px; font-family: 'Orbitron', sans-serif; color: #ffffff; font-size: 16px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <!-- TOMBOL UNTUK MEMBUKA CHAT -->
    <button onclick="handleChatClick()">BUKA T'CHAT 🔥</button>

    <!-- MODAL AUTH LOGIN -->
    <div class="chat-modal-overlay" id="authModal" style="display:none;">
        <div class="auth-modal">
            <button class="auth-close-btn" onclick="closeAuthModal()">X</button>
            <h3 style="margin: 0; text-align: center; font-family: 'Orbitron', sans-serif; color: var(--cyan-neon); font-size: 16px;">MASUK AKUN</h3>
            <div class="auth-form">
                <div class="auth-input-group">
                    <label>NAMA USER ID</label>
                    <input type="text" id="loginUser" placeholder="Masukkan User ID..." oninput="this.value = this.value.toUpperCase()">
                </div>
                <div class="auth-input-group">
                    <label>PASSWORD</label>
                    <input type="password" id="loginPass" placeholder="Masukkan password...">
                </div>
                <button onclick="submitLogin()">LOGIN SEKARANG 🔥</button>
            </div>
        </div>
    </div>

    <!-- MODAL REGISTRASI USER BARU (KHUSUS ADMIN) -->
    <div class="chat-modal-overlay" id="registerModal" style="display:none;">
        <div class="auth-modal">
            <button class="auth-close-btn" onclick="closeRegisterModal()">X</button>
            <h3 style="margin: 0; text-align: center; font-family: 'Orbitron', sans-serif; color: var(--pink-neon); font-size: 16px;">REGISTRASI USER BARU</h3>
            <div class="auth-form">
                <div class="auth-input-group">
                    <label>USERNAME BARU</label>
                    <input type="text" id="regUser" placeholder="Masukkan User ID Baru..." oninput="this.value = this.value.toUpperCase()">
                </div>
                <div class="auth-input-group">
                    <label>PASSWORD BARU</label>
                    <input type="password" id="regPass" placeholder="Masukkan Password Baru...">
                </div>
                <button class="btn-admin-reg" onclick="submitRegisterNewUser()">BUAT AKUN BARU 👑</button>
            </div>
        </div>
    </div>

    <!-- MODAL EDIT PROFIL -->
    <div class="chat-modal-overlay" id="profileModal" style="display:none;">
        <div class="auth-modal">
            <button class="auth-close-btn" onclick="closeProfileModal()">X</button>
            <h3 style="margin: 0; text-align: center; font-family: 'Orbitron', sans-serif; color: var(--purple-bright); font-size: 16px;">EDIT PROFIL AKUN</h3>
            <div class="auth-form">
                <div class="avatar-selection-box">
                    <img id="editAvatarPreview" class="avatar-preview-img" src="" alt="Preview">
                    <button style="font-size: 9px; padding: 6px 10px;" onclick="document.getElementById('editAvatarFile').click()">UPLOAD FOTO PC/HP 📷</button>
                    <input type="file" id="editAvatarFile" accept="image/*" style="display: none;" onchange="handleEditAvatarUpload(event)">
                </div>
                <div class="auth-input-group">
                    <label>NAMA USER</label>
                    <input type="text" id="editUserName" placeholder="Nama User..." oninput="this.value = this.value.toUpperCase()">
                </div>
                <div class="auth-input-group">
                    <label>PASSWORD BARU (OPSIONAL)</label>
                    <input type="password" id="editUserPass" placeholder="Isi jika ingin ganti password...">
                </div>
                <button onclick="saveProfileChanges()">SIMPAN PERUBAHAN 💾</button>
                <button id="btnAdminOpenReg" class="btn-admin-reg" style="display: none;" onclick="openRegisterModal()">+ REGISTRASI AKUN BARU (ADMIN)</button>
            </div>
        </div>
    </div>

    <!-- MODAL PERTEMANAN & DM -->
    <div class="chat-modal-overlay" id="friendsModal" style="display:none;">
        <div class="auth-modal">
            <button class="auth-close-btn" onclick="closeFriendsModal()">X</button>
            <h3 style="margin: 0; text-align: center; font-family: 'Orbitron', sans-serif; color: #00ff88; font-size: 16px;">SISTEM PERTEMANAN</h3>
            <div class="friends-nav-tabs">
                <button class="tab-btn active" id="tabFriendsBtn" onclick="switchFriendsTab('friends')">PERTEMANAN</button>
                <button class="tab-btn" id="tabRequestsBtn" onclick="switchFriendsTab('requests')">PERMINTAAN</button>
                <button class="tab-btn" id="tabAddBtn" onclick="switchFriendsTab('add')">CARI TEMAN</button>
            </div>
            <div id="tabFriendsContent" class="friends-list-container"></div>
            <div id="tabRequestsContent" class="friends-list-container" style="display: none;"></div>
            <div id="tabAddContent" style="display: none;" class="auth-form">
                <div class="auth-input-group">
                    <label>CARI USER ID TEMAN</label>
                    <input type="text" id="targetFriendUser" placeholder="Masukkan User ID..." oninput="this.value = this.value.toUpperCase()">
                </div>
                <button onclick="sendFriendRequest()">KIRIM PERMINTAAN PERTEMANAN 🤝</button>
            </div>
        </div>
    </div>

    <!-- MODAL T'CHAT UTAMA -->
    <div class="chat-modal-overlay" id="chatModal" style="display:none;">
        <div class="chat-modal">
            <div class="chat-header">
                <h3 id="chatTitleHeader">T'chat</h3>
                <div class="header-controls">
                    <button class="btn-hdr-action btn-friends-chat" onclick="openFriendsModal()">TEMAN 🤝</button>
                    <button class="btn-hdr-action btn-profile-chat" onclick="openProfileModal()">PROFIL</button>
                    <button class="btn-hdr-action btn-logout-chat" onclick="logoutChat()">LOGOUT</button>
                    <button class="btn-hdr-action btn-reset-chat" onclick="clearAllChat()">RESET</button>
                    <button class="btn-close-chat" onclick="closeTeamChat()">X</button>
                </div>
            </div>

            <div class="chat-body" id="chatLogs"></div>

            <div class="reply-preview-container" id="replyPreview">
                <div class="reply-preview-text" id="replyPreviewText">Balas: ...</div>
                <span style="color:var(--pink-neon); cursor:pointer; font-weight:bold;" onclick="cancelReply()">&times;</span>
            </div>

            <div class="sticker-picker-container" id="stickerPicker">
                <span class="sticker-item" onclick="sendSticker('🔥')">🔥</span>
                <span class="sticker-item" onclick="sendSticker('⚡')">⚡</span>
                <span class="sticker-item" onclick="sendSticker('🚀')">🚀</span>
                <span class="sticker-item" onclick="sendSticker('😎')">😎</span>
                <span class="sticker-item" onclick="sendSticker('👍')">👍</span>
                <span class="sticker-item" onclick="sendSticker('🎉')">🎉</span>
                <span class="sticker-item" onclick="sendSticker('💎')">💎</span>
                <span class="sticker-item" onclick="sendSticker('👾')">👾</span>
                <span class="sticker-item" onclick="sendSticker('🤖')">🤖</span>
                <span class="sticker-item" onclick="sendSticker('💀')">💀</span>
                <span class="sticker-item" onclick="sendSticker('💯')">💯</span>
                <span class="sticker-item" onclick="sendSticker('🎯')">🎯</span>
            </div>

            <div class="chat-footer">
                <img id="myChatAvatar" class="user-profile-thumb" src="" alt="Avatar" onclick="openProfileModal()" />
                <input type="text" id="chatUser" readonly title="Akun Terkunci" />
                <textarea id="chatText" placeholder="Tulis pesan..." onkeydown="handleChatKey(event)"></textarea>

                <button class="btn-attach-media" onclick="document.getElementById('mediaFileInput').click()" title="Kirim Foto/Video">📷</button>
                <input type="file" id="mediaFileInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(event)">

                <button class="btn-sticker-toggle" onclick="toggleStickerPicker()" title="Pilih Stiker">😊</button>
                <button class="btn-send-chat" onclick="sendChatMessage()">KIRIM 🔥</button>
            </div>
        </div>
    </div>

    <!-- VIEW FULLSIZE MEDIA/FOTO -->
    <div class="image-viewer-modal" id="imageViewerModal" onclick="closeImageViewer()">
        <img id="fullsizeImage" src="" alt="Fullsize Avatar">
        <div class="image-viewer-username" id="fullsizeUsername">USERNAME</div>
    </div>
