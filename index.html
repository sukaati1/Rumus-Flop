<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>Rumus Flop Kasir - Ultra Light Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only dark !important;
        --blue-electric: #00d2ff;
        --purple-neon: #a855f7;
        --purple-bright: #d8b4fe;
        --pink-neon: #ff007f;
        --cyan-neon: #00f0ff;
        --lavender-bg: rgba(147, 112, 219, 0.15); 
        --lavender-border: #c89eff;               
        --lavender-text: #e8d7ff;                 
        --lavender-glow: #b57edc; 
    }

    * { box-sizing: border-box; user-select: none; }

    html, body {
        width: 100%; min-height: 100vh; margin: 0; padding: 0;
        background-color: #030308; overflow-x: hidden;
    }

    body {
        padding: 30px 15px; font-family: 'Rajdhani', sans-serif;
        color: #ffffff !important; display: flex; justify-content: center; align-items: center;
    }

    .bg-video {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        object-fit: cover; z-index: 1; pointer-events: none;
    }

    @property --border-angle {
        syntax: '<angle>'; inherits: false; initial-value: 0deg;
    }

    @keyframes spinBorder { 
        0% { --border-angle: 0deg; }
        100% { --border-angle: 360deg; } 
    }

    .container {
        position: relative; 
        z-index: 2; 
        background: rgba(10, 8, 25, 0.55) !important; 
        backdrop-filter: blur(8px); 
        -webkit-backdrop-filter: blur(8px);
        border-radius: 40px !important; 
        width: 100%; 
        max-width: 900px; 
        padding: 40px; 
        margin: auto;
        box-shadow: 0 0 25px rgba(0, 210, 255, 0.3), inset 0 0 15px rgba(200, 158, 255, 0.15);
    }

    .container::before {
        content: ''; 
        position: absolute; 
        inset: 0; 
        border-radius: 40px; 
        padding: 3px;
        background: conic-gradient(
            from var(--border-angle), 
            rgba(0, 210, 255, 0.1) 0%, 
            var(--blue-electric) 25%, 
            #ffffff 50%, 
            var(--cyan-neon) 75%, 
            rgba(0, 210, 255, 0.1) 100%
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor; 
        mask-composite: exclude; 
        pointer-events: none;
        animation: spinBorder 4s linear infinite;
    }

    .container.hidden-for-chat { display: none !important; }

    h1 {
        text-align: center; font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 900;
        letter-spacing: 4px; margin: 0;
        background: linear-gradient(90deg, var(--cyan-neon), var(--blue-electric), var(--pink-neon), var(--purple-neon), var(--cyan-neon));
        background-size: 200% auto; color: transparent !important;
        -webkit-background-clip: text; background-clip: text;
        animation: shineText 3s linear infinite;
        filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.5));
    }

    @keyframes shineText { to { background-position: 200% center; } }

    .sub-title {
        text-align: center; font-family: 'Orbitron', sans-serif; font-size: 11px;
        color: var(--purple-bright) !important; letter-spacing: 6px; font-weight: 800;
        text-transform: uppercase; margin-top: 8px; margin-bottom: 28px;
    }

    .label-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .label-actions { display: flex; align-items: center; gap: 8px; }
    
    label {
        display: block; font-family: 'Orbitron', sans-serif; font-weight: 800;
        color: var(--purple-bright) !important; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    }

    .badge-count, .btn-swap-pos {
        font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 15px;
        background: rgba(0, 210, 255, 0.15); color: var(--cyan-neon) !important;
        border: 1px solid rgba(0, 240, 255, 0.5); font-family: 'Orbitron', sans-serif;
        cursor: pointer; transition: all 0.2s ease; display: inline-block;
    }

    .btn-swap-pos { background: rgba(168, 85, 247, 0.15); color: var(--purple-bright) !important; border-color: rgba(168, 85, 247, 0.5); }
    .badge-count:hover, .btn-swap-pos:hover { background: rgba(0, 210, 255, 0.35); border-color: #fff; color: #fff !important; box-shadow: 0 0 12px var(--cyan-neon); transform: scale(1.05); }

    textarea#rawInput {
        width: 100%; height: 120px; background: rgba(0, 0, 0, 0.3) !important;
        border: 1.5px solid rgba(168, 85, 247, 0.3) !important; border-radius: 12px;
        color: var(--cyan-neon) !important; padding: 14px; resize: vertical;
        font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13.5px;
        margin-bottom: 20px; user-select: text; outline: none;
    }

    textarea#rawInput:focus { border-color: var(--blue-electric) !important; background: rgba(0, 0, 0, 0.5) !important; box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); }

    .btn-group { display: flex; gap: 16px; margin-bottom: 28px; }
    .btn-group.swapped { flex-direction: row-reverse; }

    button {
        position: relative; overflow: hidden; flex: 1; padding: 16px 20px;
        font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 900;
        cursor: pointer; letter-spacing: 2px; text-transform: uppercase; outline: none;
        border-radius: 35px !important; border: 2px solid var(--lavender-border) !important;
        background: var(--lavender-bg) !important; color: var(--lavender-text) !important;
        text-shadow: 0 0 6px rgba(181, 126, 220, 0.6);
        box-shadow: 0 0 12px rgba(200, 158, 255, 0.5), inset 0 0 8px rgba(181, 126, 220, 0.2);
        transition: transform 0.1s ease, box-shadow 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    button:hover { 
        background: rgba(147, 112, 219, 0.35) !important; 
        border-color: #fff !important; 
        box-shadow: 0 0 20px #b57edc, inset 0 0 12px rgba(255, 255, 255, 0.4); 
    }

    #btnCopy:focus-visible, #btnReset:focus-visible {
        outline: none;
        border-color: var(--cyan-neon) !important;
        box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.4), 0 0 15px var(--blue-electric) !important;
    }

    button::after {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        width: 10px; height: 10px;
        background: var(--cyan-neon);
        opacity: 0;
        border-radius: 100%;
        transform: translate(-50%, -50%) scale(1);
        pointer-events: none;
    }

    button:active::after {
        animation: rippleEffect 0.35s ease-out;
    }

    @keyframes rippleEffect {
        0% { transform: translate(-50%, -50%) scale(0); opacity: 0.9; }
        50% { opacity: 0.6; }
        100% { transform: translate(-50%, -50%) scale(50); opacity: 0; }
    }

    @keyframes vibrateAnim {
        0% { transform: translate(0, 0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0, 0); }
    }

    #btnCopy:hover,
    #btnReset:hover {
        animation: vibrateAnim 0.15s linear infinite;
    }

    button:active {
        animation: none !important;
        transform: scale(0.92) translateY(2px) !important;
        background: var(--cyan-neon) !important;
        color: #000000 !important;
        text-shadow: none !important;
        border-color: #ffffff !important;
        box-shadow: 0 0 25px var(--cyan-neon), inset 0 0 15px #ffffff !important;
    }

    .table-container { 
        overflow-x: auto; max-height: 380px; border-radius: 12px;
        border: 1.5px solid rgba(168, 85, 247, 0.3) !important; background: rgba(0, 0, 0, 0.25) !important;
    }
    
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    th, td { padding: 12px 16px; text-align: left; white-space: nowrap; user-select: text; }
    th { 
        position: sticky; top: 0; z-index: 3; font-family: 'Orbitron', sans-serif; font-weight: 800;
        background: rgba(13, 10, 30, 0.75) !important; backdrop-filter: blur(6px); color: var(--purple-bright) !important; 
        font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; border-bottom: 2px solid var(--purple-neon) !important;
    }
    td { color: #fff !important; border-bottom: 1px solid rgba(168, 85, 247, 0.12) !important; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; }
    td:nth-child(1) { color: var(--blue-electric) !important; }
    td:nth-child(3) { color: var(--purple-bright) !important; }
    td:nth-child(4) { color: var(--pink-neon) !important; }
    td:nth-child(5) { color: var(--cyan-neon) !important; }
    tr:hover td { background-color: rgba(168, 85, 247, 0.25) !important; }

    .chat-modal-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.7); z-index: 999; display: none;
        justify-content: center; align-items: center; padding: 15px;
    }

    #profileModal, #registerModal, #friendsModal { z-index: 1002 !important; }
    #imageViewerModal { z-index: 1003 !important; }

    .auth-modal {
        position: relative; width: 100%; max-width: 420px; background: rgba(17, 17, 17, 0.95) !important;
        border-radius: 20px !important; padding: 2px; overflow: hidden; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
    }

    .auth-modal::before {
        content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background: conic-gradient(transparent, transparent 270deg, var(--cyan-neon) 360deg);
        animation: rotateBeam 4s linear infinite;
    }

    @keyframes rotateBeam { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .auth-modal-content {
        position: relative; z-index: 1; background: #15151c !important; border-radius: 18px;
        padding: 25px; display: flex; flex-direction: column; gap: 15px;
    }

    .auth-form { display: flex; flex-direction: column; gap: 12px; }
    .auth-input-group { display: flex; flex-direction: column; gap: 5px; }
    .auth-input-group label { font-size: 9.5px; }
    .auth-input-group input {
        background: rgba(20, 20, 28, 0.9) !important; border: 1px solid rgba(168, 85, 247, 0.4) !important;
        color: #fff !important; padding: 10px 12px; border-radius: 10px; font-family: 'JetBrains Mono', monospace;
        font-size: 12px; outline: none;
    }
    .auth-input-group input:focus { border-color: var(--cyan-neon) !important; box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }

    .avatar-selection-box { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 5px 0; }
    .avatar-preview-container {
        width: 70px; height: 70px; border-radius: 50%; overflow: hidden; border: 2px solid var(--cyan-neon);
        box-shadow: 0 0 10px var(--cyan-neon); display: flex; align-items: center; justify-content: center; background: #000;
    }
    .avatar-preview-img, .avatar-preview-video { width: 100%; height: 100%; object-fit: cover; }
    .btn-upload-avatar { font-size: 10px !important; padding: 6px 12px !important; border-radius: 10px !important; }
    .btn-auth-submit { padding: 12px !important; border-radius: 15px !important; margin-top: 10px; }
    .btn-admin-reg { background: rgba(255, 0, 127, 0.2) !important; border: 1px solid var(--pink-neon) !important; color: #fff !important; }

    .auth-close-btn {
        position: absolute; top: 15px; right: 15px; background: transparent !important;
        border: none !important; color: var(--pink-neon) !important; font-size: 18px; font-weight: 900;
        cursor: pointer; box-shadow: none !important; z-index: 2;
    }

    .chat-modal {
        position: relative; width: 100%; max-width: 650px; height: 90vh; max-height: 720px;
        background: rgba(5, 5, 8, 0.95) !important; border-radius: 20px !important;
        border: 2px solid var(--lavender-border) !important; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
        padding: 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;
    }

    .chat-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(200, 158, 255, 0.2); padding-bottom: 10px; flex-shrink: 0; }
    .chat-header h3 {
        margin: 0; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 20px; letter-spacing: 3px;
        background: linear-gradient(90deg, var(--cyan-neon), var(--blue-electric), var(--pink-neon), var(--purple-neon), var(--cyan-neon));
        background-size: 200% auto; color: transparent !important; -webkit-background-clip: text; background-clip: text;
        animation: shineText 3s linear infinite; filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.6));
    }

    .header-controls { display: flex; align-items: center; gap: 8px; }
    .btn-hdr-action { font-size: 9.5px !important; padding: 6px 14px !important; border-radius: 15px !important; flex: none !important; }
    .btn-reset-chat { background: rgba(255, 0, 127, 0.15) !important; border: 1px solid rgba(255, 0, 127, 0.4) !important; color: var(--pink-neon) !important; }
    .btn-logout-chat { background: rgba(0, 210, 255, 0.15) !important; border: 1px solid rgba(0, 210, 255, 0.4) !important; color: var(--cyan-neon) !important; }
    .btn-profile-chat { background: rgba(168, 85, 247, 0.15) !important; border: 1px solid rgba(168, 85, 247, 0.4) !important; color: var(--purple-bright) !important; }
    .btn-friends-chat { background: rgba(0, 255, 136, 0.15) !important; border: 1px solid rgba(0, 255, 136, 0.4) !important; color: #00ff88 !important; }
    .btn-close-chat { background: transparent !important; border: none !important; color: var(--pink-neon) !important; font-size: 20px; cursor: pointer; padding: 0 6px !important; box-shadow: none !important; }

    .chat-body {
        flex: 1; overflow-y: auto; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
        padding: 12px; background: #09090d !important; display: flex; flex-direction: column; gap: 12px;
    }

    .chat-msg-wrapper { display: flex; gap: 10px; width: 100%; align-items: flex-start; }
    .chat-msg-wrapper.own-msg { flex-direction: row-reverse; }

    .msg-avatar, .msg-avatar-video {
        width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
        border: 1.5px solid var(--purple-bright); flex-shrink: 0; cursor: pointer; transition: transform 0.2s ease;
    }
    .msg-avatar:hover, .msg-avatar-video:hover { transform: scale(1.1); border-color: var(--cyan-neon); }

    .msg-content-container { display: flex; flex-direction: column; max-width: 80%; }
    .chat-msg-wrapper.own-msg .msg-content-container { align-items: flex-end; }

    .msg-header-info { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 10.5px; padding: 0 2px; }
    .chat-msg-wrapper.own-msg .msg-header-info { flex-direction: row-reverse; }

    .sender { font-weight: 800; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
    .time-stamp { color: rgba(255, 255, 255, 0.4); font-size: 9.5px; font-family: 'JetBrains Mono', monospace; }

    .msg-actions { display: flex; gap: 6px; opacity: 0.6; transition: opacity 0.2s ease; }
    .chat-msg-wrapper:hover .msg-actions { opacity: 1; }
    .btn-action-msg { color: rgba(255, 255, 255, 0.7); cursor: pointer; font-size: 11px; }
    .btn-action-msg:hover { color: var(--cyan-neon); transform: scale(1.2); }

    .chat-msg {
        position: relative; font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 8px 12px;
        border-radius: 12px; user-select: text; word-break: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        width: fit-content; display: flex; flex-direction: column; line-height: 1.35;
    }
    .chat-msg-wrapper.other-msg .chat-msg { background: rgba(45, 45, 50, 0.9) !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; border-top-left-radius: 2px; }
    .chat-msg-wrapper.own-msg .chat-msg { background: rgba(65, 65, 72, 0.95) !important; border: 1px solid rgba(255, 255, 255, 0.25) !important; border-top-right-radius: 2px; }

    .chat-msg .chat-media-img { max-width: 220px; max-height: 220px; border-radius: 8px; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.2); }
    .chat-msg .chat-media-video { max-width: 240px; max-height: 220px; border-radius: 8px; outline: none; }

    .msg-reactions-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .chat-msg-wrapper.own-msg .msg-reactions-container { justify-content: flex-end; }

    .reaction-badge {
        display: inline-flex; align-items: center; gap: 3px; background: rgba(20, 20, 30, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 2px 6px; font-size: 11px; cursor: pointer;
    }
    .reaction-badge.active-user { background: rgba(0, 240, 255, 0.2); border-color: var(--cyan-neon); }
    .reaction-badge .reaction-count { font-size: 10px; color: var(--cyan-neon); font-weight: bold; }

    .reply-quote-box { background: rgba(0, 0, 0, 0.4); border-left: 3px solid var(--cyan-neon); padding: 3px 6px; border-radius: 4px; margin-bottom: 6px; font-size: 10px; }
    .reply-quote-box .reply-author { color: var(--cyan-neon); font-weight: bold; }
    .reply-quote-box .reply-text { color: rgba(255, 255, 255, 0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

    .chat-msg .msg-content { color: #f0f0f5 !important; white-space: pre-wrap; }
    .chat-msg .msg-sticker { font-size: 32px; display: block; text-align: center; }

    .reply-preview-container {
        display: none; justify-content: space-between; align-items: center; background: rgba(0, 210, 255, 0.15);
        border-left: 3px solid var(--cyan-neon); padding: 4px 10px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    }
    .reply-preview-text { color: #fff; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 90%; }
    .btn-cancel-reply { color: var(--pink-neon); cursor: pointer; font-weight: bold; font-size: 14px; }

    .sticker-picker-container {
        display: none; grid-template-columns: repeat(6, 1fr); gap: 8px; background: rgba(16, 16, 24, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 8px; max-height: 100px; overflow-y: auto;
    }
    .sticker-item { font-size: 22px; text-align: center; cursor: pointer; border-radius: 6px; transition: transform 0.1s; }
    .sticker-item:hover { background: rgba(0, 210, 255, 0.25); transform: scale(1.2); }

    .chat-footer { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .user-profile-thumb, .user-profile-thumb-video { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--cyan-neon); cursor: pointer; }

    .chat-footer input#chatUser {
        width: 100px; background: rgba(20, 20, 28, 0.9) !important; border: 1px solid rgba(168, 85, 247, 0.4) !important;
        color: var(--cyan-neon) !important; padding: 8px 10px; border-radius: 12px; font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px; height: 40px; text-transform: uppercase; font-weight: bold; outline: none;
    }

    .chat-footer textarea#chatText {
        flex: 1; background: rgba(20, 20, 28, 0.9) !important; border: 1px solid rgba(168, 85, 247, 0.4) !important;
        color: #fff !important; padding: 8px 12px; border-radius: 12px; font-family: 'JetBrains Mono', monospace;
        font-size: 12px; outline: none; resize: none; height: 40px; max-height: 90px; line-height: 1.3;
    }

    .btn-sticker-toggle, .btn-attach-media {
        width: 40px !important; padding: 0 !important; flex: none !important; border-radius: 12px !important;
        border: 1px solid rgba(168, 85, 247, 0.4) !important; background: rgba(20, 20, 28, 0.9) !important;
        color: #fff !important; font-size: 16px !important; cursor: pointer; height: 40px; display: flex; align-items: center; justify-content: center;
    }

    .btn-send-chat {
        padding: 0 16px !important; flex: none !important; border-radius: 12px !important;
        border: 1px solid var(--lavender-border) !important; background: var(--lavender-bg) !important;
        color: #fff !important; font-size: 11px !important; height: 40px; display: flex; align-items: center; justify-content: center;
    }

    .friends-nav-tabs { display: flex; gap: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; margin-bottom: 10px; }
    .tab-btn { flex: 1; padding: 8px !important; font-size: 10px !important; border-radius: 10px !important; }
    .tab-btn.active { background: var(--cyan-neon) !important; color: #000 !important; border-color: #fff !important; }

    .friends-list-container { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
    .friend-card { display: flex; align-items: center; justify-content: space-between; background: rgba(20, 20, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 12px; border-radius: 10px; }
    .friend-name { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: bold; }
    .btn-action-friend { padding: 4px 8px !important; font-size: 9px !important; border-radius: 8px !important; flex: none !important; }

    .image-viewer-modal {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85);
        display: none; justify-content: center; align-items: center; flex-direction: column;
    }

    .image-viewer-modal img, .image-viewer-modal video {
        max-width: 85vw; max-height: 80vh; border-radius: 15px; border: 2px solid var(--cyan-neon);
        box-shadow: 0 0 30px rgba(0, 240, 255, 0.5); object-fit: contain;
    }

    .image-viewer-username { margin-top: 15px; font-family: 'Orbitron', sans-serif; color: #fff; font-size: 16px; letter-spacing: 2px; }
</style>
</head>
<body>

<video class="bg-video" autoplay loop muted playsinline disablepictureinpicture>
    <source src="./gb.mp4" type="video/mp4">
</video>

<!-- CONTAINER UTAMA -->
<div class="container" id="mainContainer">
    <h1>Rumus Flop Kasir</h1>
    <div class="sub-title">Ultra Light Edition</div>

    <div class="label-header">
        <label for="rawInput">Tempel Log Transaksi</label>
    </div>

<div class="image-viewer-modal" id="imageViewerModal" onclick="closeModal('imageViewerModal')">
    <div id="fullsizeMediaContainer"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const NAMA_ADMIN_RESMI = "JAKA SEMBUNG";
    let hasilTeksUntukDisalin = "";
    let selectedReplyData = null; 
    let activeUser = null; 
    let tempEditAvatar = "";
    let isChatOpen = false;
    let unreadCount = 0;
    window.targetMsgKeyForReaction = null;

    // 1. Inisialisasi Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp({ databaseURL: "https://kasir-flop-chat-default-rtdb.asia-southeast1.firebasedatabase.app/" });
    }
    
    const dbRoot = firebase.database();
    let dbChat = dbRoot.ref("team_chat_messages");
    const dbAccounts = dbRoot.ref("chat_accounts");
    const dbFriends = dbRoot.ref("user_friends");

    // 2. Pemantau Pesan Unread Selalu Aktif
    function initUnreadListener() {
        const unreadRef = dbRoot.ref("team_chat_messages").limitToLast(1);
        unreadRef.on('child_added', (snap) => {
            const data = snap.val();
            if (!data) return;

            const sender = (data.user || '').toUpperCase();
            const myName = activeUser ? activeUser.username.toUpperCase() : '';

            if (!isChatOpen && sender !== '' && sender !== myName) {
                unreadCount++;
                updateUnreadBadge();
            }
        });
    }

    function updateUnreadBadge() {
        const counterElem = document.getElementById('dataCounter');
        if (!counterElem) return;

        if (unreadCount > 0) {
            counterElem.innerText = `🔴 ${unreadCount} PESAN BARU`;
            counterElem.style.borderColor = '#ff007f';
            counterElem.style.color = '#ff007f';
        } else {
            const lines = document.getElementById('rawInput').value.trim().split('\n').filter(l => l !== '');
            counterElem.innerText = lines.length > 0 ? `${document.querySelectorAll('#tableBody tr').length} DATA` : "DATA";
            counterElem.style.borderColor = 'rgba(0, 240, 255, 0.5)';
            counterElem.style.color = 'var(--cyan-neon)';
        }
    }

    function isVideoUrl(url) {
        if (!url) return false;
        if (url.startsWith('data:video/')) return true;
        const cleanUrl = url.split('?')[0].toLowerCase();
        return cleanUrl.endsWith('.mp4') || cleanUrl.endsWith('.webm') || cleanUrl.endsWith('.ogg');
    }

    function createAvatarElement(avatarUrl, className = 'msg-avatar', username = '') {
        const isVid = isVideoUrl(avatarUrl);
        const elem = document.createElement(isVid ? 'video' : 'img');
        elem.className = className + (isVid ? '-video' : '');
        elem.src = avatarUrl;
        if (isVid) { elem.autoplay = true; elem.loop = true; elem.muted = true; elem.playsInline = true; }
        else { elem.alt = username; }
        if (username) elem.onclick = () => viewFullsizeImage(avatarUrl, username);
        return elem;
    }

    document.addEventListener("DOMContentLoaded", () => {
        const savedAccount = localStorage.getItem("chat_active_account");
        if (savedAccount) activeUser = JSON.parse(savedAccount);
        
        initUnreadListener();

        dbRoot.ref(".info/connected").on("value", (snap) => {
            if (snap.val() === true) {
                console.log("Firebase Realtime Terhubung");
            }
        });
    });

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
        if (id === 'authModal') document.getElementById('mainContainer').classList.remove('hidden-for-chat');
    }

    function handleChatClick() {
        if (activeUser) openTeamChat();
        else {
            document.getElementById('mainContainer').classList.add('hidden-for-chat');
            document.getElementById('authModal').style.display = 'flex';
        }
    }

    function submitLogin() {
        const user = document.getElementById('loginUser').value.trim().toUpperCase();
        const pass = document.getElementById('loginPass').value.trim();
        if (!user || !pass) return alert("Nama dan Password wajib diisi!");

        dbAccounts.child(user).once('value', (snapshot) => {
            if (snapshot.exists() && snapshot.val().password === pass) {
                activeUser = { username: user, avatar: snapshot.val().avatar || ("https://api.dicebear.com/7.x/bottts/svg?seed=" + user) };
                localStorage.setItem("chat_active_account", JSON.stringify(activeUser));
                closeModal('authModal');
                openTeamChat();
            } else {
                alert("🚫 AKSES DITOLAK (User/Password Salah)");
            }
        });
    }

    function openRegisterModal() {
        if (activeUser?.username !== NAMA_ADMIN_RESMI) return alert("🚫 Hanya Admin yang dapat mendaftar.");
        closeModal('profileModal');
        document.getElementById('registerModal').style.display = 'flex';
    }

    function submitRegisterNewUser() {
        const newUser = document.getElementById('regUser').value.trim().toUpperCase();
        const newPass = document.getElementById('regPass').value.trim();
        if (!newUser || !newPass) return alert("Lengkapi data baru!");

        dbAccounts.child(newUser).set({
            password: newPass, avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=" + newUser, createdAt: new Date().toISOString()
        }, (err) => {
            if (!err) { alert("✅ Berhasil membuat akun " + newUser); closeModal('registerModal'); }
        });
    }

    function openProfileModal() {
        if (!activeUser) return;
        tempEditAvatar = activeUser.avatar;
        const container = document.getElementById('editAvatarContainer');
        container.innerHTML = '';
        container.appendChild(createAvatarElement(tempEditAvatar, 'avatar-preview-img'));

        document.getElementById('editUserName').value = activeUser.username;
        document.getElementById('editUserPass').value = '';
        document.getElementById('btnAdminOpenReg').style.display = (activeUser.username === NAMA_ADMIN_RESMI) ? 'block' : 'none';
        document.getElementById('profileModal').style.display = 'flex';
    }

    function handleEditAvatarUpload(event) {
        const file = event.target.files[0];
        if (file && file.size <= 2.5 * 1024 * 1024) {
            const reader = new FileReader();
            reader.onload = (e) => {
                tempEditAvatar = e.target.result;
                const container = document.getElementById('editAvatarContainer');
                container.innerHTML = '';
                container.appendChild(createAvatarElement(tempEditAvatar, 'avatar-preview-img'));
            };
            reader.readAsDataURL(file);
        } else { alert("File terlalu besar! Max 2.5 MB."); }
    }

    function saveProfileChanges() {
        const newName = document.getElementById('editUserName').value.trim().toUpperCase();
        const newPass = document.getElementById('editUserPass').value.trim();
        if (!newName) return alert("Nama tidak boleh kosong!");

        dbAccounts.child(activeUser.username).once('value', (snapshot) => {
            const currentData = snapshot.val();
            const updatedPass = newPass || currentData.password;

            dbAccounts.child(activeUser.username).update({ password: updatedPass, avatar: tempEditAvatar });
            activeUser.avatar = tempEditAvatar;
            localStorage.setItem("chat_active_account", JSON.stringify(activeUser));
            updateChatHeaderProfile();
            closeModal('profileModal');
            alert("Profil diperbarui!");
        });
    }

    function updateChatHeaderProfile() {
        if (!activeUser) return;
        document.getElementById('chatUser').value = activeUser.username;
        const container = document.getElementById('myChatAvatarContainer');
        container.innerHTML = '';
        container.appendChild(createAvatarElement(activeUser.avatar, 'user-profile-thumb'));
    }

    function viewFullsizeImage(avatarUrl, username) {
        const container = document.getElementById('fullsizeMediaContainer');
        container.innerHTML = '';
        const isVid = isVideoUrl(avatarUrl);
        const elem = document.createElement(isVid ? 'video' : 'img');
        elem.src = avatarUrl;
        if (isVid) { elem.autoplay = true; elem.controls = true; elem.loop = true; }
        container.appendChild(elem);
        document.getElementById('fullsizeUsername').innerText = username;
        document.getElementById('imageViewerModal').style.display = 'flex';
    }

    function logoutChat() {
        if (confirm("Logout dari akun?")) {
            activeUser = null; localStorage.removeItem("chat_active_account");
            closeTeamChat();
        }
    }

    /* SISTEM PERTEMANAN & DM */
    function openFriendsModal() { document.getElementById('friendsModal').style.display = 'flex'; switchFriendsTab('friends'); }
    
    function switchFriendsTab(tab) {
        ['Friends', 'Requests', 'Add'].forEach(t => {
            document.getElementById(`tab${t}Btn`).classList.toggle('active', t.toLowerCase() === tab);
            document.getElementById(`tab${t}Content`).style.display = (t.toLowerCase() === tab) ? 'flex' : 'none';
        });
        if (tab === 'friends') loadFriendsList();
        if (tab === 'requests') loadFriendRequests();
    }

    function sendFriendRequest() {
        const targetUser = document.getElementById('targetFriendUser').value.trim().toUpperCase();
        if (!targetUser || targetUser === activeUser.username) return alert("User ID tidak valid!");
        dbFriends.child(targetUser).child('requests').child(activeUser.username).set(true, () => alert("Permintaan terkirim!"));
    }

    function loadFriendsList() {
        const container = document.getElementById('tabFriendsContent');
        container.innerHTML = 'Loading...';
        dbFriends.child(activeUser.username).child('list').on('value', (snapshot) => {
            container.innerHTML = snapshot.exists() ? '' : 'Belum ada teman.';
            snapshot.forEach((child) => {
                container.innerHTML += `
                    <div class="friend-card">
                        <span class="friend-name">${child.key}</span>
                        <button class="btn-action-friend" onclick="startPrivateChat('${child.key}')">CHAT 💬</button>
                    </div>`;
            });
        });
    }

    function loadFriendRequests() {
        const container = document.getElementById('tabRequestsContent');
        container.innerHTML = 'Loading...';
        dbFriends.child(activeUser.username).child('requests').on('value', (snapshot) => {
            container.innerHTML = snapshot.exists() ? '' : 'Tidak ada permintaan.';
            snapshot.forEach((child) => {
                container.innerHTML += `
                    <div class="friend-card">
                        <span class="friend-name">${child.key}</span>
                        <div>
                            <button class="btn-action-friend" style="background:#00ff88; color:#000;" onclick="acceptFriend('${child.key}')">TERIMA</button>
                            <button class="btn-action-friend" style="background:#ff007f;" onclick="rejectFriend('${child.key}')">TOLAK</button>
                        </div>
                    </div>`;
            });
        });
    }

    function acceptFriend(requester) {
        dbFriends.child(activeUser.username).child('list').child(requester).set(true);
        dbFriends.child(requester).child('list').child(activeUser.username).set(true);
        dbFriends.child(activeUser.username).child('requests').child(requester).remove();
        loadFriendRequests();
    }

    function rejectFriend(requester) {
        dbFriends.child(activeUser.username).child('requests').child(requester).remove();
        loadFriendRequests();
    }

    function startPrivateChat(targetUser) {
        closeModal('friendsModal');
        const sorted = [activeUser.username, targetUser].sort();
        document.getElementById('chatTitleHeader').innerText = `DM: ${targetUser}`;
        switchChatRoom(`direct_messages/${sorted[0]}_${sorted[1]}`);
    }

    // TERAPKAN FIX CHILD_REMOVED
    function switchChatRoom(path) {
        if (dbChat) dbChat.off(); // Lepas listener lama
        document.getElementById('chatLogs').innerHTML = '';
        dbChat = dbRoot.ref(path);
        
        // 1. Pemantau Pesan Baru Tambah
        dbChat.limitToLast(60).on('child_added', (snap) => renderMessage(snap.key, snap.val()));

        // 2. Pemantau Pesan Diubah / Edit / Reaksi
        dbChat.limitToLast(60).on('child_changed', (snap) => renderMessage(snap.key, snap.val()));

        // 3. PEMANTAU PESAN DIHAPUS (Realtime tanpa Refresh!)
        dbChat.limitToLast(60).on('child_removed', (snap) => {
            const removedElem = document.getElementById(`msg-${snap.key}`);
            if (removedElem) {
                removedElem.remove();
            }
        });
    }

    function clearAllChat() {
        if (activeUser?.username === NAMA_ADMIN_RESMI && confirm("Hapus semua obrolan?")) {
            dbChat.remove(); // Listener child_removed di semua pengguna akan otomatis menghapus tampilannya!
        }
    }

    function handleMediaUpload(event) {
        const file = event.target.files[0];
        if (file && file.size <= 2 * 1024 * 1024) {
            const isVideo = file.type.startsWith('video/');
            const reader = new FileReader();
            reader.onload = (e) => {
                dbChat.push({
                    user: activeUser.username, avatar: activeUser.avatar, mediaData: e.target.result,
                    isMedia: true, mediaType: isVideo ? 'video' : 'image',
                    timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                    ...(selectedReplyData && { replyTo: selectedReplyData })
                });
                cancelReply();
            };
            reader.readAsDataURL(file);
        } else alert("File terlalu besar (Max 2MB)");
    }

    function openTeamChat() {
        isChatOpen = true;
        unreadCount = 0;
        updateUnreadBadge();

        document.getElementById('mainContainer').classList.add('hidden-for-chat');
        updateChatHeaderProfile();
        document.getElementById('chatTitleHeader').innerText = "T'chat";
        switchChatRoom("team_chat_messages");
        document.getElementById('chatModal').style.display = 'flex';
    }

    function closeTeamChat() {
        isChatOpen = false;
        document.getElementById('chatModal').style.display = 'none';
        document.getElementById('stickerPicker').style.display = 'none';
        document.getElementById('mainContainer').classList.remove('hidden-for-chat');
    }

    function getUserColor(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        return ['#00f0ff', '#ff007f', '#00ff88', '#ffb703', '#a855f7', '#3a86ff'][Math.abs(hash) % 6];
    }

    function toggleStickerPicker() {
        const picker = document.getElementById('stickerPicker');
        picker.style.display = (picker.style.display === 'grid') ? 'none' : 'grid';
    }

    function toggleReaction(msgKey, emoji) {
        const user = activeUser.username;
        const reactionRef = dbChat.child(msgKey).child('reactions').child(emoji);
        reactionRef.once('value', (snapshot) => {
            let users = snapshot.val() || [];
            users = users.includes(user) ? users.filter(u => u !== user) : [...users, user];
            if (users.length === 0) reactionRef.remove(); else reactionRef.set(users);
        });
    }

    function setReplyToMessage(user, text) {
        selectedReplyData = { user: user.toUpperCase(), text };
        document.getElementById('replyPreviewText').innerHTML = `Membalas <b>${user.toUpperCase()}</b>: "${text}"`;
        document.getElementById('replyPreview').style.display = 'flex';
    }

    function cancelReply() {
        selectedReplyData = null;
        document.getElementById('replyPreview').style.display = 'none';
    }

    function renderMessage(key, data) {
        const chatLogs = document.getElementById('chatLogs');
        const currentUser = activeUser ? activeUser.username : '';
        const username = (data.user || 'USER').toUpperCase();
        const isSelf = (username === currentUser);

        let wrapperDiv = document.getElementById(`msg-${key}`);
        if (!wrapperDiv) {
            wrapperDiv = document.createElement('div');
            wrapperDiv.className = `chat-msg-wrapper ${isSelf ? 'own-msg' : 'other-msg'}`;
            wrapperDiv.id = `msg-${key}`;
        } else { wrapperDiv.innerHTML = ''; }

        const avatarElem = createAvatarElement(data.avatar || ("https://api.dicebear.com/7.x/bottts/svg?seed=" + username), 'msg-avatar', username);
        const contentContainer = document.createElement('div');
        contentContainer.className = 'msg-content-container';

        const headerInfoDiv = document.createElement('div');
        headerInfoDiv.className = 'msg-header-info';
        headerInfoDiv.innerHTML = `
            <span class="sender" style="color: ${getUserColor(username)};">${username}</span>
            <span class="time-stamp">${data.timestamp || ''}</span>
            <div class="msg-actions">
                <span class="btn-action-msg" onclick="window.targetMsgKeyForReaction='${key}'; toggleStickerPicker();">😊</span>
                <span class="btn-action-msg" onclick="setReplyToMessage('${username}', '${(data.msg||'').replace(/'/g, "\\'")}')">↩️</span>
            </div>`;

        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-msg';

        let contentHTML = data.isSticker ? `<span class="msg-sticker">${data.sticker}</span>` : 
                          data.isMedia ? (data.mediaType === 'image' ? `<img class="chat-media-img" src="${data.mediaData}" onclick="viewFullsizeImage('${data.mediaData}', '${username}')"/>` : `<video class="chat-media-video" src="${data.mediaData}" controls></video>`) :
                          `<span class="msg-content">${data.msg || ''}</span>`;

        msgDiv.innerHTML = (data.replyTo ? `<div class="reply-quote-box"><span class="reply-author">↩️ ${data.replyTo.user}</span><span class="reply-text">${data.replyTo.text}</span></div>` : '') + contentHTML;

        const reactionsContainer = document.createElement('div');
        reactionsContainer.className = 'msg-reactions-container';
        if (data.reactions) {
            Object.keys(data.reactions).forEach(emoji => {
                const users = data.reactions[emoji] || [];
                if (users.length > 0) {
                    const badge = document.createElement('div');
                    badge.className = `reaction-badge ${users.includes(currentUser) ? 'active-user' : ''}`;
                    badge.innerHTML = `<span>${emoji}</span><span class="reaction-count">${users.length}</span>`;
                    badge.onclick = () => toggleReaction(key, emoji);
                    reactionsContainer.appendChild(badge);
                }
            });
        }

        contentContainer.appendChild(headerInfoDiv);
        contentContainer.appendChild(msgDiv);
        contentContainer.appendChild(reactionsContainer);

        wrapperDiv.appendChild(avatarElem);
        wrapperDiv.appendChild(contentContainer);

        if (!document.getElementById(`msg-${key}`)) chatLogs.appendChild(wrapperDiv);
        chatLogs.scrollTop = chatLogs.scrollHeight;
    }

    function sendSticker(stickerChar) {
        if (window.targetMsgKeyForReaction) {
            toggleReaction(window.targetMsgKeyForReaction, stickerChar);
            window.targetMsgKeyForReaction = null;
        } else {
            dbChat.push({
                user: activeUser.username, avatar: activeUser.avatar, sticker: stickerChar, isSticker: true,
                timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                ...(selectedReplyData && { replyTo: selectedReplyData })
            });
            cancelReply();
        }
        document.getElementById('stickerPicker').style.display = 'none';
    }

    function sendChatMessage() {
        const textInput = document.getElementById('chatText');
        const text = textInput.value.trim();
        if (text) {
            dbChat.push({
                user: activeUser.username, avatar: activeUser.avatar, msg: text,
                timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                ...(selectedReplyData && { replyTo: selectedReplyData })
            });
            textInput.value = ''; cancelReply();
        }
    }

    function handleChatKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
    }

    /* KASIR LOGIKA */
    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) { updateUnreadBadge(); return; }

        let parsedLogList = [], lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');

        lines.forEach(line => {
            let matchTime = line.match(/(\d{2}:\d{2}:\d{2})/);
            if (!matchTime) return;
            let waktu = matchTime[1];
            let parts = line.split(/\t|\s{2,}/).filter(p => p !== '');
            
            if (parts.length >= 5) {
                parsedLogList.push({ waktu, userId: parts[2]||"-", tujuanBank: parts[4]||"-", creditStatus: "0", jumlah: (parts[6]||parts[5]||"0").replace(/^-/, '') });
            }
        });

        parsedLogList.reverse();
        let barisDataDisalin = [];

        parsedLogList.forEach((item) => {
            tbody.innerHTML += `<tr><td>${item.waktu}</td><td>${item.userId}</td><td>${item.tujuanBank}</td><td>${item.creditStatus}</td><td>${item.jumlah}</td></tr>`;
            barisDataDisalin.push(`${item.waktu}\t${item.userId}\t${item.tujuanBank}\t\t${item.jumlah}`);
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
        updateUnreadBadge();
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        updateUnreadBadge();
    }

    function salinHasil() {
        const txt = document.getElementById('txtCopy');
        if (!hasilTeksUntukDisalin) { txt.innerText = "KOSONG!"; setTimeout(() => txt.innerText = "SALIN DATA", 1000); return; }
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            txt.innerText = "BERHASIL"; setTimeout(() => txt.innerText = "SALIN DATA", 1200);
        });
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            ['imageViewerModal', 'friendsModal', 'registerModal', 'profileModal', 'chatModal', 'authModal'].forEach(closeModal);
        }
    });
</script>
</body>
