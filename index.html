<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - GEAR 5 MATRIX STABLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=400;700;900&family=Rajdhani:wght=500;600;700&display=swap" rel="stylesheet">
    
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background: #0a0f1d; /* Latar dasar gelap berkelas */
        overflow-x: hidden;
    }

    body {
        font-family: 'Rajdhani', sans-serif;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        position: relative;
        box-sizing: border-box;
    }

    /* =======================================================
       CSS SUPER CAR ANIMATION (100% TANPA INTERNET / ANTI HITAM)
       ======================================================= */
    .scene {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        overflow: hidden;
        background: linear-gradient(to bottom, #111e36, #040714);
        pointer-events: none;
    }

    /* Jalanan Bergerak */
    .road {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 120px;
        background: #15151c;
        border-top: 4px solid #00f2fe;
    }
    .road::before {
        content: '';
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 100%;
        height: 6px;
        background: linear-gradient(90deg, #fff 0%, #fff 70%, transparent 70%, transparent 100%);
        background-size: 80px 100%;
        animation: jalanBergerak 0.4s linear infinite;
    }

    @keyframes jalanBergerak {
        0% { background-position: 0px; }
        100% { background-position: -80px; }
    }

    /* Badan Mobil (Siluet Mobil Sport Terang) */
    .car-container {
        position: absolute;
        bottom: 45px;
        left: 10%;
        width: 320px;
        height: 90px;
    }

    .car-body {
        position: absolute;
        width: 100%;
        height: 50px;
        background: linear-gradient(135deg, #00f2fe, #ff007f);
        bottom: 15px;
        border-radius: 40px 90px 10px 15px;
        box-shadow: 0 0 30px rgba(0, 242, 254, 0.6);
    }

    /* Kaca & Atap Mobil */
    .car-cabin {
        position: absolute;
        bottom: 60px;
        left: 70px;
        width: 130px;
        height: 30px;
        background: #fff;
        border-radius: 50px 60px 0 0;
        opacity: 0.8;
    }

    /* RODA BERGERAK BERPUTAR ASLI */
    .wheel {
        position: absolute;
        bottom: 0;
        width: 50px;
        height: 50px;
        background: #111;
        border: 4px solid #00f2fe;
        border-radius: 50%;
        box-shadow: 0 0 15px #00f2fe;
        animation: rodaBerputar 0.3s linear infinite;
    }
    .wheel.front { right: 40px; }
    .wheel.back { left: 40px; }

    /* Velg di dalam roda agar kelihatan muter */
    .wheel::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 84%;
        height: 8px;
        background: #fff;
        transform: translate(-50%, -50%);
    }
    .wheel::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 8px;
        height: 84%;
        background: #fff;
        transform: translate(-50%, -50%);
    }

    @keyframes rodaBerputar {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* =======================================================
       PANEL UTAMA KASIR
       ======================================================= */
    .container {
        background: rgba(5, 10, 25, 0.88); 
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 2px solid #00f2fe; 
        border-radius: 16px; 
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-sizing: border-box;
        box-shadow: 0 0 40px rgba(0, 242, 254, 0.4);
        position: relative;
        z-index: 10;
        margin: auto;
    }

    .container::before, .container::after {
        content: '';
        position: absolute;
        width: 25px;
        height: 25px;
        border: 4px solid #00f2fe;
        z-index: 11;
        pointer-events: none;
        box-shadow: 0 0 15px #00f2fe;
    }
    .container::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 16px; }
    .container::after { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 16px; }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: #ffffff;
        font-size: 38px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 6px;
        margin: 0;
        text-shadow: 0 0 15px #00f2fe;
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 13px;
        color: #ff007f; 
        letter-spacing: 4px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 35px;
        text-shadow: 0 0 10px #ff007f;
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 12px;
        color: #00f2fe; 
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-family: 'Orbitron', sans-serif;
    }
    
    textarea {
        width: 100%;
        height: 140px;
        background: rgba(0, 0, 0, 0.9);
        border: 2px solid rgba(0, 242, 254, 0.5); 
        border-radius: 8px;
        color: #ffffff;
        padding: 18px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 30px;
    }
    textarea:focus {
        outline: none;
        border-color: #00f2fe;
        box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }
    
    .btn-group {
        display: flex;
        gap: 20px;
        margin-bottom: 40px;
        flex-wrap: wrap;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        min-width: 120px;
        padding: 18px; 
        font-size: 14px;    
        font-weight: 900;
        border: none;
        border-radius: 8px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 3px;
        transition: all 0.2s ease;
    }
    
    .btn-submit { 
        background: linear-gradient(135deg, #ff007f 0%, #00f2fe 100%); 
        color: #ffffff; 
        box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }
    .btn-submit:hover { 
        transform: translateY(-2px);
        box-shadow: 0 0 25px #00f2fe;
    }
    
    .btn-copy { 
        background: rgba(0, 242, 254, 0.1); 
        color: #00f2fe; 
        border: 2px solid #00f2fe;
    }
    .btn-copy:hover { 
        background: #00f2fe; 
        color: #000000;
        box-shadow: 0 0 25px #00f2fe;
        transform: translateY(-2px);
    }
    
    .btn-reset { 
        background: #111; 
        color: #a0aec0; 
        border: 2px solid #444;
    }
    .btn-reset:hover { 
        background: #222; 
        color: #fff;
        transform: translateY(-2px);
    }
    
    .table-container { 
        overflow-x: auto; 
        border-radius: 8px;
        border: 2px solid #00f2fe;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(0, 0, 0, 0.9);
    }
    
    th, td {
        padding: 16px 20px;
        text-align: left;
        font-size: 15px;
        white-space: nowrap;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background: #050a14; 
        color: #00f2fe; 
        font-weight: 700; 
        border-bottom: 3px solid #00f2fe;
    }
    
    td {
        font-weight: 700;
        color: #ffffff;
        border-bottom: 1px solid rgba(0, 242, 254, 0.2);
    }
    
    tr:nth-child(even) {
        background-color: rgba(0, 242, 254, 0.03);
    }
    tr:hover td {
        color: #00f2fe;
        background-color: rgba(0, 242, 254, 0.1);
    }
</style>
</head>
<body>

<!-- ANIMASI BACKGROUND JALANAN DAN MOBIL CSS MURNI -->
<div class="scene">
    <div class="car-container">
        <div class="car-body"></div>
        <div class="car-cabin"></div>
        <div class="wheel back"></div>
        <div class="wheel front"></div>
    </div>
    <div class="road"></div>
</div>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">KONOHA KASIR - NIKA MATRIX v10.1</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="Tempel log transaksi mentah di sini..."></textarea>
    
    <div class="btn-group">
        <button id="btnSubmit" class="btn-submit" onclick="konversiLog()">Submit</button>
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let creditStatus = "-"; 
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin! Silakan submit log terlebih dahulu.");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "BERHASIL DISALIN!";
            setTimeout(() => { btnCopy.innerText = teksAwal; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data otomatis.");
        });
    }
</script>
</body>
</html>
