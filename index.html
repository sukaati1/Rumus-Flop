<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - CYBER CHARCOAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=400;700;900&family=Rajdhani:wght=500;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        --bg-main: #06070a;
        --panel-bg: #111322; 
        --neon-cyan: #00f3ff;
        
        /* WARNA PINK BERKILAU / METALLIC SHIMMER CHROME */
        --neon-pink: #ff007f;
        --shimmer-pink: linear-gradient(135deg, #ff007f 0%, #ff66b2 25%, #ff007f 50%, #ffffff 75%, #ff007f 100%);
        --text-white: #ffffff;
        --text-muted: #a0aec0;
    }

    body {
        font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: var(--text-white);
        
        /* FIX WALLPAPER: Kombinasi linear & radial gradient + dithering effect agar super halus */
        background-color: #04060a;
        background-image: radial-gradient(circle at 50% 30%, #151a3a 0%, #070913 70%, #030508 100%);
        background-attachment: fixed;
        position: relative;
        overflow-x: hidden;
    }
    
    /* GARIS CYBER GRID BELAKANG - DIOPTIMALKAN AGAR HALUS DAN MENYATU */
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        background-image: 
            linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
        background-size: 50px 50px;
        -webkit-mask-image: radial-gradient(circle at center, white, transparent 80%);
        mask-image: radial-gradient(circle at center, white, transparent 80%);
    }
    
    /* CONTAINER PANEL UTAMA */
    .container {
        background: var(--panel-bg); 
        border: 2px solid var(--neon-cyan);
        border-radius: 12px;
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-sizing: border-box;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 243, 255, 0.1);
        position: relative;
    }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: var(--text-white);
        font-size: 32px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 6px;
        margin: 0;
        text-shadow: 0 0 10px var(--neon-cyan);
    }

    /* SUBTITLE GRADASI PINK METALLIC CHROME */
    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        background: var(--shimmer-pink);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 4px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 6px;
        margin-bottom: 35px;
        animation: shine 3s linear infinite;
    }
    
    @keyframes shine {
        to { background-position: 200% center; }
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 10px;
        color: var(--neon-cyan);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }
    
    textarea {
        width: 100%;
        height: 150px;
        background: #020306;
        border: 2px solid #23263d;
        border-radius: 6px;
        color: #ffffff;
        padding: 15px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 25px;
        transition: border-color 0.2s ease;
    }
    
    textarea:focus {
        border-color: var(--neon-cyan);
        outline: none;
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 35px;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        padding: 16px; 
        font-size: 13px;   
        font-weight: 900;
        border: none;
        border-radius: 6px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.2s ease;
    }
    
    .btn-submit { 
        background: var(--neon-cyan); 
        color: #000000; 
    }
