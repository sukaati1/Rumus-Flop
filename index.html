<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contoh Teks Tengah 2 Baris</title>
  <style>
    /* Container/Banner */
    .banner-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px 16px;
      max-width: 500px;
      margin: 20px auto;
    }

    /* Teks Tengah (Maksimal 2 Baris) */
    .banner-text {
      flex: 1;
      text-align: center;
      font-family: sans-serif;
      font-size: 14px;
      line-height: 1.4;
      color: #334155;
      
      /* Memberikan ruang agar teks tidak tertutup tombol X */
      padding-left: 32px;
      padding-right: 32px;

      /* Mencegah teks muncul di baris ketiga */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tombol Tanda X di Kanan */
    .close-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      font-size: 18px;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
    }

    .close-btn:hover {
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="banner-container">
    <p class="banner-text">
      Ini adalah pesan pengumuman yang agak panjang untuk menguji apakah teks akan otomatis terpotong pada baris kedua saja dan tidak akan pernah terlihat di baris ketiga.
    </p>
    <button class="close-btn" aria-label="Tutup">&times;</button>
  </div>

</body>
</html>
