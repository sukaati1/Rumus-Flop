<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>Rumus Flop Kasir - Ultra Luxury Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only dark !important;
        --gold-primary: #dfa855;
        --gold-light: #fbe3b5;
        --gold-dark: #996e29;
        --gold-glow: rgba(223, 168, 85, 0.4);
        --bg-glass: rgba(13, 17, 23, 0.75);
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    html {
        width: 100%;
        height: 100%;
        background-color: #0b0f17;
    }

    body {
        margin: 0;
        padding: 40px 20px;
        width: 100%;
        min-height: 100vh;
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        color: #f8fafc !important;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;

        /* LATAR BELAKANG */
        background-image: url('./gb.gif');
        background-repeat: no-repeat;
        background-position: center center;
        background-attachment: fixed;
        background-size: cover;
        background-color: #0b0f17;
        overflow-x: hidden;
    }

    /* 1. EFEK AMBIENT LIGHT (Cahaya Masif di Belakang Card) */
    body::before {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60vw;
        height: 60vh;
        background: radial-gradient(circle, rgba(223, 168, 85, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
        pointer-events: none;
        z-index: 0;
        animation: pulseAmbient 4s ease-in-out infinite alternate;
    }

    @keyframes pulseAmbient {
        0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.95); }
        100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    }

    /* 2. CONTAINER DENGAN GLOW BORDER & SHIMMER */
    .container {
        position: relative;
        z-index: 1;
        background: var(--bg-glass) !important;
        -webkit-backdrop-filter: blur(25px) saturate(200%) !important;
        backdrop-filter: blur(25px) saturate(200%) !important;
        border: 1px solid rgba(223, 168, 85, 0.3) !important; 
        border-radius: 24px; 
        width: 100%;
        max-width: 950px;
        padding: 48px;
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.95),
                    0 0 30px rgba(223, 168, 85, 0.15),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
        margin: auto;
        overflow: hidden;
    }

    /* Garis Efek Kilatan Emas Melintas Di Container */
    .container::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
            45deg,
            transparent 45%,
            rgba(255, 223, 140, 0.08) 50%,
            transparent 55%
        );
        transform: rotate(30deg);
        animation: sweepGlint 7s infinite linear;
        pointer-events: none;
    }

    @keyframes sweepGlint {
        0% { transform: translateY(-100%) rotate(30deg); }
        100% { transform: translateY(100%) rotate(30deg); }
    }

    @keyframes goldShimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
    }

    h1 {
        text-align: center;
        font-family: 'Cinzel', serif;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: 2px;
        margin: 0;
        background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
        background-size: 200% auto;
        color: transparent !important;
        -webkit-background-clip: text !important;
        background-clip: text !important;
        animation: goldShimmer 6s linear infinite;
        filter: drop-shadow(0 2px 12px rgba(223, 168, 85, 0.4));
    }

    .sub-title {
        text-align: center;
        font-size: 11px;
        color: #94a3b8 !important;
        letter-spacing: 6px;
        font-weight: 600;
        text-transform: uppercase;
        margin-top: 6px;
        margin-bottom: 36px;
        opacity: 0.8;
    }
    
    label {
        display: block;
        font-weight: 600;
        margin-bottom: 10px;
        color: var(--gold-light) !important; 
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        opacity: 0.9;
    }
    
    textarea {
        width: 100%;
        height: 130px;
        background-color: rgba(5, 7, 10, 0.8) !important;
        border: 1px solid rgba(223, 168, 85, 0.25) !important; 
        border-radius: 12px;
        color: #38bdf8 !important;
        padding: 16px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        margin-bottom: 28px;
        user-select: text;
        transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
    }

    textarea:focus {
        outline: none;
        border-color: var(--gold-primary) !important;
        box-shadow: 0 0 25px rgba(223, 168, 85, 0.25), inset 0 0 10px rgba(223, 168, 85, 0.05) !important;
        background-color: rgba(5, 7, 10, 0.95) !important;
    }

    textarea::placeholder {
        color: rgba(148, 163, 184, 0.4);
    }

    .btn-group {
        display: flex;
        gap: 16px;
        margin-bottom: 36px;
    }
    
    button {
        position: relative;
        flex: 1;
        padding: 16px; 
        font-size: 12px;    
        font-weight: 700;
        border-radius: 12px; 
        cursor: pointer;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border: 1px solid transparent;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
        transition: left 0.5s ease;
    }

    button:hover::before {
        left: 100%;
    }

    .vibrate-text {
        display: inline-block !important;
        will-change: transform;
        transition: color 0.1s;
    }

    .btn-copy { 
        background: linear-gradient(135deg, #dfa855 0%, #a87932 100%) !important; 
        color: #0b0f17 !important; 
        box-shadow: 0 4px 20px rgba(223, 168, 85, 0.3);
    }

    .btn-copy:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 28px rgba(223, 168, 85, 0.5);
    }

    .btn-reset { 
        background-color: rgba(255, 255, 255, 0.03) !important; 
        color: #94a3b8 !important; 
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
    }

    .btn-reset:hover {
        background-color: rgba(239, 68, 68, 0.1) !important;
        color: #fca5a5 !important;
        border-color: rgba(239, 68, 68, 0.4) !important;
        box-shadow: 0 4px 20px rgba(239, 68, 68, 0.2);
        transform: translateY(-2px);
    }
    
    .table-container { 
        overflow-x: auto; 
        border-radius: 12px;
        border: 1px solid rgba(223, 168, 85, 0.2) !important;
        background-color: rgba(5, 7, 10, 0.75) !important;
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
    }
    
    th, td {
        padding: 14px 18px;
        text-align: left;
        font-size: 13px;
        white-space: nowrap;
        user-select: text;
    }
    
    th { 
        font-weight: 600;
        background-color: rgba(17, 24, 39, 0.95) !important; 
        color: var(--gold-primary) !important; 
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(223, 168, 85, 0.25) !important;
    }
    
    td {
        color: #e2e8f0 !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04) !important;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        transition: background-color 0.2s ease, color 0.2s ease;
    }
    
    tr:last-child td {
        border-bottom: none !important;
    }

    /* 3. ANIMASI FADE-IN UNTUK BARIS TABEL */
    tbody tr {
        animation: fadeInRow 0.3s ease-in-out forwards;
    }

    @keyframes fadeInRow {
        from {
            opacity: 0;
            transform: translateY(6px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    tr:hover td {
        background-color: rgba(223, 168, 85, 0.12) !important;
        color: #ffffff !important;
    }

    /* BARIS PERTAMA (TERBARU) DIBERI AMBIENT HIGHLIGHT EMAS */
    tbody tr:first-child td {
        color: var(--gold-light) !important;
        background-color: rgba(223, 168, 85, 0.05);
    }

    /* 4. CANVAS PARTIKEL EMAS (BACKGROUND ACCENT) */
    #goldParticles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }
</style>
</head>
<body>

<!-- Canvas untuk efek debu emas melayang -->
<canvas id="goldParticles"></canvas>

<div class="container">
    <h1>Rumus Flop Kasir</h1>
    <div class="sub-title">Ultra Luxury Edition</div>

    <label for="rawInput">Tempel Log Transaksi</label>
    <textarea id="rawInput" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
    
    <div class="btn-group">
        <button id="btnCopy" class="btn-copy" 
                onmouseenter="mulaiGetar('txtCopy')" 
                onmouseleave="stopGetar('txtCopy')" 
                onclick="salinHasil()">
            <span class="vibrate-text" id="txtCopy">SALIN DATA</span>
        </button>
        <button id="btnReset" class="btn-reset" 
                onmouseenter="mulaiGetar('txtReset')" 
                onmouseleave="stopGetar('txtReset')" 
                onclick="resetData()">
            <span class="vibrate-text" id="txtReset">RESET</span>
        </button>
    </div>

    <label>Hasil Konversi</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>USER ID</th>
                    <th>TUJUAN BANK</th>
                    <th>CREDIT</th>
                    <th>JUMLAH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";
    let timerGetar = {};

    function mulaiGetar(elementId) {
        const el = document.getElementById(elementId);
        if (!el) return;

        if (timerGetar[elementId]) clearInterval(timerGetar[elementId]);
        const warnaGlitch = ['#ff0055', '#00ffff', '#ffff00', '#ffffff', '#dfa855'];

        timerGetar[elementId] = setInterval(() => {
            const randomX = (Math.random() * 12 - 6).toFixed(1);
            const randomY = (Math.random() * 6 - 3).toFixed(1);
            const color = warnaGlitch[Math.floor(Math.random() * warnaGlitch.length)];

            el.style.transform = `translate(${randomX}px, ${randomY}px)`;
            el.style.color = color;
            el.style.textShadow = `${-randomX}px 0 #00ffff, ${randomX}px 0 #ff0055`;
        }, 25);
    }

    function stopGetar(elementId) {
        if (timerGetar[elementId]) {
            clearInterval(timerGetar[elementId]);
            delete timerGetar[elementId];
        }
        const el = document.getElementById(elementId);
        if (el) {
            el.style.transform = 'translate(0, 0)';
            el.style.color = '';
            el.style.textShadow = '';
        }
    }

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let parsedLogList = [];
        let lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');

        if (lines.length === 1 && !lines[0].includes('\t')) {
            let rawChunk = lines[0].replace(/(ACCEPT|REJECT|PENDING|SUCCESS|FAILED)[a-zA-Z0-9]*/gi, "$&\n");
            lines = rawChunk.split('\n').map(l => l.trim()).filter(l => l !== '');
        }

        lines.forEach(line => {
            let matchTime = line.match(/(\d{2}:\d{2}:\d{2})/);
            if (!matchTime) return;
            let waktu = matchTime[1];

            let parts = line.split(/\t|\s{2,}/).map(p => p.trim()).filter(p => p !== '');
            
            if (parts.length >= 5) {
                let userId = parts[2] || "-";
                let bankInfo = parts[4] || "-";
                let jumlah = parts[6] || parts[5] || "0";
                
                jumlah = jumlah.replace(/^-/, '').trim();

                parsedLogList.push({
                    waktu: waktu,
                    userId: userId,
                    tujuanBank: bankInfo,
                    creditStatus: "0",
                    jumlah: jumlah
                });
            } else {
                let timeIndex = line.indexOf(waktu);
                let textAfterTime = line.substring(timeIndex + waktu.length);
                let matchType = textAfterTime.match(/(Withdraw|Deposit)/i);

                if (matchType) {
                    let typeIndex = textAfterTime.search(/(Withdraw|Deposit)/i);
                    let userId = textAfterTime.substring(0, typeIndex).trim();
                    let textAfterType = textAfterTime.substring(typeIndex + matchType[0].length);

                    let matchAmount = textAfterType.match(/-?([0-9.,]+)(?:\s|\t|ACCEPT|REJECT|PENDING|SUCCESS|FAILED|$)/i);
                    let jumlah = "0";
                    let bankSection = textAfterType;

                    if (matchAmount) {
                        jumlah = matchAmount[1].replace(/^-/, '');
                        let amountIndex = textAfterType.indexOf(matchAmount[0]);
                        bankSection = textAfterType.substring(0, amountIndex).trim();
                    }

                    bankSection = bankSection.replace(/-\s*$/, '').trim();

                    parsedLogList.push({
                        waktu: waktu,
                        userId: userId,
                        tujuanBank: bankSection,
                        creditStatus: "0",
                        jumlah: jumlah
                    });
                }
            }
        });

        parsedLogList.reverse();

        let barisDataDisalin = [];

        parsedLogList.forEach((item, index) => {
            const tr = document.createElement('tr');
            // Menambahkan delay sedikit demi sedikit agar efek animasi muncul berurutan (stagger)
            tr.style.animationDelay = `${index * 0.03}s`;
            tr.innerHTML = `<td>${item.waktu}</td><td>${item.userId}</td><td>${item.tujuanBank}</td><td>${item.creditStatus}</td><td>${item.jumlah}</td>`;
            tbody.appendChild(tr);

            barisDataDisalin.push(`${item.waktu}\t${item.userId}\t${item.tujuanBank}\t\t${item.jumlah}`);
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        const txt = document.getElementById('txtCopy');
        
        if (!hasilTeksUntukDisalin) {
            txt.innerText = "DATA KOSONG!";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1000);
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            txt.innerText = "BERHASIL DISALIN";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
        });
    }

    /* 5. SCRIPT PARTIKEL EMAS MELAYANG (MENYESUAIKAN TEMA ULTRA LUXURY) */
    const canvas = document.getElementById('goldParticles');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = Array.from({ length: 35 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speedY: -(Math.random() * 0.4 + 0.1),
        speedX: Math.random() * 0.2 - 0.1,
        opacity: Math.random() * 0.6 + 0.2,
    }));

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.y += p.speedY;
            p.x += p.speedX;

            if (p.y < 0) {
                p.y = canvas.height;
                p.x = Math.random() * canvas.width;
            }

            ctx.fillStyle = `rgba(223, 168, 85, ${p.opacity})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();
</script>
</body>
</html>
