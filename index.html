<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>Rumus Flop Kasir - Ultra Light Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only dark !important;
        --blue-electric: #00d2ff;
        --purple-neon: #a855f7;
        --purple-bright: #d8b4fe;
        --pink-neon: #ff007f;
        --cyan-neon: #00f0ff;
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #030308;
        overflow-x: hidden;
    }

    body {
        padding: 30px 15px;
        font-family: 'Rajdhani', sans-serif;
        color: #ffffff !important;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* VIDEO BACKGROUND FULLSCREEN */
    .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
        pointer-events: none;
    }

    /* CONTAINER WRAPPER BINGKAI CAHAYA */
    .container-wrapper {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 900px;
        margin: auto;
        border-radius: 20px;
        padding: 2px;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* BINGKAI CAHAYA NEON BERPUTAR */
    .container-wrapper::before {
        content: '';
        position: absolute;
        width: 150%;
        height: 500%;
        background: conic-gradient(
            transparent 20%, 
            var(--cyan-neon) 40%, 
            var(--purple-neon) 60%, 
            var(--pink-neon) 80%, 
            transparent 100%
        );
        animation: rotateBorder 4s linear infinite;
    }

    @keyframes rotateBorder {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* MEJA UTAMA / CONTAINER TRANSPARAN */
    .container {
        position: relative;
        z-index: 3;
        background: rgba(8, 6, 20, 0.25) !important; /* Dibuat lebih transparan */
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border-radius: 18px; 
        width: 100%;
        padding: 35px 30px;
        box-shadow: inset 0 0 15px rgba(0, 210, 255, 0.15);
    }

    /* JUDUL UTAMA */
    h1 {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 4px;
        margin: 0;
        color: #00d2ff !important;
        text-shadow: 0 0 12px rgba(0, 210, 255, 0.6), 0 0 25px rgba(168, 85, 247, 0.4);
    }

    /* SUBTITLE */
    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        color: var(--purple-bright) !important;
        letter-spacing: 6px;
        font-weight: 800;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 28px;
    }

    .label-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }
    
    /* LABEL */
    label {
        display: block;
        font-family: 'Orbitron', sans-serif;
        font-weight: 800;
        color: var(--purple-bright) !important; 
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    /* BADGE COUNTER */
    .badge-count {
        font-size: 11px;
        font-weight: 800;
        padding: 3px 10px;
        border-radius: 15px;
        background: rgba(0, 210, 255, 0.15);
        color: var(--cyan-neon) !important;
        border: 1px solid var(--cyan-neon);
        font-family: 'Orbitron', sans-serif;
    }
    
    /* TEXTAREA TRANSPARAN */
    textarea {
        width: 100%;
        height: 120px;
        background: rgba(4, 3, 12, 0.4) !important;
        border: 1.5px solid rgba(168, 85, 247, 0.5) !important; 
        border-radius: 10px;
        color: var(--cyan-neon) !important;
        padding: 14px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 13.5px;
        margin-bottom: 20px;
        user-select: text;
        transition: border-color 0.2s ease;
    }

    textarea:focus {
        outline: none;
        border-color: var(--blue-electric) !important;
        background: rgba(4, 3, 12, 0.6) !important;
    }

    textarea::placeholder {
        color: rgba(255, 255, 255, 0.35);
    }

    .btn-group {
        display: flex;
        gap: 12px;
        margin-bottom: 28px;
    }

    button {
        position: relative;
        overflow: hidden;
        flex: 1;
        padding: 14px; 
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;    
        font-weight: 900;
        border-radius: 10px; 
        cursor: pointer;
        letter-spacing: 2px;
        text-transform: uppercase;
        border: none;
        outline: none;
        transition: transform 0.1s ease, background-color 0.2s ease;
    }

    button:active {
        transform: scale(0.98);
    }

    /* EFEK GELOMBANG (RIPPLE EFFECT) */
    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        transform: scale(0);
        animation: ripple-animation 0.6s linear;
        pointer-events: none;
    }

    @keyframes ripple-animation {
        to {
            transform: scale(4);
            opacity: 0;
        }
    }

    /* TOMBOL COPY */
    .btn-copy { 
        background: linear-gradient(135deg, rgba(0, 210, 255, 0.8) 0%, rgba(168, 85, 247, 0.8) 100%) !important; 
        color: #ffffff !important; 
        box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }

    .btn-copy:hover {
        opacity: 0.9;
    }

    /* TOMBOL RESET */
    .btn-reset { 
        background-color: rgba(255, 0, 127, 0.15) !important; 
        color: var(--pink-neon) !important; 
        border: 1.5px solid var(--pink-neon) !important;
    }

    .btn-reset:hover {
        background-color: rgba(255, 0, 127, 0.3) !important;
        color: #ffffff !important;
    }

    /* TABLE CONTAINER TRANSPARAN */
    .table-container { 
        position: relative;
        overflow-x: auto; 
        max-height: 380px;
        border-radius: 10px;
        border: 1.5px solid rgba(168, 85, 247, 0.4) !important;
        background: rgba(6, 4, 18, 0.3) !important;
    }
    
    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
    }
    
    th, td {
        padding: 12px 16px;
        text-align: left;
        white-space: nowrap;
        user-select: text;
    }
    
    /* TH HEADER TABEL */
    th { 
        position: sticky;
        top: 0;
        z-index: 3;
        font-family: 'Orbitron', sans-serif;
        font-weight: 800;
        background: rgba(13, 10, 30, 0.75) !important; 
        color: var(--purple-bright) !important; 
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border-bottom: 2px solid var(--purple-neon) !important;
    }
    
    /* TD DATA TABEL */
    td {
        color: #ffffff !important;
        border-bottom: 1px solid rgba(168, 85, 247, 0.12) !important;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 13px;
    }

    /* WARNA KOLOM */
    td:nth-child(1) { color: var(--blue-electric) !important; }
    td:nth-child(2) { color: #ffffff !important; }
    td:nth-child(3) { color: var(--purple-bright) !important; }
    td:nth-child(4) { color: var(--pink-neon) !important; }
    td:nth-child(5) { color: var(--cyan-neon) !important; }

    tr:hover td {
        background-color: rgba(168, 85, 247, 0.25) !important;
    }

    tr:last-child td { border-bottom: none !important; }
</style>
</head>
<body>

<!-- VIDEO BACKGROUND MP4 -->
<video class="bg-video" autoplay loop muted playsinline disablepictureinpicture>
    <source src="./gb.mp4" type="video/mp4">
</video>

<!-- BINGKAI ANIMASI CAHAYA MEMUTAR -->
<div class="container-wrapper">
    <div class="container">
        <h1>Rumus Flop Kasir</h1>
        <div class="sub-title">Ultra Light Edition</div>

        <div class="label-header">
            <label for="rawInput">Tempel Log Transaksi</label>
        </div>
        <textarea id="rawInput" tabindex="1" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
        
        <div class="btn-group">
            <button id="btnCopy" class="btn-copy" tabindex="2" onclick="salinHasil()">
                <span id="txtCopy">SALIN DATA</span>
            </button>
            <button id="btnReset" class="btn-reset" tabindex="3" onclick="resetData()">
                <span id="txtReset">RESET</span>
            </button>
        </div>

        <div class="label-header">
            <label>Hasil Konversi</label>
            <span class="badge-count" id="dataCounter">0 DATA</span>
        </div>
        
        <div class="table-container">
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>WAKTU</th>
                        <th>USER ID</th>
                        <th>TUJUAN BANK</th>
                        <th>CREDIT</th>
                        <th>JUMLAH</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    /* FUNGSI EFEK GELOMBANG (RIPPLE) */
    document.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', function(e) {
            const circle = document.createElement('span');
            const diameter = Math.max(this.clientWidth, this.clientHeight);
            const radius = diameter / 2;

            const rect = this.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - rect.left - radius}px`;
            circle.style.top = `${e.clientY - rect.top - radius}px`;
            circle.classList.add('ripple');

            const ripple = this.querySelector('.ripple');
            if (ripple) {
                ripple.remove();
            }

            this.appendChild(circle);
        });
    });

    /* FUNGSI KONVERSI LOG RINGAN */
    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        const counter = document.getElementById('dataCounter');
        
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) {
            counter.innerText = "0 DATA";
            return;
        }

        let parsedLogList = [];
        let lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');

        if (lines.length === 1 && !lines[0].includes('\t')) {
            let rawChunk = lines[0].replace(/(ACCEPT|REJECT|PENDING|SUCCESS|FAILED)[a-zA-Z0-9]*/gi, "$&\n");
            lines = rawChunk.split('\n').map(l => l.trim()).filter(l => l !== '');
        }

        lines.forEach(line => {
            let matchTime = line.match(/(\d{2}:\d{2}:\d{2})/);
            if (!matchTime) return;
            let waktu = matchTime[1];

            let parts = line.split(/\t|\s{2,}/).map(p => p.trim()).filter(p => p !== '');
            
            if (parts.length >= 5) {
                let userId = parts[2] || "-";
                let bankInfo = parts[4] || "-";
                let jumlah = parts[6] || parts[5] || "0";
                
                jumlah = jumlah.replace(/^-/, '').trim();

                parsedLogList.push({
                    waktu: waktu,
                    userId: userId,
                    tujuanBank: bankInfo,
                    creditStatus: "0",
                    jumlah: jumlah
                });
            } else {
                let timeIndex = line.indexOf(waktu);
                let textAfterTime = line.substring(timeIndex + waktu.length);
                let matchType = textAfterTime.match(/(Withdraw|Deposit)/i);

                if (matchType) {
                    let typeIndex = textAfterTime.search(/(Withdraw|Deposit)/i);
                    let userId = textAfterTime.substring(0, typeIndex).trim();
                    let textAfterType = textAfterTime.substring(typeIndex + matchType[0].length);

                    let matchAmount = textAfterType.match(/-?([0-9.,]+)(?:\s|\t|ACCEPT|REJECT|PENDING|SUCCESS|FAILED|$)/i);
                    let jumlah = "0";
                    let bankSection = textAfterType;

                    if (matchAmount) {
                        jumlah = matchAmount[1].replace(/^-/, '');
                        let amountIndex = textAfterType.indexOf(matchAmount[0]);
                        bankSection = textAfterType.substring(0, amountIndex).trim();
                    }

                    bankSection = bankSection.replace(/-\s*$/, '').trim();

                    parsedLogList.push({
                        waktu: waktu,
                        userId: userId,
                        tujuanBank: bankSection,
                        creditStatus: "0",
                        jumlah: jumlah
                    });
                }
            }
        });

        parsedLogList.reverse();

        let barisDataDisalin = [];

        parsedLogList.forEach((item) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${item.waktu}</td><td>${item.userId}</td><td>${item.tujuanBank}</td><td>${item.creditStatus}</td><td>${item.jumlah}</td>`;
            tbody.appendChild(tr);

            barisDataDisalin.push(`${item.waktu}\t${item.userId}\t${item.tujuanBank}\t\t${item.jumlah}`);
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
        counter.innerText = `${parsedLogList.length} DATA`;
    }

    /* FUNGSI RESET */
    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        document.getElementById('dataCounter').innerText = "0 DATA";
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    /* FUNGSI SALIN TEKS */
    function salinHasil() {
        const txt = document.getElementById('txtCopy');
        
        if (!hasilTeksUntukDisalin) {
            txt.innerText = "DATA KOSONG!";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1000);
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            txt.innerText = "BERHASIL DISALIN";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
        });
    }

    /* SHORTCUT KEYBOARD */
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            resetData();
        }
        if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            salinHasil();
        }
    });
</script>
</body>
</html>
