<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <title>Rumus Flop Kasir - Clean Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only light !important;
    }

    * {
        box-sizing: border-box;
    }

    /* TAMPILAN LATAR GAMBAR */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        /* Menggunakan foto background.jpg yang kamu upload */
        background-image: url('background.jpg') !important;
        background-size: cover !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
        background-attachment: fixed !important;
        font-family: 'Inter', -apple-system, sans-serif;
        color: #f8fafc !important;
    }

    body {
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* CONTAINER TRANSPARAN GELAP (Supaya teks tetap terbaca di atas foto) */
    .container {
        background: rgba(17, 24, 39, 0.85) !important; /* Efek sedikit transparan */
        backdrop-filter: blur(8px); /* Efek kaca buram (opsional) */
        border: 1px solid #1f293d !important; 
        border-radius: 16px; 
        width: 100%;
        max-width: 860px;
        padding: 40px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        margin: auto;
    }

    h1 {
        text-align: center;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin: 0;
        color: #f8fafc !important;
    }

    .sub-title {
        text-align: center;
        font-size: 11px;
        color: #94a3b8 !important;
        letter-spacing: 3px;
        font-weight: 600;
        text-transform: uppercase;
        margin-top: 6px;
        margin-bottom: 32px;
    }
    
    label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #cbd5e1 !important; 
        font-size: 12px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
    
    textarea {
        width: 100%;
        height: 120px;
        background-color: rgba(11, 15, 23, 0.8) !important;
        border: 1px solid #1f293d !important; 
        border-radius: 8px;
        color: #38bdf8 !important;
        padding: 14px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Inter', monospace;
        font-size: 13px;
        margin-bottom: 24px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    textarea:focus {
        outline: none;
        border-color: #38bdf8 !important;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15) !important;
    }
    
    /* TOMBOL */
    .btn-group {
        display: flex;
        gap: 14px;
        margin-bottom: 32px;
    }
    
    button {
        position: relative;
        flex: 1;
        padding: 14px; 
        font-size: 13px;    
        font-weight: 600;
        border-radius: 8px; 
        cursor: pointer;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        border: 1px solid transparent;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-copy { 
        background-color: #f8fafc !important; 
        color: #0f172a !important; 
        box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    
    .btn-copy:hover { 
        transform: translateY(-2px);
        background-color: #ffffff !important;
        box-shadow: 0 8px 20px -4px rgba(248, 250, 252, 0.25);
    }

    .btn-reset { 
        background-color: rgba(255, 255, 255, 0.03) !important; 
        color: #94a3b8 !important; 
        border: 1px solid #1f293d !important;
    }
    
    .btn-reset:hover { 
        transform: translateY(-2px);
        background-color: rgba(255, 255, 255, 0.08) !important; 
        color: #f8fafc !important;
        border-color: #334155 !important;
    }

    button:active {
        transform: translateY(0px) scale(0.98);
    }
    
    /* TABEL */
    .table-container { 
        overflow-x: auto; 
        border-radius: 8px;
        border: 1px solid #1f293d !important;
        background-color: rgba(11, 15, 23, 0.8) !important;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
    }
    
    th, td {
        padding: 13px 16px;
        text-align: left;
        font-size: 13px;
        white-space: nowrap;
    }
    
    th { 
        font-weight: 600;
        background-color: rgba(17, 24, 39, 0.9) !important; 
        color: #38bdf8 !important; 
        font-size: 11px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        border-bottom: 1px solid #1f293d !important;
    }
    
    td {
        color: #cbd5e1 !important;
        border-bottom: 1px solid #111827 !important;
    }
    
    tr:last-child td {
        border-bottom: none !important;
    }

    tr:hover td {
        background-color: rgba(255, 255, 255, 0.05) !important;
        color: #ffffff !important;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Rumus Flop Kasir</h1>
    <div class="sub-title">Clean Luxury Edition</div>

    <label for="rawInput">Tempel Log Transaksi</label>
    <textarea id="rawInput" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
    
    <div class="btn-group">
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>USER ID</th>
                    <th>TUJUAN BANK</th>
                    <th>CREDIT</th>
                    <th>JUMLAH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n'); 
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let creditStatus = "-"; 
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin!");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "BERHASIL DISALIN";
            setTimeout(() => { btnCopy.innerText = teksAwal; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data.");
        });
    }
</script>
</body>
</html>
