<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>Rumus Flop Kasir - Ultra Light Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&family=Hanuman:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only dark !important;
        --blue-electric: #00d2ff;
        --purple-neon: #a855f7;
        --purple-bright: #d8b4fe;
        --pink-neon: #ff007f;
        --cyan-neon: #00f0ff;
        
        --lavender-bg: rgba(147, 112, 219, 0.15); 
        --lavender-border: #c89eff;               
        --lavender-text: #e8d7ff;                 
        --lavender-glow: #b57edc; 
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #030308;
        overflow-x: hidden;
    }

    body {
        padding: 30px 15px;
        font-family: 'Rajdhani', sans-serif;
        color: #ffffff !important;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
        pointer-events: none;
    }

    /* CONTAINER UTAMA */
    .container {
        position: relative;
        z-index: 2;
        background: rgba(10, 8, 25, 0.55) !important; 
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border-radius: 40px !important;
        border: 2px solid var(--lavender-border) !important;
        width: 100%;
        max-width: 900px;
        padding: 40px;
        margin: auto;
        box-shadow: 
            0 0 15px rgba(200, 158, 255, 0.6),
            0 0 35px rgba(168, 85, 247, 0.4),
            inset 0 0 20px rgba(200, 158, 255, 0.25);
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .container.hidden-for-chat {
        display: none !important;
    }

    h1 {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 4px;
        margin: 0;
        background: linear-gradient(
            90deg, 
            var(--cyan-neon), 
            var(--blue-electric), 
            var(--pink-neon), 
            var(--purple-neon), 
            var(--cyan-neon)
        );
        background-size: 200% auto;
        color: transparent !important;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shineText 3s linear infinite;
        filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.5));
    }

    @keyframes shineText {
        to { background-position: 200% center; }
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        color: var(--purple-bright) !important;
        letter-spacing: 6px;
        font-weight: 800;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 28px;
    }

    .label-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    .label-actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    label {
        display: block;
        font-family: 'Orbitron', sans-serif;
        font-weight: 800;
        color: var(--purple-bright) !important; 
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .badge-count, .btn-swap-pos, .btn-typing-test {
        font-size: 11px;
        font-weight: 800;
        padding: 4px 12px;
        border-radius: 15px;
        background: rgba(0, 210, 255, 0.15);
        color: var(--cyan-neon) !important;
        border: 1px solid rgba(0, 240, 255, 0.5);
        font-family: 'Orbitron', sans-serif;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-block;
    }

    .btn-swap-pos {
        background: rgba(168, 85, 247, 0.15);
        color: var(--purple-bright) !important;
        border: 1px solid rgba(168, 85, 247, 0.5);
    }

    /* TOMBOL TYPING TEST BARU */
    .btn-typing-test {
        background: rgba(255, 0, 127, 0.15);
        color: var(--pink-neon) !important;
        border: 1px solid rgba(255, 0, 127, 0.5);
    }

    .badge-count:hover, .btn-swap-pos:hover, .btn-typing-test:hover {
        background: rgba(0, 210, 255, 0.35);
        border-color: #ffffff;
        color: #ffffff !important;
        box-shadow: 0 0 12px var(--cyan-neon);
        transform: scale(1.05);
    }

    .btn-swap-pos:hover {
        box-shadow: 0 0 12px var(--purple-neon);
    }

    .btn-typing-test:hover {
        background: rgba(255, 0, 127, 0.35);
        box-shadow: 0 0 12px var(--pink-neon);
    }
    
    textarea#rawInput {
        width: 100%;
        height: 120px;
        background: rgba(0, 0, 0, 0.3) !important;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: 1.5px solid rgba(168, 85, 247, 0.3) !important; 
        border-radius: 12px;
        color: var(--cyan-neon) !important;
        padding: 14px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 13.5px;
        margin-bottom: 20px;
        user-select: text;
        transition: border-color 0.2s ease, background 0.2s ease;
    }

    textarea#rawInput:focus {
        outline: none;
        border-color: var(--blue-electric) !important;
        background: rgba(0, 0, 0, 0.5) !important;
        box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    .btn-group {
        display: flex;
        gap: 16px;
        margin-bottom: 28px;
    }

    .btn-group.swapped {
        flex-direction: row-reverse;
    }

    button {
        position: relative;
        overflow: hidden;
        flex: 1;
        padding: 16px 20px; 
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;    
        font-weight: 900;
        cursor: pointer;
        letter-spacing: 2px;
        text-transform: uppercase;
        outline: none;
        border-radius: 35px !important;
        border: 2px solid var(--lavender-border) !important;
        background: var(--lavender-bg) !important;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        color: var(--lavender-text) !important;
        text-shadow: 0 0 6px rgba(181, 126, 220, 0.6);
        box-shadow: 0 0 12px rgba(200, 158, 255, 0.5), inset 0 0 8px rgba(181, 126, 220, 0.2);
        transition: transform 0.1s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    button:hover {
        animation: shakeBtn 0.2s ease-in-out infinite alternate;
        background: rgba(147, 112, 219, 0.35) !important;
        border-color: #ffffff !important;
        box-shadow: 0 0 20px #b57edc, inset 0 0 12px rgba(255, 255, 255, 0.4);
    }

    @keyframes shakeBtn {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        25% { transform: translate(-1px, -1px) rotate(-0.5deg); }
        50% { transform: translate(-1px, 1px) rotate(0.5deg); }
        75% { transform: translate(1px, -1px) rotate(0deg); }
        100% { transform: translate(1px, 1px) rotate(0.5deg); }
    }

    button:active {
        transform: scale(0.96) !important;
        animation: none !important;
    }

    .table-container { 
        position: relative;
        overflow-x: auto; 
        max-height: 380px;
        border-radius: 12px;
        border: 1.5px solid rgba(168, 85, 247, 0.3) !important;
        background: rgba(0, 0, 0, 0.25) !important;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }
    
    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
    }
    
    th, td {
        padding: 12px 16px;
        text-align: left;
        white-space: nowrap;
        user-select: text;
    }
    
    th { 
        position: sticky;
        top: 0;
        z-index: 3;
        font-family: 'Orbitron', sans-serif;
        font-weight: 800;
        background: rgba(13, 10, 30, 0.75) !important; 
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        color: var(--purple-bright) !important; 
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border-bottom: 2px solid var(--purple-neon) !important;
    }
    
    td {
        color: #ffffff !important;
        border-bottom: 1px solid rgba(168, 85, 247, 0.12) !important;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 13px;
    }

    td:nth-child(1) { color: var(--blue-electric) !important; }
    td:nth-child(2) { color: #ffffff !important; }
    td:nth-child(3) { color: var(--purple-bright) !important; }
    td:nth-child(4) { color: var(--pink-neon) !important; }
    td:nth-child(5) { color: var(--cyan-neon) !important; }

    /* STYLE MODAL TYPING TEST */
    .typing-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        z-index: 1008;
        display: none;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .typing-card {
        position: relative;
        background: rgba(10, 8, 25, 0.95);
        border: 2px solid var(--pink-neon);
        box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
        border-radius: 24px;
        padding: 30px;
        width: 100%;
        max-width: 750px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .typing-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 10px;
    }

    .typing-card-title {
        font-family: 'Orbitron', sans-serif;
        font-size: 18px;
        font-weight: 900;
        color: var(--cyan-neon);
        letter-spacing: 2px;
    }

    .typing-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }

    .typing-select {
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(20, 20, 30, 0.9);
        color: var(--cyan-neon);
        border: 1px solid rgba(0, 240, 255, 0.4);
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        outline: none;
        cursor: pointer;
    }

    .typing-stats {
        display: flex;
        gap: 10px;
    }

    .t-stat-box {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 6px 12px;
        border-radius: 10px;
        text-align: center;
    }

    .t-stat-box .t-label {
        font-size: 9px;
        color: var(--purple-bright);
        font-family: 'Orbitron', sans-serif;
    }

    .t-stat-box .t-value {
        font-size: 14px;
        font-weight: bold;
        color: #fff;
        font-family: 'JetBrains Mono', monospace;
    }

    .typing-text-display {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(168, 85, 247, 0.3);
        padding: 15px;
        border-radius: 12px;
        min-height: 100px;
        max-height: 140px;
        overflow-y: auto;
        font-family: 'Poppins', 'Hanuman', sans-serif;
        font-size: 18px;
        line-height: 1.6;
        user-select: none;
        word-break: break-word;
    }

    .t-char { color: #555; }
    .t-char.correct { color: #4ade80; }
    .t-char.incorrect { color: #f87171; background: rgba(248, 113, 113, 0.2); }
    .t-char.current { border-left: 2px solid var(--cyan-neon); animation: blink 1s infinite; }

    @keyframes blink { 50% { border-color: transparent; } }

    textarea#typingInput {
        width: 100%;
        height: 80px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(0, 240, 255, 0.4);
        border-radius: 12px;
        padding: 12px;
        color: #fff;
        font-family: 'Poppins', 'Hanuman', sans-serif;
        font-size: 16px;
        outline: none;
        resize: none;
    }

    .auth-close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: transparent !important;
        border: none !important;
        color: var(--pink-neon) !important;
        font-size: 18px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: none !important;
    }
</style>
</head>
<body>

<video class="bg-video" autoplay loop muted playsinline disablepictureinpicture>
    <source src="./gb.mp4" type="video/mp4">
</video>

<!-- CONTAINER UTAMA -->
<div class="container" id="mainContainer">
    <h1>Rumus Flop Kasir</h1>
    <div class="sub-title">Ultra Light Edition</div>

    <div class="label-header">
        <label for="rawInput">Tempel Log Transaksi</label>
    </div>
    <textarea id="rawInput" tabindex="1" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
    
    <div class="btn-group" id="btnGroup">
        <button id="btnCopy" class="btn-copy" tabindex="2" onclick="salinHasil()">
            <span id="txtCopy">SALIN DATA</span>
        </button>
        <button id="btnReset" class="btn-reset" tabindex="3" onclick="resetData()">
            <span id="txtReset">RESET</span>
        </button>
    </div>

    <div class="label-header">
        <label>Hasil Konversi</label>
        <div class="label-actions">
            <!-- TOMBOL BARU TYPING TEST DI SEBELAH SWAP -->
            <span class="btn-typing-test" onclick="openTypingModal()">TYPING TEST ⌨️</span>
            <span class="btn-swap-pos" onclick="toggleBtnPosition()">SWAP ⇄</span>
            <span class="badge-count" id="dataCounter" onclick="handleChatClick()">DATA</span>
        </div>
    </div>
    
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>USER ID</th>
                    <th>TUJUAN BANK</th>
                    <th>CREDIT</th>
                    <th>JUMLAH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- MODAL TYPING TEST BAHASA INDONESIA & KHMER -->
<div class="typing-modal-overlay" id="typingModal">
    <div class="typing-card">
        <button class="auth-close-btn" onclick="closeTypingModal()">X</button>
        
        <div class="typing-card-header">
            <div class="typing-card-title">TYPING TEST (1 MENIT)</div>
        </div>

        <div class="typing-controls">
            <select id="langSelect" class="typing-select" onchange="resetTypingTest()">
                <option value="id">Bahasa Indonesia</option>
                <option value="km">Bahasa Khmer (ភាសាខ្មែរ)</option>
            </select>

            <div class="typing-stats">
                <div class="t-stat-box">
                    <div class="t-label">WAKTU</div>
                    <div class="t-value" id="tTimer">60s</div>
                </div>
                <div class="t-stat-box">
                    <div class="t-label">WPM</div>
                    <div class="t-value" id="tWpm">0</div>
                </div>
                <div class="t-stat-box">
                    <div class="t-label">AKURASI</div>
                    <div class="t-value" id="tAccuracy">100%</div>
                </div>
            </div>
        </div>

        <div class="typing-text-display" id="typingTextDisplay"></div>

        <textarea id="typingInput" placeholder="Ketik di sini untuk memulai tes..." oninput="processTyping()"></textarea>

        <button onclick="resetTypingTest()" style="padding: 10px; border-radius: 12px;">RESET TEST 🔄</button>
    </div>
</div>

<script>
    // LOGIKA BAHASA & TYPING TEST
    const typingTexts = {
        id: [
            "teknologi informasi berkembang sangat pesat di era digital saat ini. setiap orang dituntut untuk dapat beradaptasi dengan perubahan yang terjadi. keterampilan mengetik cepat dan akurat menjadi salah satu kemampuan dasar yang sangat berguna.",
            "keindahan alam indonesia sangat mempesona dari sabang sampai merauke. gunung yang menjulang tinggi serta pantai indah menjadi daya tarik wisatawan. kita harus senantiasa menjaga kelestarian lingkungan."
        ],
        km: [
            "បច្ចេកវិទ្យាព័ត៌មានកំពុងអភិវឌ្ឍយ៉ាងលឿននៅក្នុងយុគសម័យឌីជីថលនេះ។ មនុស្សគ្រប់រូបត្រូវតែសម្របខ្លួនទៅនឹងការផ្លាស់ប្តូរដែលកំពុងកើតឡើង។ ជំនាញវាយអត្ថបទរហ័សនិងត្រឹមត្រូវគឺជារឿងសំខាន់។",
            "ប្រទេសកម្ពុជាមានវប្បធម៌និងអរិយធម៌ដ៏សំបូរបែប។ ប្រាសាទអង្គរវត្តជាបេតិកភណ្ឌពិភពលោកដែលធ្វើឱ្យប្រជាជនកម្ពុជាមានមោទនភាពយ៉ាងខ្លាំង។"
        ]
    };

    let tTimeLimit = 60;
    let tTimeLeft = tTimeLimit;
    let tTimer = null;
    let tIsTesting = false;
    let tCurrentText = "";

    function openTypingModal() {
        document.getElementById('mainContainer').classList.add('hidden-for-chat');
        document.getElementById('typingModal').style.display = 'flex';
        resetTypingTest();
    }

    function closeTypingModal() {
        clearInterval(tTimer);
        tIsTesting = false;
        document.getElementById('typingModal').style.display = 'none';
        document.getElementById('mainContainer').classList.remove('hidden-for-chat');
    }

    function initTypingText() {
        const lang = document.getElementById("langSelect").value;
        const list = typingTexts[lang];
        tCurrentText = list[Math.floor(Math.random() * list.length)];
        
        const display = document.getElementById("typingTextDisplay");
        display.innerHTML = "";

        Array.from(tCurrentText).forEach((char, index) => {
            const span = document.createElement("span");
            span.classList.add("t-char");
            if (index === 0) span.classList.add("current");
            span.innerText = char;
            display.appendChild(span);
        });
    }

    function startTypingTimer() {
        if (!tIsTesting) {
            tIsTesting = true;
            tTimer = setInterval(() => {
                if (tTimeLeft > 0) {
                    tTimeLeft--;
                    document.getElementById("tTimer").innerText = tTimeLeft + "s";
                    calculateTypingStats();
                } else {
                    endTypingTest();
                }
            }, 1000);
        }
    }

    function processTyping() {
        const input = document.getElementById("typingInput");
        const typedText = input.value;
        const spans = document.querySelectorAll(".t-char");

        if (!tIsTesting && typedText.length > 0) {
            startTypingTimer();
        }

        spans.forEach((span, index) => {
            const typedChar = typedText[index];
            span.classList.remove("current");

            if (typedChar == null) {
                span.classList.remove("correct", "incorrect");
            } else if (typedChar === span.innerText) {
                span.classList.add("correct");
                span.classList.remove("incorrect");
            } else {
                span.classList.add("incorrect");
                span.classList.remove("correct");
            }
        });

        if (typedText.length < spans.length) {
            spans[typedText.length].classList.add("current");
        }

        calculateTypingStats();

        if (typedText.length >= tCurrentText.length) {
            endTypingTest();
        }
    }

    function calculateTypingStats() {
        const typedText = document.getElementById("typingInput").value;
        const spans = document.querySelectorAll(".t-char");
        
        let correctChars = 0;
        spans.forEach((span, index) => {
            if (typedText[index] === span.innerText) correctChars++;
        });

        const timeSpent = tTimeLimit - tTimeLeft;
        if (timeSpent > 0) {
            const wpm = Math.round((correctChars / 5) / (timeSpent / 60));
            document.getElementById("tWpm").innerText = wpm >= 0 ? wpm : 0;
        }

        if (typedText.length > 0) {
            const accuracy = Math.round((correctChars / typedText.length) * 100);
            document.getElementById("tAccuracy").innerText = (accuracy >= 0 ? accuracy : 0) + "%";
        }
    }

    function endTypingTest() {
        clearInterval(tTimer);
        tIsTesting = false;
        document.getElementById("typingInput").disabled = true;
        document.getElementById("tTimer").innerText = "Selesai!";
    }

    function resetTypingTest() {
        clearInterval(tTimer);
        tIsTesting = false;
        tTimeLeft = tTimeLimit;
        document.getElementById("tTimer").innerText = tTimeLimit + "s";
        document.getElementById("tWpm").innerText = "0";
        document.getElementById("tAccuracy").innerText = "100%";
        const input = document.getElementById("typingInput");
        input.value = "";
        input.disabled = false;
        initTypingText();
    }

    // LOGIKA LAINNYA
    let hasilTeksUntukDisalin = "";
    let chatClickCount = 0;
    let chatClickTimer = null;

    function handleChatClick() {
        chatClickCount++;
        clearTimeout(chatClickTimer);
        chatClickTimer = setTimeout(() => {
            chatClickCount = 0;
        }, 400);
    }

    function toggleBtnPosition() {
        document.getElementById('btnGroup').classList.toggle('swapped');
    }

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        const counter = document.getElementById('dataCounter');
        
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) {
            counter.innerText = "0 DATA";
            return;
        }

        let parsedLogList = [];
        let lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');

        lines.forEach(line => {
            let matchTime = line.match(/(\d{2}:\d{2}:\d{2})/);
            if (!matchTime) return;
            let waktu = matchTime[1];

            let parts = line.split(/\t|\s{2,}/).map(p => p.trim()).filter(p => p !== '');
            if (parts.length >= 5) {
                let userId = parts[2] || "-";
                let bankInfo = parts[4] || "-";
                let jumlah = parts[6] || parts[5] || "0";
                jumlah = jumlah.replace(/^-/, '').trim();

                parsedLogList.push({ waktu, userId, tujuanBank: bankInfo, creditStatus: "0", jumlah });
            }
        });

        parsedLogList.reverse();
        let barisDataDisalin = [];

        parsedLogList.forEach((item) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${item.waktu}</td><td>${item.userId}</td><td>${item.tujuanBank}</td><td>${item.creditStatus}</td><td>${item.jumlah}</td>`;
            tbody.appendChild(tr);
            barisDataDisalin.push(`${item.waktu}\t${item.userId}\t${item.tujuanBank}\t\t${item.jumlah}`);
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
        counter.innerText = `${parsedLogList.length} DATA`;
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        document.getElementById('dataCounter').innerText = "0 DATA";
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        const txt = document.getElementById('txtCopy');
        if (!hasilTeksUntukDisalin) {
            txt.innerText = "DATA KOSONG!";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1000);
            return;
        }
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            txt.innerText = "BERHASIL DISALIN";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1200);
        });
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            if (document.getElementById('typingModal').style.display === 'flex') {
                closeTypingModal();
            } else {
                resetData();
            }
        }
    });
</script>
