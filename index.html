<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - NARUTO SAGE SMOOTH</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=400;700;900&family=Rajdhani:wght=500;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        --bg-deep: #0e0301;          
        --panel-bg: rgba(24, 8, 4, 0.96); 
        --kurama-orange: #ff5500;    
        --sage-gold: #ffaa00;        
        --scroll-red: #9e1b1b;       
        --shimmer-naruto: linear-gradient(135deg, #ff5500 0%, #ffaa00 50%, #9e1b1b 100%);
        --text-white: #ffffff;
    }

    body {
        font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: var(--text-white);
        
        /* SOLUSI ANTI-POLOS: Menggunakan kombinasi warna solid dan radial gradient murni */
        background-color: var(--bg-deep);
        background-image: radial-gradient(circle at 50% 35%, #4a1500 0%, #1a0601 50%, #050100 100%);
        background-attachment: fixed;
    }
    
    /* PANEL UTAMA - SEAMLESS MATTE */
    .container {
        background: var(--panel-bg); 
        border: none; 
        border-radius: 24px; 
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-sizing: border-box;
        box-shadow: 
            0 25px 60px rgba(0, 0, 0, 0.95), 
            0 0 40px rgba(255, 85, 0, 0.15);
        position: relative;
        z-index: 1;
        backdrop-filter: blur(15px);
    }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: var(--text-white);
        font-size: 36px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 8px;
        margin: 0;
        text-shadow: 0 0 15px var(--kurama-orange);
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;
        background: var(--shimmer-naruto);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 6px;
        font-weight: 900;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 35px;
        animation: shine 2.5s linear infinite;
    }
    
    @keyframes shine {
        to { background-position: 200% center; }
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--sage-gold);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    
    /* INPUT AREA */
    textarea {
        width: 100%;
        height: 140px;
        background: #0b0200;
        border: none; 
        border-radius: 12px;
        color: #ffffff;
        padding: 18px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 30px;
        box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
        transition: all 0.3s ease;
    }
    
    textarea:focus {
        outline: none;
        box-shadow: inset 0 2px 10px rgba(0,0,0,0.9), 0 0 15px rgba(255, 85, 0, 0.4);
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 40px;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        padding: 18px; 
        font-size: 13px;   
        font-weight: 900;
        border: none;
        border-radius: 12px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2.5px;
        transition: all 0.2s ease;
    }
    
    .btn-submit { 
        background: var(--kurama-orange); 
        color: #ffffff; 
        box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
    }
    .btn-submit:hover {
        background: #ff6a1f;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 85, 0, 0.5);
    }
    
    .btn-copy { 
        background: rgba(255, 255, 255, 0.05); 
        color: #ffffff; 
        border: 2px solid var(--sage-gold);
    }
    .btn-copy:hover { 
        background: var(--sage-gold);
        color: #000000;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 170, 0, 0.4);
    }
    
    .btn-reset { 
        background: #2b0805; 
        color: var(--text-white); 
    }
    .btn-reset:hover { 
        background: #420f06;
        transform: translateY(-2px);
    }
    
    /* TABEL DATA TANPA KOTAK GARIS PINGGIR */
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 16px;
        border: none; 
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: transparent; 
    }
    
    th, td {
        border: none; 
        padding: 18px 20px;
        text-align: left;
        font-size: 14px;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background-color: rgba(45, 14, 7, 0.7); 
        color: var(--sage-gold); 
        font-weight: 900; 
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    
    td {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        color: #e2e8f0;
    }

    td:nth-child(5) {
        font-family: 'Orbitron', sans-serif;
        color: var(--sage-gold); 
        text-shadow: 0 0 8px rgba(255, 170, 0, 0.4);
        font-weight: 900;
    }
    
    tr:nth-child(even) {
        background-color: rgba(255, 255, 255, 0.02);
    }

    tr:hover {
        background-color: rgba(255, 85, 0, 0.06);
    }
</style>
</head>
<body>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">Sage Mode - Konoha Kasir v5.5</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="SAGE CHAKRA DETECTED... READY TO TRANSLATE LOGS..."></textarea>
    
    <div class="btn-group">
        <button id="btnSubmit" class="btn-submit" onclick="konversiLog()">Submit</button>
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            
            if (kolom.length < 5) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 5) {
                const pakaiNoUrut = !isNaN(kolom[0]) && kolom.length > 6;
                
                let waktu = "";
                let idxWaktu = pakaiNoUrut ? 1 : 0;
                if(kolom[idxWaktu] && kolom[idxWaktu].includes('-')) {
                    let pecahWaktu = kolom[idxWaktu].split(/\s+/);
                    waktu = pecahWaktu[1] || kolom[idxWaktu];
                } else {
                    waktu = kolom[idxWaktu] || "";
                }
                
                if (waktu.includes('-') && waktu.includes(':')) {
                    waktu = waktu.split(/\s+/)[1] || waktu;
                } else if (!waktu.includes(':') && kolom[idxWaktu+1] && kolom[idxWaktu+1].includes(':')) {
                    waktu = kolom[idxWaktu+1];
                }

                let userId = "";
                for (let i = 1; i < kolom.length; i++) {
                    if (kolom[i].includes(':')) {
                        userId = kolom[i+1] || "";
                        break;
                    }
                }
                if (!userId) userId = pakaiNoUrut ? kolom[2] : kolom[1];

                let tujuanBank = "";
                for (let i = 0; i < kolom.length; i++) {
                    if (kolom[i].includes(',') || kolom[i].toUpperCase().includes('MANDIRI') || kolom[i].toUpperCase().includes('BCA') || kolom[i].toUpperCase().includes('BRI') || kolom[i].toUpperCase().includes('BNI')) {
                        tujuanBank = kolom[i];
                        break;
                    }
                }

                let jumlah = "";
                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 4) {
                        jumlah = kolom[i];
                        break;
                    }
                }
                if (!jumlah) {
                    jumlah = kolom[kolom.length - 3] || "";
                }

                const creditStatus = ""; 

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${creditStatus}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin! Silakan submit log terlebih dahulu.");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "JURUS COPY SUKSES!";
            btnCopy.style.background = "var(--kurama-orange)";
            btnCopy.style.color = "#ffffff";
            
            setTimeout(() => {
                btnCopy.innerText = teksAwal;
                btnCopy.style.background = "transparent";
                btnCopy.style.color = "#ffffff";
            }, 1500);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data, pastikan izin clipboard aktif.");
        });
    }
</script>
</body>
</html>
