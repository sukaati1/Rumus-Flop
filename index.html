<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Neon Boss</title>
    <style>
        /* --- CSS Global Boss --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace; /* Pake font monospace biar keliatan jadul koding */
        }

        body {
            background-color: #050505; /* Hitam pekat, biar neonnya nyala */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- Container Utamanya Boss --- */
        .neon-table-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            background: #0a0a0a;
            border-radius: 15px;
            padding: 4px; /* Space buat neon-nya */
            overflow: hidden; /* Biar neon nggak lari keluar */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* --- Ini Dia Rahasia Cahaya Neon Jalan-nya Boss! --- */
        .neon-table-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                0deg, 
                transparent, 
                transparent, 
                #00e676, /* Hijau Neon */
                #00e676 /* Hijau Neon */
            );
            transform-origin: bottom right;
            animation: light-rotate 4s linear infinite; /* Kecepatan muternya */
        }

        .neon-table-container::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                0deg, 
                transparent, 
                transparent, 
                #e91e63, /* Pink/Merah Neon */
                #e91e63 /* Pink/Merah Neon */
            );
            transform-origin: bottom right;
            animation: light-rotate 4s linear infinite;
            animation-delay: -2s; /* Jeda biar jadi kayak dua warna jalan bareng */
        }

        /* --- Animasi Muter --- */
        @keyframes light-rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* --- Content di dalem biar aman --- */
        .table-inner {
            position: relative;
            background: #111; /* Warna background dalem table */
            border-radius: 11px;
            z-index: 10;
            padding: 20px;
            overflow: hidden;
        }

        /* --- Header Table --- */
        .table-header {
            color: #00e676; /* Warna text header neon */
            text-shadow: 0 0 10px #00e676, 0 0 20px #00e676; /* Efek glow neon */
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        /* --- List Log Kasir --- */
        .log-list {
            list-style: none;
            height: 300px;
            overflow-y: auto; /* Biar bisa di-scroll kalo kepanjangan */
            padding-right: 10px;
        }

        .log-item {
            padding: 10px 15px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .log-time { color: #888; }
        .log-desc { flex-grow: 1; margin: 0 20px; }
        .log-price { font-weight: bold; }

        /* --- Footer Buat Total --- */
        .table-footer {
            margin-top: 20px;
            border-top: 2px solid #e91e63; /* Separator neon pink */
            padding-top: 15px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .total-label { color: #e91e63; font-weight: bold; margin-right: 20px; }
        .total-amount { font-size: 22px; font-weight: bold; color: white; text-shadow: 0 0 5px white; }

        /* --- Tombol "Palsu" Buat Nambahin Data (Buat Demo Aja) --- */
        #addBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00e676;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px #00e676;
        }
    </style>
</head>
<body>

    <!-- Container Utama Boss -->
    <div class="neon-table-container">
        <div class="table-inner">
            <div class="table-header">>> LOG TRANSAKSI KASIR NEON <<</div>
            
            <ul class="log-list" id="logList">
                <li class="log-item">
                    <span class="log-time">14:02:11</span>
                    <span class="log-desc">Token Listrik 100k</span>
                    <span class="log-price text-green">Rp 102.000</span>
                </li>
                <li class="log-item">
                    <span class="log-time">14:02:45</span>
                    <span class="log-desc">Rokok Marboro Merah</span>
                    <span class="log-price">Rp 35.500</span>
                </li>
                <li class="log-item">
                    <span class="log-time">14:03:01</span>
                    <span class="log-desc">Indomie Goreng (x5)</span>
                    <span class="log-price">Rp 16.000</span>
                </li>
                 <li class="log-item">
                    <span class="log-time">14:03:30</span>
                    <span class="log-desc">Air Mineral 600ml</span>
                    <span class="log-price">Rp 5.000</span>
                </li>
            </ul>

            <div class="table-footer">
                <span class="total-label">TOTAL PENDAPATAN:</span>
                <span class="total-amount">Rp 158.500</span>
            </div>
        </div>
    </div>

    <!-- Tombol Demo Boss -->
    <button id="addBtn">Tambah Transaksi</button>

    <script>
        // --- Javascript Boss (Buat Demo Nambahin Data) ---
        const logList = document.getElementById('logList');
        const totalAmountSpan = document.querySelector('.total-amount');
        const addBtn = document.getElementById('addBtn');
        let currentTotal = 158500;

        const dummyTransactions = [
            { desc: "Kopi Hitam", price: 8000 },
            { desc: "Pake Data Telkomsel", price: 55000 },
            { desc: "Ciki Ring", price: 2500 },
            { desc: "Minyak Goreng 2L", price: 41000 },
            { desc: "Es Krim", price: 12000 },
        ];

        function getCurrentTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function formatRupiah(amount) {
            return "Rp " + amount.toLocaleString('id-ID');
        }

        addBtn.addEventListener('click', () => {
            // Pilih transaksi acak
            const randIdx = Math.floor(Math.random() * dummyTransactions.length);
            const trans = dummyTransactions[randIdx];
            currentTotal += trans.price;

            // Buat element log baru
            const newLogItem = document.createElement('li');
            newLogItem.className = 'log-item';
            newLogItem.innerHTML = `
                <span class="log-time">${getCurrentTime()}</span>
                <span class="log-desc">${trans.desc}</span>
                <span class="log-price">${formatRupiah(trans.price)}</span>
            `;

            // Tambahin ke list
            logList.appendChild(newLogItem);

            // Update total
            totalAmountSpan.textContent = formatRupiah(currentTotal);

            // Auto-scroll ke paling bawah
            logList.scrollTop = logList.scrollHeight;
        });

    </script>
</body>
</html>
