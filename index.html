<style>
    body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    /* Mengarahkan langsung ke file gambar di dalam folder yang sama */
    background: linear-gradient(rgba(10, 5, 0, 0.82), rgba(20, 10, 0, 0.92)), 
                url('naruto.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #f3f4f6;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    }
    /* Canvas ditaruh di paling latar belakang */
    #bgCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
    }
    .container {
        background: rgba(15, 8, 5, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 69, 0, 0.35);
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85), 0 0 25px rgba(255, 69, 0, 0.2);
        width: 100%;
        max-width: 950px;
        padding: 30px;
        box-sizing: border-box;
        position: relative;
        z-index: 1;
    }
    h1 {
        text-align: center;
        color: #ff4500;
        font-size: 28px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 4px;
        margin-bottom: 30px;
        text-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
    }
    label {
        display: block;
        font-weight: 600;
        margin-bottom: 10px;
        color: #ffa500;
        font-size: 14px;
        letter-spacing: 0.7px;
    }
    textarea {
        width: 100%;
        height: 150px;
        background: rgba(8, 3, 1, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        color: #fff;
        padding: 15px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 13.5px;
        margin-bottom: 25px;
        transition: all 0.3s ease;
    }
    textarea:focus {
        border-color: #ff4500;
        outline: none;
        box-shadow: 0 0 12px rgba(255, 69, 0, 0.4);
        background: rgba(5, 1, 0, 0.95);
    }
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;
    }
    button {
        flex: 1;
        padding: 14px 20px;
        font-size: 14px;
        font-weight: 700;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 1.2px;
    }
    .btn-submit { 
        background: linear-gradient(135deg, #ff4500, #ff6600); 
        color: #fff; 
    }
    .btn-submit:hover { 
        transform: translateY(-2px); 
        box-shadow: 0 6px 15px rgba(255, 69, 0, 0.45); 
    }
    .btn-copy { 
        background: linear-gradient(135deg, #1e40af, #3b82f6); 
        color: #fff; 
    }
    .btn-copy:hover { 
        transform: translateY(-2px); 
        box-shadow: 0 6px 15px rgba(59, 130, 246, 0.45); 
    }
    .btn-reset { 
        background: rgba(255, 255, 255, 0.08); 
        color: #d1d5db; 
        border: 1px solid rgba(255, 255, 255, 0.15); 
    }
    .btn-reset:hover { 
        background: rgba(255, 255, 255, 0.18); 
        color: #fff; 
    }
    button:active {
        transform: translateY(1px);
    }
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 10px; 
        border: 1px solid rgba(255, 255, 255, 0.08); 
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(12, 6, 4, 0.85);
    }
    th, td {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 14px 18px;
        text-align: left;
        font-size: 13.5px;
    }
    th { 
        background-color: rgba(20, 10, 5, 0.95); 
        color: #ff4500; 
        font-weight: 700; 
        letter-spacing: 0.8px; 
    }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background-color: rgba(255, 69, 0, 0.02); }
</style>
</head>
<body>

<!-- Elemen Live Wallpaper -->
<canvas id="bgCanvas"></canvas>

<div class="container">
    <h1>Rumus Flop</h1>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="1	2026-06-30 12:33:08	wasuli123..."></textarea>
    
    <div class="btn-group">
        <button class="btn-submit" onclick="konversiLog()">Submit</button>
        <button class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // --- LOGIKA LIVE WALLPAPER (PERCIKAN API & SILUET) ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    // Mengambil Gambar Siluet Naruto dari URL Terpercaya
    const narutoImg = new Image();
    narutoImg.src = 'https://i.imgur.com/vHwzYgL.png'; 

    class Particle {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.size = Math.random() * 3 + 1;
            this.speedY = Math.random() * 2 + 1;
            this.speedX = Math.random() * 2 - 1;
            this.alpha = 1;
            this.fade = Math.random() * 0.015 + 0.005;
            // Warna percikan api klan Uchiha / Kyuubi
            this.color = Math.random() > 0.3 ? '#ff4500' : '#ffcc00';
        }
        update() {
            this.y -= this.speedY;
            this.x += this.speedX;
            this.alpha -= this.fade;
            if (this.alpha <= 0 || this.y < 0) {
                this.reset();
            }
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    const particles = [];
    for (let i = 0; i < 60; i++) {
        particles.push(new Particle());
    }

    function animate() {
        // Efek trail/jejak gelap agar pergerakan halus
        ctx.fillStyle = 'rgba(12, 6, 2, 0.3)';
        ctx.fillRect(0, 0, width, height);

        // Gambar Siluet Naruto di Latar Belakang Kanan Bawah
        if (narutoImg.complete) {
            const imgW = width * 0.35 > 400 ? 400 : width * 0.35;
            const imgH = imgW * (narutoImg.height / narutoImg.width);
            ctx.save();
            ctx.globalAlpha = 0.15; // Dibuat transparan agar tidak mengganggu tabel
            ctx.drawImage(narutoImg, width - imgW - 20, height - imgH, imgW, imgH);
            ctx.restore();
        }

        // Jalankan animasi percikan api bergeraknya
        particles.forEach(p => {
            p.update();
            p.draw();
        });

        requestAnimationFrame(animate);
    }
    animate();

    // --- LOGIKA KONVERSI TRANSAKSI ---
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            const kolom = line.split(/\t| {2,}/);

            if (kolom.length >= 7) {
                const fullDateTime = kolom[1]; 
                const waktu = fullDateTime.includes(' ') ? fullDateTime.split(' ')[1] : fullDateTime;
                const userId = kolom[2];
                const tujuanBank = kolom[4];
                const creditStatus = ""; 
                const jumlah = kolom[6]; 

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${creditStatus}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) return;
        navigator.clipboard.writeText(hasilTeksUntukDisalin);
    }
</script>
</body>
</html>
