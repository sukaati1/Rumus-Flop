<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>Rumus Flop Kasir - Ultra Luxury Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only dark !important;
        --blue-electric: #00d2ff;
        --purple-neon: #a855f7;
        --purple-bright: #d8b4fe;
        --pink-neon: #ff007f;
        --cyan-neon: #00f0ff;
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #030308;
        overflow-x: hidden;
    }

    body {
        padding: 40px 20px;
        font-family: 'Rajdhani', sans-serif;
        color: #ffffff !important;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* VIDEO BACKGROUND FULLSCREEN */
    .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
        pointer-events: none;
    }

    /* ANIMASI BORDER CAHAYA MENGELILINGI PETAK BESAR */
    @keyframes borderRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* CONTAINER UTAMA / PETAK BESAR DENGAN CAHAYA BERJALAN MENGELILINGI BINGKAI */
    .container {
        position: relative;
        z-index: 2;
        background: rgba(8, 6, 20, 0.65) !important;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 24px; 
        width: 100%;
        max-width: 950px;
        padding: 48px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(168, 85, 247, 0.25);
        margin: auto;
        overflow: hidden; /* Menjaga garis cahaya tetap berada di batas border */
    }

    /* BORDER CAHAYA NEON BERJALAN MENGELILINGI CONTAINER */
    .container::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(
            transparent 0deg,
            transparent 280deg,
            var(--cyan-neon) 310deg,
            var(--purple-neon) 340deg,
            var(--blue-electric) 360deg
        );
        animation: borderRotate 4s linear infinite;
        z-index: -2;
    }

    /* LAYER DALAM UNTUK MENUTUPI APERTUR CONTAINER */
    .container::after {
        content: '';
        position: absolute;
        inset: 2px; /* Ketebalan border neon */
        background: rgba(8, 6, 20, 0.75);
        border-radius: 22px;
        z-index: -1;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }

    @keyframes purpleShimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
    }

    /* JUDUL UTAMA - GRADASI BIRU KE UNGU NEON */
    h1 {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 5px;
        margin: 0;
        background: linear-gradient(135deg, #ffffff 0%, #00d2ff 30%, #a855f7 70%, #e879f9 100%);
        background-size: 200% auto;
        color: transparent !important;
        -webkit-background-clip: text !important;
        background-clip: text !important;
        animation: purpleShimmer 4s linear infinite;
        filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.8)) drop-shadow(0 0 40px rgba(0, 210, 255, 0.5));
    }

    /* SUBTITLE - ELECTRIC CYAN NEON */
    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;
        color: var(--blue-electric) !important;
        letter-spacing: 9px;
        font-weight: 800;
        text-transform: uppercase;
        margin-top: 12px;
        margin-bottom: 36px;
        text-shadow: 0 0 10px rgba(0, 210, 255, 0.8), 0 0 25px rgba(0, 210, 255, 0.5);
    }

    .label-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    
    /* LABEL - UNGU CERAH */
    label {
        display: block;
        font-family: 'Orbitron', sans-serif;
        font-weight: 800;
        color: var(--purple-bright) !important; 
        font-size: 12px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(168, 85, 247, 0.8);
    }

    /* BADGE COUNTER - CYAN NEON */
    .badge-count {
        font-size: 12px;
        font-weight: 800;
        padding: 4px 14px;
        border-radius: 20px;
        background: rgba(0, 210, 255, 0.15);
        color: var(--cyan-neon) !important;
        border: 1.5px solid var(--cyan-neon);
        font-family: 'Orbitron', sans-serif;
        letter-spacing: 1px;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        text-shadow: 0 0 10px rgba(0, 210, 255, 0.9);
    }
    
    /* TEXTAREA - NEON BIRU UNGU */
    textarea {
        width: 100%;
        height: 130px;
        background: rgba(4, 3, 12, 0.5) !important;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1.5px solid rgba(168, 85, 247, 0.4) !important; 
        border-radius: 12px;
        color: var(--cyan-neon) !important;
        padding: 16px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 28px;
        user-select: text;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.7);
        text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    textarea:focus {
        outline: none;
        border-color: var(--blue-electric) !important;
        background: rgba(4, 3, 12, 0.7) !important;
        box-shadow: 0 0 25px rgba(168, 85, 247, 0.6), inset 0 2px 10px rgba(0, 0, 0, 0.7) !important;
    }

    textarea::placeholder {
        color: rgba(255, 255, 255, 0.35);
        text-shadow: none;
    }

    .btn-group {
        display: flex;
        gap: 16px;
        margin-bottom: 36px;
    }

    @keyframes liquidRipple {
        0% { width: 0px; height: 0px; opacity: 0.7; }
        100% { width: 500px; height: 500px; opacity: 0; }
    }
    
    button {
        position: relative;
        flex: 1;
        padding: 18px; 
        font-family: 'Orbitron', sans-serif;
        font-size: 13px;    
        font-weight: 900;
        border-radius: 12px; 
        cursor: pointer;
        letter-spacing: 3px;
        text-transform: uppercase;
        border: none;
        overflow: hidden;
        outline: none;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover, button:focus {
        transform: translateY(-3px);
    }

    button:active {
        transform: translateY(1px) scale(0.98);
    }

    .ripple {
        position: absolute;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        animation: liquidRipple 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    /* TOMBOL COPY */
    .btn-copy { 
        background: linear-gradient(135deg, #00d2ff 0%, #a855f7 50%, #7e22ce 100%) !important; 
        color: #ffffff !important; 
        box-shadow: 0 4px 20px rgba(168, 85, 247, 0.5);
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    .btn-copy .ripple { background: rgba(255, 255, 255, 0.8); }

    .btn-copy:hover, .btn-copy:focus {
        box-shadow: 0 8px 35px rgba(0, 210, 255, 0.8) !important;
    }

    /* TOMBOL RESET */
    .btn-reset { 
        background-color: rgba(255, 0, 127, 0.1) !important; 
        color: var(--pink-neon) !important; 
        border: 1.5px solid var(--pink-neon) !important;
        backdrop-filter: blur(6px);
        text-shadow: 0 0 12px rgba(255, 0, 127, 0.8);
    }

    .btn-reset .ripple { background: rgba(255, 0, 127, 0.6); }

    .btn-reset:hover, .btn-reset:focus {
        background-color: rgba(255, 0, 127, 0.3) !important;
        color: #ffffff !important;
        box-shadow: 0 0 30px rgba(255, 0, 127, 0.8) !important;
        text-shadow: 0 0 15px rgba(255, 255, 255, 1);
    }

    .vibrate-text {
        position: relative;
        z-index: 2;
        display: inline-block !important;
        will-change: transform;
    }

    /* TABLE CONTAINER - TEMBUS PANDANG DENGAN ISI BERSIH (TANPA SCANNER LINE DALAM) */
    .table-container { 
        position: relative;
        overflow-x: auto; 
        max-height: 400px;
        border-radius: 14px;
        border: 1.5px solid rgba(168, 85, 247, 0.4) !important;
        background: rgba(6, 4, 18, 0.22) !important;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6), 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #rainCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
    }
    
    table {
        position: relative;
        z-index: 1;
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
    }
    
    th, td {
        padding: 16px 20px;
        text-align: left;
        white-space: nowrap;
        user-select: text;
    }
    
    /* TH HEADER TABEL */
    th { 
        position: sticky;
        top: 0;
        z-index: 3;
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        background: rgba(13, 10, 30, 0.75) !important; 
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: var(--purple-bright) !important; 
        font-size: 11.5px;
        letter-spacing: 2px;
        text-transform: uppercase;
        border-bottom: 2px solid var(--purple-neon) !important;
        text-shadow: 0 0 14px rgba(168, 85, 247, 0.8);
    }
    
    /* TD DATA TABEL */
    td {
        color: #ffffff !important;
        border-bottom: 1px solid rgba(168, 85, 247, 0.15) !important;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 13.5px;
        transition: all 0.25s ease;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
    }

    /* KONTRASTING WARNA UNTUK PER KOLOM */
    td:nth-child(1) { color: var(--blue-electric) !important; text-shadow: 0 0 8px rgba(0, 210, 255, 0.7); } /* Waktu */
    td:nth-child(2) { color: #ffffff !important; } /* User ID */
    td:nth-child(3) { color: var(--purple-bright) !important; text-shadow: 0 0 8px rgba(216, 180, 254, 0.7); } /* Bank */
    td:nth-child(4) { color: var(--pink-neon) !important; text-shadow: 0 0 8px rgba(255, 0, 127, 0.7); } /* Credit */
    td:nth-child(5) { color: var(--cyan-neon) !important; text-shadow: 0 0 8px rgba(0, 240, 255, 0.7); } /* Jumlah */

    tr { transition: transform 0.2s ease; }

    /* HOVER BARIS DENGAN KILAU UNGU AMETHYST */
    tr:hover td {
        background-color: rgba(168, 85, 247, 0.25) !important;
        color: #ffffff !important;
        box-shadow: inset 0 0 15px rgba(168, 85, 247, 0.4);
        text-shadow: 0 0 12px rgba(255, 255, 255, 1), 0 0 20px rgba(168, 85, 247, 0.9) !important;
    }

    tr:last-child td { border-bottom: none !important; }
</style>
</head>
<body>

<!-- VIDEO BACKGROUND MP4 -->
<video class="bg-video" autoplay loop muted playsinline disablepictureinpicture>
    <source src="./gb.mp4" type="video/mp4">
</video>

<div class="container">
    <h1>Rumus Flop Kasir</h1>
    <div class="sub-title">Ultra Luxury Edition</div>

    <div class="label-header">
        <label for="rawInput">Tempel Log Transaksi</label>
    </div>
    <textarea id="rawInput" tabindex="1" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
    
    <div class="btn-group">
        <button id="btnCopy" class="btn-copy" 
                tabindex="2"
                onmouseenter="mulaiGetar('txtCopy'); buatEfekAir(event, this)" 
                onmouseleave="stopGetar('txtCopy')" 
                onfocus="mulaiGetar('txtCopy'); buatEfekAirPusat(this)" 
                onblur="stopGetar('txtCopy')"
                onclick="salinHasil()">
            <span class="vibrate-text" id="txtCopy">SALIN DATA</span>
        </button>
        <button id="btnReset" class="btn-reset" 
                tabindex="3"
                onmouseenter="mulaiGetar('txtReset'); buatEfekAir(event, this)" 
                onmouseleave="stopGetar('txtReset')" 
                onfocus="mulaiGetar('txtReset'); buatEfekAirPusat(this)" 
                onblur="stopGetar('txtReset')"
                onclick="resetData()">
            <span class="vibrate-text" id="txtReset">RESET</span>
        </button>
    </div>

    <div class="label-header">
        <label>Hasil Konversi</label>
        <span class="badge-count" id="dataCounter">0 DATA</span>
    </div>
    
    <div class="table-container" id="tableBox">
        <canvas id="rainCanvas"></canvas>

        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>USER ID</th>
                    <th>TUJUAN BANK</th>
                    <th>CREDIT</th>
                    <th>JUMLAH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";
    let timerGetar = {};

    /* EFEK TETESAN AIR PADA KACA TABEL */
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tableBox');

    function aturUkuranCanvas() {
        canvas.width = container.scrollWidth;
        canvas.height = container.scrollHeight;
    }
    aturUkuranCanvas();
    window.addEventListener('resize', aturUkuranCanvas);

    class TetesAir {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * -canvas.height;
            this.len = Math.random() * 12 + 6;
            this.speed = Math.random() * 2 + 1;
            this.radius = Math.random() * 1.8 + 0.8;
            this.opacity = Math.random() * 0.4 + 0.2;
        }

        update() {
            this.y += this.speed;
            if (this.y > canvas.height) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x, this.y - this.len);
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity * 0.4})`;
            ctx.lineWidth = this.radius * 0.8;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
            ctx.shadowBlur = 6;
            ctx.shadowColor = "rgba(168, 85, 247, 0.7)";
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    const daftarTetesAir = Array.from({ length: 40 }, () => new TetesAir());

    function animasiAir() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        daftarTetesAir.forEach(tetes => {
            tetes.update();
            tetes.draw();
        });

        requestAnimationFrame(animasiAir);
    }
    animasiAir();

    /* EFEK GELOMBANG AIR MENGIKUTI POSISI MOUSE */
    function buatEfekAir(event, btn) {
        let rect = btn.getBoundingClientRect();
        let x = event.clientX - rect.left;
        let y = event.clientY - rect.top;

        let ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;

        btn.appendChild(ripple);

        setTimeout(() => {
            ripple.remove();
        }, 800);
    }

    /* EFEK GELOMBANG AIR DARI PUSAT */
    function buatEfekAirPusat(btn) {
        let ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.left = `50%`;
        ripple.style.top = `50%`;

        btn.appendChild(ripple);

        setTimeout(() => {
            ripple.remove();
        }, 800);
    }

    /* EFEK GETAR TEKS TOMBOL */
    function mulaiGetar(elementId) {
        const el = document.getElementById(elementId);
        if (!el) return;

        if (timerGetar[elementId]) clearInterval(timerGetar[elementId]);
        const warnaGlitch = ['#ff007f', '#00f0ff', '#a855f7', '#ffffff', '#00d2ff'];

        timerGetar[elementId] = setInterval(() => {
            const randomX = (Math.random() * 8 - 4).toFixed(1);
            const randomY = (Math.random() * 4 - 2).toFixed(1);
            const color = warnaGlitch[Math.floor(Math.random() * warnaGlitch.length)];

            el.style.transform = `translate(${randomX}px, ${randomY}px)`;
            el.style.color = color;
        }, 50);
    }

    function stopGetar(elementId) {
        if (timerGetar[elementId]) {
            clearInterval(timerGetar[elementId]);
            delete timerGetar[elementId];
        }
        const el = document.getElementById(elementId);
        if (el) {
            el.style.transform = 'translate(0, 0)';
            el.style.color = '';
        }
    }

    /* FUNGSI KONVERSI LOG LENGKAP */
    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        const counter = document.getElementById('dataCounter');
        
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) {
            counter.innerText = "0 DATA";
            aturUkuranCanvas();
            return;
        }

        let parsedLogList = [];
        let lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');

        if (lines.length === 1 && !lines[0].includes('\t')) {
            let rawChunk = lines[0].replace(/(ACCEPT|REJECT|PENDING|SUCCESS|FAILED)[a-zA-Z0-9]*/gi, "$&\n");
            lines = rawChunk.split('\n').map(l => l.trim()).filter(l => l !== '');
        }

        lines.forEach(line => {
            let matchTime = line.match(/(\d{2}:\d{2}:\d{2})/);
            if (!matchTime) return;
            let waktu = matchTime[1];

            let parts = line.split(/\t|\s{2,}/).map(p => p.trim()).filter(p => p !== '');
            
            if (parts.length >= 5) {
                let userId = parts[2] || "-";
                let bankInfo = parts[4] || "-";
                let jumlah = parts[6] || parts[5] || "0";
                
                jumlah = jumlah.replace(/^-/, '').trim();

                parsedLogList.push({
                    waktu: waktu,
                    userId: userId,
                    tujuanBank: bankInfo,
                    creditStatus: "0",
                    jumlah: jumlah
                });
            } else {
                let timeIndex = line.indexOf(waktu);
                let textAfterTime = line.substring(timeIndex + waktu.length);
                let matchType = textAfterTime.match(/(Withdraw|Deposit)/i);

                if (matchType) {
                    let typeIndex = textAfterTime.search(/(Withdraw|Deposit)/i);
                    let userId = textAfterTime.substring(0, typeIndex).trim();
                    let textAfterType = textAfterTime.substring(typeIndex + matchType[0].length);

                    let matchAmount = textAfterType.match(/-?([0-9.,]+)(?:\s|\t|ACCEPT|REJECT|PENDING|SUCCESS|FAILED|$)/i);
                    let jumlah = "0";
                    let bankSection = textAfterType;

                    if (matchAmount) {
                        jumlah = matchAmount[1].replace(/^-/, '');
                        let amountIndex = textAfterType.indexOf(matchAmount[0]);
                        bankSection = textAfterType.substring(0, amountIndex).trim();
                    }

                    bankSection = bankSection.replace(/-\s*$/, '').trim();

                    parsedLogList.push({
                        waktu: waktu,
                        userId: userId,
                        tujuanBank: bankSection,
                        creditStatus: "0",
                        jumlah: jumlah
                    });
                }
            }
        });

        parsedLogList.reverse();

        let barisDataDisalin = [];

        parsedLogList.forEach((item) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${item.waktu}</td><td>${item.userId}</td><td>${item.tujuanBank}</td><td>${item.creditStatus}</td><td>${item.jumlah}</td>`;
            tbody.appendChild(tr);

            barisDataDisalin.push(`${item.waktu}\t${item.userId}\t${item.tujuanBank}\t\t${item.jumlah}`);
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
        counter.innerText = `${parsedLogList.length} DATA`;

        setTimeout(aturUkuranCanvas, 50);
    }

    /* FUNGSI RESET */
    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        document.getElementById('dataCounter').innerText = "0 DATA";
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
        aturUkuranCanvas();
    }

    /* FUNGSI SALIN TEKS KE CLIPBOARD */
    function salinHasil() {
        const txt = document.getElementById('txtCopy');
        
        if (!hasilTeksUntukDisalin) {
            txt.innerText = "DATA KOSONG!";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1000);
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            txt.innerText = "BERHASIL DISALIN";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
        });
    }

    /* SHORTCUT KEYBOARD HARIAN */
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            resetData();
        }
        if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            salinHasil();
        }
    });
</script>
</body>
</html>
