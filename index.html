<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - CYBER ANIME EDITION</title>
    <!-- Import Google Fonts untuk Vibes Sci-Fi & Kompak -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        --bg-main: #040408;
        --panel-bg: rgba(10, 11, 20, 0.8);
        --neon-cyan: #00f3ff;
        --neon-pink: #ff007f;
        --neon-dark: #0a192f;
    }

    body {
        font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #e2e8f0;
        overflow-x: hidden;
        background-color: var(--bg-main); 
        position: relative;
    }
    
    /* BACKGROUND SCI-FI GRID & MATRIX SCANLINE */
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 200%; height: 200%;
        z-index: -2;
        background-image: 
            linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        animation: matrixMove 40s linear infinite;
    }

    body::after {
        content: " ";
        display: block;
        position: fixed;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
        z-index: 999;
        background-size: 100% 4px, 6px 100%;
        pointer-events: none;
    }

    @keyframes matrixMove {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-40px, -40px); }
    }
    
    /* INTERFACE PANEL DENGAN EFEK ANIMASI BORDER GLOW */
    .container {
        background: var(--panel-bg); 
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 12px;
        position: relative;
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-sizing: border-box;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        overflow: hidden;
    }

    /* Garis neon halus mengelilingi panel */
    .container::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        border: 2px solid rgba(0, 243, 255, 0.2);
        box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.05);
        border-radius: 12px;
        pointer-events: none;
    }

    /* Ornamen Mecha Header Corner */
    .mecha-corner {
        position: absolute;
        top: 0;
        right: 40px;
        width: 60px;
        height: 5px;
        background: var(--neon-pink);
        box-shadow: 0 0 12px var(--neon-pink);
    }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: #fff;
        font-size: 32px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 8px;
        margin: 0;
        text-shadow: 0 0 15px rgba(0, 243, 255, 0.6), 0 0 30px rgba(0, 243, 255, 0.2);
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        color: var(--neon-pink);
        letter-spacing: 5px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 40px;
        text-shadow: 0 0 8px var(--neon-pink);
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--neon-cyan);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    
    textarea {
        width: 100%;
        height: 160px;
        background: rgba(4, 4, 8, 0.9);
        border: 1px solid rgba(0, 243, 255, 0.25);
        border-radius: 6px;
        color: #fff;
        padding: 18px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        margin-bottom: 30px;
        transition: border 0.3s ease, box-shadow 0.3s ease;
    }
    
    textarea:focus {
        border-color: var(--neon-cyan);
        outline: none;
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 35px;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        padding: 16px; 
        font-size: 13px;   
        font-weight: 900;
        border: none;
        border-radius: 6px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: background 0.25s ease, box-shadow 0.25s ease;
        position: relative;
    }
    
    /* TOMBOL DESIGN PREMIUM (POLOS TETAP DI TEMPAT) */
    .btn-submit { 
        background: linear-gradient(135deg, #00f3ff, #0077aa); 
        color: #030307; 
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }
    .btn-submit:hover { 
        box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
    }
    
    .btn-copy { 
        background: rgba(255, 0, 127, 0.05); 
        color: #fff; 
        border: 2px solid var(--neon-pink);
        box-shadow: 0 0 15px rgba(255, 0, 127, 0.1);
    }
    .btn-copy:hover { 
        background: var(--neon-pink);
        color: #000;
        box-shadow: 0 0 25px rgba(255, 0, 127, 0.5);
    }
    
    .btn-reset { 
        background: #12131e; 
        color: #a0aec0; 
        border: 1px solid rgba(255, 255, 255, 0.1); 
    }
    .btn-reset:hover { 
        background: #1c1d30; 
        color: #fff;
    }

    /* INDIKATOR FASTRACK TAB NEON (CINCIN MENTONG) */
    button:focus-visible {
        outline: 3px solid var(--neon-pink);
        outline-offset: 4px;
        box-shadow: 0 0 25px var(--neon-pink);
    }
    
    button:focus {
        outline: none; 
    }
    
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 6px; 
        border: 1px solid rgba(0, 243, 255, 0.15); 
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(6, 7, 13, 0.95);
    }
    
    th, td {
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        padding: 16px 20px;
        text-align: left;
        font-size: 14px;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background-color: #0e101c; 
        color: var(--neon-cyan); 
        font-weight: 700; 
        letter-spacing: 1.5px;
        border-bottom: 2px solid rgba(0, 243, 255, 0.4);
    }
    
    td {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    /* Glow Lembut Khusus Kolom Angka Nominal */
    td:nth-child(5) {
        font-family: 'Orbitron', sans-serif;
        color: #fff;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }
    
    tr:nth-child(even) {
        background-color: rgba(14, 16, 28, 0.4);
    }

    tr:hover {
        background-color: rgba(0, 243, 255, 0.03);
    }
</style>
</head>
<body>

<div class="container">
    <div class="mecha-corner"></div>
    <h1>Rumus Flop</h1>
    <div class="sub-title">Cyber UI Core v2.0</div>
    
    <!-- Tabindex di-lock murni biar urutan tab dari textarea langsung meluncur ke grup tombol -->
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" tabindex="1" placeholder="READY FOR INPUT... // PASTE TRANSACTION LOG HERE"></textarea>
    
    <div class="btn-group">
        <button id="btnSubmit" class="btn-submit" onclick="konversiLog()">Submit</button>
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            
            if (kolom.length < 5) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 5) {
                const pakaiNoUrut = !isNaN(kolom[0]) && kolom.length > 6;
                
                let waktu = "";
                let idxWaktu = pakaiNoUrut ? 1 : 0;
                if(kolom[idxWaktu] && kolom[idxWaktu].includes('-')) {
                    let pecahWaktu = kolom[idxWaktu].split(/\s+/);
                    waktu = pecahWaktu[1] || kolom[idxWaktu];
                } else {
                    waktu = kolom[idxWaktu] || "";
                }
                
                if (waktu.includes('-') && waktu.includes(':')) {
                    waktu = waktu.split(/\s+/)[1] || waktu;
                } else if (!waktu.includes(':') && kolom[idxWaktu+1] && kolom[idxWaktu+1].includes(':')) {
                    waktu = kolom[idxWaktu+1];
                }

                let userId = "";
                for (let i = 1; i < kolom.length; i++) {
                    if (kolom[i].includes(':')) {
                        userId = kolom[i+1] || "";
                        break;
                    }
                }
                if (!userId) userId = pakaiNoUrut ? kolom[2] : kolom[1];

                let tujuanBank = "";
                for (let i = 0; i < kolom.length; i++) {
                    if (kolom[i].includes(',') || kolom[i].toUpperCase().includes('MANDIRI') || kolom[i].toUpperCase().includes('BCA') || kolom[i].toUpperCase().includes('BRI') || kolom[i].toUpperCase().includes('BNI')) {
                        tujuanBank = kolom[i];
                        break;
                    }
                }

                let jumlah = "";
                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 4) {
                        jumlah = kolom[i];
                        break;
                    }
                }
                if (!jumlah) {
                    jumlah = kolom[kolom.length - 3] || "";
                }

                const creditStatus = ""; 

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${creditStatus}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
        
        // JALUR AMAN: Kursor dibiarkan tenang tanpa interupsi paksa JS
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            return;
        }
        
        const el = document.createElement('textarea');
        el.value = hasilTeksUntukDisalin;
        el.setAttribute('readonly', '');
        el.style.position = 'absolute';
        el.style.left = '-9999px';
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);

        // JALUR AMAN: Kursor dibiarkan tenang tanpa interupsi paksa JS
    }
</script>
</body>
</html>
