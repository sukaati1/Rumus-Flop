<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - GEAR 5 MATRIX STABLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=400;700;900&family=Rajdhani:wght=500;600;700&display=swap" rel="stylesheet">
    
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #020408; /* Hitam OLED Pekat */
    }

    body {
        font-family: 'Rajdhani', sans-serif;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        position: relative;
        box-sizing: border-box;
        overflow-x: hidden;
    }
    
    /* CANVAS UNTUK ANIMASI AIR HUJAN BERGERAK */
    #rainCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
    }

    /* OVERLAY AMBIENT GLOW UNTUK PROYEKSI WARNA NEON */
    body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, rgba(0, 242, 254, 0.18) 0%, transparent 75%);
        z-index: 2;
        pointer-events: none;
    }
    
    /* PANEL UTAMA: HOLOGRAM GLASSMORPHISM TERANG */
    .container {
        background: rgba(6, 10, 20, 0.75); 
        backdrop-filter: blur(25px) saturate(200%);
        -webkit-backdrop-filter: blur(25px) saturate(200%);
        border: 2px solid #00f2fe; /* Border Cyan Terang */
        border-radius: 16px; 
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-sizing: border-box;
        box-shadow: 0 0 40px rgba(0, 242, 254, 0.45), 
                    inset 0 0 25px rgba(0, 242, 254, 0.2);
        position: relative;
        z-index: 10;
        margin: auto;
    }

    /* DEKORASI SUDUT HUD GLOWING */
    .container::before, .container::after {
        content: '';
        position: absolute;
        width: 25px;
        height: 25px;
        border: 4px solid #00f2fe;
        z-index: 11;
        pointer-events: none;
        box-shadow: 0 0 15px #00f2fe;
    }
    .container::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 16px; }
    .container::after { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 16px; }
    
    /* JUDUL MENYALA MAKSIMAL */
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: #ffffff;
        font-size: 38px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 6px;
        margin: 0;
        text-shadow: 0 0 20px #00f2fe, 0 0 40px rgba(0, 242, 254, 0.7);
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 13px;
        color: #ff007f; /* Pink Neon Terang */
        letter-spacing: 4px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 35px;
        text-shadow: 0 0 12px #ff007f;
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 12px;
        color: #00f2fe; 
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-family: 'Orbitron', sans-serif;
        text-shadow: 0 0 8px rgba(0, 242, 254, 0.6);
    }
    
    /* INPUT BOX */
    textarea {
        width: 100%;
        height: 140px;
        background: rgba(2, 4, 8, 0.9);
        border: 2px solid rgba(0, 242, 254, 0.6); 
        border-radius: 8px;
        color: #ffffff;
        padding: 18px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 30px;
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 242, 254, 0.2);
        transition: all 0.3s ease;
    }
    textarea:focus {
        outline: none;
        border-color: #00f2fe;
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 242, 254, 0.5);
    }
    
    /* TOMBOL GRADASI SUPER TERANG */
    .btn-group {
        display: flex;
        gap: 20px;
        margin-bottom: 40px;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        padding: 18px; 
        font-size: 14px;    
        font-weight: 900;
        border: none;
        border-radius: 8px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 3px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }
    
    .btn-submit { 
        background: linear-gradient(135deg, #ff007f 0%, #00f2fe 100%); 
        color: #ffffff; 
        box-shadow: 0 0 20px rgba(255, 0, 127, 0.6), 0 0 20px rgba(0, 242, 254, 0.6);
        text-shadow: 0 0 5px #fff;
    }
    .btn-submit:hover { 
        transform: translateY(-3px);
        box-shadow: 0 0 35px #00f2fe;
    }
    
    .btn-copy { 
        background: rgba(0, 242, 254, 0.15); 
        color: #00f2fe; 
        border: 2px solid #00f2fe;
        box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.3), 0 0 10px rgba(0, 242, 254, 0.3);
        text-shadow: 0 0 5px rgba(0, 242, 254, 0.5);
    }
    .btn-copy:hover { 
        background: #00f2fe; 
        color: #03050a;
        box-shadow: 0 0 30px #00f2fe;
        transform: translateY(-3px);
    }
    
    .btn-reset { 
        background: #0d1117; 
        color: #a0aec0; 
        border: 2px solid rgba(160, 174, 192, 0.4);
    }
    .btn-reset:hover { 
        background: #1a202c; 
        color: #ffffff;
        border-color: #ffffff;
        transform: translateY(-3px);
    }
    
    /* TABEL KASIR TERANG */
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 8px;
        border: 2px solid #00f2fe;
        box-shadow: 0 0 25px rgba(0, 242, 254, 0.3);
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(2, 4, 8, 0.85);
    }
    
    th, td {
        padding: 16px 20px;
        text-align: left;
        font-size: 15px;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background: rgba(6, 10, 20, 0.95); 
        color: #00f2fe; 
        font-weight: 700; 
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 3px solid #00f2fe;
        text-shadow: 0 0 8px rgba(0, 242, 254, 0.7);
    }
    
    td {
        font-weight: 700;
        color: #ffffff;
        border-bottom: 1px solid rgba(0, 242, 254, 0.3);
        letter-spacing: 1px;
    }
    
    tr:nth-child(even) {
        background-color: rgba(0, 242, 254, 0.04);
    }

    tr:hover td {
        color: #00f2fe;
        background-color: rgba(0, 242, 254, 0.15);
        text-shadow: 0 0 8px #00f2fe;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
        width: 8px;
    }
    ::-webkit-scrollbar-track {
        background: #020408;
    }
    ::-webkit-scrollbar-thumb {
        background: linear-gradient(#ff007f, #00f2fe);
        border-radius: 4px;
    }
</style>
</head>
<body>

<!-- CANVAS UNTUK ANIMASI AIR HUJAN BERGERAK -->
<canvas id="rainCanvas"></canvas>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">KONOHA KASIR - NIKA MATRIX v10.1</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="Tempel log transaksi mentah di sini..."></textarea>
    
    <div class="btn-group">
        <button id="btnSubmit" class="btn-submit" onclick="konversiLog()">Submit</button>
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // --- REALISTIC DYNAMIC RAIN ON GLASS ENGINE ---
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = Math.max(
            document.body.scrollHeight, 
            document.body.offsetHeight, 
            document.documentElement.clientHeight, 
            document.documentElement.scrollHeight, 
            document.documentElement.offsetHeight
        );
    }
    resizeCanvas();
    window.addEventListener('resize', () => { setTimeout(resizeCanvas, 100); });

    const maxDrops = 120; 
    const drops = [];

    // Membuat struktur data butiran air netes ke kaca
    for (let i = 0; i < maxDrops; i++) {
        drops.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2.5 + 1,       // Ukuran ketebalan air netes
            length: Math.random() * 25 + 15,     // Panjang ekor seretan air
            speed: Math.random() * 2.5 + 1.5,    // Kecepatan meluncur turun
            opacity: Math.random() * 0.5 + 0.3
        });
    }

    function animateRain() {
        // Lapisan kaca hitam pekat dibersihkan tipis per frame agar berjejak estetik
        ctx.fillStyle = 'rgba(2, 4, 8, 0.18)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drops.forEach(drop => {
            // Gambar butiran/aliran air (Biru Neon Cyan Menyala)
            ctx.beginPath();
            
            // Menggunakan gradasi linear dari pudar ke terang di ujung tetesan air
            let gradient = ctx.createLinearGradient(drop.x, drop.y, drop.x, drop.y + drop.length);
            gradient.addColorStop(0, 'rgba(0, 242, 254, 0)');
            gradient.addColorStop(0.7, `rgba(0, 190, 254, ${drop.opacity * 0.5})`);
            gradient.addColorStop(1, `rgba(0, 242, 254, ${drop.opacity})`);
            
            ctx.strokeStyle = gradient;
            ctx.lineWidth = drop.size;
            ctx.lineCap = 'round';
            
            // Menggambar garis aliran vertikal air netes ke bawah
            ctx.moveTo(drop.x, drop.y);
            ctx.lineTo(drop.x, drop.y + drop.length);
            ctx.stroke();

            // Gerakkan air meluncur ke bawah kaca
            drop.y += drop.speed;

            // Jika tetesan air sudah melewati batas bawah layar, munculkan lagi dari atas secara acak
            if (drop.y > canvas.height) {
                drop.y = -drop.length - 20;
                drop.x = Math.random() * canvas.width;
                drop.speed = Math.random() * 2.5 + 1.5;
                drop.opacity = Math.random() * 0.5 + 0.3;
            }
        });

        requestAnimationFrame(animateRain);
    }
    
    // Mulai render animasi jalannya air hujan
    animateRain();


    // --- FUNGSI LOGIKA UTAMA KASIR (100% AMAN TIDAK BERUBAH) ---
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let creditStatus = "-"; 
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
        setTimeout(resizeCanvas, 50); 
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
        setTimeout(resizeCanvas, 50);
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin! Silakan submit log terlebih dahulu.");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "BERHASIL DISALIN!";
            setTimeout(() => { btnCopy.innerText = teksAwal; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data otomatis.");
        });
    }
</script>
</body>
</html>
