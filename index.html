<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - GEAR 5 MATRIX STABLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=400;700;900&family=Rajdhani:wght=500;600;700&display=swap" rel="stylesheet">
    
<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #03070d;
        overflow-x: hidden;
        font-family: 'Rajdhani', sans-serif;
        color: #e0e6ed;
    }

    /* Background Matrix Rain via Canvas */
    #matrixCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        pointer-events: none;
    }

    body {
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* PANEL UTAMA (Lebih Transparan & Menyala) */
    .container {
        background: rgba(10, 25, 47, 0.75); 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid #00ff66; 
        border-radius: 16px; 
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-shadow: 0 0 35px rgba(0, 255, 102, 0.4), inset 0 0 15px rgba(0, 255, 102, 0.1);
        position: relative;
        z-index: 10;
        margin: auto;
    }

    .container::before, .container::after {
        content: '';
        position: absolute;
        width: 25px;
        height: 25px;
        border: 4px solid #00ff66;
        z-index: 11;
        pointer-events: none;
        box-shadow: 0 0 15px #00ff66;
    }
    .container::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 16px; }
    .container::after { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 16px; }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: #ffffff;
        font-size: 38px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 6px;
        margin: 0;
        text-shadow: 0 0 20px #00ff66, 0 0 40px #00ff66;
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 13px;
        color: #00f2fe; 
        letter-spacing: 4px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 35px;
        text-shadow: 0 0 12px #00f2fe;
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 12px;
        color: #00ff66; 
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-family: 'Orbitron', sans-serif;
    }
    
    textarea {
        width: 100%;
        height: 140px;
        background: rgba(4, 12, 24, 0.85);
        border: 2px solid rgba(0, 255, 102, 0.5); 
        border-radius: 8px;
        color: #33ff88;
        padding: 18px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 30px;
    }
    textarea:focus {
        outline: none;
        border-color: #00ff66;
        box-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
    }
    
    .btn-group {
        display: flex;
        gap: 20px;
        margin-bottom: 40px;
        flex-wrap: wrap;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        min-width: 120px;
        padding: 18px; 
        font-size: 14px;    
        font-weight: 900;
        border: none;
        border-radius: 8px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 3px;
        transition: all 0.2s ease;
    }
    
    .btn-copy { 
        background: linear-gradient(135deg, #00f2fe 0%, #00ff66 100%); 
        color: #03070d; 
        box-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
    }
    .btn-copy:hover { 
        box-shadow: 0 0 30px #00ff66;
        transform: translateY(-2px);
    }
    
    .btn-reset { 
        background: rgba(15, 23, 42, 0.8); 
        color: #a0aec0; 
        border: 2px solid #334155;
    }
    .btn-reset:hover { 
        background: rgba(30, 41, 59, 0.9); 
        color: #fff;
        border-color: #00ff66;
        transform: translateY(-2px);
    }
    
    .table-container { 
        overflow-x: auto; 
        border-radius: 8px;
        border: 2px solid #00ff66;
        box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(4, 12, 24, 0.85);
    }
    
    th, td {
        padding: 16px 20px;
        text-align: left;
        font-size: 15px;
        white-space: nowrap;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background: rgba(8, 20, 38, 0.95); 
        color: #00ff66; 
        font-weight: 700; 
        border-bottom: 3px solid #00ff66;
    }
    
    td {
        font-weight: 700;
        color: #ffffff;
        border-bottom: 1px solid rgba(0, 255, 102, 0.2);
    }
    
    tr:nth-child(even) {
        background-color: rgba(0, 255, 102, 0.03);
    }
    tr:hover td {
        color: #00ff66;
        background-color: rgba(0, 255, 102, 0.12);
    }
</style>
</head>
<body>

<!-- Canvas Animasi Matrix -->
<canvas id="matrixCanvas"></canvas>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">KONOHA KASIR - NIKA MATRIX v10.1</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="Tempel log transaksi mentah di sini (Otomatis Terkonversi)..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
    
    <div class="btn-group">
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    /* =======================================================
       ANIMASI BACKGROUND MATRIX RAIN (TANPA GAMBAR/GIF EXTERNAL)
       ======================================================= */
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const alphabet = katakana + latin;

    const fontSize = 16;
    let columns = Math.floor(canvas.width / fontSize);
    let rainDrops = Array(columns).fill(1);

    function drawMatrix() {
        // Efek trail transparan
        ctx.fillStyle = 'rgba(3, 7, 13, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#0f0'; // Warna teks Matrix
        ctx.font = fontSize + 'px monospace';

        // Update jumlah kolom jika window berubah ukuran
        const currentColumns = Math.floor(canvas.width / fontSize);
        if (currentColumns !== columns) {
            columns = currentColumns;
            rainDrops = Array(columns).fill(1);
        }

        for (let i = 0; i < rainDrops.length; i++) {
            const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
            const x = i * fontSize;
            const y = rainDrops[i] * fontSize;

            // Karakter paling bawah lebih terang/putih
            ctx.fillStyle = Math.random() > 0.85 ? '#ffffff' : '#00ff66';
            ctx.fillText(text, x, y);

            if (y > canvas.height && Math.random() > 0.975) {
                rainDrops[i] = 0;
            }
            rainDrops[i]++;
        }
    }

    setInterval(drawMatrix, 33);

    /* =======================================================
       LOGIKA KASIR (TETAP SAMA)
       ======================================================= */
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let creditStatus = "-"; 
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin!");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "BERHASIL DISALIN!";
            setTimeout(() => { btnCopy.innerText = teksAwal; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data otomatis.");
        });
    }
</script>
</body>
</html>
