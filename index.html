<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumus flop</title>
    <style>
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(rgba(10, 10, 10, 0.88), rgba(20, 5, 0, 0.95)), 
                        url('https://images.alphacoders.com/132/1322432.png') no-repeat center center fixed;
            background-size: cover;
            color: #e5e7eb;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 69, 0, 0.3);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 69, 0, 0.15);
            width: 100%;
            max-width: 950px;
            padding: 30px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #ff4500;
            font-size: 26px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-shadow: 0 0 12px rgba(255, 69, 0, 0.4);
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ff8c00;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        textarea {
            width: 100%;
            height: 140px;
            background: rgba(10, 10, 10, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            padding: 14px;
            box-sizing: border-box;
            resize: vertical;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        textarea:focus {
            border-color: #ff4500;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.3);
            background: rgba(10, 10, 10, 0.9);
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-submit { background-color: #ff4500; color: #fff; }
        .btn-submit:hover { background-color: #ff5714; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255, 69, 0, 0.3); }
        .btn-reset { background-color: #262626; color: #a3a3a3; border: 1px solid #404040; }
        .btn-reset:hover { background-color: #404040; color: #fff; }
        .btn-copy { background-color: #1d4ed8; color: #fff; }
        .btn-copy:hover { background-color: #2563eb; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3); }
        .table-container { overflow-x: auto; margin-top: 5px; border-radius: 8px; border: 1px solid #262626; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(15, 15, 15, 0.6);
        }
        th, td {
            border-bottom: 1px solid #262626;
            padding: 12px 16px;
            text-align: left;
            font-size: 13px;
        }
        th { background-color: rgba(26, 26, 26, 0.9); color: #ff4500; font-weight: 600; letter-spacing: 0.5px; }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) { background-color: rgba(255, 69, 0, 0.02); }
    </style>
</head>
<body>

<div class="container">
    <h1>Rumus flop</h1>
    
    <label for="rawInput">Tempel log transaksi mentah disini:</label>
    <textarea id="rawInput" placeholder="Tempel log di sini..."></textarea>
    
    <div class="btn-group">
        <button class="btn-reset" onclick="resetData()">Reset</button>
        <button class="btn-submit" onclick="konversiLog()">Submit</button>
        <button class="btn-copy" onclick="salinHasil()">Salin Data</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) {
            alert('Silakan tempel log transaksi terlebih dahulu!');
            return;
        }

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            const kolom = line.split(/\t| {2,}/);

            if (kolom.length >= 7) {
                const fullDateTime = kolom[1]; 
                const waktu = fullDateTime.includes(' ') ? fullDateTime.split(' ')[1] : fullDateTime;
                const userId = kolom[2];
                const tujuanBank = kolom[4];
                const creditStatus = ""; 
                const jumlah = kolom[6]; 

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${creditStatus}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert('Belum ada data yang dikonversi untuk disalin!');
            return;
        }
        navigator.clipboard.writeText(hasilTeksUntukDisalin);
    }
</script>
</body>
</html>
