<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>Rumus Flop Kasir - Ultra Light Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only dark !important;
        --blue-electric: #00d2ff;
        --purple-neon: #a855f7;
        --purple-bright: #d8b4fe;
        --pink-neon: #ff007f;
        --cyan-neon: #00f0ff;
        --lavender-bg: rgba(147, 112, 219, 0.15); 
        --lavender-border: #c89eff;               
        --lavender-text: #ffffff;                 
        --lavender-glow: #b57edc; 
    }

    * { box-sizing: border-box; user-select: none; }

    html, body {
        width: 100%; min-height: 100vh; margin: 0; padding: 0;
        background-color: #030308; overflow-x: hidden;
    }

    body {
        padding: 30px 15px; font-family: 'Rajdhani', sans-serif;
        color: #ffffff !important; display: flex; justify-content: center; align-items: center;
    }

    .bg-video {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        object-fit: cover; z-index: 1; pointer-events: none;
    }

    @property --border-angle {
        syntax: '<angle>'; inherits: false; initial-value: 0deg;
    }

    @keyframes spinBorder { 
        0% { --border-angle: 0deg; }
        100% { --border-angle: 360deg; } 
    }

    .container, .chat-modal-box {
        position: relative; 
        z-index: 2; 
        background: rgba(10, 8, 25, 0.35) !important; 
        backdrop-filter: blur(6px); 
        -webkit-backdrop-filter: blur(6px);
        border-radius: 40px !important; 
        width: 100%; 
        max-width: 900px; 
        padding: 40px; 
        margin: auto;
        box-shadow: 0 0 25px rgba(0, 210, 255, 0.2), inset 0 0 15px rgba(200, 158, 255, 0.1);
    }

    .container::before, .chat-modal-box::before {
        content: ''; 
        position: absolute; 
        inset: 0; 
        border-radius: 40px; 
        padding: 3px;
        background: conic-gradient(
            from var(--border-angle), 
            rgba(0, 210, 255, 0.1) 0%, 
            var(--blue-electric) 25%, 
            #ffffff 50%, 
            var(--cyan-neon) 75%, 
            rgba(0, 210, 255, 0.1) 100%
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor; 
        mask-composite: exclude; 
        pointer-events: none;
        animation: spinBorder 4s linear infinite;
    }

    h1, .chat-modal-header h1 {
        text-align: center; font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 900;
        letter-spacing: 4px; margin: 0;
        background: linear-gradient(90deg, var(--cyan-neon), var(--blue-electric), var(--pink-neon), var(--purple-neon), var(--cyan-neon));
        background-size: 200% auto; color: transparent !important;
        -webkit-background-clip: text; background-clip: text;
        animation: shineText 3s linear infinite;
        filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.5));
    }

    @keyframes shineText { to { background-position: 200% center; } }

    .sub-title {
        text-align: center; font-family: 'Orbitron', sans-serif; font-size: 11px;
        color: #ffffff !important; letter-spacing: 6px; font-weight: 800;
        text-transform: uppercase; margin-top: 8px; margin-bottom: 28px;
    }

    .label-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .label-actions { display: flex; align-items: center; gap: 8px; }
    
    label {
        display: block; font-family: 'Orbitron', sans-serif; font-weight: 800;
        color: #ffffff !important; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    }

    .badge-count, .btn-swap-pos {
        font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 15px;
        background: rgba(0, 210, 255, 0.15); color: #ffffff !important;
        border: 1px solid rgba(0, 240, 255, 0.5); font-family: 'Orbitron', sans-serif;
        cursor: pointer; transition: all 0.2s ease; display: inline-block;
    }

    .btn-swap-pos { background: rgba(168, 85, 247, 0.15); color: #ffffff !important; border-color: rgba(168, 85, 247, 0.5); }
    .badge-count:hover, .btn-swap-pos:hover { background: rgba(0, 210, 255, 0.35); border-color: #fff; color: #fff !important; box-shadow: 0 0 12px var(--cyan-neon); transform: scale(1.05); }

    textarea#rawInput {
        width: 100%; height: 120px; background: rgba(0, 0, 0, 0.3) !important;
        border: 1.5px solid rgba(168, 85, 247, 0.3) !important; border-radius: 12px;
        color: #ffffff !important; padding: 14px; resize: vertical;
        font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13.5px;
        margin-bottom: 20px; user-select: text; outline: none;
    }

    textarea#rawInput:focus { border-color: var(--blue-electric) !important; background: rgba(0, 0, 0, 0.5) !important; box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); }

    .btn-group { display: flex; gap: 16px; margin-bottom: 28px; }
    .btn-group.swapped { flex-direction: row-reverse; }

    button, .btn-flop-style {
        position: relative; overflow: hidden; flex: 1; padding: 16px 20px;
        font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 900;
        cursor: pointer; letter-spacing: 2px; text-transform: uppercase; outline: none;
        border-radius: 35px !important; border: 2px solid var(--lavender-border) !important;
        background: var(--lavender-bg) !important; color: #ffffff !important;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
        box-shadow: 0 0 12px rgba(200, 158, 255, 0.5), inset 0 0 8px rgba(181, 126, 220, 0.2);
        transition: transform 0.1s ease, box-shadow 0.15s ease, background 0.2s ease, border-color 0.2s ease;
        display: inline-flex; align-items: center; justify-content: center;
    }

    button:hover, .btn-flop-style:hover { 
        background: rgba(147, 112, 219, 0.35) !important; 
        border-color: #fff !important; 
        box-shadow: 0 0 20px #b57edc, inset 0 0 12px rgba(255, 255, 255, 0.4); 
    }

    .table-container { 
        overflow-x: auto; max-height: 380px; border-radius: 12px;
        border: 1.5px solid rgba(168, 85, 247, 0.3) !important; background: rgba(0, 0, 0, 0.25) !important;
    }
    
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    th, td { padding: 12px 16px; text-align: left; white-space: nowrap; user-select: text; }
    th { 
        position: sticky; top: 0; z-index: 3; font-family: 'Orbitron', sans-serif; font-weight: 800;
        background: rgba(13, 10, 30, 0.75) !important; backdrop-filter: blur(6px); color: #ffffff !important; 
        font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; border-bottom: 2px solid var(--purple-neon) !important;
    }
    td { color: #ffffff !important; border-bottom: 1px solid rgba(168, 85, 247, 0.12) !important; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; }

    .chat-modal-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.45) !important; backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 999; display: none; justify-content: center; align-items: center; padding: 15px;
    }

    #profileModal, #registerModal, #friendsModal, #createGroupModal { z-index: 1002 !important; }
    #imageViewerModal { z-index: 1003 !important; }

    .auth-modal {
        position: relative; width: 100%; max-width: 480px; 
        background: rgba(10, 8, 25, 0.85) !important;
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-radius: 20px !important; border: 1.5px solid var(--lavender-border) !important;
        padding: 0; overflow: hidden; box-shadow: 0 0 25px rgba(0, 210, 255, 0.2);
    }

    .auth-modal-content {
        position: relative; z-index: 1; background: transparent !important;
        padding: 24px; display: flex; flex-direction: column; gap: 16px;
    }

    .auth-form { display: flex; flex-direction: column; gap: 12px; }
    .auth-input-group { display: flex; flex-direction: column; gap: 6px; }
    .auth-input-group label { font-size: 11px; color: #ffffff !important; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
    .auth-input-group input {
        background: rgba(0, 0, 0, 0.4) !important; border: 1px solid rgba(168, 85, 247, 0.4) !important;
        color: #ffffff !important; padding: 12px 14px; border-radius: 8px; font-family: 'JetBrains Mono', monospace;
        font-size: 14px; outline: none;
    }

    .avatar-selection-box { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 5px 0; }
    .avatar-preview-container {
        width: 76px; height: 76px; border-radius: 50%; overflow: hidden; border: 2px solid var(--cyan-neon);
        display: flex; align-items: center; justify-content: center; background: #000;
    }
    
    .auth-close-btn {
        position: absolute; top: 15px; right: 15px; background: rgba(255, 255, 255, 0.1) !important;
        border: 1px solid var(--lavender-border) !important; color: #ffffff !important; font-size: 14px; width: 28px; height: 28px; border-radius: 50%;
        cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2;
    }

    .chat-modal-box {
      height: 90vh; 
      max-height: 780px;
      padding: 24px !important;
      display: flex; 
      flex-direction: column; 
      overflow: hidden;
      background: rgba(10, 8, 25, 0.55) !important;
    }

    .chat-modal-header { 
        display: flex; justify-content: space-between; align-items: center; 
        padding-bottom: 16px; margin-bottom: 12px;
        border-bottom: 1px solid rgba(168, 85, 247, 0.3);
    }

    .header-left { display: flex; align-items: center; gap: 10px; }
    .btn-back-arrow {
        font-size: 16px !important; padding: 4px 10px !important; border-radius: 50% !important;
        flex: none !important; width: 32px !important; height: 32px !important;
        display: flex !important; align-items: center !important; justify-content: center !important;
        font-family: 'Orbitron', sans-serif !important; cursor: pointer;
    }

    .header-controls { display: flex; align-items: center; gap: 6px; }
    .btn-hdr-action { 
        font-size: 10px !important; padding: 6px 12px !important; 
        border-radius: 20px !important; flex: none !important; height: auto !important;
        font-family: 'Orbitron', sans-serif !important; font-weight: 800 !important;
    }

    .chat-body {
        flex: 1; overflow-y: auto; padding: 12px;
        background: rgba(0, 0, 0, 0.35) !important;
        border: 1.5px solid rgba(168, 85, 247, 0.3) !important;
        border-radius: 16px;
        display: flex; flex-direction: column; gap: 10px;
        margin-bottom: 16px;
    }

    .chat-msg-wrapper { display: flex; gap: 8px; width: 100%; align-items: flex-end; }
    .chat-msg-wrapper.own-msg { flex-direction: row-reverse; }

    .msg-avatar, .msg-avatar-video {
        width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
        border: 1.5px solid var(--cyan-neon); flex-shrink: 0;
    }

    .msg-avatar.admin-avatar, .msg-avatar-video.admin-avatar {
        border: 2px solid #ffd700 !important;
        box-shadow: 0 0 10px #ffd700, 0 0 15px var(--pink-neon) !important;
    }

    .msg-content-container { display: flex; flex-direction: column; max-width: 80%; width: auto; }
    .chat-msg-wrapper.own-msg .msg-content-container { align-items: flex-end; }

    .msg-header-info { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; font-size: 10px; color: rgba(255, 255, 255, 0.7); }
    .chat-msg-wrapper.own-msg .msg-header-info { flex-direction: row-reverse; }

    .sender { font-weight: 800; font-family: 'Orbitron', sans-serif; font-size: 10px; color: var(--cyan-neon) !important; }
    
    .admin-badge {
        font-size: 8px; font-weight: 900; padding: 1px 4px; border-radius: 4px;
        background: linear-gradient(45deg, #ffd700, #ff007f); color: #000 !important;
        font-family: 'Orbitron', sans-serif; letter-spacing: 0.5px; display: inline-block;
    }

    .time-stamp { color: rgba(255, 255, 255, 0.5); font-size: 9px; font-family: 'JetBrains Mono', monospace; }

    .msg-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s ease; }
    .chat-msg-wrapper:hover .msg-actions { opacity: 1; }
    .btn-action-msg { 
        color: #fff; cursor: pointer; font-size: 10px !important; line-height: 1; 
        display: inline-flex; align-items: center; 
    }

    .chat-msg {
        position: relative; font-family: 'JetBrains Mono', monospace; font-size: 12px; 
        padding: 4px 8px !important; border-radius: 8px; user-select: text; 
        word-break: break-word; line-height: 1.25; display: inline-block !important;
        width: max-content !important; max-width: fit-content !important; box-sizing: border-box;
    }

    .chat-msg-wrapper.other-msg .chat-msg { 
        background: rgba(20, 15, 45, 0.85) !important; color: #ffffff !important; 
        border: 1px solid rgba(168, 85, 247, 0.4) !important; border-bottom-left-radius: 2px;
    }

    .chat-msg-wrapper.own-msg .chat-msg { 
        background: rgba(0, 210, 255, 0.2) !important; color: #ffffff !important; 
        border: 1px solid var(--blue-electric) !important; border-bottom-right-radius: 2px;
    }

    .chat-msg .chat-media-img { max-width: 180px; max-height: 180px; border-radius: 6px; cursor: pointer; display: block; }
    .chat-msg .chat-media-video { max-width: 200px; max-height: 180px; border-radius: 6px; display: block; }

    .msg-reactions-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
    .chat-msg-wrapper.own-msg .msg-reactions-container { justify-content: flex-end; }

    .reaction-badge {
        display: inline-flex; align-items: center; gap: 3px; background: rgba(0, 0, 0, 0.5);
        border: 1px solid var(--purple-neon); border-radius: 10px; padding: 1px 5px; font-size: 10px; cursor: pointer; color: #ffffff;
    }

    .reply-quote-box { 
        background: rgba(0, 0, 0, 0.4); border-left: 2px solid var(--cyan-neon); 
        padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; font-size: 10px; 
    }

    .reply-preview-container {
        display: none; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.5);
        border-left: 3px solid var(--cyan-neon); padding: 6px 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
        border-radius: 6px; margin-bottom: 8px;
    }

    .sticker-picker-container {
        display: none; grid-template-columns: repeat(6, 1fr); gap: 6px; background: rgba(10, 8, 25, 0.95);
        border: 1px solid var(--purple-neon); border-radius: 10px; padding: 8px; max-height: 100px; overflow-y: auto; margin-bottom: 8px;
    }
    .sticker-item { font-size: 18px; text-align: center; cursor: pointer; border-radius: 4px; padding: 2px; }
    .sticker-item:hover { background: rgba(255, 255, 255, 0.2); }

    .chat-footer { display: flex; gap: 8px; align-items: center; flex-shrink: 0; width: 100%; }

    .chat-footer textarea#chatText {
        flex: 1; height: 40px; background: rgba(0, 0, 0, 0.4) !important;
        border: 1.5px solid rgba(168, 85, 247, 0.4) !important; border-radius: 12px !important;
        color: #ffffff !important; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; 
        font-size: 13px; font-weight: 700; outline: none; resize: none; line-height: 1.3;
    }
    .chat-footer textarea#chatText:focus {
        border-color: var(--blue-electric) !important; box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    .btn-chat-small {
        width: 36px !important; height: 36px !important; min-width: 36px !important; max-width: 36px !important;
        padding: 0 !important; flex: none !important; background: rgba(0, 0, 0, 0.4) !important;
        border: 1.5px solid rgba(168, 85, 247, 0.4) !important; border-radius: 10px !important; color: #ffffff !important;
        cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.2s ease;
    }
    .btn-chat-small:hover { border-color: var(--cyan-neon) !important; background: rgba(0, 210, 255, 0.2) !important; box-shadow: 0 0 8px var(--cyan-neon); }

    .btn-send-chat {
        flex: none !important; width: auto !important; min-width: 90px !important; height: 40px !important;
        padding: 0 14px !important; border-radius: 35px !important; border: 2px solid var(--lavender-border) !important;
        background: var(--lavender-bg) !important; color: #ffffff !important; font-family: 'Orbitron', sans-serif !important;
        font-size: 11px !important; font-weight: 900 !important; letter-spacing: 2px !important; text-transform: uppercase !important;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.6) !important; box-shadow: 0 0 12px rgba(200, 158, 255, 0.5), inset 0 0 8px rgba(181, 126, 220, 0.2) !important;
        cursor: pointer;
    }
    .btn-send-chat:hover { background: rgba(147, 112, 219, 0.35) !important; border-color: #fff !important; box-shadow: 0 0 20px #b57edc, inset 0 0 12px rgba(255, 255, 255, 0.4) !important; }

    .friends-nav-tabs { display: flex; gap: 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); padding-bottom: 12px; margin-bottom: 12px; align-items: center; }
    
    .tab-btn {
        flex: 1; padding: 8px 4px !important; font-size: 10px !important; border-radius: 8px !important; 
        color: #ffffff !important; background: var(--lavender-bg) !important; border: 1.5px solid var(--lavender-border) !important; 
        font-family: 'Orbitron', sans-serif !important; font-weight: 800 !important; letter-spacing: 1px !important; text-transform: uppercase !important;
        height: 34px !important; display: inline-flex !important; align-items: center !important; justify-content: center !important;
        box-shadow: 0 0 8px rgba(200, 158, 255, 0.3); transition: all 0.2s ease;
    }
    .tab-btn:hover { background: rgba(147, 112, 219, 0.35) !important; border-color: #fff !important; box-shadow: 0 0 12px #b57edc; }
    .tab-btn.active { background: rgba(0, 210, 255, 0.3) !important; color: #fff !important; border-color: var(--cyan-neon) !important; box-shadow: 0 0 12px var(--cyan-neon); }

    .btn-logout-tab {
        background: rgba(255, 0, 127, 0.2) !important; border-color: rgba(255, 0, 127, 0.6) !important;
    }
    .btn-logout-tab:hover {
        background: rgba(255, 0, 127, 0.5) !important; border-color: #fff !important; box-shadow: 0 0 12px var(--pink-neon) !important;
    }

    .friends-list-container { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
    .section-label { font-family: 'Orbitron', sans-serif; font-size: 10px; color: var(--cyan-neon); letter-spacing: 1.5px; margin: 8px 0 4px 0; font-weight: 800; text-transform: uppercase; }
    
    .friend-card { 
        display: flex; align-items: center; justify-content: space-between; 
        background: rgba(0, 0, 0, 0.4); padding: 8px 10px; border-radius: 8px; 
        border: 1px solid rgba(168, 85, 247, 0.3); gap: 10px;
    }
    .friend-name { 
        font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; color: #ffffff;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }

    .btn-friend-action {
        font-size: 8px !important; padding: 4px 8px !important; height: auto !important; min-height: 0 !important;
        border-radius: 12px !important; flex: none !important; font-family: 'Orbitron', sans-serif !important; letter-spacing: 0.5px !important;
    }
    
    .btn-danger-action {
        background: rgba(255, 0, 127, 0.25) !important; border-color: rgba(255, 0, 127, 0.6) !important;
    }
    .btn-danger-action:hover {
        background: rgba(255, 0, 127, 0.6) !important; box-shadow: 0 0 10px var(--pink-neon) !important;
    }

    .checkbox-list { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; border: 1px solid rgba(168, 85, 247, 0.3); padding: 8px; border-radius: 8px; background: rgba(0,0,0,0.3); }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer; }

    .image-viewer-modal {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9);
        display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 1005;
    }
    .image-viewer-modal img, .image-viewer-modal video { max-width: 85vw; max-height: 80vh; border-radius: 12px; }
</style>
</head>
<body>

<video class="bg-video" autoplay loop muted playsinline disablepictureinpicture>
    <source src="./gb.mp4" type="video/mp4">
</video>

<div class="container" id="mainContainer">
    <h1>Rumus Flop Kasir</h1>
    <div class="sub-title">Ultra Light Edition</div>

    <div class="label-header">
        <label for="rawInput">Tempel Log Transaksi</label>
    </div>
    <textarea id="rawInput" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()"></textarea>
    
    <div class="btn-group" id="btnGroup">
        <button id="btnCopy" onclick="salinHasil()"><span id="txtCopy">SALIN DATA</span></button>
        <button id="btnReset" onclick="resetData()"><span id="txtReset">RESET</span></button>
    </div>

    <div class="label-header">
        <label>Hasil Konversi</label>
        <div class="label-actions">
            <span class="btn-swap-pos" onclick="document.getElementById('btnGroup').classList.toggle('swapped')">SWAP ⇄</span>
            <span class="badge-count" id="dataCounter" onclick="handleChatClick()">DATA</span>
        </div>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>USER ID</th>
                    <th>TUJUAN BANK</th>
                    <th>CREDIT</th>
                    <th>JUMLAH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div class="chat-modal-overlay" id="authModal">
    <div class="auth-modal">
        <button class="auth-close-btn" onclick="closeModal('authModal')">&times;</button>
        <div class="auth-modal-content">
            <h1 style="font-size: 20px;">MASUK CHAT</h1>
            <div class="auth-form">
                <div class="auth-input-group">
                    <label>USER ID</label>
                    <input type="text" id="loginUser" placeholder="Masukkan User ID..." oninput="this.value = this.value.toUpperCase()">
                </div>
                <div class="auth-input-group">

            <span class="sticker-item" onclick="sendSticker('🎉')">🎉</span>
            <span class="sticker-item" onclick="sendSticker('💎')">💎</span>
            <span class="sticker-item" onclick="sendSticker('👾')">👾</span>
            <span class="sticker-item" onclick="sendSticker('🤖')">🤖</span>
            <span class="sticker-item" onclick="sendSticker('💀')">💀</span>
            <span class="sticker-item" onclick="sendSticker('💯')">💯</span>

            <button class="btn-chat-small" onclick="document.getElementById('mediaFileInput').click()" title="Upload Foto/Video">📷</button>
            <input type="file" id="mediaFileInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(event)">

<div class="image-viewer-modal" id="imageViewerModal" onclick="closeModal('imageViewerModal')">
    <div id="fullsizeMediaContainer"></div>
    <div style="margin-top: 15px; font-family: 'Orbitron', sans-serif; color: var(--cyan-neon); font-size: 14px;" id="fullsizeUsername">USERNAME</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const NAMA_ADMIN_RESMI = "JAKA SEMBUNG";
    let hasilTeksUntukDisalin = "";
    let selectedReplyData = null; 
    let activeUser = null; 
    let tempEditAvatar = "";
    let isChatOpen = false;
    let windowTargetMsgKeyForReaction = null;
    let currentChatPath = null;

    if (!firebase.apps.length) {
        firebase.initializeApp({ databaseURL: "https://kasir-flop-chat-default-rtdb.asia-southeast1.firebasedatabase.app/" });
    }
    
    const dbRoot = firebase.database();
    let dbChat = null;
    const dbAccounts = dbRoot.ref("chat_accounts");
    const dbFriends = dbRoot.ref("user_friends");
    const dbCustomGroups = dbRoot.ref("custom_groups");
    const dbDirectMessages = dbRoot.ref("direct_messages");

    function isVideoUrl(url) {
        if (!url) return false;
        if (url.startsWith('data:video/')) return true;
        const cleanUrl = url.split('?')[0].toLowerCase();
        return cleanUrl.endsWith('.mp4') || cleanUrl.endsWith('.webm') || cleanUrl.endsWith('.ogg');
    }

    function createAvatarElement(avatarUrl, className = 'msg-avatar', username = '') {
        const isVid = isVideoUrl(avatarUrl);
        const elem = document.createElement(isVid ? 'video' : 'img');
        
        let extraClass = (username.toUpperCase() === NAMA_ADMIN_RESMI) ? ' admin-avatar' : '';
        elem.className = className + (isVid ? '-video' : '') + extraClass;
        
        elem.src = avatarUrl;
        if (isVid) { elem.autoplay = true; elem.loop = true; elem.muted = true; elem.playsInline = true; }
        else { elem.alt = username; }
        if (username) elem.onclick = () => viewFullsizeImage(avatarUrl, username);
        return elem;
    }

    document.addEventListener("DOMContentLoaded", () => {});

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    function handleChatClick() {
        document.getElementById('mainContainer').style.display = 'none';
        
        if (!activeUser) {
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('authModal').style.display = 'flex';
        } else {
            openFriendsModal();
        }
    }

    function submitLogin() {
        const user = document.getElementById('loginUser').value.trim().toUpperCase();
        const pass = document.getElementById('loginPass').value.trim();
        if (!user || !pass) return alert("Nama dan Password wajib diisi!");

        dbAccounts.child(user).once('value', (snapshot) => {
            if (snapshot.exists() && snapshot.val().password === pass) {
                activeUser = { username: user, avatar: snapshot.val().avatar || ("https://api.dicebear.com/7.x/bottts/svg?seed=" + user) };
                closeModal('authModal');
                openFriendsModal();
            } else {
                alert("🚫 AKSES DITOLAK (User/Password Salah)");
            }
        });
    }

    function openRegisterModal() {
        if (activeUser?.username !== NAMA_ADMIN_RESMI) return alert("🚫 Hanya Admin yang dapat mendaftar.");
        closeModal('profileModal');
        document.getElementById('registerModal').style.display = 'flex';
    }

    function submitRegisterNewUser() {
        const newUser = document.getElementById('regUser').value.trim().toUpperCase();
        const newPass = document.getElementById('regPass').value.trim();
        if (!newUser || !newPass) return alert("Lengkapi data baru!");

        dbAccounts.child(newUser).set({
            password: newPass, avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=" + newUser, createdAt: new Date().toISOString()
        }, (err) => {
            if (!err) { alert("✅ Berhasil membuat akun " + newUser); closeModal('registerModal'); }
        });
    }

    function openProfileModalDirect() {
        closeModal('friendsModal');
        openProfileModal();
    }

    function openProfileModal() {
        if (!activeUser) return;
        tempEditAvatar = activeUser.avatar;
        const container = document.getElementById('editAvatarContainer');
        container.innerHTML = '';
        container.appendChild(createAvatarElement(tempEditAvatar, 'avatar-preview-img'));

        document.getElementById('editUserName').value = activeUser.username;
        document.getElementById('editUserPass').value = '';
        
        const isAdmin = (activeUser.username === NAMA_ADMIN_RESMI);
        document.getElementById('btnAdminOpenReg').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('btnAdminCreateGroup').style.display = isAdmin ? 'block' : 'none';
        
        document.getElementById('profileModal').style.display = 'flex';
    }

    function handleEditAvatarUpload(event) {
        const file = event.target.files[0];
        if (file && file.size <= 2.5 * 1024 * 1024) {
            const reader = new FileReader();
            reader.onload = (e) => {
                tempEditAvatar = e.target.result;
                const container = document.getElementById('editAvatarContainer');
                container.innerHTML = '';
                container.appendChild(createAvatarElement(tempEditAvatar, 'avatar-preview-img'));
            };
            reader.readAsDataURL(file);
        } else { alert("File terlalu besar! Max 2.5 MB."); }
    }

    function saveProfileChanges() {
        const newName = document.getElementById('editUserName').value.trim().toUpperCase();
        const newPass = document.getElementById('editUserPass').value.trim();
        if (!newName) return alert("Nama tidak boleh kosong!");

        dbAccounts.child(activeUser.username).once('value', (snapshot) => {
            const currentData = snapshot.val();
            const updatedPass = newPass || currentData.password;

            dbAccounts.child(activeUser.username).update({ password: updatedPass, avatar: tempEditAvatar });
            activeUser.avatar = tempEditAvatar;
            closeModal('profileModal');
            alert("Profil diperbarui!");
        });
    }

    function openCreateGroupModal() {
        if (activeUser?.username !== NAMA_ADMIN_RESMI) return alert("Hanya Admin yang dapat membuat grup.");
        closeModal('profileModal');
        const container = document.getElementById('groupMembersChecklist');
        container.innerHTML = 'Memuat user...';
        
        dbAccounts.once('value', (snapshot) => {
            container.innerHTML = '';
            snapshot.forEach((child) => {
                const u = child.key;
                if (u !== NAMA_ADMIN_RESMI) {
                    container.innerHTML += `
                        <label class="checkbox-item">
                            <input type="checkbox" value="${u}" class="group-member-checkbox">
                            ${u}
                        </label>`;
                }
            });
        });
        document.getElementById('createGroupModal').style.display = 'flex';
    }

    function submitCreateGroup() {
        const groupName = document.getElementById('newGroupName').value.trim().toUpperCase();
        if (!groupName) return alert("Nama Grup Wajib Diisi!");

        const checkboxes = document.querySelectorAll('.group-member-checkbox:checked');
        let selectedUsers = [NAMA_ADMIN_RESMI];
        checkboxes.forEach(cb => selectedUsers.push(cb.value));

        if (selectedUsers.length < 2) return alert("Pilih minimal 1 anggota tambahan!");

        const newGroupKey = dbCustomGroups.push().key;
        let membersObj = {};
        selectedUsers.forEach(user => { membersObj[user] = true; });

        dbCustomGroups.child(newGroupKey).set({
            name: groupName,
            createdBy: activeUser.username,
            members: membersObj
        }, (err) => {
            if (!err) {
                alert("✅ Grup berhasil dibuat!");
                closeModal('createGroupModal');
                loadRecentChatsAndGroups();
            }
        });
    }

    function deleteGroup(groupId, groupName) {
        if (activeUser?.username !== NAMA_ADMIN_RESMI) return alert("Hanya Admin yang bisa menghapus grup!");
        if (confirm(`Apakah Anda yakin ingin menghapus grup "${groupName}"?`)) {
            dbCustomGroups.child(groupId).remove()
                .then(() => {
                    dbRoot.ref(`group_chats/${groupId}`).remove();
                    alert("✅ Grup berhasil dihapus!");
                    loadRecentChatsAndGroups();
                })
                .catch(err => alert("Gagal menghapus grup: " + err.message));
        }
    }

    function viewFullsizeImage(avatarUrl, username) {
        const container = document.getElementById('fullsizeMediaContainer');
        container.innerHTML = '';
        const isVid = isVideoUrl(avatarUrl);
        const elem = document.createElement(isVid ? 'video' : 'img');
        elem.src = avatarUrl;
        if (isVid) { elem.autoplay = true; elem.controls = true; elem.loop = true; }
        container.appendChild(elem);
        document.getElementById('fullsizeUsername').innerText = username;
        document.getElementById('imageViewerModal').style.display = 'flex';
    }

    function logoutChat() {
        if (confirm("Logout dari akun?")) {
            activeUser = null;
            closeModal('friendsModal');
            closeTeamChat();
            alert("Berhasil Logout.");
        }
    }

    function openFriendsModal() {
        document.getElementById('friendsModal').style.display = 'flex';
        switchFriendsTab('recent');
    }

    function backToFriendsModal() {
        closeModal('chatModal');
        openFriendsModal();
    }

    function switchFriendsTab(tab) {
        ['Recent', 'Requests', 'Add'].forEach(t => {
            const btn = document.getElementById(`tab${t}Btn`);
            if (btn) btn.classList.toggle('active', t.toLowerCase() === tab);
            const content = document.getElementById(`tab${t}Content`);
            if (content) content.style.display = (t.toLowerCase() === tab) ? 'flex' : 'none';
        });
        if (tab === 'recent') loadRecentChatsAndGroups();
        if (tab === 'requests') loadFriendRequests();
    }

    function loadRecentChatsAndGroups() {
        const container = document.getElementById('tabRecentContent');
        container.innerHTML = 'Memuat obrolan...';

        const isAdmin = (activeUser?.username === NAMA_ADMIN_RESMI);

        dbCustomGroups.once('value', (groupSnap) => {
            let groupsHTML = '<div class="section-label">👥 GRUP SAYA</div>';
            let groupCount = 0;

            groupSnap.forEach((child) => {
                const group = child.val();
                const groupId = child.key;
                if (group.members && group.members[activeUser.username]) {
                    groupCount++;
                    let deleteBtn = isAdmin ? `<button class="btn-flop-style btn-friend-action btn-danger-action" onclick="deleteGroup('${groupId}', '${group.name}')">HAPUS</button>` : '';
                    groupsHTML += `
                        <div class="friend-card">
                            <span class="friend-name">👥 ${group.name}</span>
                            <div style="display:flex; gap:4px;">
                                <button class="btn-flop-style btn-friend-action" onclick="startGroupChat('${groupId}', '${group.name}')">BUKA</button>
                                ${deleteBtn}
                            </div>
                        </div>`;
                }
            });

            if (groupCount === 0) groupsHTML += '<span style="font-size:11px; color:#888;">Belum ada grup.</span>';

            dbFriends.child(activeUser.username).child('list').once('value', (friendSnap) => {
                let friendsHTML = '<div class="section-label" style="margin-top:12px;">👤 CHAT PRIBADI</div>';
                let friendCount = 0;

                friendSnap.forEach((child) => {
                    friendCount++;
                    friendsHTML += `
                        <div class="friend-card">
                            <span class="friend-name">👤 ${child.key}</span>
                            <button class="btn-flop-style btn-friend-action" onclick="startPrivateChat('${child.key}')">PESAN</button>
                        </div>`;
                });

                if (friendCount === 0) friendsHTML += '<span style="font-size:11px; color:#888;">Belum ada riwayat chat pribadi.</span>';

                container.innerHTML = groupsHTML + friendsHTML;
            });
        });
    }

    function sendFriendRequest() {
        const targetUser = document.getElementById('targetFriendUser').value.trim().toUpperCase();
        if (!targetUser || targetUser === activeUser.username) return alert("User ID tidak valid!");
        dbFriends.child(targetUser).child('requests').child(activeUser.username).set(true, () => alert("Permintaan terkirim!"));
    }

    function loadFriendRequests() {
        const container = document.getElementById('tabRequestsContent');
        container.innerHTML = 'Loading...';
        dbFriends.child(activeUser.username).child('requests').on('value', (snapshot) => {
            container.innerHTML = snapshot.exists() ? '' : '<span style="font-size:11px;">Tidak ada permintaan.</span>';
            snapshot.forEach((child) => {
                container.innerHTML += `
                    <div class="friend-card">
                        <span class="friend-name">${child.key}</span>
                        <div style="display:flex; gap:4px;">
                            <button class="btn-flop-style btn-friend-action" onclick="acceptFriend('${child.key}')">TERIMA</button>
                            <button class="btn-flop-style btn-friend-action" onclick="rejectFriend('${child.key}')">TOLAK</button>
                        </div>
                    </div>`;
            });
        });
    }

    function acceptFriend(requester) {
        dbFriends.child(activeUser.username).child('list').child(requester).set(true);
        dbFriends.child(requester).child('list').child(activeUser.username).set(true);
        dbFriends.child(activeUser.username).child('requests').child(requester).remove();
        loadFriendRequests();
    }

    function rejectFriend(requester) {
        dbFriends.child(activeUser.username).child('requests').child(requester).remove();
        loadFriendRequests();
    }

    function startPrivateChat(targetUser) {
        closeModal('friendsModal');
        const sorted = [activeUser.username, targetUser].sort();
        document.getElementById('chatTitleHeader').innerText = `👤 ${targetUser}`;
        switchChatRoom(`direct_messages/${sorted[0]}_${sorted[1]}`);
    }

    function startGroupChat(groupId, groupName) {
        closeModal('friendsModal');
        document.getElementById('chatTitleHeader').innerText = `👥 ${groupName}`;
        switchChatRoom(`group_chats/${groupId}`);
    }

    function switchChatRoom(path) {
        if (dbChat) dbChat.off(); 
        document.getElementById('chatLogs').innerHTML = '';
        currentChatPath = path;
        dbChat = dbRoot.ref(path);
        
        dbChat.limitToLast(60).on('child_added', (snap) => renderMessage(snap.key, snap.val()));
        dbChat.limitToLast(60).on('child_changed', (snap) => renderMessage(snap.key, snap.val()));
        dbChat.limitToLast(60).on('child_removed', (snap) => {
            const removedElem = document.getElementById(`msg-${snap.key}`);
            if (removedElem) removedElem.remove();
        });
        document.getElementById('chatModal').style.display = 'flex';
        isChatOpen = true;
    }

    function clearAllChat() {
        if (activeUser?.username === NAMA_ADMIN_RESMI && confirm("Hapus semua pesan di obrolan ini?")) {
            if (dbChat) dbChat.remove(); 
        }
    }

    function handleMediaUpload(event) {
        const file = event.target.files[0];
        if (file && file.size <= 2 * 1024 * 1024) {
            const isVideo = file.type.startsWith('video/');
            const reader = new FileReader();
            reader.onload = (e) => {
                dbChat.push({
                    user: activeUser.username, avatar: activeUser.avatar, mediaData: e.target.result,
                    isMedia: true, mediaType: isVideo ? 'video' : 'image',
                    timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                    ...(selectedReplyData && { replyTo: selectedReplyData })
                });
                cancelReply();
            };
            reader.readAsDataURL(file);
        } else alert("File terlalu besar (Max 2MB)");
    }

    function closeTeamChat() {
        isChatOpen = false;
        document.getElementById('chatModal').style.display = 'none';
        document.getElementById('stickerPicker').style.display = 'none';
    }

    function toggleStickerPicker() {
        const picker = document.getElementById('stickerPicker');
        picker.style.display = (picker.style.display === 'grid') ? 'none' : 'grid';
    }

    function toggleReaction(msgKey, emoji) {
        const user = activeUser.username;
        const reactionRef = dbChat.child(msgKey).child('reactions').child(emoji);
        reactionRef.once('value', (snapshot) => {
            let users = snapshot.val() || [];
            users = users.includes(user) ? users.filter(u => u !== user) : [...users, user];
            if (users.length === 0) reactionRef.remove(); else reactionRef.set(users);
        });
    }

    function setReplyToMessage(user, text) {
        selectedReplyData = { user: user.toUpperCase(), text };
        document.getElementById('replyPreviewText').innerHTML = `Membalas <b>${user.toUpperCase()}</b>: "${text}"`;
        document.getElementById('replyPreview').style.display = 'flex';
    }

    function cancelReply() {
        selectedReplyData = null;
        document.getElementById('replyPreview').style.display = 'none';
    }

    function renderMessage(key, data) {
        const chatLogs = document.getElementById('chatLogs');
        const currentUser = activeUser ? activeUser.username : '';
        const username = (data.user || 'USER').toUpperCase();
        const isSelf = (username === currentUser);
        const isAdmin = (username === NAMA_ADMIN_RESMI);

        let wrapperDiv = document.getElementById(`msg-${key}`);
        if (!wrapperDiv) {
            wrapperDiv = document.createElement('div');
            wrapperDiv.className = `chat-msg-wrapper ${isSelf ? 'own-msg' : 'other-msg'}`;
            wrapperDiv.id = `msg-${key}`;
        } else { wrapperDiv.innerHTML = ''; }

        const avatarElem = createAvatarElement(data.avatar || ("https://api.dicebear.com/7.x/bottts/svg?seed=" + username), 'msg-avatar', username);
        const contentContainer = document.createElement('div');
        contentContainer.className = 'msg-content-container';

        const headerInfoDiv = document.createElement('div');
        headerInfoDiv.className = 'msg-header-info';
        
        let adminLabelHTML = isAdmin ? `<span class="admin-badge">👑 ADMIN</span>` : '';

        headerInfoDiv.innerHTML = `
            <span class="sender">${username}</span>
            ${adminLabelHTML}
            <span class="time-stamp">${data.timestamp || ''}</span>
            <div class="msg-actions">
                <span class="btn-action-msg" onclick="windowTargetMsgKeyForReaction='${key}'; toggleStickerPicker();">😊</span>
                <span class="btn-action-msg" onclick="setReplyToMessage('${username}', '${(data.msg||'').replace(/'/g, "\\'")}')">↩️</span>
            </div>`;

        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-msg';

        let contentHTML = data.isSticker ? `<span style="font-size:22px;">${data.sticker}</span>` : 
                          data.isMedia ? (data.mediaType === 'image' ? `<img class="chat-media-img" src="${data.mediaData}" onclick="viewFullsizeImage('${data.mediaData}', '${username}')"/>` : `<video class="chat-media-video" src="${data.mediaData}" controls></video>`) :
                          `<span>${data.msg || ''}</span>`;

        msgDiv.innerHTML = (data.replyTo ? `<div class="reply-quote-box"><b>${data.replyTo.user}:</b> ${data.replyTo.text}</div>` : '') + contentHTML;

        const reactionsContainer = document.createElement('div');
        reactionsContainer.className = 'msg-reactions-container';
        if (data.reactions) {
            Object.keys(data.reactions).forEach(emoji => {
                const users = data.reactions[emoji] || [];
                if (users.length > 0) {
                    const badge = document.createElement('div');
                    badge.className = 'reaction-badge';
                    badge.innerHTML = `<span>${emoji}</span> <span>${users.length}</span>`;
                    badge.onclick = () => toggleReaction(key, emoji);
                    reactionsContainer.appendChild(badge);
                }
            });
        }

        contentContainer.appendChild(headerInfoDiv);
        contentContainer.appendChild(msgDiv);
        contentContainer.appendChild(reactionsContainer);

        wrapperDiv.appendChild(avatarElem);
        wrapperDiv.appendChild(contentContainer);

        if (!document.getElementById(`msg-${key}`)) chatLogs.appendChild(wrapperDiv);
        chatLogs.scrollTop = chatLogs.scrollHeight;
    }

    function sendSticker(stickerChar) {
        if (windowTargetMsgKeyForReaction) {
            toggleReaction(windowTargetMsgKeyForReaction, stickerChar);
            windowTargetMsgKeyForReaction = null;
        } else {
            dbChat.push({
                user: activeUser.username, avatar: activeUser.avatar, sticker: stickerChar, isSticker: true,
                timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                ...(selectedReplyData && { replyTo: selectedReplyData })
            });
            cancelReply();
        }
        document.getElementById('stickerPicker').style.display = 'none';
    }

    function sendChatMessage() {
        const textInput = document.getElementById('chatText');
        const text = textInput.value.trim();
        if (text) {
            dbChat.push({
                user: activeUser.username, avatar: activeUser.avatar, msg: text,
                timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                ...(selectedReplyData && { replyTo: selectedReplyData })
            });
            textInput.value = ''; cancelReply();
        }
    }

    function handleChatKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
    }

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let parsedLogList = [], lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');

        lines.forEach(line => {
            let matchTime = line.match(/(\d{2}:\d{2}:\d{2})/);
            if (!matchTime) return;
            let waktu = matchTime[1];
            let parts = line.split(/\t|\s{2,}/).filter(p => p !== '');
            
            if (parts.length >= 5) {
                parsedLogList.push({ waktu, userId: parts[2]||"-", tujuanBank: parts[4]||"-", creditStatus: "0", jumlah: (parts[6]||parts[5]||"0").replace(/^-/, '') });
            }
        });

        parsedLogList.reverse();
        let barisDataDisalin = [];

        parsedLogList.forEach((item) => {
            tbody.innerHTML += `<tr><td>${item.waktu}</td><td>${item.userId}</td><td>${item.tujuanBank}</td><td>${item.creditStatus}</td><td>${item.jumlah}</td></tr>`;
            barisDataDisalin.push(`${item.waktu}\t${item.userId}\t${item.tujuanBank}\t\t${item.jumlah}`);
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
    }

    function salinHasil() {
        const txt = document.getElementById('txtCopy');
        if (!hasilTeksUntukDisalin) { txt.innerText = "KOSONG!"; setTimeout(() => txt.innerText = "SALIN DATA", 1000); return; }
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            txt.innerText = "BERHASIL"; setTimeout(() => txt.innerText = "SALIN DATA", 1200);
        });
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            ['imageViewerModal', 'friendsModal', 'registerModal', 'profileModal', 'chatModal', 'authModal', 'createGroupModal'].forEach(closeModal);
        }
    });
</script>
</body>
</html>
