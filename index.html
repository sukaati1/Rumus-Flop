<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>Rumus Flop Kasir - Luxe & Cute Edition ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only dark !important;
        --sakura-pink: #ff80bf;
        --sweet-purple: #c084fc;
        --pastel-lavender: #e9d5ff;
        --cute-cyan: #70e000;
        --neon-mint: #00f5d4;
        --soft-pink-glow: #ff99c8;
        --peach-glow: #fde2e4;
        
        --glass-bg: rgba(20, 12, 35, 0.82); 
        --lavender-border: #d8b4fe;               
        --lavender-text: #f3e8ff;                 
        --lavender-glow: #c084fc; 
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #080312;
        overflow-x: hidden;
    }

    body {
        padding: 30px 15px;
        font-family: 'Fredoka', 'Rajdhani', sans-serif;
        color: #ffffff !important;
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(255, 128, 191, 0.15) 0%, transparent 40%),
            radial-gradient(circle at 90% 80%, rgba(192, 132, 252, 0.15) 0%, transparent 40%),
            radial-gradient(circle at 50% 50%, rgba(0, 245, 212, 0.08) 0%, transparent 60%);
    }

    .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
        pointer-events: none;
        opacity: 0.85;
    }

    /* ANIMASI CAHAYA BINGKAI MELINGKARI CONTAINER */
    @property --border-angle {
        syntax: '<angle>';
        inherits: false;
        initial-value: 0deg;
    }

    @keyframes spinBorder {
        to {
            --border-angle: 360deg;
        }
    }

    /* CONTAINER UTAMA MEWAH & CUTE */
    .container {
        position: relative;
        z-index: 2;
        background: var(--glass-bg) !important; 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 36px !important;
        width: 100%;
        max-width: 900px;
        padding: 40px;
        margin: auto;

        border: 3px solid transparent !important;
        background-image: 
            linear-gradient(rgba(18, 10, 32, 0.9), rgba(18, 10, 32, 0.9)), 
            conic-gradient(
                from var(--border-angle), 
                rgba(255, 128, 191, 0.3) 0%, 
                var(--sakura-pink) 25%, 
                #ffffff 50%, 
                var(--sweet-purple) 75%, 
                rgba(255, 128, 191, 0.3) 100%
            ) !important;
        background-origin: border-box !important;
        background-clip: padding-box, border-box !important;
        
        animation: spinBorder 5s linear infinite;
        box-shadow: 
            0 0 25px rgba(255, 128, 191, 0.35),
            0 0 50px rgba(192, 132, 252, 0.2),
            inset 0 0 20px rgba(255, 153, 200, 0.15);
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .container.hidden-for-chat {
        display: none !important;
    }

    h1 {
        text-align: center;
        font-family: 'Fredoka', 'Orbitron', sans-serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 2px;
        margin: 0;
        background: linear-gradient(
            90deg, 
            var(--neon-mint), 
            var(--sakura-pink), 
            var(--sweet-purple), 
            var(--pastel-lavender), 
            var(--neon-mint)
        );
        background-size: 200% auto;
        color: transparent !important;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shineText 3.5s linear infinite;
        filter: drop-shadow(0 0 12px rgba(255, 128, 191, 0.6));
    }

    @keyframes shineText {
        to { background-position: 200% center; }
    }

    .sub-title {
        text-align: center;
        font-family: 'Fredoka', sans-serif;
        font-size: 12px;
        color: var(--pastel-lavender) !important;
        letter-spacing: 4px;
        font-weight: 600;
        text-transform: uppercase;
        margin-top: 6px;
        margin-bottom: 28px;
    }

    .label-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    .label-actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    label {
        display: block;
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        color: var(--pastel-lavender) !important; 
        font-size: 13px;
        letter-spacing: 1px;
    }

    .badge-count, .btn-swap-pos {
        font-size: 11px;
        font-weight: 700;
        padding: 5px 14px;
        border-radius: 20px;
        background: rgba(0, 245, 212, 0.15);
        color: var(--neon-mint) !important;
        border: 1.5px solid rgba(0, 245, 212, 0.5);
        font-family: 'Fredoka', sans-serif;
        cursor: pointer;
        transition: all 0.25 ease;
        display: inline-block;
        box-shadow: 0 0 10px rgba(0, 245, 212, 0.2);
    }

    .btn-swap-pos {
        background: rgba(255, 128, 191, 0.15);
        color: var(--sakura-pink) !important;
        border: 1.5px solid rgba(255, 128, 191, 0.5);
        box-shadow: 0 0 10px rgba(255, 128, 191, 0.2);
    }

    .badge-count:hover, .btn-swap-pos:hover {
        background: rgba(0, 245, 212, 0.35);
        border-color: #ffffff;
        color: #ffffff !important;
        box-shadow: 0 0 16px var(--neon-mint);
        transform: scale(1.05);
    }

    .btn-swap-pos:hover {
        box-shadow: 0 0 16px var(--sakura-pink);
    }
    
    textarea#rawInput {
        width: 100%;
        height: 120px;
        background: rgba(12, 6, 24, 0.6) !important;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 2px solid rgba(192, 132, 252, 0.4) !important; 
        border-radius: 18px;
        color: var(--neon-mint) !important;
        padding: 14px 16px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 13.5px;
        margin-bottom: 20px;
        user-select: text;
        transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    textarea#rawInput:focus {
        outline: none;
        border-color: var(--sakura-pink) !important;
        background: rgba(12, 6, 24, 0.8) !important;
        box-shadow: 0 0 15px rgba(255, 128, 191, 0.4);
    }

    textarea#rawInput::placeholder {
        color: rgba(233, 213, 255, 0.35);
    }

    .btn-group {
        display: flex;
        gap: 16px;
        margin-bottom: 28px;
    }

    .btn-group.swapped {
        flex-direction: row-reverse;
    }

    button {
        position: relative;
        overflow: hidden;
        flex: 1;
        padding: 15px 20px; 
        font-family: 'Fredoka', sans-serif;
        font-size: 13px;    
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        outline: none;
        border-radius: 25px !important;
        border: 2px solid var(--sakura-pink) !important;
        background: rgba(255, 128, 191, 0.15) !important;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: var(--peach-glow) !important;
        text-shadow: 0 0 8px rgba(255, 128, 191, 0.7);
        box-shadow: 0 0 15px rgba(255, 128, 191, 0.3), inset 0 0 10px rgba(255, 153, 200, 0.2);
        transition: transform 0.15s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    button#btnReset {
        border-color: var(--sweet-purple) !important;
        background: rgba(192, 132, 252, 0.15) !important;
        color: var(--pastel-lavender) !important;
        text-shadow: 0 0 8px rgba(192, 132, 252, 0.7);
        box-shadow: 0 0 15px rgba(192, 132, 252, 0.3), inset 0 0 10px rgba(192, 132, 252, 0.2);
    }

    button:hover {
        animation: pulseCute 0.3s ease-in-out infinite alternate;
        background: rgba(255, 128, 191, 0.35) !important;
        border-color: #ffffff !important;
        box-shadow: 0 0 22px var(--sakura-pink), inset 0 0 14px rgba(255, 255, 255, 0.5);
    }

    button#btnReset:hover {
        background: rgba(192, 132, 252, 0.35) !important;
        box-shadow: 0 0 22px var(--sweet-purple), inset 0 0 14px rgba(255, 255, 255, 0.5);
    }

    button.btn-copy:focus,
    button.btn-reset:focus,
    button.btn-copy:focus-visible,
    button.btn-reset:focus-visible {
        outline: none !important;
        border-color: #ffffff !important;
        box-shadow: 
            0 0 0 3px var(--neon-mint), 
            0 0 20px var(--sakura-pink), 
            inset 0 0 10px rgba(255, 255, 255, 0.5) !important;
        transform: scale(1.02);
    }

    @keyframes pulseCute {
        0% { transform: scale(1); }
        100% { transform: scale(1.02); }
    }

    button:active {
        transform: scale(0.96) !important;
        animation: none !important;
    }

    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        transform: scale(0);
        animation: ripple-animation 0.6s linear;
        pointer-events: none;
    }

    @keyframes ripple-animation {
        to {
            transform: scale(4);
            opacity: 0;
        }
    }

    .table-container { 
        position: relative;
        overflow-x: auto; 
        max-height: 380px;
        border-radius: 20px;
        border: 2px solid rgba(192, 132, 252, 0.3) !important;
        background: rgba(10, 5, 20, 0.45) !important;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
    }
    
    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
    }
    
    th, td {
        padding: 13px 18px;
        text-align: left;
        white-space: nowrap;
        user-select: text;
    }
    
    th { 
        position: sticky;
        top: 0;
        z-index: 3;
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        background: rgba(22, 12, 38, 0.9) !important; 
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: var(--pastel-lavender) !important; 
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        border-bottom: 2px solid var(--sakura-pink) !important;
    }
    
    td {
        color: #ffffff !important;
        border-bottom: 1px solid rgba(192, 132, 252, 0.15) !important;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 13px;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    td:nth-child(1) { color: var(--neon-mint) !important; }
    td:nth-child(2) { color: #ffffff !important; }
    td:nth-child(3) { color: var(--pastel-lavender) !important; }
    td:nth-child(4) { color: var(--sakura-pink) !important; }
    td:nth-child(5) { color: #ffe600 !important; }

    tr:hover td { background-color: rgba(255, 128, 191, 0.18) !important; }
    tr:last-child td { border-bottom: none !important; }

    /* MODAL OVERLAY UMUM CUTE & GLAM */
    .chat-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(5, 2, 12, 0.78);
        backdrop-filter: blur(6px);
        z-index: 999;
        display: none;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    #profileModal, #registerModal, #friendsModal {
        z-index: 1002 !important;
    }

    #imageViewerModal {
        z-index: 1003 !important;
    }

    /* MODAL AUTH */
    .auth-modal {
        position: relative;
        width: 100%;
        max-width: 420px;
        background: rgba(18, 10, 32, 0.95) !important;
        border-radius: 28px !important;
        border: 2.5px solid var(--sakura-pink) !important;
        box-shadow: 0 8px 32px rgba(255, 128, 191, 0.3);
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .auth-input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .auth-input-group label {
        font-size: 11px;
    }

    .auth-input-group input {
        background: rgba(30, 16, 50, 0.9) !important;
        border: 1.5px solid rgba(192, 132, 252, 0.4) !important;
        color: #fff !important;
        padding: 11px 14px;
        border-radius: 14px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        outline: none;
    }

    .auth-input-group input:focus {
        border-color: var(--neon-mint) !important;
        box-shadow: 0 0 12px rgba(0, 245, 212, 0.35);
    }

    .avatar-selection-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 5px;
        margin-bottom: 5px;
    }

    .avatar-preview-img {
        width: 75px;
        height: 75px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--sakura-pink);
        box-shadow: 0 0 15px var(--sakura-pink);
    }

    .btn-upload-avatar {
        font-size: 11px !important;
        padding: 8px 14px !important;
        border-radius: 15px !important;
        margin-top: 2px;
    }

    .btn-auth-submit {
        padding: 13px !important;
        border-radius: 20px !important;
        margin-top: 10px;
    }

    .btn-admin-reg {
        background: rgba(255, 128, 191, 0.25) !important;
        border: 1.5px solid var(--sakura-pink) !important;
        color: #ffffff !important;
        margin-top: 5px;
    }

    .auth-close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: transparent !important;
        border: none !important;
        color: var(--sakura-pink) !important;
        font-size: 18px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: none !important;
    }

    /* KOTAK CHAT CUTE & LUXE */
    .chat-modal {
        position: relative;
        width: 100%;
        max-width: 650px;
        height: 90vh;
        max-height: 720px;
        background: rgba(18, 10, 32, 0.96) !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border-radius: 28px !important;
        border: 2.5px solid var(--sakura-pink) !important;
        box-shadow: 0 10px 40px rgba(255, 128, 191, 0.35);
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: hidden;
    }

    .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1.5px solid rgba(255, 128, 191, 0.25);
        padding-bottom: 12px;
        flex-shrink: 0;
    }

    .chat-header h3 {
        margin: 0;
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 1.5px;
        text-transform: none !important;
        background: linear-gradient(
            90deg, 
            var(--neon-mint), 
            var(--sakura-pink), 
            var(--sweet-purple), 
            var(--neon-mint)
        );
        background-size: 200% auto;
        color: transparent !important;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shineText 3s linear infinite;
        filter: drop-shadow(0 0 10px rgba(255, 128, 191, 0.6));
    }

    .header-controls {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-hdr-action {
        font-size: 10px !important;
        padding: 6px 14px !important;
        border-radius: 16px !important;
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        box-shadow: none !important;
        transition: all 0.2s ease;
        flex: none !important;
    }

    .btn-reset-chat {
        background: rgba(255, 128, 191, 0.18) !important;
        border: 1px solid rgba(255, 128, 191, 0.5) !important;
        color: var(--sakura-pink) !important;
    }

    .btn-logout-chat {
        background: rgba(0, 245, 212, 0.18) !important;
        border: 1px solid rgba(0, 245, 212, 0.5) !important;
        color: var(--neon-mint) !important;
    }

    .btn-profile-chat {
        background: rgba(192, 132, 252, 0.18) !important;
        border: 1px solid rgba(192, 132, 252, 0.5) !important;
        color: var(--pastel-lavender) !important;
    }

    .btn-friends-chat {
        background: rgba(112, 224, 0, 0.18) !important;
        border: 1px solid rgba(112, 224, 0, 0.5) !important;
        color: var(--cute-cyan) !important;
    }

    .btn-reset-chat:hover { background: rgba(255, 128, 191, 0.35) !important; color: #ffffff !important; }
    .btn-logout-chat:hover { background: rgba(0, 245, 212, 0.35) !important; color: #ffffff !important; }
    .btn-profile-chat:hover { background: rgba(192, 132, 252, 0.35) !important; color: #ffffff !important; }
    .btn-friends-chat:hover { background: rgba(112, 224, 0, 0.35) !important; color: #ffffff !important; }

    .btn-close-chat {
        background: transparent !important;
        border: none !important;
        color: var(--sakura-pink) !important;
        font-size: 20px;
        font-weight: 900;
        cursor: pointer;
        padding: 0 6px !important;
        box-shadow: none !important;
    }

    /* AREA PESAN */
    .chat-body {
        flex: 1;
        overflow-y: auto;
        border: 1.5px solid rgba(192, 132, 252, 0.2);
        border-radius: 18px;
        padding: 14px;
        background: rgba(10, 5, 20, 0.8) !important;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .chat-msg-wrapper {
        display: flex;
        gap: 10px;
        width: 100%;
        align-items: flex-start;
    }

    .chat-msg-wrapper.other-msg { flex-direction: row; }
    .chat-msg-wrapper.own-msg { flex-direction: row-reverse; }

    .msg-avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--sweet-purple);
        flex-shrink: 0;
        margin-top: 2px;
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .msg-avatar:hover {
        transform: scale(1.1);
        border-color: var(--sakura-pink);
    }

    .msg-content-container {
        display: flex;
        flex-direction: column;
        max-width: 80%;
    }

    .chat-msg-wrapper.own-msg .msg-content-container {
        align-items: flex-end;
    }

    .msg-header-info {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 3px;
        font-size: 11px;
        padding: 0 2px;
    }

    .chat-msg-wrapper.own-msg .msg-header-info {
        flex-direction: row-reverse;
    }

    .sender {
        font-weight: 700;
        font-family: 'Fredoka', sans-serif;
    }

    .time-stamp {
        color: rgba(233, 213, 255, 0.45);
        font-size: 10px;
        font-family: 'JetBrains Mono', monospace;
    }

    .msg-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: 4px;
        margin-right: 4px;
        opacity: 0.6;
        transition: opacity 0.2s ease;
    }

    .chat-msg-wrapper:hover .msg-actions { opacity: 1; }

    .btn-action-msg {
        color: rgba(255, 255, 255, 0.7);
        cursor: pointer;
        font-size: 12px;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .btn-action-msg:hover {
        color: var(--sakura-pink);
        transform: scale(1.25);
    }

    /* GELEMBUNG CHAT CUTE */
    .chat-msg {
        position: relative;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        padding: 9px 14px;
        border-radius: 16px;
        user-select: text;
        word-break: break-word;
        box-shadow: 0 3px 8px rgba(0,0,0,0.4);
        width: fit-content;
        display: flex;
        flex-direction: column;
        line-height: 1.4;
    }

    .chat-msg-wrapper.other-msg .chat-msg {
        background: rgba(35, 20, 50, 0.9) !important;
        border: 1.5px solid rgba(192, 132, 252, 0.3) !important;
        border-top-left-radius: 4px;
    }

    .chat-msg-wrapper.own-msg .chat-msg {
        background: rgba(55, 30, 75, 0.95) !important;
        border: 1.5px solid rgba(255, 128, 191, 0.4) !important;
        border-top-right-radius: 4px;
    }

    .chat-msg .chat-media-img {
        max-width: 220px;
        max-height: 220px;
        border-radius: 12px;
        cursor: pointer;
        margin-top: 4px;
        border: 1.5px solid rgba(255, 128, 191, 0.3);
    }

    .chat-msg .chat-media-video {
        max-width: 240px;
        max-height: 220px;
        border-radius: 12px;
        margin-top: 4px;
        outline: none;
    }

    .msg-reactions-container {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
    }

    .chat-msg-wrapper.own-msg .msg-reactions-container {
        justify-content: flex-end;
    }

    .reaction-badge {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: rgba(25, 12, 40, 0.85);
        border: 1px solid rgba(255, 128, 191, 0.25);
        border-radius: 14px;
        padding: 2px 7px;
        font-size: 11px;
        cursor: pointer;
        user-select: none;
        transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .reaction-badge:hover {
        transform: scale(1.12);
        border-color: var(--sakura-pink);
    }

    .reaction-badge.active-user {

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const NAMA_ADMIN_RESMI = "JAKA SEMBUNG";

    let hasilTeksUntukDisalin = "";
    let isInitialLoad = true;
    let selectedReplyData = null; 
    let currentDataCount = 0;

    let activeUser = null; 
    let tempEditAvatar = "";
    window.targetMsgKeyForReaction = null;

    // VARIABLE UNTUK PRIVAT DM CHAT
    let currentChatMode = "GLOBAL"; // GLOBAL atau PERSONAL
    let activeDMPartner = "";
    let activeRefPath = "team_chat_messages";
    let activeChatListener = null;

    const firebaseConfig = {
        databaseURL: "https://kasir-flop-chat-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    
    let dbChat = firebase.database().ref("team_chat_messages");
    const dbAccounts = firebase.database().ref("chat_accounts");
    const dbFriends = firebase.database().ref("user_friends");

    document.addEventListener("DOMContentLoaded", () => {
        const savedAccount = localStorage.getItem("chat_active_account");
        if (savedAccount) {
            const parsedAccount = JSON.parse(savedAccount);
            if (parsedAccount && parsedAccount.username) {
                activeUser = parsedAccount;
            } else {
                localStorage.removeItem("chat_active_account");
                activeUser = null;
            }
        }
    });

    // FUNGSI HANDLE KLIK DATA (LANGSUNG BUKA CHAT / LOGIN)
    function handleChatClick() {
        if (activeUser) {
            openTeamChat();
        } else {
            openAuthModal();
        }
    }

    function openAuthModal() {
        document.getElementById('mainContainer').classList.add('hidden-for-chat');
        document.getElementById('authModal').style.display = 'flex';
    }

    function closeAuthModal() {
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('mainContainer').classList.remove('hidden-for-chat');
    }

    function submitLogin() {
        const user = document.getElementById('loginUser').value.trim().toUpperCase();
        const pass = document.getElementById('loginPass').value.trim();

        if (!user || !pass) {
            alert("Nama dan Password wajib diisi!");
            return;
        }

        dbAccounts.child(user).once('value', (snapshot) => {
            if (snapshot.exists()) {
                const accData = snapshot.val();
                if (accData.password === pass) {
                    activeUser = { 
                        username: user,
                        avatar: accData.avatar || ("https://api.dicebear.com/7.x/bottts/svg?seed=" + user)
                    };
                    localStorage.setItem("chat_active_account", JSON.stringify(activeUser));
                    
                    document.getElementById('loginUser').value = '';
                    document.getElementById('loginPass').value = '';
                    
                    closeAuthModal();
                    openTeamChat();
                } else {
                    alert("🚫 AKSES DITOLAK (Password Salah)");
                }
            } else {
                alert("🚫 AKSES DITOLAK (User ID Tidak Ditemukan)");
            }
        });
    }

    function openRegisterModal() {
        if (!activeUser || activeUser.username !== NAMA_ADMIN_RESMI) {
            alert("🚫 AKSES DITOLAK! Hanya Admin yang dapat mendaftarkan akun baru.");
            return;
        }
        
        closeProfileModal();
        document.getElementById('regUser').value = '';
        document.getElementById('regPass').value = '';
        document.getElementById('registerModal').style.display = 'flex';
    }

    function closeRegisterModal() {
        document.getElementById('registerModal').style.display = 'none';
    }

    function submitRegisterNewUser() {
        if (!activeUser || activeUser.username !== NAMA_ADMIN_RESMI) {
            alert("🚫 AKSES DITOLAK!");
            return;
        }

        const newUser = document.getElementById('regUser').value.trim().toUpperCase();
        const newPass = document.getElementById('regPass').value.trim();

        if (!newUser || !newPass) {
            alert("Username dan Password baru tidak boleh kosong!");
            return;
        }

        dbAccounts.child(newUser).once('value', (snapshot) => {
            if (snapshot.exists()) {
                alert("❌ Username tersebut sudah digunakan!");
            } else {
                dbAccounts.child(newUser).set({
                    password: newPass,
                    avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=" + newUser,
                    createdAt: new Date().toISOString()
                }, (error) => {
                    if (error) {
                        alert("Gagal membuat akun: " + error.message);
                    } else {
                        alert("✅ Berhasil membuat akun baru untuk: " + newUser + "\nUser tersebut sekarang sudah bisa login ke T'chat!");
                        closeRegisterModal();
                    }
                });
            }
        });
    }

    function openProfileModal() {
        if (!activeUser) return;
        tempEditAvatar = activeUser.avatar;
        document.getElementById('editAvatarPreview').src = tempEditAvatar;
        document.getElementById('editUserName').value = activeUser.username;
        document.getElementById('editUserPass').value = '';
        
        const regBtn = document.getElementById('btnAdminOpenReg');
        if (activeUser.username === NAMA_ADMIN_RESMI) {
            regBtn.style.display = 'block';
        } else {
            regBtn.style.display = 'none';
        }

        document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfileModal() {
        document.getElementById('profileModal').style.display = 'none';
    }

    function handleEditAvatarUpload(event) {
        const file = event.target.files[0];
        if (file) {
            if (file.size > 500 * 1024) { 
                alert("Ukuran foto terlalu besar! Maksimal 500 KB.");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                tempEditAvatar = e.target.result;
                document.getElementById('editAvatarPreview').src = tempEditAvatar;
            };
            reader.readAsDataURL(file);
        }
    }

    function saveProfileChanges() {
        if (!activeUser) return;
        const newName = document.getElementById('editUserName').value.trim().toUpperCase();
        const newPass = document.getElementById('editUserPass').value.trim();

        if (!newName) {
            alert("Nama User tidak boleh kosong!");
            return;
        }

        const oldName = activeUser.username;

        dbAccounts.child(oldName).once('value', (snapshot) => {
            if (snapshot.exists()) {
                const currentData = snapshot.val();
                const updatedPass = newPass ? newPass : currentData.password;

                if (newName !== oldName) {
                    dbAccounts.child(newName).once('value', (checkSnap) => {
                        if (checkSnap.exists()) {

    function playBeepSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'send') {
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'receive') {
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1174.66, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            }
        } catch(e) {}
    }

    const userColors = [
        '#ff80bf', '#c084fc', '#70e000', '#ffb703',

        '#ff99c8', '#ff006e', '#8338ec', '#00b4d8'
    ];

    function getUserColor(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        return userColors[Math.abs(hash) % userColors.length];
    }

    function formatChatMessage(text) {
        if (!text) return '';
        let formatted = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        formatted = formatted.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
        formatted = formatted.replace(/_(.*?)_/g, '<em>$1</em>');
        formatted = formatted.replace(/`(.*?)`/g, '<code>$1</code>');

        const urlPattern = /(https?:\/\/[^\s]+)/g;
        formatted = formatted.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener">$1</a>');

        return formatted;
    }

    function toggleReaction(msgKey, emoji) {
        if (!activeUser) return;
        
        const user = activeUser.username;
        const reactionRef = dbChat.child(msgKey).child('reactions').child(emoji);

        reactionRef.once('value', (snapshot) => {
            let users = snapshot.val() || [];
            
            if (users.includes(user)) {
                users = users.filter(u => u !== user);
                if (users.length === 0) {
                    reactionRef.remove();
                } else {
                    reactionRef.set(users);
                }
            } else {
                users.push(user);
                reactionRef.set(users);
            }
        });
    }

    function renderMessage(key, data) {
        const chatLogs = document.getElementById('chatLogs');

        const isSelf = (username === currentUser && currentUser !== '');

        let wrapperDiv = document.getElementById(`msg-${key}`);
        
        if (!wrapperDiv) {
            wrapperDiv = document.createElement('div');
            wrapperDiv.className = `chat-msg-wrapper ${isSelf ? 'own-msg' : 'other-msg'}`;
            wrapperDiv.id = `msg-${key}`;
        } else {
            wrapperDiv.innerHTML = ''; 
        }

        const color = getUserColor(username);
        const isAdmin = (username === NAMA_ADMIN_RESMI);
        const badgeAdmin = isAdmin 
            ? `<span style="background: #ff80bf; color: #ffffff; font-size: 8px; padding: 1px 6px; border-radius: 4px; margin-left: 5px; font-weight: 900; letter-spacing: 1px; box-shadow: 0 0 6px var(--sakura-pink);">ADMIN</span>` 
            : '';

        const safeUser = username.replace(/'/g, "\\'");
        const safeText = (data.msg || (data.isSticker ? data.sticker : (data.isMedia ? '[Media]' : ''))).replace(/'/g, "\\'").replace(/\n/g, ' ');

        const avatarImg = document.createElement('img');
        avatarImg.className = 'msg-avatar';
        avatarImg.src = avatarUrl;
        avatarImg.alt = username;
        avatarImg.onclick = () => viewFullsizeImage(avatarUrl, username);

        const contentContainer = document.createElement('div');
        contentContainer.className = 'msg-content-container';

        const headerInfoDiv = document.createElement('div');
        headerInfoDiv.className = 'msg-header-info';
        headerInfoDiv.innerHTML = `
            <span class="sender" style="color: ${color};">${username}${badgeAdmin}</span>
            <span class="time-stamp">${data.timestamp || ''}</span>
            <div class="msg-actions">
                <span class="btn-action-msg" title="Beri Reaksi" onclick="openReactionPicker('${key}')">😊</span>
                <span class="btn-action-msg" title="Balas Pesan Ini" onclick="setReplyToMessage('${safeUser}', '${safeText}')">↩️</span>
            </div>
        `;

        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-msg';

        let replyHTML = '';
        if (data.replyTo) {
            replyHTML = `
                <div class="reply-quote-box">
                    <span class="reply-author">↩️ ${data.replyTo.user.toUpperCase()}</span>
                    <span class="reply-text">${formatChatMessage(data.replyTo.text)}</span>
                </div>
            `;
        }

        let contentHTML = '';
        if (data.isSticker) {
            contentHTML = `<span class="msg-sticker">${data.sticker}</span>`;
        } else if (data.isMedia) {
            if (data.mediaType === 'image') {
                contentHTML = `<img class="chat-media-img" src="${data.mediaData}" onclick="viewFullsizeImage('${data.mediaData}', '${username}')" />`;
            } else if (data.mediaType === 'video') {
                contentHTML = `<video class="chat-media-video" src="${data.mediaData}" controls></video>`;
            }
        } else {
            contentHTML = `<span class="msg-content">${formatChatMessage(data.msg)}</span>`;
        }

        msgDiv.innerHTML = `${replyHTML}${contentHTML}`;

        const reactionsContainer = document.createElement('div');
        reactionsContainer.className = 'msg-reactions-container';

        if (data.reactions) {
            Object.keys(data.reactions).forEach(emoji => {
                const users = data.reactions[emoji] || [];
                if (users.length > 0) {
                    const isMyReaction = users.includes(currentUser);
                    const badge = document.createElement('div');
                    badge.className = `reaction-badge ${isMyReaction ? 'active-user' : ''}`;
                    badge.title = `Direaksi oleh: ${users.join(', ')}`;
                    badge.innerHTML = `<span>${emoji}</span><span class="reaction-count">${users.length}</span>`;
                    
                    badge.onclick = () => toggleReaction(key, emoji);
                    reactionsContainer.appendChild(badge);
                }
            });
        }

        contentContainer.appendChild(headerInfoDiv);
        contentContainer.appendChild(msgDiv);
        contentContainer.appendChild(reactionsContainer); 

        wrapperDiv.appendChild(avatarImg);
        wrapperDiv.appendChild(contentContainer);

        if (!document.getElementById(`msg-${key}`)) {
            chatLogs.appendChild(wrapperDiv);
        }
        
        chatLogs.scrollTop = chatLogs.scrollHeight;
    }

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        const counter = document.getElementById('dataCounter');
        
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) {
            currentDataCount = 0;
            counter.innerText = "DATA";
            return;
        }

        let parsedLogList = [];
        let lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');

        if (lines.length === 1 && !lines[0].includes('\t')) {
            let rawChunk = lines[0].replace(/(ACCEPT|REJECT|PENDING|SUCCESS|FAILED)[a-zA-Z0-9]*/gi, "$&\n");
            lines = rawChunk.split('\n').map(l => l.trim()).filter(l => l !== '');
        }

        lines.forEach(line => {
            let matchTime = line.match(/(\d{2}:\d{2}:\d{2})/);
            if (!matchTime) return;
            let waktu = matchTime[1];

            let parts = line.split(/\t|\s{2,}/).map(p => p.trim()).filter(p => p !== '');
            
            if (parts.length >= 5) {
                let userId = parts[2] || "-";
                let bankInfo = parts[4] || "-";
                let jumlah = parts[6] || parts[5] || "0";
                
                jumlah = jumlah.replace(/^-/, '').trim();

                parsedLogList.push({
                    waktu: waktu,
                    userId: userId,
                    tujuanBank: bankInfo,
                    creditStatus: "0",
                    jumlah: jumlah
                });
            } else {
                let timeIndex = line.indexOf(waktu);
                let textAfterTime = line.substring(timeIndex + waktu.length);
                let matchType = textAfterTime.match(/(Withdraw|Deposit)/i);

                if (matchType) {
                    let typeIndex = textAfterTime.search(/(Withdraw|Deposit)/i);
                    let userId = textAfterTime.substring(0, typeIndex).trim();
                    let textAfterType = textAfterTime.substring(typeIndex + matchType[0].length);

                    let matchAmount = textAfterType.match(/-?([0-9.,]+)(?:\s|\t|ACCEPT|REJECT|PENDING|SUCCESS|FAILED|$)/i);
                    let jumlah = "0";
                    let bankSection = textAfterType;

                    if (matchAmount) {
                        jumlah = matchAmount[1].replace(/^-/, '');
                        let amountIndex = textAfterType.indexOf(matchAmount[0]);
                        bankSection = textAfterType.substring(0, amountIndex).trim();
                    }

                    bankSection = bankSection.replace(/-\s*$/, '').trim();

                    parsedLogList.push({
                        waktu: waktu,
                        userId: userId,
                        tujuanBank: bankSection,
                        creditStatus: "0",
                        jumlah: jumlah
                    });
                }
            }
        });

        parsedLogList.reverse();

        let barisDataDisalin = [];

        parsedLogList.forEach((item) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${item.waktu}</td><td>${item.userId}</td><td>${item.tujuanBank}</td><td>${item.creditStatus}</td><td>${item.jumlah}</td>`;
            tbody.appendChild(tr);

            barisDataDisalin.push(`${item.waktu}\t${item.userId}\t${item.tujuanBank}\t\t${item.jumlah}`);
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
        currentDataCount = parsedLogList.length;
        counter.innerText = `${currentDataCount} DATA`;
    }

            setTimeout(() => { txt.innerText = "💖 SALIN DATA"; }, 1200);

    }

        if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            salinHasil();
        }
    });
</script>
