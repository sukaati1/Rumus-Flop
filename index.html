<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - ANIME LIVE EDITION</title>
<style>
    body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
        color: #e2e8f0;
        position: relative;
    }

    /* --- BACKGROUND VIDEO ANIME BERGERAK --- */
    .live-wallpaper {
        position: fixed;
        right: 0;
        bottom: 0;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        z-index: -2;
        object-fit: cover;
        filter: brightness(0.4) contrast(1.1); /* Membuat anime agak gelap agar tulisan kasir tetap kontras */
    }

    /* Lapisan kegelapan ekstra agar teks tidak silau */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 11, 15, 0.4);
        z-index: -1;
    }
    
    /* --- BOX CONTAINER TEMA CYBERPUNK/ANIME NEON --- */
    .container {
        background: rgba(15, 17, 26, 0.75);
        backdrop-filter: blur(12px); /* Efek kaca transparan premium */
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid #ff4500;
        border-radius: 16px;
        /* Animasi pendaran neon di tepi kotak */
        box-shadow: 0 0 25px rgba(255, 69, 0, 0.3), inset 0 0 15px rgba(255, 69, 0, 0.1);
        width: 100%;
        max-width: 950px;
        padding: 35px;
        box-sizing: border-box;
        animation: neonGlow 4s infinite alternate;
    }

    @keyframes neonGlow {
        0% { box-shadow: 0 0 20px rgba(255, 69, 0, 0.25); border-color: #ff4500; }
        100% { box-shadow: 0 0 35px rgba(255, 99, 71, 0.5); border-color: #ff6600; }
    }
    
    h1 {
        text-align: center;
        color: #ff4500;
        font-size: 28px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 6px;
        margin-bottom: 30px;
        text-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 10px;
        color: #ff8700;
        font-size: 13.5px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    
    textarea {
        width: 100%;
        height: 150px;
        background: rgba(5, 6, 8, 0.85);
        border: 1px solid #3b4252;
        border-radius: 8px;
        color: #fff;
        padding: 15px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        margin-bottom: 25px;
        box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
    }
    
    textarea:focus {
        border-color: #ff6600;
        outline: none;
        box-shadow: 0 0 12px rgba(255, 102, 0, 0.4);
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;
    }
    
    button {
        flex: 1;
        padding: 14px 18px; 
        font-size: 13.5px;   
        font-weight: 800;
        border: none;
        border-radius: 8px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease-in-out;
    }
    
    .btn-submit { 
        background: linear-gradient(135deg, #ff4500, #ff6600); 
        color: #fff; 
        box-shadow: 0 4px 15px rgba(255, 69, 0, 0.3);
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 69, 0, 0.5); }
    
    .btn-copy { 
        background: linear-gradient(135deg, #0052cc, #0066ff); 
        color: #fff; 
        box-shadow: 0 4px 15px rgba(0, 82, 204, 0.3);
    }
    .btn-copy:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 102, 255, 0.5); }
    
    .btn-reset { 
        background: #22252d; 
        color: #cbd5e1; 
        border: 1px solid #3b4252; 
    }
    .btn-reset:hover { background: #2d313b; color: #fff; }
    
    button:focus {
        outline: 3px solid #ff6600;
    }
    
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 8px; 
        border: 1px solid #3b4252; 
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(14, 16, 20, 0.85);
    }
    
    th, td {
        border-bottom: 1px solid #2d3139;
        padding: 14px 18px;
        text-align: left;
        font-size: 13.5px;
    }
    
    th { 
        background-color: rgba(21, 23, 30, 0.9); 
        color: #ff4500; 
        font-weight: 700; 
        letter-spacing: 0.5px;
    }
    
    tr:nth-child(even) {
        background-color: rgba(17, 19, 25, 0.6);
    }
</style>
</head>
<body>

<video autoplay loop muted playsinline class="live-wallpaper">
    <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-numbers-31919-large.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="container">
    <h1>Rumus Flop</h1>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="Dari kita untuk kita"></textarea>
    
    <div class="btn-group">
        <button class="btn-submit" onclick="konversiLog()">Submit</button>
        <button class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            
            if (kolom.length < 5) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 5) {
                const pakaiNoUrut = !isNaN(kolom[0]) && kolom.length > 6;
                
                let waktu = "";
                let idxWaktu = pakaiNoUrut ? 1 : 0;
                if(kolom[idxWaktu] && kolom[idxWaktu].includes('-')) {
                    let pecahWaktu = kolom[idxWaktu].split(/\s+/);
                    waktu = pecahWaktu[1] || kolom[idxWaktu];
                } else {
                    waktu = kolom[idxWaktu] || "";
                }
                
                if (waktu.includes('-') && waktu.includes(':')) {
                    waktu = waktu.split(/\s+/)[1] || waktu;
                } else if (!waktu.includes(':') && kolom[idxWaktu+1] && kolom[idxWaktu+1].includes(':')) {
                    waktu = kolom[idxWaktu+1];
                }

                let userId = "";
                for (let i = 1; i < kolom.length; i++) {
                    if (kolom[i].includes(':')) {
                        userId = kolom[i+1] || "";
                        break;
                    }
                }
                if (!userId) userId = pakaiNoUrut ? kolom[2] : kolom[1];

                let tujuanBank = "";
                for (let i = 0; i < kolom.length; i++) {
                    if (kolom[i].includes(',') || kolom[i].toUpperCase().includes('MANDIRI') || kolom[i].toUpperCase().includes('BCA') || kolom[i].toUpperCase().includes('BRI') || kolom[i].toUpperCase().includes('BNI')) {
                        tujuanBank = kolom[i];
                        break;
                    }
                }

                let jumlah = "";
                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 4) {
                        jumlah = kolom[i];
                        break;
                    }
                }
                if (!jumlah) {
                    jumlah = kolom[kolom.length - 3] || "";
                }

                const creditStatus = ""; 

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${creditStatus}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            document.getElementById('btnReset').focus();
            return;
        }
        
        const el = document.createElement('textarea');
        el.value = hasilTeksUntukDisalin;
        el.setAttribute('readonly', '');
        el.style.position = 'absolute';
        el.style.left = '-9999px';
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);

        document.getElementById('btnReset').focus();
    }
</script>
</body>
</html>
