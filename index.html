<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - GEAR 5 MATRIX STABLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=400;700;900&family=Rajdhani:wght=500;600;700&display=swap" rel="stylesheet">
    
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #020612;
    }

    body {
        font-family: 'Rajdhani', sans-serif;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #e2e8f0;
        position: relative;
        box-sizing: border-box;
        overflow-x: hidden;
    }
    
    /* BACKGROUND DIGITAL MATRIX LIGHTS */
    #matrixCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
    }

    /* GLOBAL GLOW EFFECT OVERLAY */
    body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, rgba(14, 165, 233, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
        z-index: 2;
        pointer-events: none;
    }
    
    /* SCI-FI GLASS CONTAINER */
    .container {
        background: rgba(6, 18, 36, 0.65); 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid rgba(14, 165, 233, 0.4); 
        border-radius: 16px; 
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-sizing: border-box;
        box-shadow: 0 0 40px rgba(14, 165, 233, 0.25), 
                    inset 0 0 30px rgba(14, 165, 233, 0.1);
        position: relative;
        z-index: 10;
        margin: auto;
    }

    /* DEKORASI SUDUT HUD HOLOGRAM */
    .container::before, .container::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        border: 3px solid #38bdf8;
        z-index: 11;
        pointer-events: none;
    }
    .container::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 16px; }
    .container::after { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 16px; }
    
    /* HEADER STYLING */
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: #ffffff;
        font-size: 38px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 6px;
        margin: 0;
        text-shadow: 0 0 15px rgba(14, 165, 233, 0.8), 0 0 30px rgba(14, 165, 233, 0.4);
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 13px;
        color: #38bdf8;
        letter-spacing: 4px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 35px;
        text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }
    
    /* LABELS */
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 12px;
        color: #7dd3fc; 
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-family: 'Orbitron', sans-serif;
    }
    
    /* TEXTAREA HOLOGRAM STYLE */
    textarea {
        width: 100%;
        height: 140px;
        background: rgba(2, 6, 23, 0.8);
        border: 1px solid rgba(14, 165, 233, 0.5); 
        border-radius: 8px;
        color: #f1f5f9;
        padding: 18px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 30px;
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6), 0 0 10px rgba(14, 165, 233, 0.1);
        transition: all 0.3s ease;
    }
    textarea:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.3);
    }
    
    /* NEON BUTTONS GROUP */
    .btn-group {
        display: flex;
        gap: 20px;
        margin-bottom: 40px;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        padding: 18px; 
        font-size: 14px;    
        font-weight: 900;
        border: none;
        border-radius: 8px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 3px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }
    
    /* Button: SUBMIT (Cyan Glow) */
    .btn-submit { 
        background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); 
        color: #ffffff; 
        box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
    }
    .btn-submit:hover { 
        background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
        box-shadow: 0 0 30px rgba(56, 189, 248, 0.7);
        transform: translateY(-2px);
    }
    
    /* Button: SALIN DATA (Outline Hologram) */
    .btn-copy { 
        background: rgba(14, 165, 233, 0.1); 
        color: #38bdf8; 
        border: 1px solid #0ea5e9;
        box-shadow: inset 0 0 10px rgba(14, 165, 233, 0.2);
    }
    .btn-copy:hover { 
        background: #0ea5e9; 
        color: #ffffff;
        box-shadow: 0 0 25px rgba(14, 165, 233, 0.6);
        transform: translateY(-2px);
    }
    
    /* Button: RESET (Dark Metal) */
    .btn-reset { 
        background: #0f172a; 
        color: #94a3b8; 
        border: 1px solid rgba(148, 163, 184, 0.3);
    }
    .btn-reset:hover { 
        background: #1e293b; 
        color: #f1f5f9;
        border-color: #64748b;
        transform: translateY(-2px);
    }
    
    /* TABLE SCI-FI DESIGN */
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 8px;
        border: 1px solid rgba(14, 165, 233, 0.3);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(2, 6, 23, 0.6);
    }
    
    th, td {
        padding: 16px 20px;
        text-align: left;
        font-size: 15px;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.9) 100%); 
        color: #38bdf8; 
        font-weight: 700; 
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 2px solid #0ea5e9;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    
    td {
        font-weight: 600;
        color: #e2e8f0;
        border-bottom: 1px solid rgba(14, 165, 233, 0.15);
        letter-spacing: 1px;
    }
    
    tr:nth-child(even) {
        background-color: rgba(14, 165, 233, 0.03);
    }

    tr:hover td {
        color: #ffffff;
        background-color: rgba(14, 165, 233, 0.08);
        text-shadow: 0 0 5px rgba(56, 189, 248, 0.4);
    }
</style>
</head>
<body>

<!-- CANVAS BACKGROUND -->
<canvas id="matrixCanvas"></canvas>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">KONOHA KASIR - NIKA MATRIX v10.1</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="Tempel log transaksi mentah di sini..."></textarea>
    
    <div class="btn-group">
        <button id="btnSubmit" class="btn-submit" onclick="konversiLog()">Submit</button>
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // --- SKRIP BACKGROUND MATRIX DENGAN LIGHTS PERUBAHAN WARNA CYAN & BLUE ---
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = Math.max(
            document.body.scrollHeight, 
            document.body.offsetHeight, 
            document.documentElement.clientHeight, 
            document.documentElement.scrollHeight, 
            document.documentElement.offsetHeight
        );
    }
    
    resizeCanvas();
    
    window.addEventListener('resize', () => {
        setTimeout(resizeCanvas, 100);
    });

    const katakana = '0123456789NIKAJKBOY777';
    const alphabet = katakana.split('');

    const fontSize = 16;
    const columns = window.innerWidth / fontSize;

    const rainDrops = [];
    for (let x = 0; x < columns; x++) {
        rainDrops[x] = 1;
    }

    function drawMatrix() {
        // Efek trail background gelap malam fiksi ilmiah
        ctx.fillStyle = 'rgba(2, 6, 18, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < rainDrops.length; i++) {
            const text = alphabet[Math.floor(Math.random() * alphabet.length)];
            
            if (Math.random() > 0.88) {
                ctx.fillStyle = '#ffffff'; // Light center head drop
                ctx.font = 'bold ' + fontSize + 'px monospace';
            } else if (Math.random() > 0.4) {
                ctx.fillStyle = '#0ea5e9'; // Cyan Matrix Stream
                ctx.font = fontSize + 'px monospace';
            } else {
                ctx.fillStyle = '#1d4ed8'; // Royal Blue Accent Stream
                ctx.font = fontSize + 'px monospace';
            }

            ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

            if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                rainDrops[i] = 0;
            }
            rainDrops[i]++;
        }
    }
    setInterval(drawMatrix, 30);


    // --- FUNGSI LOGIKA UTAMA KASIR (100% UTAL & AMAN TIDAK BERUBAH) ---
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let creditStatus = "-"; 
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
        
        // Triger recalculate tinggi canvas setelah data masuk tabel (agar canvas memanjang ke bawah otomatis)
        setTimeout(resizeCanvas, 50);
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
        setTimeout(resizeCanvas, 50);
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin! Silakan submit log terlebih dahulu.");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "BERHASIL DISALIN!";
            setTimeout(() => { btnCopy.innerText = teksAwal; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data otomatis.");
        });
    }
</script>
</body>
</html>
