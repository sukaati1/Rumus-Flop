<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Border Beam</title>
  <style>
    /* Reset & Styling Halaman */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d0e12;
    }

    /* Container Card */
    .card {
      position: relative;
      width: 320px;
      height: 200px;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      padding: 2px; /* Mengatur ketebalan border */
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Lapisan Sinar Cahaya Berputar */
    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent, 
        transparent 270deg, 
        #00ffcc 360deg /* Warna cahaya border */
      );
      animation: rotateBeam 4s linear infinite;
    }

    /* Area Konten Utama (Menutupi Tengah Card) */
    .card-content {
      position: relative;
      width: 100%;
      height: 100%;
      background: #16181e;
      border-radius: 14px; /* Disesuaikan agar pas di dalam border */
      z-index: 1;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .card-content h2 {
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    .card-content p {
      font-size: 0.875rem;
      color: #94a3b8;
    }

    /* Keyframes Animasi Putar */
    @keyframes rotateBeam {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-content">
      <h2>Border Beam Effect</h2>
      <p>Cahaya berjalan mengelilingi tepi border tanpa memancar dari tengah.</p>
    </div>
  </div>

</body>
</html>
