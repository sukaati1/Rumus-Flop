<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <title>Rumus Flop Kasir - Executive Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only light !important;
    }

    * {
        box-sizing: border-box;
    }

    /* LATAR MATTE DARK + TEXTURE BUATAN (TANPA LINK OUTSIDE = PASTI BISA) */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #0f172a !important;
        /* Pattern Grid Halus Embedded */
        background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px) !important;
        background-size: 24px 24px !important;
        background-attachment: fixed !important;
        font-family: 'Inter', sans-serif;
        color: #f8fafc !important;
    }

    body {
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Container Card Minimalis & Solid (Anti-Norak) */
    .container {
        background-color: #1e293b !important; 
        border: 1px solid #334155 !important; 
        border-radius: 12px; 
        width: 100%;
        max-width: 860px;
        padding: 36px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        margin: auto;
    }

    h1 {
        text-align: center;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1px;
        margin: 0;
        color: #f8fafc !important;
    }

    .sub-title {
        text-align: center;
        font-size: 11px;
        color: #38bdf8 !important;
        letter-spacing: 2.5px;
        font-weight: 600;
        text-transform: uppercase;
        margin-top: 6px;
        margin-bottom: 28px;
    }
    
    label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #94a3b8 !important; 
        font-size: 12px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
    
    textarea {
        width: 100%;
        height: 120px;
        background-color: #0f172a !important;
        border: 1px solid #334155 !important; 
        border-radius: 6px;
        color: #e2e8f0 !important;
        padding: 12px 14px;
        box-sizing: border-box;
        resize: vertical;
        font-family: monospace;
        font-size: 13px;
        margin-bottom: 20px;
    }
    textarea:focus {
        outline: none;
        border-color: #0284c7 !important;
        box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2) !important;
    }
    
    .btn-group {
        display: flex;
        gap: 12px;
        margin-bottom: 28px;
    }
    
    button {
        flex: 1;
        padding: 12px; 
        font-size: 13px;    
        font-weight: 600;
        border-radius: 6px; 
        cursor: pointer;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        border: none;
        transition: opacity 0.2s ease;
    }
    button:hover {
        opacity: 0.9;
    }
    
    .btn-copy { 
        background-color: #0284c7 !important; 
        color: #ffffff !important; 
    }
    
    .btn-reset { 
        background-color: #334155 !important; 
        color: #cbd5e1 !important; 
    }
    
    /* Tabel Clean & Terstruktur */
    .table-container { 
        overflow-x: auto; 
        border-radius: 6px;
        border: 1px solid #334155 !important;
        background-color: #0f172a !important;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
    }
    
    th, td {
        padding: 12px 16px;
        text-align: left;
        font-size: 13px;
        white-space: nowrap;
    }
    
    th { 
        font-weight: 600;
        background-color: #1e293b !important; 
        color: #38bdf8 !important; 
        font-size: 11px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        border-bottom: 1px solid #334155 !important;
    }
    
    td {
        color: #cbd5e1 !important;
        border-bottom: 1px solid #1e293b !important;
    }
    
    tr:last-child td {
        border-bottom: none !important;
    }

    tr:hover td {
        background-color: #1e293b !important;
        color: #ffffff !important;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">TRANSACTION RECAP SYSTEM</div>
    
    <label for="rawInput">Tempel Log Transaksi</label>
    <textarea id="rawInput" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
    
    <div class="btn-group">
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>USER ID</th>
                    <th>TUJUAN BANK</th>
                    <th>CREDIT</th>
                    <th>JUMLAH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n'); 
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let creditStatus = "-"; 
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin!");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "BERHASIL DISALIN";
            setTimeout(() => { btnCopy.innerText = teksAwal; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data.");
        });
    }
</script>
</body>
</html>
