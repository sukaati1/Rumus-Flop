<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - CYBER CHARCOAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        --bg-main: #06070a;
        --panel-bg: rgba(19, 21, 34, 0.85); /* Dibuat semi-transparan biar wallpaper tembus pandang */
        --neon-cyan: #00f3ff;
        
        /* WARNA PINK BERKILAU / METALLIC SHIMMER CHROME */
        --neon-pink: #ff007f;
        --shimmer-pink: linear-gradient(135deg, #ff007f 0%, #ff66b2 25%, #ff007f 50%, #ffffff 75%, #ff007f 100%);
        --text-white: #ffffff;
        --text-muted: #a0aec0;
    }

    body {
        font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: var(--text-white);
        
        /* WALLPAPER GRADASI RADIAL UNTUK EFEK PENDALAM CAHAYA STYLISH */
        background: radial-gradient(circle at center, #101528 0%, #05060b 80%);
        position: relative;
        overflow-x: hidden;
    }
    
    /* WALLPAPER GRID TECH BERGERAK 3D PERSPEKTIF */
    body::before {
        content: "";
        position: fixed;
        top: -20%; left: -20%; width: 140%; height: 140%;
        z-index: -1;
        background-image: 
            linear-gradient(rgba(0, 243, 255, 0.05) 1.5px, transparent 1.5px),
            linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1.5px, transparent 1.5px);
        background-size: 50px 50px;
        
        /* Memberikan efek neon glow lembut pada garis grid belakang */
        filter: drop-shadow(0 0 1px rgba(0, 243, 255, 0.3));
        animation: gridMove3D 20s linear infinite;
    }

    @keyframes gridMove3D {
        0% { transform: translate(0, 0); }
        100% { transform: translate(50px, 50px); }
    }
    
    /* CONTAINER GELAP KONTRAS TINGGI DENGAN EFFECT GLASSMORPHISM */
    .container {
        background: var(--panel-bg); 
        border: 2px solid var(--neon-cyan);
        border-radius: 12px;
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-sizing: border-box;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 243, 255, 0.1);
        position: relative;
        backdrop-filter: blur(8px); /* Efek kaca buram tembus pandang ke wallpaper grid */
    }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: var(--text-white);
        font-size: 32px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 6px;
        margin: 0;
        text-shadow: 0 0 10px var(--neon-cyan);
    }

    /* SUBTITLE DENGAN EFEK GRADASI PINK BERKILAU */
    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        background: var(--shimmer-pink);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 4px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 6px;
        margin-bottom: 35px;
        animation: shine 3s linear infinite;
    }
    
    @keyframes shine {
        to { background-position: 200% center; }
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 10px;
        color: var(--neon-cyan);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }
    
    textarea {
        width: 100%;
        height: 150px;
        background: rgba(6, 7, 12, 0.9);
        border: 2px solid #23263d;
        border-radius: 6px;
        color: #ffffff;
        padding: 15px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 25px;
        transition: border-color 0.2s ease;
    }
    
    textarea:focus {
        border-color: var(--neon-cyan);
        outline: none;
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 35px;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        padding: 16px; 
        font-size: 13px;   
        font-weight: 900;
        border: none;
        border-radius: 6px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.2s ease;
    }
    
    .btn-submit { 
        background: var(--neon-cyan); 
        color: #000000; 
    }
    .btn-submit:hover {
        background: #00c8ff;
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }
    
    /* TOMBOL COPY BERKILAU */
    .btn-copy { 
        background: transparent; 
        color: #ffffff; 
        border: 2px solid var(--neon-pink);
        position: relative;
        overflow: hidden;
    }
    .btn-copy:hover { 
        background: var(--shimmer-pink);
        background-size: 200% auto;
        animation: shine 1.5s linear infinite;
        border-color: #ffffff;
        box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
    }
    
    .btn-reset { 
        background: #202336; 
        color: var(--text-white); 
        border: 1px solid #323754;
    }
    .btn-reset:hover { 
        background: #2a2e47;
    }

    /* INDIKATOR FOKUS DI-TAB SEKARANG LEBIH TIPIS & CYAN BERKILAU */
    button:focus-visible, textarea:focus-visible {
        outline: 3px solid var(--neon-cyan) !important;
        outline-offset: 3px !important;
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.5), 0 0 5px #ffffff !important;
        animation: pulseGlow 2s infinite alternate;
    }
    
    @keyframes pulseGlow {
        0% { box-shadow: 0 0 8px rgba(0, 243, 255, 0.4), 0 0 2px #ffffff; }
        100% { box-shadow: 0 0 18px rgba(0, 243, 255, 0.8), 0 0 8px #ffffff; }
    }
    
    button:focus, textarea:focus {
        outline: none; 
    }
    
    /* TABEL DATA SANGAT KONTRAS DAN JELAS */
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 6px; 
        border: 2px solid var(--neon-cyan); 
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: #090a10;
    }
    
    th, td {
        border-bottom: 1px solid #1c1e30;
        padding: 15px 18px;
        text-align: left;
        font-size: 14px;
    }
    
    /* HEADER TABEL DENGAN EFEK CAHAYA CYBER CHARCOAL NEON */
    th { 
        font-family: 'Orbitron', sans-serif;
        background-color: #131522; 
        color: var(--neon-cyan); 
        font-weight: 900; 
        letter-spacing: 2px;
        border-bottom: 2px solid var(--neon-cyan);
        text-transform: uppercase;
        
        /* Efek Pancaran Cahaya Dobel */
        text-shadow: 0 0 5px rgba(0, 243, 255, 0.6), 0 0 10px rgba(0, 243, 255, 0.4);
        box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.05);
        
        /* Animasi Micro-Flicker Casual Tech */
        animation: cyberPulse 4s infinite alternate;
    }
    
    @keyframes cyberPulse {
        0%, 95%, 100% {
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.7), 0 0 10px rgba(0, 243, 255, 0.4);
        }
        97% {
            text-shadow: 0 0 2px rgba(0, 243, 255, 0.2), 0 0 4px rgba(0, 243, 255, 0.1);
            color: #00a3ad;
        }
    }
    
    td {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        color: #ffffff;
    }

    /* Angka Nominal Dikasih Warna Hijau Neon Biar Mencolok */
    td:nth-child(5) {
        font-family: 'Orbitron', sans-serif;
        color: #00ff66;
        text-shadow: 0 0 5px rgba(0, 255, 102, 0.4);
        font-weight: 900;
    }
    
    tr:nth-child(even) {
        background-color: #0e1018;
    }

    tr:hover {
        background-color: rgba(0, 243, 255, 0.05);
    }
</style>
</head>
<body>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">Cyber Charcoal Edition v3.0</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="READY FOR DATA SCAN..."></textarea>
    
    <div class="btn-group">
        <button id="btnSubmit" class="btn-submit" onclick="konversiLog()">Submit</button>
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            
            if (kolom.length < 5) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 5) {
                const pakaiNoUrut = !isNaN(kolom[0]) && kolom.length > 6;
                
                let waktu = "";
                let idxWaktu = pakaiNoUrut ? 1 : 0;
                if(kolom[idxWaktu] && kolom[idxWaktu].includes('-')) {
                    let pecahWaktu = kolom[idxWaktu].split(/\s+/);
                    waktu = pecahWaktu[1] || kolom[idxWaktu];
                } else {
                    waktu = kolom[idxWaktu] || "";
                }
                
                if (waktu.includes('-') && waktu.includes(':')) {
                    waktu = waktu.split(/\s+/)[1] || waktu;
                } else if (!waktu.includes(':') && kolom[idxWaktu+1] && kolom[idxWaktu+1].includes(':')) {
                    waktu = kolom[idxWaktu+1];
                }

                let userId = "";
                for (let i = 1; i < kolom.length; i++) {
                    if (kolom[i].includes(':')) {
                        userId = kolom[i+1] || "";
                        break;
                    }
                }
                if (!userId) userId = pakaiNoUrut ? kolom[2] : kolom[1];

                let tujuanBank = "";
                for (let i = 0; i < kolom.length; i++) {
                    if (kolom[i].includes(',') || kolom[i].toUpperCase().includes('MANDIRI') || kolom[i].toUpperCase().includes('BCA') || kolom[i].toUpperCase().includes('BRI') || kolom[i].toUpperCase().includes('BNI')) {
                        tujuanBank = kolom[i];
                        break;
                    }
                }

                let jumlah = "";
                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 4) {
                        jumlah = kolom[i];
                        break;
                    }
                }
                if (!jumlah) {
                    jumlah = kolom[kolom.length - 3] || "";
                }

                const creditStatus = ""; 

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${creditStatus}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin! Silakan submit log terlebih dahulu.");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "BERHASIL DISALIN!";
            btnCopy.style.background = "var(--neon-cyan)";
            btnCopy.style.color = "#000000";
            btnCopy.style.animation = "none"; 
            
            setTimeout(() => {
                btnCopy.innerText = teksAwal;
                btnCopy.style.background = "transparent";
                btnCopy.style.color = "#ffffff";
            }, 150
