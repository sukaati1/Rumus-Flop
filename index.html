<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <title>Rumus Flop Kasir - Vivid Motion Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only light !important;
    }

    * {
        box-sizing: border-box;
    }

    /* LATAR BELAKANG MEWAH, CERAH, TAPI SELESE/NYAMAN */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #0b1329 !important;
        /* Grid cerah lembut + ambient light */
        background-image: 
            radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.18) 0%, transparent 60%),
            radial-gradient(circle at 85% 90%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
            linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px) !important;
        background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px !important;
        background-attachment: fixed !important;
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: #f8fafc !important;
    }

    body {
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* CONTAINER CARD EFEK KACA MEWAH */
    .container {
        background: rgba(18, 28, 56, 0.85) !important; 
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(56, 189, 248, 0.25) !important; 
        border-radius: 20px; 
        width: 100%;
        max-width: 880px;
        padding: 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        margin: auto;
    }

    h1 {
        text-align: center;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 2px;
        margin: 0;
        background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .sub-title {
        text-align: center;
        font-size: 11px;
        color: #f59e0b !important; /* Vivid Gold/Amber */
        letter-spacing: 3.5px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 32px;
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 10px;
        color: #38bdf8 !important; 
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    
    textarea {
        width: 100%;
        height: 125px;
        background-color: #080e21 !important;
        border: 1.5px solid rgba(56, 189, 248, 0.3) !important; 
        border-radius: 10px;
        color: #38bdf8 !important;
        padding: 14px 16px;
        box-sizing: border-box;
        resize: vertical;
        font-family: monospace;
        font-size: 13.5px;
        margin-bottom: 28px;
        transition: all 0.3s ease;
    }
    textarea:focus {
        outline: none;
        border-color: #38bdf8 !important;
        box-shadow: 0 0 18px rgba(56, 189, 248, 0.35) !important;
    }
    
    /* =======================================================
       DESAIN TOMBOL MEWAH & BERGERAK (INTERAKTIF ANIMATED)
       ======================================================= */
    .btn-group {
        display: flex;
        gap: 16px;
        margin-bottom: 32px;
    }
    
    button {
        position: relative;
        flex: 1;
        padding: 16px; 
        font-size: 13px;    
        font-weight: 800;
        border-radius: 10px; 
        cursor: pointer;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border: none;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1;
    }

    /* Efek Kilatan Cahaya Berjalan di Tombol (Shimmer) */
    button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.4),
            transparent
        );
        transition: 0.5s;
        z-index: 2;
    }

    button:hover::before {
        left: 100%;
    }

    /* Tombol Salin (Emerald / Cyan Neon Glow) */
    .btn-copy { 
        background: linear-gradient(135deg, #10b981 0%, #0284c7 100%) !important; 
        color: #ffffff !important; 
        box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
    }
    
    .btn-copy:hover { 
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6);
        animation: pulseGlow 1.5s infinite alternate;
    }

    /* Tombol Reset (Amber Gold Glow) */
    .btn-reset { 
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important; 
        color: #ffffff !important; 
        box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
    }
    
    .btn-reset:hover { 
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 8px 25px rgba(245, 158, 11, 0.55);
    }

    button:active {
        transform: translateY(1px) scale(0.98);
    }

    /* Animasi Bergetar Cahaya Lembut saat Hover */
    @keyframes pulseGlow {
        0% {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        100% {
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
        }
    }
    
    /* TABEL CERAH & SPASIONAL */
    .table-container { 
        overflow-x: auto; 
        border-radius: 10px;
        border: 1px solid rgba(56, 189, 248, 0.2) !important;
        background-color: #080e21 !important;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
    }
    
    th, td {
        padding: 14px 18px;
        text-align: left;
        font-size: 13.5px;
        white-space: nowrap;
    }
    
    th { 
        font-weight: 700;
        background-color: #121c38 !important; 
        color: #38bdf8 !important; 
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(56, 189, 248, 0.2) !important;
    }
    
    td {
        color: #e2e8f0 !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
    }
    
    tr:last-child td {
        border-bottom: none !important;
    }

    tr:hover td {
        background-color: rgba(56, 189, 248, 0.08) !important;
        color: #ffffff !important;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">TRANSACTION RECAP SYSTEM</div>
    
    <label for="rawInput">Tempel Log Transaksi</label>
    <textarea id="rawInput" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
    
    <div class="btn-group">
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>USER ID</th>
                    <th>TUJUAN BANK</th>
                    <th>CREDIT</th>
                    <th>JUMLAH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n'); 
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let creditStatus = "-"; 
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin!");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "✨ BERHASIL DISALIN ✨";
            setTimeout(() => { btnCopy.innerText = teksAwal; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data.");
        });
    }
</script>
</body>
</html>
