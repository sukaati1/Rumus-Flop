<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karya Anak Djarum - Wallpaper Utama</title>
<style>
    body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        /* --- WALLPAPER BARU: GRADASI MERAH ORANYE API MEMBARA (ANTI HITAM) --- */
        background: linear-gradient(135deg, #4a1505 0%, #2b0b01 40%, #0f0400 100%);
        background-size: cover;
        background-attachment: fixed;
        color: #f3f4f6;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    
    .container {
        background: rgba(22, 11, 5, 0.92); 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 69, 0, 0.4);
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85), 0 0 25px rgba(255, 69, 0, 0.2);
        width: 100%;
        max-width: 950px;
        padding: 30px;
        box-sizing: border-box;
    }
    
    h1 {
        text-align: center;
        color: #ff4500;
        font-size: 28px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 4px;
        margin-bottom: 30px;
        text-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
    }
    
    label {
        display: block;
        font-weight: 600;
        margin-bottom: 10px;
        color: #ffa500;
        font-size: 14px;
        letter-spacing: 0.7px;
    }
    
    textarea {
        width: 100%;
        height: 150px;
        background: rgba(8, 3, 1, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        color: #fff;
        padding: 15px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 13.5px;
        margin-bottom: 25px;
        transition: all 0.3s ease;
    }
    
    textarea:focus {
        border-color: #ff4500;
        outline: none;
        box-shadow: 0 0 12px rgba(255, 69, 0, 0.4);
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;
    }
    
    button {
        flex: 1;
        padding: 10px 14px; 
        font-size: 13px;   
        font-weight: 700;
        border: none;
        border-radius: 6px; 
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    .btn-submit { 
        background: linear-gradient(135deg, #ff4500, #ff6600); 
        color: #fff; 
    }
    
    .btn-submit:hover { 
        transform: translateY(-2px); 
        box-shadow: 0 6px 15px rgba(255, 69, 0, 0.45); 
    }
    
    .btn-copy { 
        background: linear-gradient(135deg, #1e40af, #3b82f6); 
        color: #fff; 
    }
    
    .btn-copy:hover { 
        transform: translateY(-2px); 
        box-shadow: 0 6px 15px rgba(59, 130, 246, 0.45); 
    }
    
    .btn-reset { 
        background: rgba(255, 255, 255, 0.08); 
        color: #d1d5db; 
        border: 1px solid rgba(255, 255, 255, 0.15); 
    }
    
    .btn-reset:hover { 
        background: rgba(255, 255, 255, 0.18); 
        color: #fff; 
    }
    
    /* Indikator fokus yang jelas saat ditekan TAB */
    button:focus {
        outline: 3px solid #ff4500;
        outline-offset: 1px;
    }
    
    button:active {
        transform: translateY(1px);
    }
    
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 10px; 
        border: 1px solid rgba(255, 255, 255, 0.08); 
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(12, 6, 4, 0.9);
    }
    
    th, td {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 14px 18px;
        text-align: left;
        font-size: 13.5px;
    }
    
    th { 
        background-color: rgba(20, 10, 5, 0.95); 
        color: #ff4500; 
        font-weight: 700; 
        letter-spacing: 0.8px; 
    }
    
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background-color: rgba(255, 69, 0, 0.02); }
</style>
</head>
<body>

<div class="container">
    <h1>Karya anak Djarum</h1>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <!-- KUNCI URUTAN TAB -->
    <textarea id="rawInput" tabindex="1" placeholder="Dari kita untuk kita"></textarea>
    
    <div class="btn-group">
        <button class="btn-submit" tabindex="2" onclick="konversiLog()">Submit</button>
        <button class="btn-copy" tabindex="3" id="btnCopy" onclick="salinHasil(event)">Salin Data</button>
        <button class="btn-reset" tabindex="4" id="btnReset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            
            if (kolom.length < 5) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 5) {
                const pakaiNoUrut = !isNaN(kolom[0]) && kolom.length > 6;
                
                let waktu = "";
                let idxWaktu = pakaiNoUrut ? 1 : 0;
                if(kolom[idxWaktu] && kolom[idxWaktu].includes('-')) {
                    let pecahWaktu = kolom[idxWaktu].split(/\s+/);
                    waktu = pecahWaktu[1] || kolom[idxWaktu];
                } else {
                    waktu = kolom[idxWaktu] || "";
                }
                
                if (waktu.includes('-') && waktu.includes(':')) {
                    waktu = waktu.split(/\s+/)[1] || waktu;
                } else if (!waktu.includes(':') && kolom[idxWaktu+1] && kolom[idxWaktu+1].includes(':')) {
                    waktu = kolom[idxWaktu+1];
                }

                let userId = "";
                for (let i = 1; i < kolom.length; i++) {
                    if (kolom[i].includes(':')) {
                        userId = kolom[i+1] || "";
                        break;
                    }
                }
                if (!userId) userId = pakaiNoUrut ? kolom[2] : kolom[1];

                let tujuanBank = "";
                for (let i = 0; i < kolom.length; i++) {
                    if (kolom[i].includes(',') || kolom[i].toUpperCase().includes('MANDIRI') || kolom[i].toUpperCase().includes('BCA') || kolom[i].toUpperCase().includes('BRI') || kolom[i].toUpperCase().includes('BNI')) {
                        tujuanBank = kolom[i];
                        break;
                    }
                }

                let jumlah = "";
                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 4) {
                        jumlah = kolom[i];
                        break;
                    }
                }
                if (!jumlah) {
                    jumlah = kolom[kolom.length - 3] || "";
                }

                const creditStatus = ""; 

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${creditStatus}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    // --- SALIN DATA DAN PAKSA ALUR TAB KE RESET ---
    function salinHasil(e) {
        // Cegah aksi bawaan browser agar fokus tidak rusak
        if(e) e.preventDefault();

        if (hasilTeksUntukDisalin) {
            const el = document.createElement('textarea');
            el.value = hasilTeksUntukDisalin;
            el.setAttribute('readonly', '');
            el.style.position = 'absolute';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
        }

        // KUNCI UTAMA: Setelah sukses salin, kursor langsung dipaksa mengunci tombol Reset
        document.getElementById('btnReset').focus();
    }
</script>
</body>
</html>
