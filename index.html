<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - LIGHT ANIME EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        --bg-main: #f4f6fa;
        --panel-bg: #ffffff;
        --tech-blue: #0066cc;
        --neon-pink: #ff007f;
        --text-main: #1a202c;
        --border-color: #cbd5e1;
    }

    body {
        font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: var(--text-main);
        background-color: var(--bg-main); 
        position: relative;
        overflow-x: hidden;
    }
    
    /* WALLPAPER BERGERAK (ANIMATED TECH GRID BACKGROUND) */
    body::before {
        content: "";
        position: fixed;
        top: -50%; left: -50%; width: 200%; height: 200%;
        z-index: -1;
        background-image: 
            linear-gradient(rgba(0, 102, 204, 0.05) 1.5px, transparent 1.5px),
            linear-gradient(90deg, rgba(0, 102, 204, 0.05) 1.5px, transparent 1.5px);
        background-size: 40px 40px;
        /* Menjalankan animasi bergerak secara diagonal terus-menerus */
        animation: gridMove 20s linear infinite;
    }
    
    /* Efek Scanline halusnya */
    body::after {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 102, 204, 0.02) 50%);
        background-size: 100% 4px;
        pointer-events: none;
    }

    /* RUMUS ANIMASI BACKROUND BERGERAK */
    @keyframes gridMove {
        0% {
            transform: translate(0, 0);
        }
        100% {
            transform: translate(40px, 40px);
        }
    }
    
    .container {
        background: var(--panel-bg); 
        border: 2px solid var(--tech-blue);
        border-radius: 12px;
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-sizing: border-box;
        box-shadow: 0 15px 35px rgba(0, 102, 204, 0.15);
        position: relative;
    }

    .container::before {
        content: '';
        position: absolute;
        top: -2px; right: 40px; width: 50px; height: 4px;
        background: var(--neon-pink);
    }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: var(--tech-blue);
        font-size: 32px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 6px;
        margin: 0;
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        color: var(--neon-pink);
        letter-spacing: 4px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 6px;
        margin-bottom: 35px;
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 10px;
        color: var(--tech-blue);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }
    
    textarea {
        width: 100%;
        height: 150px;
        background: #ffffff;
        border: 2px solid var(--border-color);
        border-radius: 6px;
        color: #000000;
        padding: 15px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 25px;
        transition: border-color 0.2s ease;
    }
    
    textarea:focus {
        border-color: var(--tech-blue);
        outline: none;
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 35px;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        padding: 16px; 
        font-size: 13px;   
        font-weight: 900;
        border: none;
        border-radius: 6px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: background 0.2s ease, color 0.2s ease;
    }
    
    .btn-submit { 
        background: var(--tech-blue); 
        color: #ffffff; 
    }
    .btn-submit:hover {
        background: #004da6;
    }
    
    .btn-copy { 
        background: #ffffff; 
        color: var(--neon-pink); 
        border: 2px solid var(--neon-pink);
    }
    .btn-copy:hover { 
        background: var(--neon-pink);
        color: #ffffff;
    }
    
    .btn-reset { 
        background: #e2e8f0; 
        color: #4a5568; 
        border: 1px solid var(--border-color);
    }
    .btn-reset:hover { 
        background: #cbd5e1;
        color: #1a202c;
    }

    /* PENANDA LINGKARAN DI-TAB TETAP SUPER TEBAL DAN MENYALA */
    button:focus-visible, textarea:focus-visible {
        outline: 5px solid var(--neon-pink) !important;
        outline-offset: 3px !important;
        box-shadow: 0 0 20px var(--neon-pink) !important;
    }
    
    button:focus, textarea:focus {
        outline: none; 
    }
    
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 6px; 
        border: 2px solid var(--tech-blue); 
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
    }
    
    th, td {
        border-bottom: 1px solid var(--border-color);
        padding: 15px 18px;
        text-align: left;
        font-size: 14px;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background-color: var(--tech-blue); 
        color: #ffffff; 
        font-weight: 700; 
        letter-spacing: 1px;
    }
    
    td {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        color: #1a202c;
    }

    td:nth-child(5) {
        font-family: 'Orbitron', sans-serif;
        color: #000000;
        font-weight: 900;
    }
    
    tr:nth-child(even) {
        background-color: #f8fafc;
    }

    tr:hover {
        background-color: #f1f5f9;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">Light Tech Moving Grid v2.5</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="Masukkan atau tempel data log transaksi di sini..."></textarea>
    
    <div class="btn-group">
        <button id="btnSubmit" class="btn-submit" onclick="konversiLog()">Submit</button>
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            
            if (kolom.length < 5) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 5) {
                const pakaiNoUrut = !isNaN(kolom[0]) && kolom.length > 6;
                
                let waktu = "";
                let idxWaktu = pakaiNoUrut ? 1 : 0;
                if(kolom[idxWaktu] && kolom[idxWaktu].includes('-')) {
                    let pecahWaktu = kolom[idxWaktu].split(/\s+/);
                    waktu = pecahWaktu[1] || kolom[idxWaktu];
                } else {
                    waktu = kolom[idxWaktu] || "";
                }
                
                if (waktu.includes('-') && waktu.includes(':')) {
                    waktu = waktu.split(/\s+/)[1] || waktu;
                } else if (!waktu.includes(':') && kolom[idxWaktu+1] && kolom[idxWaktu+1].includes(':')) {
                    waktu = kolom[idxWaktu+1];
                }

                let userId = "";
                for (let i = 1; i < kolom.length; i++) {
                    if (kolom[i].includes(':')) {
                        userId = kolom[i+1] || "";
                        break;
                    }
                }
                if (!userId) userId = pakaiNoUrut ? kolom[2] : kolom[1];

                let tujuanBank = "";
                for (let i = 0; i < kolom.length; i++) {
                    if (kolom[i].includes(',') || kolom[i].toUpperCase().includes('MANDIRI') || kolom[i].toUpperCase().includes('BCA') || kolom[i].toUpperCase().includes('BRI') || kolom[i].toUpperCase().includes('BNI')) {
                        tujuanBank = kolom[i];
                        break;
                    }
                }

                let jumlah = "";
                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 4) {
                        jumlah = kolom[i];
                        break;
                    }
                }
                if (!jumlah) {
                    jumlah = kolom[kolom.length - 3] || "";
                }

                const creditStatus = ""; 

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${creditStatus}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) return;
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            console.log("Data copied successfully!");
        }).catch(err => {
            console.error("Gagal salin: ", err);
        });
    }
</script>
</body>
</html>
