<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>Rumus Flop Kasir - Ultra Red Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            color-scheme: only dark !important;
            --red-main: #ff0033;
            --red-glow: #ff2a55;
            --red-dark: #80001a;
            --red-bg: rgba(255, 0, 51, 0.15); 
            --red-border: #ff2a55;               
        }

        * { box-sizing: border-box; user-select: none; }
        html, body { width: 100%; min-height: 100vh; margin: 0; padding: 0; background-color: #030308; overflow-x: hidden; }
        body { padding: 30px 15px; font-family: 'Rajdhani', sans-serif; color: #fff !important; display: flex; justify-content: center; align-items: center; }

        .bg-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; pointer-events: none; }

        @property --border-angle { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
        @keyframes spinBorder { 0% { --border-angle: 0deg; } 100% { --border-angle: 360deg; } }
        @keyframes shineText { to { background-position: 200% center; } }

        /* Bingkai utama dengan rotasi cahaya MERAH */
        .container, .chat-modal-box {
            position: relative; z-index: 2; background: rgba(15, 5, 8, 0.55) !important; 
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-radius: 40px !important; width: 100%; max-width: 900px; padding: 40px; margin: auto;
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.35), inset 0 0 20px rgba(255, 0, 51, 0.15);
        }

        .container::before, .chat-modal-box::before {
            content: ''; position: absolute; inset: 0; border-radius: 40px; padding: 3px;
            background: conic-gradient(from var(--border-angle), rgba(255, 0, 51, 0.2) 0%, var(--red-main) 25%, #ffffff 50%, var(--red-glow) 75%, rgba(255, 0, 51, 0.2) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; animation: spinBorder 4s linear infinite;
        }

        h1, .chat-modal-header h1 {
            text-align: center; font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 900; letter-spacing: 4px; margin: 0;
            background: linear-gradient(90deg, #ff0055, #ff0033, #ff6600, #ff0055);
            background-size: 200% auto; color: transparent !important; -webkit-background-clip: text; background-clip: text;
            animation: shineText 3s linear infinite; filter: drop-shadow(0 0 10px rgba(255, 0, 51, 0.6));
        }

        .sub-title { text-align: center; font-family: 'Orbitron', sans-serif; font-size: 11px; color: #fff !important; letter-spacing: 6px; font-weight: 800; text-transform: uppercase; margin: 8px 0 28px; }
        .label-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .label-actions { display: flex; align-items: center; gap: 8px; }

        label { display: block; font-family: 'Orbitron', sans-serif; font-weight: 800; color: #fff !important; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; text-align: center; }

        .badge-count, .btn-swap-pos {
            font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 15px;
            background: rgba(255, 0, 51, 0.2); color: #fff !important; border: 1px solid rgba(255, 42, 85, 0.6); 
            font-family: 'Orbitron', sans-serif; cursor: pointer; transition: all 0.2s ease; display: inline-block; text-align: center;
        }
        .btn-swap-pos { background: rgba(255, 0, 85, 0.2); border-color: rgba(255, 0, 85, 0.6); }
        .badge-count:hover, .btn-swap-pos:hover { background: rgba(255, 0, 51, 0.45); border-color: #fff; box-shadow: 0 0 12px var(--red-glow); transform: scale(1.05); }

        textarea#rawInput {
            width: 100%; height: 120px; background: rgba(0, 0, 0, 0.4) !important; border: 1.5px solid rgba(255, 0, 51, 0.4) !important; 
            border-radius: 12px; color: #fff !important; padding: 14px; resize: vertical; font-family: 'JetBrains Mono', monospace; 
            font-weight: 700; font-size: 13.5px; margin-bottom: 20px; user-select: text; outline: none;
        }
        textarea#rawInput:focus { border-color: var(--red-glow) !important; background: rgba(0, 0, 0, 0.6) !important; box-shadow: 0 0 12px rgba(255, 0, 51, 0.5); }

        .btn-group { display: flex; gap: 16px; margin-bottom: 28px; }
        .btn-group.swapped { flex-direction: row-reverse; }

        /* Style Umum Tombol Flop */
        button, .btn-flop-style {
            position: relative; overflow: hidden; flex: 1; padding: 12px 16px; font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 900;
            cursor: pointer; letter-spacing: 1px; text-transform: uppercase; outline: none; border-radius: 25px !important; 
            border: 1.5px solid var(--red-border) !important; background: var(--red-bg) !important; color: #fff !important;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.6); box-shadow: 0 0 10px rgba(255, 42, 85, 0.4), inset 0 0 6px rgba(255, 0, 51, 0.2);
            transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; text-align: center;
        }
        button:hover, .btn-flop-style:hover { background: rgba(255, 0, 51, 0.35) !important; border-color: #fff !important; box-shadow: 0 0 15px #ff2a55, inset 0 0 10px rgba(255, 255, 255, 0.4); }

        /* Style Khusus Tombol Salin & Reset (Focus Tab, Gelombang, & Flash) */
        #btnCopy, #btnReset {
            position: relative;
            overflow: hidden;
        }
        
        /* Border menyala saat berpindah TAB keyboard */
        #btnCopy:focus-visible, #btnReset:focus-visible {
            border: 2px solid #ffffff !important;
            box-shadow: 0 0 20px var(--red-main), 0 0 10px #ffffff, inset 0 0 12px var(--red-glow) !important;
            outline: 2px solid var(--red-main);
            outline-offset: 3px;
        }

        /* Elemen Efek Flash */
        .flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #ffffff 10%, #ff0055 80%);
            opacity: 0; pointer-events: none; z-index: 5;
            transition: opacity 0.05s ease-out;
        }

        /* Elemen Efek Gelombang (Ripple) */
        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            transform: scale(0);
            animation: rippleAnim 0.5s linear;
            pointer-events: none;
            z-index: 4;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        @keyframes flashAnim {
            0% { opacity: 0.95; }
            100% { opacity: 0; }
        }

        .btn-flash-active {
            animation: flashAnim 0.35s ease-out forwards;
        }

        .profile-action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .profile-action-grid .btn-flop-style { padding: 8px 10px !important; font-size: 9.5px !important; letter-spacing: 0.5px !important; border-radius: 18px !important; height: 38px !important; }

        .table-container { overflow-x: auto; max-height: 380px; border-radius: 12px; border: 1.5px solid rgba(255, 0, 51, 0.4) !important; background: rgba(0, 0, 0, 0.35) !important; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th, td { padding: 12px 16px; text-align: left; white-space: nowrap; user-select: text; }
        th { position: sticky; top: 0; z-index: 3; font-family: 'Orbitron', sans-serif; font-weight: 800; background: rgba(20, 5, 8, 0.85) !important; backdrop-filter: blur(6px); color: #fff !important; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; border-bottom: 2px solid var(--red-main) !important; }
        td { color: #fff !important; border-bottom: 1px solid rgba(255, 0, 51, 0.15) !important; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; }

        .chat-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6) !important; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 999; display: none; justify-content: center; align-items: center; padding: 15px; }
        #profileModal, #registerModal, #friendsModal, #createGroupModal { z-index: 1002 !important; }
        #imageViewerModal { z-index: 1003 !important; }

        .auth-modal { position: relative; width: 100%; max-width: 440px; background: rgba(15, 5, 8, 0.9) !important; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 24px !important; border: 1.5px solid var(--red-border) !important; padding: 0; overflow: hidden; box-shadow: 0 0 25px rgba(255, 0, 51, 0.3); }
        .auth-modal-content { position: relative; z-index: 1; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .auth-header { display: flex; align-items: center; justify-content: space-between; }
        .auth-form { display: flex; flex-direction: column; gap: 10px; }
        .auth-input-group { display: flex; flex-direction: column; gap: 4px; }
        .auth-input-group label { font-size: 10px; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        .auth-input-group input { background: rgba(0, 0, 0, 0.5) !important; border: 1px solid rgba(255, 0, 51, 0.4) !important; color: #fff !important; padding: 10px 12px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none; text-align: center; }

        .avatar-selection-box { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 2px 0; }
        .avatar-preview-container { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; border: 2px solid var(--red-glow); display: flex; align-items: center; justify-content: center; background: #000; }

        .auth-close-btn, .btn-back-arrow { background: rgba(255, 255, 255, 0.1) !important; border: 1px solid var(--red-border) !important; color: #fff !important; font-size: 13px; width: 32px !important; height: 32px !important; border-radius: 50% !important; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0 !important; flex: none !important; transition: all 0.2s ease; }
        .auth-close-btn:hover, .btn-back-arrow:hover { background: rgba(255, 0, 51, 0.4) !important; border-color: #fff !important; box-shadow: 0 0 10px var(--red-main); }

        .chat-modal-box { height: 90vh; max-height: 780px; padding: 24px !important; display: flex; flex-direction: column; overflow: hidden; background: rgba(15, 5, 8, 0.7) !important; }
        .chat-modal-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; margin-bottom: 12px; border-bottom: 1px solid rgba(255, 0, 51, 0.3); }
        .header-left, .header-controls { display: flex; align-items: center; gap: 10px; }
        .header-controls { gap: 6px; }

        .btn-hdr-action { font-size: 10px !important; padding: 6px 12px !important; border-radius: 20px !important; flex: none !important; height: auto !important; font-family: 'Orbitron', sans-serif !important; font-weight: 800 !important; }

        .chat-body { flex: 1; overflow-y: auto; padding: 12px; background: rgba(0, 0, 0, 0.45) !important; border: 1.5px solid rgba(255, 0, 51, 0.3) !important; border-radius: 16px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .chat-msg-wrapper { display: flex; gap: 8px; width: 100%; align-items: flex-end; }
        .chat-msg-wrapper.own-msg { flex-direction: row-reverse; }

        .msg-avatar, .msg-avatar-video { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--red-glow); flex-shrink: 0; }
        .msg-avatar.admin-avatar, .msg-avatar-video.admin-avatar { border: 2px solid #ffd700 !important; box-shadow: 0 0 10px #ffd700, 0 0 15px var(--red-main) !important; }

        .msg-content-container { display: flex; flex-direction: column; max-width: 80%; width: auto; }
        .chat-msg-wrapper.own-msg .msg-content-container { align-items: flex-end; }
        .msg-header-info { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; font-size: 10px; color: rgba(255, 255, 255, 0.7); }
        .chat-msg-wrapper.own-msg .msg-header-info { flex-direction: row-reverse; }

        .sender { font-weight: 800; font-family: 'Orbitron', sans-serif; font-size: 10px; color: var(--red-glow) !important; }
        .admin-badge { font-size: 8px; font-weight: 900; padding: 1px 4px; border-radius: 4px; background: linear-gradient(45deg, #ffd700, #ff0033); color: #000 !important; font-family: 'Orbitron', sans-serif; letter-spacing: 0.5px; display: inline-block; }
        .time-stamp { color: rgba(255, 255, 255, 0.5); font-size: 9px; font-family: 'JetBrains Mono', monospace; }

        .msg-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s ease; }
        .chat-msg-wrapper:hover .msg-actions { opacity: 1; }
        .btn-action-msg { color: #fff; cursor: pointer; font-size: 10px !important; line-height: 1; display: inline-flex; align-items: center; }

        .chat-msg { position: relative; font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 4px 8px !important; border-radius: 8px; user-select: text; word-break: break-word; line-height: 1.25; display: inline-block !important; width: max-content !important; max-width: fit-content !important; box-sizing: border-box; }
        .chat-msg-wrapper.other-msg .chat-msg { background: rgba(30, 8, 12, 0.85) !important; color: #fff !important; border: 1px solid rgba(255, 0, 51, 0.4) !important; border-bottom-left-radius: 2px; }
        .chat-msg-wrapper.own-msg .chat-msg { background: rgba(255, 0, 51, 0.25) !important; color: #fff !important; border: 1px solid var(--red-glow) !important; border-bottom-right-radius: 2px; }
        
        .chat-msg .chat-media-img { max-width: 180px; max-height: 180px; border-radius: 6px; cursor: pointer; display: block; }
        .chat-msg .chat-media-video { max-width: 200px; max-height: 180px; border-radius: 6px; display: block; }

        .msg-reactions-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
        .chat-msg-wrapper.own-msg .msg-reactions-container { justify-content: flex-end; }
        .reaction-badge { display: inline-flex; align-items: center; gap: 3px; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--red-main); border-radius: 10px; padding: 1px 5px; font-size: 10px; cursor: pointer; color: #fff; }

        .reply-quote-box { background: rgba(0, 0, 0, 0.4); border-left: 2px solid var(--red-glow); padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; font-size: 10px; }
        .reply-preview-container { display: none; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.5); border-left: 3px solid var(--red-glow); padding: 6px 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; border-radius: 6px; margin-bottom: 8px; }

        .sticker-picker-container { display: none; grid-template-columns: repeat(6, 1fr); gap: 6px; background: rgba(15, 5, 8, 0.95); border: 1px solid var(--red-main); border-radius: 10px; padding: 8px; max-height: 100px; overflow-y: auto; margin-bottom: 8px; }
        .sticker-item { font-size: 18px; text-align: center; cursor: pointer; border-radius: 4px; padding: 2px; }
        .sticker-item:hover { background: rgba(255, 255, 255, 0.2); }

        .chat-footer { display: flex; gap: 8px; align-items: center; flex-shrink: 0; width: 100%; }
        .chat-footer textarea#chatText { flex: 1; height: 40px; background: rgba(0, 0, 0, 0.4) !important; border: 1.5px solid rgba(255, 0, 51, 0.4) !important; border-radius: 12px !important; color: #fff !important; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; outline: none; resize: none; line-height: 1.3; }
        .chat-footer textarea#chatText:focus { border-color: var(--red-glow) !important; box-shadow: 0 0 10px rgba(255, 0, 51, 0.4); }

        .btn-chat-small { width: 36px !important; height: 36px !important; min-width: 36px !important; max-width: 36px !important; padding: 0 !important; flex: none !important; background: rgba(0, 0, 0, 0.4) !important; border: 1.5px solid rgba(255, 0, 51, 0.4) !important; border-radius: 10px !important; color: #fff !important; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.2s ease; }
        .btn-chat-small:hover { border-color: var(--red-glow) !important; background: rgba(255, 0, 51, 0.25) !important; box-shadow: 0 0 8px var(--red-glow); }

        .btn-send-chat { flex: none !important; width: auto !important; min-width: 90px !important; height: 40px !important; padding: 0 14px !important; border-radius: 35px !important; border: 2px solid var(--red-border) !important; background: var(--red-bg) !important; color: #fff !important; font-family: 'Orbitron', sans-serif !important; font-size: 11px !important; font-weight: 900 !important; letter-spacing: 2px !important; text-transform: uppercase !important; text-shadow: 0 0 6px rgba(255, 255, 255, 0.6) !important; box-shadow: 0 0 12px rgba(255, 42, 85, 0.5), inset 0 0 8px rgba(255, 0, 51, 0.2) !important; cursor: pointer; text-align: center; }
        .btn-send-chat:hover { background: rgba(255, 0, 51, 0.35) !important; border-color: #fff !important; box-shadow: 0 0 20px #ff2a55, inset 0 0 12px rgba(255, 255, 255, 0.4) !important; }

        .friends-nav-tabs { display: flex; gap: 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); padding-bottom: 12px; margin-bottom: 12px; align-items: center; }
        .tab-btn { flex: 1; padding: 8px 4px !important; font-size: 10px !important; border-radius: 8px !important; color: #fff !important; background: var(--red-bg) !important; border: 1.5px solid var(--red-border) !important; font-family: 'Orbitron', sans-serif !important; font-weight: 800 !important; letter-spacing: 1px !important; text-transform: uppercase !important; height: 34px !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; box-shadow: 0 0 8px rgba(255, 42, 85, 0.3); transition: all 0.2s ease; text-align: center; }
        .tab-btn:hover { background: rgba(255, 0, 51, 0.35) !important; border-color: #fff !important; box-shadow: 0 0 12px #ff2a55; }
        .tab-btn.active { background: rgba(255, 0, 51, 0.4) !important; color: #fff !important; border-color: #fff !important; box-shadow: 0 0 12px var(--red-glow); }

        .btn-logout-tab { background: rgba(255, 0, 51, 0.2) !important; border-color: rgba(255, 0, 51, 0.6) !important; }
        .btn-logout-tab:hover { background: rgba(255, 0, 51, 0.5) !important; border-color: #fff !important; box-shadow: 0 0 12px var(--red-glow) !important; }

        .friends-list-container { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
        .section-label { font-family: 'Orbitron', sans-serif; font-size: 10px; color: var(--red-glow); letter-spacing: 1.5px; margin: 8px 0 4px 0; font-weight: 800; text-transform: uppercase; text-align: center; }
        .friend-card { display: flex; align-items: center; justify-content: space-between; background: rgba(0, 0, 0, 0.4); padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255, 0, 51, 0.3); gap: 10px; }
        .friend-name { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        
        .btn-friend-action { font-size: 8px !important; padding: 4px 8px !important; height: auto !important; min-height: 0 !important; border-radius: 12px !important; flex: none !important; font-family: 'Orbitron', sans-serif !important; letter-spacing: 0.5px !important; text-align: center; }
        .btn-danger-action { background: rgba(255, 0, 51, 0.3) !important; border-color: rgba(255, 0, 51, 0.7) !important; }
        .btn-danger-action:hover { background: rgba(255, 0, 51, 0.7) !important; box-shadow: 0 0 10px var(--red-main) !important; }

        .checkbox-list { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; border: 1px solid rgba(255, 0, 51, 0.3); padding: 8px; border-radius: 8px; background: rgba(0,0,0,0.3); }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer; }

        .image-viewer-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 1005; }
        .image-viewer-modal img, .image-viewer-modal video { max-width: 85vw; max-height: 80vh; border-radius: 12px; }
    </style>
</head>
<body>

    <video class="bg-video" autoplay loop muted playsinline disablepictureinpicture>
        <source src="./gb.mp4" type="video/mp4">
    </video>

    <main class="container" id="mainContainer">
        <h1>Rumus Flop Kasir</h1>
        <div class="sub-title">Ultra Red Edition</div>

        <div class="label-header">
            <label for="rawInput">Tempel Log Transaksi</label>
        </div>
        <textarea id="rawInput" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()"></textarea>
        
        <div class="btn-group" id="btnGroup">
            <button id="btnCopy" tabindex="1" onclick="executeSalinData(event)" onkeydown="handleBtnKey(event, executeSalinData)">
                <div class="flash-overlay" id="flashCopy"></div>
                <span id="txtCopy" style="position:relative; z-index:6;">SALIN DATA</span>
            </button>
            <button id="btnReset" tabindex="2" onclick="executeResetData(event)" onkeydown="handleBtnKey(event, executeResetData)">
                <div class="flash-overlay" id="flashReset"></div>
                <span id="txtReset" style="position:relative; z-index:6;">RESET</span>
            </button>
        </div>

        <div class="label-header">
            <label>Hasil Konversi</label>
            <div class="label-actions">
                <span class="btn-swap-pos" onclick="document.getElementById('btnGroup').classList.toggle('swapped')">SWAP ⇄</span>
                <span class="badge-count" id="dataCounter" onclick="handleChatClick()">DATA</span>
            </div>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>WAKTU</th>
                        <th>USER ID</th>
                        <th>TUJUAN BANK</th>
                        <th>CREDIT</th>
                        <th>JUMLAH</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal: Login -->
    <section class="chat-modal-overlay" id="authModal">
        <div class="auth-modal">
            <div class="auth-modal-content">
                <div class="auth-header">
                    <button class="btn-back-arrow" onclick="closeModal('authModal')" title="Kembali">⬅️</button>

        <div id="fullsizeMediaContainer"></div>

    <script>
        const NAMA_ADMIN_RESMI = "JAKA SEMBUNG";
        let hasilTeksUntukDisalin = "", selectedReplyData = null, activeUser = null, tempEditAvatar = "", isChatOpen = false, windowTargetMsgKeyForReaction = null, currentChatPath = null, sessionListenerRef = null;

        if (!firebase.apps.length) {
            firebase.initializeApp({ databaseURL: "https://kasir-flop-chat-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        }
        
        const dbRoot = firebase.database();
        let dbChat = null;
        const dbAccounts = dbRoot.ref("chat_accounts"), dbFriends = dbRoot.ref("user_friends"), dbCustomGroups = dbRoot.ref("custom_groups");

        window.addEventListener('DOMContentLoaded', () => {
            const savedUserData = localStorage.getItem('flop_chat_active_user');
            if (savedUserData) {
                try {
                    activeUser = JSON.parse(savedUserData);
                    if (activeUser?.username && activeUser?.sessionToken) {
                        listenSingleSession(activeUser.username, activeUser.sessionToken);
                    }
                } catch (e) { activeUser = null; }
            }
        });

        /* FUNGSI EFEK FLASH & GELOMBANG (RIPPLE) */
        function triggerButtonEffects(btnElement, flashOverlayId, event) {
            // 1. Efek Flash
            const flashOverlay = document.getElementById(flashOverlayId);
            if (flashOverlay) {
                flashOverlay.classList.remove('btn-flash-active');
                void flashOverlay.offsetWidth; // Trigger reflow
                flashOverlay.classList.add('btn-flash-active');
            }

            // 2. Efek Gelombang (Ripple)
            const circle = document.createElement('span');
            circle.classList.add('ripple-effect');
            
            const rect = btnElement.getBoundingClientRect();
            const diameter = Math.max(rect.width, rect.height);
            circle.style.width = circle.style.height = `${diameter}px`;
            
            if (event && event.clientX && event.clientY) {
                circle.style.left = `${event.clientX - rect.left - diameter / 2}px`;
                circle.style.top = `${event.clientY - rect.top - diameter / 2}px`;
            } else {
                circle.style.left = `${rect.width / 2 - diameter / 2}px`;
                circle.style.top = `${rect.height / 2 - diameter / 2}px`;
            }

            const existingRipple = btnElement.querySelector('.ripple-effect');
            if (existingRipple) existingRipple.remove();

            btnElement.appendChild(circle);
            setTimeout(() => circle.remove(), 500);
        }

        function handleBtnKey(e, callbackFunc) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                callbackFunc(e);
            }
        }

        function executeSalinData(event) {
            triggerButtonEffects(document.getElementById('btnCopy'), 'flashCopy', event);
            salinHasil();
        }

        function executeResetData(event) {
            triggerButtonEffects(document.getElementById('btnReset'), 'flashReset', event);
            resetData();
        }

        function isVideoUrl(url) {
            if (!url) return false;
            if (url.startsWith('data:video/')) return true;
            const cleanUrl = url.split('?')[0].toLowerCase();
            return cleanUrl.endsWith('.mp4') || cleanUrl.endsWith('.webm') || cleanUrl.endsWith('.ogg');
        }

        function createAvatarElement(avatarUrl, className = 'msg-avatar', username = '') {
            const isVid = isVideoUrl(avatarUrl);
            const elem = document.createElement(isVid ? 'video' : 'img');
            elem.className = className + (isVid ? '-video' : '') + ((username.toUpperCase() === NAMA_ADMIN_RESMI) ? ' admin-avatar' : '');
            elem.src = avatarUrl;

            if (isVid) { elem.autoplay = elem.loop = elem.muted = elem.playsInline = true; } 
            else { elem.alt = username; }

            if (username) elem.onclick = () => viewFullsizeImage(avatarUrl, username);
            return elem;
        }

        function closeModal(id) {
            const elem = document.getElementById(id);
            if (elem) elem.style.display = 'none';
            checkMainContainerVisibility();
        }

        function checkMainContainerVisibility() {
            let isAnyOverlayVisible = Array.from(document.querySelectorAll('.chat-modal-overlay')).some(modal => modal.style.display === 'flex');
            if (!isAnyOverlayVisible) document.getElementById('mainContainer').style.display = 'block';
        }

        function handleChatClick() {
            document.getElementById('mainContainer').style.display = 'none';
            if (activeUser?.username) { openFriendsModal(); } 
            else {
                document.getElementById('loginUser').value = document.getElementById('loginPass').value = '';
                document.getElementById('authModal').style.display = 'flex';
            }
        }

        function submitLogin() {
            const user = document.getElementById('loginUser').value.trim().toUpperCase();
            const pass = document.getElementById('loginPass').value.trim();
            if (!user || !pass) return alert("Nama dan Password wajib diisi!");

            dbAccounts.child(user).once('value', (snapshot) => {
                if (snapshot.exists() && snapshot.val().password === pass) {
                    const newSessionToken = Date.now() + "_" + Math.random().toString(36).substring(2, 9);
                    dbAccounts.child(user).update({ sessionToken: newSessionToken }).then(() => {
                        activeUser = { username: user, avatar: snapshot.val().avatar || ("https://api.dicebear.com/7.x/bottts/svg?seed=" + user), sessionToken: newSessionToken };
                        localStorage.setItem('flop_chat_active_user', JSON.stringify(activeUser));
                        listenSingleSession(user, newSessionToken);
                        closeModal('authModal');
                        openFriendsModal();
                    });
                } else alert("🚫 AKSES DITOLAK (User/Password Salah)");
            });
        }

        function listenSingleSession(username, myToken) {
            if (sessionListenerRef) sessionListenerRef.off();
            sessionListenerRef = dbAccounts.child(username).child('sessionToken');
            sessionListenerRef.on('value', (snapshot) => {
                const latestToken = snapshot.val();
                if (latestToken && latestToken !== myToken) {
                    sessionListenerRef.off();
                    forceLogoutDueToNewLogin();
                }
            });
        }

        function forceLogoutDueToNewLogin() {
            if (dbChat) dbChat.off();
            isChatOpen = false; activeUser = null;
            localStorage.removeItem('flop_chat_active_user');
            ['imageViewerModal', 'friendsModal', 'registerModal', 'profileModal', 'chatModal', 'authModal', 'createGroupModal'].forEach(closeModal);
            document.getElementById('mainContainer').style.display = 'block';
            alert("⚠️ Akun Anda telah login di perangkat/browser lain. Anda telah dikeluarkan secara otomatis.");
        }

        function logoutChat() {
            if (confirm("Logout dari akun?")) {
                if (sessionListenerRef) sessionListenerRef.off();
                activeUser = null;
                localStorage.removeItem('flop_chat_active_user');
                closeModal('profileModal'); closeModal('friendsModal'); closeTeamChat();
                document.getElementById('mainContainer').style.display = 'block';
                alert("Berhasil Logout.");
            }
        }

        function openRegisterModal() {
            if (activeUser?.username !== NAMA_ADMIN_RESMI) return alert("🚫 Hanya Admin yang dapat mendaftar.");
            document.getElementById('profileModal').style.display = 'none';
            document.getElementById('registerModal').style.display = 'flex';
        }

        function submitRegisterNewUser() {
            const newUser = document.getElementById('regUser').value.trim().toUpperCase();
            const newPass = document.getElementById('regPass').value.trim();
            if (!newUser || !newPass) return alert("Lengkapi data baru!");

            dbAccounts.child(newUser).set({ password: newPass, avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=" + newUser, createdAt: new Date().toISOString() }, (err) => {
                if (!err) { alert("✅ Berhasil membuat akun " + newUser); backToProfileModal(); }
            });
        }

        function openProfileModal() {
            if (!activeUser) return;
            tempEditAvatar = activeUser.avatar;
            const container = document.getElementById('editAvatarContainer');
            container.innerHTML = '';
            container.appendChild(createAvatarElement(tempEditAvatar, 'avatar-preview-img'));

            document.getElementById('editUserName').value = activeUser.username;
            document.getElementById('editUserPass').value = '';
            
            const isAdmin = (activeUser.username === NAMA_ADMIN_RESMI);
            document.getElementById('btnAdminOpenReg').style.display = document.getElementById('btnAdminCreateGroup').style.display = isAdmin ? 'inline-flex' : 'none';
            
            document.getElementById('friendsModal').style.display = 'none';
            document.getElementById('profileModal').style.display = 'flex';
        }

        function backToFriendsModalFromProfile() { closeModal('profileModal'); openFriendsModal(); }
        function backToProfileModal() { closeModal('registerModal'); closeModal('createGroupModal'); document.getElementById('profileModal').style.display = 'flex'; }

        function handleEditAvatarUpload(event) {
            const file = event.target.files[0];
            if (file && file.size <= 2.5 * 1024 * 1024) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    tempEditAvatar = e.target.result;
                    const container = document.getElementById('editAvatarContainer');
                    container.innerHTML = '';
                    container.appendChild(createAvatarElement(tempEditAvatar, 'avatar-preview-img'));
                };
                reader.readAsDataURL(file);
            } else alert("File terlalu besar! Max 2.5 MB.");
        }

        function saveProfileChanges() {
            const newName = document.getElementById('editUserName').value.trim().toUpperCase();
            const newPass = document.getElementById('editUserPass').value.trim();
            if (!newName) return alert("Nama tidak boleh kosong!");

            dbAccounts.child(activeUser.username).once('value', (snapshot) => {
                const updatedPass = newPass || snapshot.val().password;
                dbAccounts.child(activeUser.username).update({ password: updatedPass, avatar: tempEditAvatar });
                activeUser.avatar = tempEditAvatar;
                localStorage.setItem('flop_chat_active_user', JSON.stringify(activeUser));
                alert("Profil diperbarui!");
                backToFriendsModalFromProfile();
            });
        }

        function openFriendsModal() {
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('friendsModal').style.display = 'flex';
            switchFriendsTab('recent');
        }

        function backToFriendsModal() { closeModal('chatModal'); openFriendsModal(); }

        function switchFriendsTab(tab) {
            ['Profile', 'Recent', 'Requests', 'Add'].forEach(t => {
                const btn = document.getElementById(`tab${t}Btn`), content = document.getElementById(`tab${t}Content`);
                if (btn) btn.classList.toggle('active', t.toLowerCase() === tab);
                if (content) content.style.display = (t.toLowerCase() === tab) ? 'flex' : 'none';
            });
            if (tab === 'recent') loadRecentChatsAndGroups();
            if (tab === 'requests') loadFriendRequests();
        }

        function loadRecentChatsAndGroups() {
            const container = document.getElementById('tabRecentContent');
            container.innerHTML = 'Memuat obrolan...';
            const isAdmin = (activeUser?.username === NAMA_ADMIN_RESMI);

            dbCustomGroups.once('value', (groupSnap) => {
                let groupsHTML = '<div class="section-label">👥 GRUP SAYA</div>', groupCount = 0;
                groupSnap.forEach((child) => {
                    const group = child.val(), groupId = child.key;
                    if (group.members && group.members[activeUser.username]) {
                        groupCount++;
                        let deleteBtn = isAdmin ? `<button class="btn-flop-style btn-friend-action btn-danger-action" onclick="deleteGroup('${groupId}', '${group.name}')">HAPUS</button>` : '';
                        groupsHTML += `<div class="friend-card"><span class="friend-name">👥 ${group.name}</span><div style="display:flex; gap:4px;"><button class="btn-flop-style btn-friend-action" onclick="startGroupChat('${groupId}', '${group.name}')">BUKA</button>${deleteBtn}</div></div>`;
                    }
                });
                if (groupCount === 0) groupsHTML += '<span style="font-size:11px; color:#888; text-align:center;">Belum ada grup.</span>';

                dbFriends.child(activeUser.username).child('list').once('value', (friendSnap) => {
                    let friendsHTML = '<div class="section-label" style="margin-top:12px;">👤 CHAT PRIBADI</div>', friendCount = 0;
                    friendSnap.forEach((child) => {
                        friendCount++;
                        friendsHTML += `<div class="friend-card"><span class="friend-name">👤 ${child.key}</span><button class="btn-flop-style btn-friend-action" onclick="startPrivateChat('${child.key}')">PESAN</button></div>`;
                    });
                    if (friendCount === 0) friendsHTML += '<span style="font-size:11px; color:#888; text-align:center;">Belum ada riwayat chat pribadi.</span>';
                    container.innerHTML = groupsHTML + friendsHTML;
                });
            });
        }

        function openCreateGroupModal() {
            if (activeUser?.username !== NAMA_ADMIN_RESMI) return alert("Hanya Admin yang dapat membuat grup.");
            document.getElementById('profileModal').style.display = 'none';
            const container = document.getElementById('groupMembersChecklist');
            container.innerHTML = 'Memuat user...';
            
            dbAccounts.once('value', (snapshot) => {
                container.innerHTML = '';
                snapshot.forEach((child) => {
                    if (child.key !== NAMA_ADMIN_RESMI) {
                        container.innerHTML += `<label class="checkbox-item"><input type="checkbox" value="${child.key}" class="group-member-checkbox"> ${child.key}</label>`;
                    }
                });
            });
            document.getElementById('createGroupModal').style.display = 'flex';
        }

        function submitCreateGroup() {
            const groupName = document.getElementById('newGroupName').value.trim().toUpperCase();
            if (!groupName) return alert("Nama Grup Wajib Diisi!");

            let selectedUsers = [NAMA_ADMIN_RESMI];
            document.querySelectorAll('.group-member-checkbox:checked').forEach(cb => selectedUsers.push(cb.value));
            if (selectedUsers.length < 2) return alert("Pilih minimal 1 anggota tambahan!");

            const newGroupKey = dbCustomGroups.push().key;
            let membersObj = {};
            selectedUsers.forEach(user => { membersObj[user] = true; });

            dbCustomGroups.child(newGroupKey).set({ name: groupName, createdBy: activeUser.username, members: membersObj }, (err) => {
                if (!err) { alert("✅ Grup berhasil dibuat!"); backToProfileModal(); }
            });
        }

        function deleteGroup(groupId, groupName) {
            if (activeUser?.username !== NAMA_ADMIN_RESMI) return alert("Hanya Admin yang bisa menghapus grup!");
            if (confirm(`Apakah Anda yakin ingin menghapus grup "${groupName}"?`)) {
                dbCustomGroups.child(groupId).remove().then(() => {
                    dbRoot.ref(`group_chats/${groupId}`).remove();
                    alert("✅ Grup berhasil dihapus!");
                    loadRecentChatsAndGroups();
                }).catch(err => alert("Gagal menghapus grup: " + err.message));
            }
        }

        function sendFriendRequest() {
            const targetUser = document.getElementById('targetFriendUser').value.trim().toUpperCase();
            if (!targetUser || targetUser === activeUser.username) return alert("User ID tidak valid!");
            dbFriends.child(targetUser).child('requests').child(activeUser.username).set(true, () => alert("Permintaan terkirim!"));
        }

        function loadFriendRequests() {
            const container = document.getElementById('tabRequestsContent');
            container.innerHTML = 'Loading...';
            
            dbFriends.child(activeUser.username).child('requests').on('value', (snapshot) => {
                container.innerHTML = snapshot.exists() ? '' : '<span style="font-size:11px; text-align:center;">Tidak ada permintaan.</span>';
                snapshot.forEach((child) => {
                    container.innerHTML += `<div class="friend-card"><span class="friend-name">${child.key}</span><div style="display:flex; gap:4px;"><button class="btn-flop-style btn-friend-action" onclick="acceptFriend('${child.key}')">TERIMA</button><button class="btn-flop-style btn-friend-action" onclick="rejectFriend('${child.key}')">TOLAK</button></div></div>`;
                });
            });
        }

        function acceptFriend(requester) {
            dbFriends.child(activeUser.username).child('list').child(requester).set(true);
            dbFriends.child(requester).child('list').child(activeUser.username).set(true);
            dbFriends.child(activeUser.username).child('requests').child(requester).remove();
            loadFriendRequests();
        }

        function rejectFriend(requester) {
            dbFriends.child(activeUser.username).child('requests').child(requester).remove();
            loadFriendRequests();
        }

        function startPrivateChat(targetUser) {
            closeModal('friendsModal');
            const sorted = [activeUser.username, targetUser].sort();
            document.getElementById('chatTitleHeader').innerText = `👤 ${targetUser}`;
            switchChatRoom(`direct_messages/${sorted[0]}_${sorted[1]}`);
        }

        function startGroupChat(groupId, groupName) {
            closeModal('friendsModal');
            document.getElementById('chatTitleHeader').innerText = `👥 ${groupName}`;
            switchChatRoom(`group_chats/${groupId}`);
        }

        function switchChatRoom(path) {
            if (dbChat) dbChat.off(); 
            document.getElementById('chatLogs').innerHTML = '';
            currentChatPath = path;
            dbChat = dbRoot.ref(path);
            
            dbChat.limitToLast(60).on('child_added', (snap) => renderMessage(snap.key, snap.val()));
            dbChat.limitToLast(60).on('child_changed', (snap) => renderMessage(snap.key, snap.val()));
            dbChat.limitToLast(60).on('child_removed', (snap) => {
                const removedElem = document.getElementById(`msg-${snap.key}`);
                if (removedElem) removedElem.remove();
            });
            document.getElementById('chatModal').style.display = 'flex';
            isChatOpen = true;
        }

        function closeTeamChat() {
            isChatOpen = false;
            closeModal('chatModal');
            document.getElementById('stickerPicker').style.display = 'none';
        }

        function clearAllChat() {
            if (activeUser?.username === NAMA_ADMIN_RESMI && confirm("Hapus semua pesan di obrolan ini?")) {
                if (dbChat) dbChat.remove(); 
            }
        }

        function sendChatMessage() {
            const textInput = document.getElementById('chatText'), text = textInput.value.trim();
            if (text) {
                dbChat.push({
                    user: activeUser.username, avatar: activeUser.avatar, msg: text,
                    timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                    ...(selectedReplyData && { replyTo: selectedReplyData })
                });
                textInput.value = ''; cancelReply();
            }
        }

        function handleChatKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); } }

        function handleMediaUpload(event) {
            const file = event.target.files[0];
            if (file && file.size <= 2 * 1024 * 1024) {
                const isVideo = file.type.startsWith('video/'), reader = new FileReader();
                reader.onload = (e) => {
                    dbChat.push({
                        user: activeUser.username, avatar: activeUser.avatar, mediaData: e.target.result,
                        isMedia: true, mediaType: isVideo ? 'video' : 'image',
                        timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                        ...(selectedReplyData && { replyTo: selectedReplyData })
                    });
                    cancelReply();
                };
                reader.readAsDataURL(file);
            } else alert("File terlalu besar (Max 2MB)");
        }

        function renderMessage(key, data) {
            const chatLogs = document.getElementById('chatLogs');
            const currentUser = activeUser ? activeUser.username : '';
            const username = (data.user || 'USER').toUpperCase();
            const isSelf = (username === currentUser);
            const isAdmin = (username === NAMA_ADMIN_RESMI);

            let wrapperDiv = document.getElementById(`msg-${key}`);
            if (!wrapperDiv) {
                wrapperDiv = document.createElement('div');
                wrapperDiv.className = `chat-msg-wrapper ${isSelf ? 'own-msg' : 'other-msg'}`;
                wrapperDiv.id = `msg-${key}`;
            } else { wrapperDiv.innerHTML = ''; }

            const avatarElem = createAvatarElement(data.avatar || ("https://api.dicebear.com/7.x/bottts/svg?seed=" + username), 'msg-avatar', username);
            const contentContainer = document.createElement('div');
            contentContainer.className = 'msg-content-container';

            const headerInfoDiv = document.createElement('div');
            headerInfoDiv.className = 'msg-header-info';
            headerInfoDiv.innerHTML = `
                <span class="sender">${username}</span>
                ${isAdmin ? '<span class="admin-badge">👑 ADMIN</span>' : ''}
                <span class="time-stamp">${data.timestamp || ''}</span>
                <div class="msg-actions">
                    <span class="btn-action-msg" onclick="windowTargetMsgKeyForReaction='${key}'; toggleStickerPicker();">😊</span>
                    <span class="btn-action-msg" onclick="setReplyToMessage('${username}', '${(data.msg||'').replace(/'/g, "\\'")}')">↩️</span>
                </div>`;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';

            let contentHTML = data.isSticker ? `<span style="font-size:22px;">${data.sticker}</span>` : 
                              data.isMedia ? (data.mediaType === 'image' ? `<img class="chat-media-img" src="${data.mediaData}" onclick="viewFullsizeImage('${data.mediaData}', '${username}')"/>` : `<video class="chat-media-video" src="${data.mediaData}" controls></video>`) :
                              `<span>${data.msg || ''}</span>`;

            msgDiv.innerHTML = (data.replyTo ? `<div class="reply-quote-box"><b>${data.replyTo.user}:</b> ${data.replyTo.text}</div>` : '') + contentHTML;

            const reactionsContainer = document.createElement('div');
            reactionsContainer.className = 'msg-reactions-container';
            if (data.reactions) {
                Object.keys(data.reactions).forEach(emoji => {
                    const users = data.reactions[emoji] || [];
                    if (users.length > 0) {
                        const badge = document.createElement('div');
                        badge.className = 'reaction-badge';
                        badge.innerHTML = `<span>${emoji}</span> <span>${users.length}</span>`;
                        badge.onclick = () => toggleReaction(key, emoji);
                        reactionsContainer.appendChild(badge);
                    }
                });
            }

            contentContainer.append(headerInfoDiv, msgDiv, reactionsContainer);
            wrapperDiv.append(avatarElem, contentContainer);

            if (!document.getElementById(`msg-${key}`)) chatLogs.appendChild(wrapperDiv);
            chatLogs.scrollTop = chatLogs.scrollHeight;
        }

        function toggleStickerPicker() {
            const picker = document.getElementById('stickerPicker');
            picker.style.display = (picker.style.display === 'grid') ? 'none' : 'grid';
        }

        function sendSticker(stickerChar) {
            if (windowTargetMsgKeyForReaction) {
                toggleReaction(windowTargetMsgKeyForReaction, stickerChar);
                windowTargetMsgKeyForReaction = null;
            } else {
                dbChat.push({
                    user: activeUser.username, avatar: activeUser.avatar, sticker: stickerChar, isSticker: true,
                    timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                    ...(selectedReplyData && { replyTo: selectedReplyData })
                });
                cancelReply();
            }
            document.getElementById('stickerPicker').style.display = 'none';
        }

        function toggleReaction(msgKey, emoji) {
            const user = activeUser.username, reactionRef = dbChat.child(msgKey).child('reactions').child(emoji);
            reactionRef.once('value', (snapshot) => {
                let users = snapshot.val() || [];
                users = users.includes(user) ? users.filter(u => u !== user) : [...users, user];
                if (users.length === 0) reactionRef.remove(); else reactionRef.set(users);
            });
        }

        function setReplyToMessage(user, text) {
            selectedReplyData = { user: user.toUpperCase(), text };
            document.getElementById('replyPreviewText').innerHTML = `Membalas <b>${user.toUpperCase()}</b>: "${text}"`;
            document.getElementById('replyPreview').style.display = 'flex';
        }

        function cancelReply() {
            selectedReplyData = null;
            document.getElementById('replyPreview').style.display = 'none';
        }

        function viewFullsizeImage(avatarUrl, username) {
            const container = document.getElementById('fullsizeMediaContainer');
            container.innerHTML = '';
            const isVid = isVideoUrl(avatarUrl), elem = document.createElement(isVid ? 'video' : 'img');
            elem.src = avatarUrl;
            if (isVid) { elem.autoplay = elem.controls = elem.loop = true; }
            container.appendChild(elem);
            document.getElementById('fullsizeUsername').innerText = username;
            document.getElementById('imageViewerModal').style.display = 'flex';
        }

        function konversiLog() {
            const input = document.getElementById('rawInput').value.trim();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; hasilTeksUntukDisalin = ""; 

            if (!input) return;

            let parsedLogList = [], lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');
            lines.forEach(line => {
                let matchTime = line.match(/(\d{2}:\d{2}:\d{2})/);
                if (!matchTime) return;
                
                let waktu = matchTime[1], parts = line.split(/\t|\s{2,}/).filter(p => p !== '');
                if (parts.length >= 5) {
                    parsedLogList.push({ 
                        waktu, userId: parts[2] || "-", tujuanBank: parts[4] || "-", 
                        creditStatus: "0", jumlah: (parts[6] || parts[5] || "0").replace(/^-/, '') 
                    });
                }
            });

            parsedLogList.reverse();
            let barisDataDisalin = [];
            parsedLogList.forEach((item) => {
                tbody.innerHTML += `<tr><td>${item.waktu}</td><td>${item.userId}</td><td>${item.tujuanBank}</td><td>${item.creditStatus}</td><td>${item.jumlah}</td></tr>`;
                barisDataDisalin.push(`${item.waktu}\t${item.userId}\t${item.tujuanBank}\t\t${item.jumlah}`);
            });
            hasilTeksUntukDisalin = barisDataDisalin.join('\n');
        }

        function resetData() {
            document.getElementById('rawInput').value = '';
            document.getElementById('tableBody').innerHTML = '';
            hasilTeksUntukDisalin = "";
        }

        function salinHasil() {
            const txt = document.getElementById('txtCopy');
            if (!hasilTeksUntukDisalin) { 
                txt.innerText = "KOSONG!"; 
                setTimeout(() => txt.innerText = "SALIN DATA", 1000); 
                return; 
            }
            navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
                txt.innerText = "BERHASIL"; 
                setTimeout(() => txt.innerText = "SALIN DATA", 1200);
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                ['imageViewerModal', 'friendsModal', 'registerModal', 'profileModal', 'chatModal', 'authModal', 'createGroupModal'].forEach(closeModal);
            }
        });
    </script>
</body>
</html>
