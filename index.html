<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegance Kasir - Premium Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
<style>
    * {
        box-sizing: border-box;
    }

    /* Kunci warna dasar di CSS agar TIDAK PERNAH HITAM POLOS */
    html {
        background-color: #0b0d12;
    }

    body {
        margin: 0;
        padding: 60px 20px;
        width: 100%;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 20%, #151a26 0%, #0b0d12 100%);
        background-attachment: fixed;
        font-family: 'Inter', sans-serif;
        color: #e2e8f0;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* Ambient Canvas Latar Belakang */
    #ambientCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        pointer-events: none;
    }

    /* Panel Frosted Glassmorphism Premium */
    .container {
        background: rgba(18, 22, 31, 0.78); 
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08); 
        border-radius: 20px; 
        width: 100%;
        max-width: 920px;
        padding: 48px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        position: relative;
        z-index: 10;
        margin: auto;
    }

    /* Typography Elegan */
    h1 {
        font-family: 'Cinzel', serif;
        text-align: center;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 4px;
        margin: 0;
        background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .sub-title {
        text-align: center;
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        color: #d4af37; /* Champagne Gold */
        letter-spacing: 5px;
        font-weight: 600;
        text-transform: uppercase;
        margin-top: 10px;
        margin-bottom: 40px;
    }
    
    label {
        display: block;
        font-weight: 500;
        margin-bottom: 10px;
        color: #94a3b8; 
        font-size: 13px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    
    textarea {
        width: 100%;
        height: 130px;
        background: rgba(10, 13, 20, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1); 
        border-radius: 12px;
        color: #e2e8f0;
        padding: 16px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Inter', monospace;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 28px;
        transition: all 0.3s ease;
    }
    textarea:focus {
        outline: none;
        border-color: rgba(212, 175, 55, 0.5);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        background: rgba(10, 13, 20, 0.85);
    }
    
    .btn-group {
        display: flex;
        gap: 16px;
        margin-bottom: 36px;
    }
    
    button {
        font-family: 'Inter', sans-serif;
        flex: 1;
        padding: 16px; 
        font-size: 13px;    
        font-weight: 600;
        border-radius: 10px; 
        cursor: pointer;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .btn-copy { 
        background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); 
        color: #0b0d12; 
        border: none;
        box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
    }
    .btn-copy:hover { 
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
    }
    
    .btn-reset { 
        background: rgba(255, 255, 255, 0.03); 
        color: #94a3b8; 
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-reset:hover { 
        background: rgba(255, 255, 255, 0.08); 
        color: #f1f5f9;
        transform: translateY(-2px);
    }
    
    /* Tabel Minimalis & Mewah */
    .table-container { 
        overflow-x: auto; 
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(10, 13, 20, 0.4);
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
    }
    
    th, td {
        padding: 16px 20px;
        text-align: left;
        font-size: 14px;
        white-space: nowrap;
    }
    
    th { 
        font-weight: 600;
        background: rgba(255, 255, 255, 0.03); 
        color: #d4af37; 
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    td {
        font-weight: 400;
        color: #cbd5e1;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    tr:last-child td {
        border-bottom: none;
    }

    tr:hover td {
        background-color: rgba(255, 255, 255, 0.02);
        color: #ffffff;
    }
</style>
</head>
<body>

<canvas id="ambientCanvas"></canvas>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">TRANSACTION RECAP SYSTEM</div>
    
    <label for="rawInput">Tempel Log Transaksi</label>
    <textarea id="rawInput" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
    
    <div class="btn-group">
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>USER ID</th>
                    <th>TUJUAN BANK</th>
                    <th>CREDIT</th>
                    <th>JUMLAH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    /* =======================================================
       SOFT AMBIENT GLOW BACKGROUND (NO MORE BLACKOUT)
       ======================================================= */
    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');

    let orbs = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        if (orbs.length === 0) {
            initOrbs();
        }
    }

    function initOrbs() {
        orbs = [
            { x: window.innerWidth * 0.2, y: window.innerHeight * 0.3, r: 280, color: 'rgba(212, 175, 55, 0.08)', vx: 0.3, vy: 0.2 },
            { x: window.innerWidth * 0.8, y: window.innerHeight * 0.7, r: 350, color: 'rgba(99, 102, 241, 0.06)', vx: -0.2, vy: -0.3 },
            { x: window.innerWidth * 0.5, y: window.innerHeight * 0.5, r: 220, color: 'rgba(255, 255, 255, 0.03)', vx: 0.15, vy: -0.15 }
        ];
    }

    window.addEventListener('resize', resizeCanvas);

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        orbs.forEach(orb => {
            orb.x += orb.vx;
            orb.y += orb.vy;

            if (orb.x < -100 || orb.x > canvas.width + 100) orb.vx *= -1;
            if (orb.y < -100 || orb.y > canvas.height + 100) orb.vy *= -1;

            const gradient = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.r);
            gradient.addColorStop(0, orb.color);
            gradient.addColorStop(1, 'transparent');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
            ctx.fill();
        });

        requestAnimationFrame(draw);
    }

    resizeCanvas();
    draw();

    /* =======================================================
       LOGIKA KASIR
       ======================================================= */
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n'); 
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let creditStatus = "-"; 
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin!");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "BERHASIL DISALIN";
            setTimeout(() => { btnCopy.innerText = teksAwal; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data.");
        });
    }
</script>
</body>
</html>
