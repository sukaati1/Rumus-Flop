<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - GEAR 5 MATRIX MODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=700;900&family=Rajdhani:wght=600;700&display=swap" rel="stylesheet">
    
<style>
    body {
        font-family: 'Rajdhani', sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #ffffff;
        background-color: #08050e;
        position: relative;
        overflow-x: hidden;
    }
    
    /* BACKGROUND HUJAN KODE (ANTI BLOKIR BROWSER) */
    #matrixCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        pointer-events: none;
    }
    
    /* KOTAK UTAMA KASIR (Z-INDEX DIATAS CANVAS BIAR GAK KETUTUP) */
    .container {
        background: rgba(16, 12, 24, 0.93); 
        border: 2px solid #a855f7; 
        border-radius: 12px; 
        width: 100%;
        max-width: 950px;
        padding: 35px;
        box-sizing: border-box;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
        position: relative;
        z-index: 10;
    }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: #ffffff;
        font-size: 32px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 5px;
        margin: 0;
        text-shadow: 0 0 10px #a855f7;
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;
        color: #d8b4fe;
        letter-spacing: 4px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 5px;
        margin-bottom: 30px;
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 10px;
        color: #d8b4fe; 
        font-size: 14px;
        text-transform: uppercase;
    }
    
    textarea {
        width: 100%;
        height: 140px;
        background: #000000;
        border: 1px solid #a855f7; 
        border-radius: 8px;
        color: #ffffff;
        padding: 15px;
        box-sizing: border-box;
        resize: vertical;
        font-family: monospace;
        font-size: 14px;
        margin-bottom: 25px;
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 35px;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        padding: 16px; 
        font-size: 13px;   
        font-weight: 700;
        border: none;
        border-radius: 8px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: background 0.2s;
    }
    
    .btn-submit { 
        background: #ffffff; 
        color: #100c18; 
    }
    .btn-submit:hover { background: #f3e8ff; }
    
    .btn-copy { 
        background: transparent; 
        color: #ffffff; 
        border: 1px solid #a855f7;
    }
    .btn-copy:hover { background: #a855f7; }
    
    .btn-reset { 
        background: #24123a; 
        color: #ffffff; 
    }
    .btn-reset:hover { background: #311453; }
    
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 8px;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
    }
    
    th, td {
        padding: 14px 18px;
        text-align: left;
        font-size: 14px;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background-color: #24123a; 
        color: #ffffff; 
        font-weight: 700; 
        text-transform: uppercase;
        border-bottom: 2px solid #a855f7;
    }
    
    td {
        font-weight: 700;
        color: #f3e8ff;
        border-bottom: 1px solid rgba(168, 85, 247, 0.1);
    }
    
    tr:nth-child(even) {
        background-color: rgba(255, 255, 255, 0.02);
    }
</style>
</head>
<body>

<!-- CANVAS UNTUK EFEK HUJAN DIGITAL GEAR 5 -->
<canvas id="matrixCanvas"></canvas>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">KONOHA KASIR - NIKA MATRIX v10.0</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="Tempel log transaksi mentah di sini..."></textarea>
    
    <div class="btn-group">
        <button id="btnSubmit" class="btn-submit" onclick="konversiLog()">Submit</button>
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // --- SKRIP BACKGROUND MATRIX (ANTI EMULASI DARK MODE) ---
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Karakter acak khas nika/angka digital
    const katakana = '0123456789NIKAJKBOY777';
    const alphabet = katakana.split('');

    const fontSize = 16;
    const columns = canvas.width / fontSize;

    const rainDrops = [];
    for (let x = 0; x < columns; x++) {
        rainDrops[x] = 1;
    }

    function drawMatrix() {
        // Efek trail hitam transparan di latar belakang
        ctx.fillStyle = 'rgba(8, 5, 14, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < rainDrops.length; i++) {
            const text = alphabet[Math.floor(Math.random() * alphabet.length)];
            
            // Variasi warna acak ungu dan putih kilat Gear 5
            if (Math.random() > 0.85) {
                ctx.fillStyle = '#ffffff'; // Putih kilat Nika
                ctx.font = 'bold ' + fontSize + 'px monospace';
            } else {
                ctx.fillStyle = '#a855f7'; // Ungu Haki Gear 5
                ctx.font = fontSize + 'px monospace';
            }

            ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

            if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                rainDrops[i] = 0;
            }
            rainDrops[i]++;
        }
    }
    setInterval(drawMatrix, 30);


    // --- FUNGSI LOGIKA UTAMA KASIR (100% AMAN DAN STABIL) ---
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let creditStatus = "-"; 
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t\t${jumlah}`);
            }
        });

        hasilTeksUntilDisalin = barisDataDisalin.join('\n');
        hasilTeksUntukDisalin = hasilTeksUntilDisalin;
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin! Silakan submit log terlebih dahulu.");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "BERHASIL DISALIN!";
            setTimeout(() => { btnCopy.innerText = teksAwal; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data otomatis.");
        });
    }
</script>
</body>
</html>
