<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumus Flop Kasir - Premium Background</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
<style>
    * {
        box-sizing: border-box;
    }

    /* LATAR BELAKANG STABIL (PURE CSS, ANTI HITAM POLOS) */
    html {
        background-color: #0d1117;
    }

    body {
        margin: 0;
        padding: 50px 20px;
        width: 100%;
        min-height: 100vh;
        /* Gradasi warna latar belakang visual */
        background: 
            radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 45%),
            radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 45%),
            radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #0d1117 100%);
        background-attachment: fixed;
        font-family: 'Inter', sans-serif;
        color: #f1f5f9;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Container Card Efek Kaca Transparan */
    .container {
        background: rgba(22, 27, 34, 0.75); 
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1); 
        border-radius: 16px; 
        width: 100%;
        max-width: 880px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        margin: auto;
    }

    h1 {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 2px;
        margin: 0;
        background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .sub-title {
        text-align: center;
        font-size: 11px;
        color: #38bdf8;
        letter-spacing: 4px;
        font-weight: 600;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 32px;
    }
    
    label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #94a3b8; 
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    
    textarea {
        width: 100%;
        height: 130px;
        background: rgba(13, 17, 23, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.12); 
        border-radius: 8px;
        color: #e2e8f0;
        padding: 14px;
        box-sizing: border-box;
        resize: vertical;
        font-family: monospace;
        font-size: 13px;
        margin-bottom: 24px;
        transition: all 0.2s;
    }
    textarea:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }
    
    .btn-group {
        display: flex;
        gap: 14px;
        margin-bottom: 32px;
    }
    
    button {
        flex: 1;
        padding: 14px; 
        font-size: 13px;    
        font-weight: 700;
        border-radius: 8px; 
        cursor: pointer;
        letter-spacing: 1px;
        text-transform: uppercase;
        border: none;
        transition: transform 0.2s, background-color 0.2s;
    }
    
    .btn-copy { 
        background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
        color: #ffffff; 
        box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }
    .btn-copy:hover { 
        transform: translateY(-1px);
        background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
    }
    
    .btn-reset { 
        background: rgba(255, 255, 255, 0.05); 
        color: #94a3b8; 
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-reset:hover { 
        background: rgba(255, 255, 255, 0.1); 
        color: #ffffff;
        transform: translateY(-1px);
    }
    
    /* Tabel Elegant */
    .table-container { 
        overflow-x: auto; 
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(13, 17, 23, 0.5);
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
    }
    
    th, td {
        padding: 14px 18px;
        text-align: left;
        font-size: 13px;
        white-space: nowrap;
    }
    
    th { 
        font-weight: 600;
        background: rgba(255, 255, 255, 0.03); 
        color: #38bdf8; 
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    td {
        color: #cbd5e1;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    tr:last-child td {
        border-bottom: none;
    }

    tr:hover td {
        background-color: rgba(255, 255, 255, 0.02);
        color: #ffffff;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">TRANSACTION RECAP SYSTEM</div>
    
    <label for="rawInput">Tempel Log Transaksi</label>
    <textarea id="rawInput" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
    
    <div class="btn-group">
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>USER ID</th>
                    <th>TUJUAN BANK</th>
                    <th>CREDIT</th>
                    <th>JUMLAH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n'); 
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let creditStatus = "-"; 
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin!");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "BERHASIL DISALIN";
            setTimeout(() => { btnCopy.innerText = teksAwal; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data.");
        });
    }
</script>
</body>
</html>
