<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - PREMIUM EDITION</title>
<style>
    body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        /* --- WALLPAPER PREMIUM CHARCOAL (SOLID & ANTI HITAM PEKAT) --- */
        background: #0d0e12;
        color: #e2e8f0;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    
    .container {
        background: #15171e;
        border: 1px solid #ff4500; /* Neon Orange border yang tegas */
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(255, 69, 0, 0.15), 0 15px 35px rgba(0, 0, 0, 0.6);
        width: 100%;
        max-width: 950px;
        padding: 30px;
        box-sizing: border-box;
    }
    
    h1 {
        text-align: center;
        color: #ff4500;
        font-size: 26px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 5px;
        margin-bottom: 30px;
        text-shadow: 0 0 10px rgba(255, 69, 0, 0.3);
    }
    
    label {
        display: block;
        font-weight: 600;
        margin-bottom: 10px;
        color: #ff8700;
        font-size: 13.5px;
        letter-spacing: 0.5px;
    }
    
    textarea {
        width: 100%;
        height: 150px;
        background: #090a0d;
        border: 1px solid #2d3139;
        border-radius: 8px;
        color: #fff;
        padding: 15px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 13.5px;
        margin-bottom: 25px;
    }
    
    textarea:focus {
        border-color: #ff4500;
        outline: none;
        box-shadow: 0 0 10px rgba(255, 69, 0, 0.2);
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;
    }
    
    button {
        flex: 1;
        padding: 12px 14px; 
        font-size: 13px;   
        font-weight: 700;
        border: none;
        border-radius: 6px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: all 0.2s ease;
    }
    
    .btn-submit { 
        background: linear-gradient(135deg, #ff4500, #ff6600); 
        color: #fff; 
    }
    
    .btn-copy { 
        background: linear-gradient(135deg, #0052cc, #0066ff); 
        color: #fff; 
    }
    
    .btn-reset { 
        background: #22252d; 
        color: #cbd5e1; 
        border: 1px solid #3b4252; 
    }
    
    button:focus {
        outline: 3px solid #ff4500;
    }
    
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 8px; 
        border: 1px solid #2d3139; 
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: #0e1014;
    }
    
    th, td {
        border-bottom: 1px solid #2d3139;
        padding: 14px 18px;
        text-align: left;
        font-size: 13.5px;
    }
    
    th { 
        background-color: #15171e; 
        color: #ff4500; 
        font-weight: 700; 
    }
    
    tr:nth-child(even) {
        background-color: #111319;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Karya anak Djarum</h1>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="Dari kita untuk kita"></textarea>
    
    <!-- REQUEST DIKUNCI: SUBMIT -> SALIN DATA -> RESET -->
    <div class="btn-group">
        <button class="btn-submit" onclick="konversiLog()">Submit</button>
        <button class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button class="btn-reset" id="btnReset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            
            if (kolom.length < 5) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 5) {
                const pakaiNoUrut = !isNaN(kolom[0]) && kolom.length > 6;
                
                let waktu = "";
                let idxWaktu = pakaiNoUrut ? 1 : 0;
                if(kolom[idxWaktu] && kolom[idxWaktu].includes('-')) {
                    let pecahWaktu = kolom[idxWaktu].split(/\s+/);
                    waktu = pecahWaktu[1] || kolom[idxWaktu];
                } else {
                    waktu = kolom[idxWaktu] || "";
                }
                
                if (waktu.includes('-') && waktu.includes(':')) {
                    waktu = waktu.split(/\s+/)[1] || waktu;
                } else if (!waktu.includes(':') && kolom[idxWaktu+1] && kolom[idxWaktu+1].includes(':')) {
                    waktu = kolom[idxWaktu+1];
                }

                let userId = "";
                for (let i = 1; i < kolom.length; i++) {
                    if (kolom[i].includes(':')) {
                        userId = kolom[i+1] || "";
                        break;
                    }
                }
                if (!userId) userId = pakaiNoUrut ? kolom[2] : kolom[1];

                let tujuanBank = "";
                for (let i = 0; i < kolom.length; i++) {
                    if (kolom[i].includes(',') || kolom[i].toUpperCase().includes('MANDIRI') || kolom[i].toUpperCase().includes('BCA') || kolom[i].toUpperCase().includes('BRI') || kolom[i].toUpperCase().includes('BNI')) {
                        tujuanBank = kolom[i];
                        break;
                    }
                }

                let jumlah = "";
                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 4) {
                        jumlah = kolom[i];
                        break;
                    }
                }
                if (!jumlah) {
                    jumlah = kolom[kolom.length - 3] || "";
                }

                const creditStatus = ""; 

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${creditStatus}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            document.getElementById('btnReset').focus();
            return;
        }
        
        const el = document.createElement('textarea');
        el.value = hasilTeksUntukDisalin;
        el.setAttribute('readonly', '');
        el.style.position = 'absolute';
        el.style.left = '-9999px';
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);

        // FORMULA JUARA: Kunci fokus langsung mendarat tepat sasaran ke tombol Reset
        document.getElementById('btnReset').focus();
    }
</script>
</body>
</html>
