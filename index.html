<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - CYBER ANIME EDITION</title>
    <!-- Import Google Fonts biar font text & angka ala Sci-Fi Anime -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        --bg-main: #06060c;
        --panel-bg: rgba(14, 15, 26, 0.75);
        --neon-cyan: #00f3ff;
        --neon-pink: #ff007f;
        --neon-orange: #ff5500;
        --text-glow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    body {
        font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #e2e8f0;
        overflow-x: hidden;
        background-color: var(--bg-main); 
        position: relative;
    }
    
    /* BACKGROUND GRID TECH & EFFECT SCANLINE */
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 200%; height: 200%;
        z-index: -2;
        background-image: 
            linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
        background-size: 30px 30px;
        animation: matrixMove 30s linear infinite;
    }

    body::after {
        content: " ";
        display: block;
        position: fixed;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 999;
        background-size: 100% 3px, 6px 100%;
        pointer-events: none;
    }

    @keyframes matrixMove {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-30px, -30px); }
    }
    
    .container {
        background: var(--panel-bg); 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid var(--neon-cyan);
        border-radius: 16px;
        box-shadow: 0 0 35px rgba(0, 243, 255, 0.25), inset 0 0 20px rgba(0, 243, 255, 0.1);
        width: 100%;
        max-width: 950px;
        padding: 35px;
        box-sizing: border-box;
        position: relative;
    }

    /* Ornamen Sudut Mecha ala Anime UI */
    .container::before {
        content: '';
        position: absolute;
        top: -2px; right: 20px; width: 40px; height: 4px;
        background: var(--neon-pink);
        box-shadow: 0 0 10px var(--neon-pink);
    }
    .container::after {
        content: '';
        position: absolute;
        bottom: -2px; left: 20px; width: 40px; height: 4px;
        background: var(--neon-pink);
        box-shadow: 0 0 10px var(--neon-pink);
    }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: #fff;
        font-size: 28px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 6px;
        margin-bottom: 5px;
        text-shadow: 0 0 15px var(--neon-cyan), 0 0 30px rgba(0, 243, 255, 0.5);
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;
        color: var(--neon-pink);
        letter-spacing: 4px;
        font-weight: bold;
        text-transform: uppercase;
        margin-bottom: 35px;
        text-shadow: 0 0 8px var(--neon-pink);
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 10px;
        color: var(--neon-cyan);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }
    
    textarea {
        width: 100%;
        height: 150px;
        background: rgba(5, 6, 10, 0.85);
        border: 1px solid rgba(0, 243, 255, 0.3);
        border-radius: 8px;
        color: #fff;
        padding: 15px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        margin-bottom: 25px;
        transition: all 0.3s ease;
    }
    
    textarea:focus {
        border-color: var(--neon-pink);
        outline: none;
        box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        padding: 15px; 
        font-size: 13px;   
        font-weight: 700;
        border: none;
        border-radius: 8px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        transition: background 0.2s ease, box-shadow 0.2s ease;
        position: relative;
        overflow: hidden;
    }
    
    /* EFEK POLOS: Di-hover tetap diam */
    .btn-submit { 
        background: linear-gradient(135deg, #00f3ff, #0088cc); 
        color: #000; 
        font-weight: 900;
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }
    .btn-submit:hover { 
        box-shadow: 0 0 25px var(--neon-cyan);
    }
    
    .btn-copy { 
        background: transparent; 
        color: #fff; 
        border: 2px solid var(--neon-pink);
        box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
    }
    .btn-copy:hover { 
        background: var(--neon-pink);
        box-shadow: 0 0 25px var(--neon-pink);
    }
    
    .btn-reset { 
        background: #181926; 
        color: #cbd5e1; 
        border: 1px solid rgba(255, 255, 255, 0.1); 
    }
    .btn-reset:hover { 
        background: #23253a; 
        color: #fff;
    }

    /* BARU: TANDA OUTLINE NEON SAAT DI-TAB (FOKUS) */
    button:focus-visible {
        outline: 3px solid var(--neon-pink);
        outline-offset: 4px;
        box-shadow: 0 0 20px var(--neon-pink);
        animation: pulseGlow 1.5s infinite alternate;
    }

    @keyframes pulseGlow {
        0% { box-shadow: 0 0 10px var(--neon-pink); }
        100% { box-shadow: 0 0 25px var(--neon-pink), 0 0 10px var(--neon-cyan); }
    }
    
    button:focus {
        outline: none; /* bypass outline default browser */
    }
    
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 8px; 
        border: 1px solid rgba(0, 243, 255, 0.2); 
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(10, 11, 18, 0.9);
    }
    
    th, td {
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        padding: 15px 18px;
        text-align: left;
        font-size: 14px;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background-color: rgba(20, 22, 37, 0.95); 
        color: var(--neon-cyan); 
        font-weight: 700; 
        letter-spacing: 1px;
        border-bottom: 2px solid var(--neon-cyan);
    }
    
    td {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    /* Angka nominal kontras */
    td:nth-child(5) {
        font-family: 'Orbitron', sans-serif;
        color: #fff;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
    }
    
    tr:nth-child(even) {
        background-color: rgba(16, 18, 30, 0.5);
    }

    tr:hover {
        background-color: rgba(0, 243, 255, 0.05);
    }
</style>
</head>
<body>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">Cyber Anime Edition</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="Dari kita untuk kita // Ready for data scan..."></textarea>
    
    <div class="btn-group">
        <button id="btnSubmit" class="btn-submit" onclick="konversiLog()">Submit</button>
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            
            if (kolom.length < 5) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 5) {
                const pakaiNoUrut = !isNaN(kolom[0]) && kolom.length > 6;
                
                let waktu = "";
                let idxWaktu = pakaiNoUrut ? 1 : 0;
                if(kolom[idxWaktu] && kolom[idxWaktu].includes('-')) {
                    let pecahWaktu = kolom[idxWaktu].split(/\s+/);
                    waktu = pecahWaktu[1] || kolom[idxWaktu];
                } else {
                    waktu = kolom[idxWaktu] || "";
                }
                
                if (waktu.includes('-') && waktu.includes(':')) {
                    waktu = waktu.split(/\s+/)[1] || waktu;
                } else if (!waktu.includes(':') && kolom[idxWaktu+1] && kolom[idxWaktu+1].includes(':')) {
                    waktu = kolom[idxWaktu+1];
                }

                let userId = "";
                for (let i = 1; i < kolom.length; i++) {
                    if (kolom[i].includes(':')) {
                        userId = kolom[i+1] || "";
                        break;
                    }
                }
                if (!userId) userId = pakaiNoUrut ? kolom[2] : kolom[1];

                let tujuanBank = "";
                for (let i = 0; i < kolom.length; i++) {
                    if (kolom[i].includes(',') || kolom[i].toUpperCase().includes('MANDIRI') || kolom[i].toUpperCase().includes('BCA') || kolom[i].toUpperCase().includes('BRI') || kolom[i].toUpperCase().includes('BNI')) {
                        tujuanBank = kolom[i];
                        break;
                    }
                }

                let jumlah = "";
                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 4) {
                        jumlah = kolom[i];
                        break;
                    }
                }
                if (!jumlah) {
                    jumlah = kolom[kolom.length - 3] || "";
                }

                const creditStatus = ""; 

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${creditStatus}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            return;
        }
        
        const el = document.createElement('textarea');
        el.value = hasilTeksUntukDisalin;
        el.setAttribute('readonly', '');
        el.style.position = 'absolute';
        el.style.left = '-9999px';
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);

        // Tetap di input utama
        document.getElementById('rawInput').focus();
    }
</script>
</body>
</html>
