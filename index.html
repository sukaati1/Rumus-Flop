<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>Rumus Flop Kasir - Ultra Luxury Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only dark !important;
        --gold-primary: #f59e0b;
        --gold-light: #fef08a;
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #05070a;
        overflow-x: hidden;
    }

    body {
        padding: 40px 20px;
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        color: #f8fafc !important;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* VIDEO BACKGROUND FULLSCREEN */
    .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
        pointer-events: none;
    }

    /* CONTAINER UTAMA */
    .container {
        position: relative;
        z-index: 2;
        background: rgba(8, 12, 20, 0.45) !important;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1.5px solid rgba(245, 158, 11, 0.4) !important; 
        border-radius: 24px; 
        width: 100%;
        max-width: 950px;
        padding: 48px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(245, 158, 11, 0.15);
        margin: auto;
    }

    /* ANIMASI KILATAN TEKS EMAS */
    @keyframes goldShimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
    }

    h1 {
        text-align: center;
        font-family: 'Cinzel', serif;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: 3px;
        margin: 0;
        background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #78350f 100%);
        background-size: 200% auto;
        color: transparent !important;
        -webkit-background-clip: text !important;
        background-clip: text !important;
        animation: goldShimmer 5s linear infinite;
    }

    .sub-title {
        text-align: center;
        font-size: 11px;
        color: #fbbf24 !important;
        letter-spacing: 6px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 36px;
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 10px;
        color: var(--gold-light) !important; 
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    
    /* TEXTAREA */
    textarea {
        width: 100%;
        height: 130px;
        background: rgba(3, 7, 18, 0.35) !important;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(245, 158, 11, 0.3) !important; 
        border-radius: 12px;
        color: #38bdf8 !important;
        padding: 16px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        margin-bottom: 28px;
        user-select: text;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    textarea:focus {
        outline: none;
        border-color: #fef08a !important;
        background: rgba(3, 7, 18, 0.5) !important;
        box-shadow: 0 0 20px rgba(245, 158, 11, 0.35), inset 0 2px 10px rgba(0, 0, 0, 0.5) !important;
    }

    textarea::placeholder {
        color: rgba(248, 250, 252, 0.4);
    }

    .btn-group {
        display: flex;
        gap: 16px;
        margin-bottom: 36px;
    }

    /* ANIMASI LIQUID / GELOMBANG AIR */
    @keyframes liquidRipple {
        0% {
            transform: scale(0);
            opacity: 0.8;
        }
        100% {
            transform: scale(3.5);
            opacity: 0;
        }
    }
    
    /* BASE BUTTON STYLING */
    button {
        position: relative;
        flex: 1;
        padding: 18px; 
        font-size: 13px;    
        font-weight: 800;
        border-radius: 12px; 
        cursor: pointer;
        letter-spacing: 2px;
        text-transform: uppercase;
        border: none;
        overflow: hidden; /* Menjaga efek air tidak meluber keluar dari tombol */
        outline: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    /* EFEK NAIK HALUS & SHADOW SAAT TAB / HOVER */
    button:hover, button:focus {
        transform: translateY(-3px);
    }

    /* BENTUK TUMPASAN AIR (LIQUID LAYER) */
    button::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(0);
        pointer-events: none;
        opacity: 0;
    }

    /* TRIGGERS ANIMASI AIR SAAT SENTUH (HOVER) ATAU GESER TAB (FOCUS) */
    button:hover::before, button:focus::before {
        animation: liquidRipple 1s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
    }

    /* STYLING SPESIFIK TOMBOL COPY (AIR EMAS) */
    .btn-copy { 
        background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #b45309 100%) !important; 
        color: #000000 !important; 
        box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }

    .btn-copy::before {
        background: rgba(255, 255, 255, 0.6); /* Riak air putih emas */
    }

    .btn-copy:hover, .btn-copy:focus {
        box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6) !important;
    }

    /* STYLING SPESIFIK TOMBOL RESET (AIR MERAH/KRISTAL) */
    .btn-reset { 
        background-color: rgba(255, 255, 255, 0.05) !important; 
        color: #cbd5e1 !important; 
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        backdrop-filter: blur(6px);
    }

    .btn-reset::before {
        background: rgba(244, 63, 94, 0.4); /* Riak air neon merah */
    }

    .btn-reset:hover, .btn-reset:focus {
        background-color: rgba(225, 29, 72, 0.25) !important;
        color: #fecdd3 !important;
        border-color: #f43f5e !important;
        box-shadow: 0 0 20px rgba(244, 63, 94, 0.4) !important;
    }

    .vibrate-text {
        position: relative;
        z-index: 2; /* Agar teks berada di atas lapisan air */
        display: inline-block !important;
        will-change: transform;
    }

    /* KOTAK TABEL */
    .table-container { 
        overflow-x: auto; 
        border-radius: 14px;
        border: 1px solid rgba(245, 158, 11, 0.35) !important;
        background: rgba(5, 8, 15, 0.35) !important;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6), 0 8px 25px rgba(0, 0, 0, 0.4);
    }
    
    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
    }
    
    th, td {
        padding: 16px 20px;
        text-align: left;
        white-space: nowrap;
        user-select: text;
    }
    
    th { 
        font-weight: 700;
        background: rgba(15, 23, 42, 0.65) !important; 
        color: #fef08a !important; 
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        border-bottom: 2px solid rgba(245, 158, 11, 0.5) !important;
        text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }
    
    td {
        color: #f1f5f9 !important;
        border-bottom: 1px solid rgba(245, 158, 11, 0.12) !important;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        transition: background-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    tr {
        transition: transform 0.2s ease;
    }

    tr:hover td {
        background-color: rgba(245, 158, 11, 0.18) !important;
        color: #ffffff !important;
        box-shadow: inset 0 0 12px rgba(245, 158, 11, 0.2);
    }

    tr:last-child td {
        border-bottom: none !important;
    }
</style>
</head>
<body>

<!-- VIDEO BACKGROUND MP4 -->
<video class="bg-video" autoplay loop muted playsinline disablepictureinpicture>
    <source src="./gb.mp4" type="video/mp4">
</video>

<div class="container">
    <h1>Rumus Flop Kasir</h1>
    <div class="sub-title">Ultra Luxury Edition</div>

    <label for="rawInput">Tempel Log Transaksi</label>
    <textarea id="rawInput" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
    
    <div class="btn-group">
        <button id="btnCopy" class="btn-copy" 
                tabindex="0"
                onmouseenter="mulaiGetar('txtCopy')" 
                onmouseleave="stopGetar('txtCopy')" 
                onfocus="mulaiGetar('txtCopy')" 
                onblur="stopGetar('txtCopy')"
                onclick="salinHasil()">
            <span class="vibrate-text" id="txtCopy">SALIN DATA</span>
        </button>
        <button id="btnReset" class="btn-reset" 
                tabindex="0"
                onmouseenter="mulaiGetar('txtReset')" 
                onmouseleave="stopGetar('txtReset')" 
                onfocus="mulaiGetar('txtReset')" 
                onblur="stopGetar('txtReset')"
                onclick="resetData()">
            <span class="vibrate-text" id="txtReset">RESET</span>
        </button>
    </div>

    <label>Hasil Konversi</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>USER ID</th>
                    <th>TUJUAN BANK</th>
                    <th>CREDIT</th>
                    <th>JUMLAH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";
    let timerGetar = {};

    /* EFEK GETAR TEKS TOMBOL */
    function mulaiGetar(elementId) {
        const el = document.getElementById(elementId);
        if (!el) return;

        if (timerGetar[elementId]) clearInterval(timerGetar[elementId]);
        const warnaGlitch = ['#ff0055', '#00ffff', '#ffff00', '#ffffff', '#f59e0b'];

        timerGetar[elementId] = setInterval(() => {
            const randomX = (Math.random() * 8 - 4).toFixed(1);
            const randomY = (Math.random() * 4 - 2).toFixed(1);
            const color = warnaGlitch[Math.floor(Math.random() * warnaGlitch.length)];

            el.style.transform = `translate(${randomX}px, ${randomY}px)`;
            el.style.color = color;
        }, 50);
    }

    function stopGetar(elementId) {
        if (timerGetar[elementId]) {
            clearInterval(timerGetar[elementId]);
            delete timerGetar[elementId];
        }
        const el = document.getElementById(elementId);
        if (el) {
            el.style.transform = 'translate(0, 0)';
            el.style.color = '';
        }
    }

    /* FUNGSI KONVERSI LOG LENGKAP */
    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let parsedLogList = [];
        let lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');

        if (lines.length === 1 && !lines[0].includes('\t')) {
            let rawChunk = lines[0].replace(/(ACCEPT|REJECT|PENDING|SUCCESS|FAILED)[a-zA-Z0-9]*/gi, "$&\n");
            lines = rawChunk.split('\n').map(l => l.trim()).filter(l => l !== '');
        }

        lines.forEach(line => {
            let matchTime = line.match(/(\d{2}:\d{2}:\d{2})/);
            if (!matchTime) return;
            let waktu = matchTime[1];

            let parts = line.split(/\t|\s{2,}/).map(p => p.trim()).filter(p => p !== '');
            
            if (parts.length >= 5) {
                let userId = parts[2] || "-";
                let bankInfo = parts[4] || "-";
                let jumlah = parts[6] || parts[5] || "0";
                
                jumlah = jumlah.replace(/^-/, '').trim();

                parsedLogList.push({
                    waktu: waktu,
                    userId: userId,
                    tujuanBank: bankInfo,
                    creditStatus: "0",
                    jumlah: jumlah
                });
            } else {
                let timeIndex = line.indexOf(waktu);
                let textAfterTime = line.substring(timeIndex + waktu.length);
                let matchType = textAfterTime.match(/(Withdraw|Deposit)/i);

                if (matchType) {
                    let typeIndex = textAfterTime.search(/(Withdraw|Deposit)/i);
                    let userId = textAfterTime.substring(0, typeIndex).trim();
                    let textAfterType = textAfterTime.substring(typeIndex + matchType[0].length);

                    let matchAmount = textAfterType.match(/-?([0-9.,]+)(?:\s|\t|ACCEPT|REJECT|PENDING|SUCCESS|FAILED|$)/i);
                    let jumlah = "0";
                    let bankSection = textAfterType;

                    if (matchAmount) {
                        jumlah = matchAmount[1].replace(/^-/, '');
                        let amountIndex = textAfterType.indexOf(matchAmount[0]);
                        bankSection = textAfterType.substring(0, amountIndex).trim();
                    }

                    bankSection = bankSection.replace(/-\s*$/, '').trim();

                    parsedLogList.push({
                        waktu: waktu,
                        userId: userId,
                        tujuanBank: bankSection,
                        creditStatus: "0",
                        jumlah: jumlah
                    });
                }
            }
        });

        parsedLogList.reverse();

        let barisDataDisalin = [];

        parsedLogList.forEach((item) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${item.waktu}</td><td>${item.userId}</td><td>${item.tujuanBank}</td><td>${item.creditStatus}</td><td>${item.jumlah}</td>`;
            tbody.appendChild(tr);

            barisDataDisalin.push(`${item.waktu}\t${item.userId}\t${item.tujuanBank}\t\t${item.jumlah}`);
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    /* FUNGSI RESET */
    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    /* FUNGSI SALIN TEKS KE CLIPBOARD */
    function salinHasil() {
        const txt = document.getElementById('txtCopy');
        
        if (!hasilTeksUntukDisalin) {
            txt.innerText = "DATA KOSONG!";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1000);
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            txt.innerText = "BERHASIL DISALIN";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
        });
    }
</script>
</body>
</html>
