<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - GEAR 5 NIKA MODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=400;700;900&family=Rajdhani:wght=500;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        --panel-bg: rgba(16, 12, 24, 0.88); /* Background panel gelap keunguan */
        --nika-white: #ffffff;             
        --gear5-purple: #a855f7;           
        --shimmer-nika: linear-gradient(135deg, #ffffff 0%, #a855f7 50%, #ffffff 100%);
        --text-white: #ffffff;
    }

    body {
        font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: var(--text-white);
        background-color: #08050e; /* Dasar malam gelap Wano */
        position: relative;
        overflow-x: hidden;
    }

    /* PURE CSS LIVE WALLPAPER: Efek Aura & Petir Gear 5 Bergerak Murni Tanpa Gambar/Video */
    .pure-css-auras {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
    }

    /* Aura Putih Nika Bergerak di Kiri Atas */
    .aura-cloud-1 {
        position: absolute;
        top: -10%; left: -10%;
        width: 60vw; height: 60vw;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, transparent 70%);
        border-radius: 50%;
        animation: floatAura 8s ease-in-out infinite alternate;
    }

    /* Aura Petir Ungu Bergerak di Kanan Bawah */
    .aura-cloud-2 {
        position: absolute;
        bottom: -10%; right: -10%;
        width: 70vw; height: 70vw;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        animation: floatAura 11s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatAura {
        0% { transform: translate(0, 0) scale(1); opacity: 0.6; }
        100% { transform: translate(5%, 5%) scale(1.2); opacity: 1; }
    }
    
    /* PANEL UTAMA - SUN GOD GLASSMORPHISM */
    .container {
        background: var(--panel-bg); 
        border: 2px solid rgba(168, 85, 247, 0.45); /* Bingkai petir ungu dipertegas */
        border-radius: 16px; 
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-sizing: border-box;
        backdrop-filter: blur(15px); 
        -webkit-backdrop-filter: blur(15px);
        box-shadow: 
            0 25px 60px rgba(0, 0, 0, 0.9), 
            0 0 35px rgba(168, 85, 247, 0.3);
        position: relative;
        z-index: 10; 
    }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: var(--nika-white);
        font-size: 36px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 8px;
        margin: 0;
        text-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 0 15px var(--gear5-purple);
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 13px;
        background: var(--shimmer-nika);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 5px;
        font-weight: 900;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 35px;
        animation: shine 3s linear infinite;
    }
    
    @keyframes shine {
        to { background-position: 200% center; }
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 12px;
        color: #e9d5ff; 
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    
    /* INPUT AREA */
    textarea {
        width: 100%;
        height: 140px;
        background: rgba(10, 7, 15, 0.95);
        border: 1px solid rgba(168, 85, 247, 0.35); 
        border-radius: 10px;
        color: #ffffff;
        padding: 18px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 30px;
        box-shadow: inset 0 2px 8px rgba(0,0,0,0.9);
        transition: all 0.3s ease;
    }
    
    textarea:focus {
        outline: none;
        border-color: var(--gear5-purple);
        box-shadow: inset 0 2px 8px rgba(0,0,0,1), 0 0 15px rgba(168, 85, 247, 0.5);
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 40px;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        padding: 18px; 
        font-size: 13px;   
        font-weight: 900;
        border: none;
        border-radius: 10px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2.5px;
        transition: all 0.2s ease;
    }
    
    .btn-submit { 
        background: #ffffff; 
        color: #0c0813; 
        box-shadow: 0 4px 20px rgba(255, 255, 255, 0.4);
    }
    .btn-submit:hover {
        background: #f3e8ff;
        transform: translateY(-2px);
    }
    
    .btn-copy { 
        background: rgba(255, 255, 255, 0.02); 
        color: #ffffff; 
        border: 2px solid var(--gear5-purple);
        box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
    }
    .btn-copy:hover { 
        background: var(--gear5-purple);
        color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 0 20px var(--gear5-purple);
    }
    
    .btn-reset { 
        background: #24123a; 
        color: var(--text-white); 
        border: 1px solid rgba(168, 85, 247, 0.2);
    }
    .btn-reset:hover { 
        background: #311453;
        transform: translateY(-2px);
    }
    
    /* TABEL DATA */
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 12px;
        border: none; 
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background: transparent; 
    }
    
    th, td {
        border: none; 
        padding: 16px 20px;
        text-align: left;
        font-size: 14px;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background-color: rgba(36, 18, 58, 0.95); 
        color: #ffffff; 
        font-weight: 900; 
        letter-spacing: 2px;
        text-transform: uppercase;
        border-bottom: 2px solid var(--gear5-purple);
        text-shadow: 0 0 5px var(--gear5-purple);
    }
    
    td {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        color: #f3e8ff;
    }

    /* Kolom Credit sekarang sengaja dibikin buram samar-samar/kosong */
    td:nth-child(4) {
        color: rgba(255, 255, 255, 0.2); 
        font-weight: 500;
    }

    td:nth-child(5) {
        font-family: 'Orbitron', sans-serif;
        color: #ffffff; 
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        font-weight: 900;
    }
    
    tr:nth-child(even) {
        background-color: rgba(255, 255, 255, 0.02);
    }

    tr:hover {
        background-color: rgba(168, 85, 247, 0.12);
    }
</style>
</head>
<body>

<!-- BACKGOUND ANIMASI CSS MURNI (ANTI BLOKIR BROWSER) -->
<div class="pure-css-auras">
    <div class="aura-cloud-1"></div>
    <div class="aura-cloud-2"></div>
</div>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">JOY BOY MODE - KONOHA KASIR v6.0</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="DRUMS OF LIBERATION DETECTED... READY TO TRANSLATE LOGS..."></textarea>
    
    <div class="btn-group">
        <button id="btnSubmit" class="btn-submit" onclick="konversiLog()">Submit</button>
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Credit</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let creditStatus = ""; // DIKOSONGKAN TOTAL SESUAI REKUES
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                // Kolom ke-4 (Credit) dipaksa nampilin kosong/strip
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>-</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                // Di teks kopiannya juga dikosongkan biar rapi pas lu paste ke Excel/catatan
                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin! Silakan submit log terlebih dahulu.");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "GOMU GOMU COPY SUKSES!";
            btnCopy.style.background = "var(--gear5-purple)";
            btnCopy.style.color = "#ffffff";
            
            setTimeout(() => {
                btnCopy.innerText = teksAwal;
                btnCopy.style.background = "rgba(255, 255, 255, 0.02)";
                btnCopy.style.color = "#ffffff";
            }, 1500);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data, pastikan izin clipboard aktif.");
        });
    }
</script>
</body>
</html>
