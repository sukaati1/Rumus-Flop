<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>Rumus Flop Kasir - Ultra Luxury Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only dark !important;
        --gold-primary: #f59e0b;
        --gold-light: #fef08a;
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #05070a;
        overflow-x: hidden;
    }

    body {
        padding: 40px 20px;
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        color: #f8fafc !important;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* VIDEO BACKGROUND FULLSCREEN */
    .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
        pointer-events: none;
    }

    /* CONTAINER UTAMA */
    .container {
        position: relative;
        z-index: 2;
        background: rgba(8, 12, 20, 0.45) !important;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1.5px solid rgba(245, 158, 11, 0.4) !important; 
        border-radius: 24px; 
        width: 100%;
        max-width: 950px;
        padding: 48px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(245, 158, 11, 0.15);
        margin: auto;
    }

    /* ANIMASI KILATAN TEKS EMAS */
    @keyframes goldShimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
    }

    h1 {
        text-align: center;
        font-family: 'Cinzel', serif;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: 3px;
        margin: 0;
        background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #78350f 100%);
        background-size: 200% auto;
        color: transparent !important;
        -webkit-background-clip: text !important;
        background-clip: text !important;
        animation: goldShimmer 5s linear infinite;
    }

    .sub-title {
        text-align: center;
        font-size: 11px;
        color: #fbbf24 !important;
        letter-spacing: 6px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 36px;
    }

    .label-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    
    label {
        display: block;
        font-weight: 700;
        color: var(--gold-light) !important; 
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    /* BADGE COUNTER HASIL LOG */
    .badge-count {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 20px;
        background: rgba(245, 158, 11, 0.15);
        color: #fef08a;
        border: 1px solid rgba(245, 158, 11, 0.3);
        font-family: 'JetBrains Mono', monospace;
    }
    
    /* TEXTAREA */
    textarea {
        width: 100%;
        height: 130px;
        background: rgba(3, 7, 18, 0.35) !important;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(245, 158, 11, 0.3) !important; 
        border-radius: 12px;
        color: #38bdf8 !important;
        padding: 16px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        margin-bottom: 28px;
        user-select: text;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    textarea:focus {
        outline: none;
        border-color: #fef08a !important;
        background: rgba(3, 7, 18, 0.5) !important;
        box-shadow: 0 0 20px rgba(245, 158, 11, 0.35), inset 0 2px 10px rgba(0, 0, 0, 0.5) !important;
    }

    textarea::placeholder {
        color: rgba(248, 250, 252, 0.4);
    }

    .btn-group {
        display: flex;
        gap: 16px;
        margin-bottom: 36px;
    }

    /* ANIMASI GELOMBANG AIR DINAMIS */
    @keyframes liquidRipple {
        0% {
            width: 0px;
            height: 0px;
            opacity: 0.7;
        }
        100% {
            width: 500px;
            height: 500px;
            opacity: 0;
        }
    }
    
    /* BASE BUTTON STYLING */
    button {
        position: relative;
        flex: 1;
        padding: 18px; 
        font-size: 13px;    
        font-weight: 800;
        border-radius: 12px; 
        cursor: pointer;
        letter-spacing: 2px;
        text-transform: uppercase;
        border: none;
        overflow: hidden;
        outline: none;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover, button:focus {
        transform: translateY(-3px);
    }

    button:active {
        transform: translateY(1px) scale(0.98);
    }

    /* RIPPLE ELEMENT BERGAYA LIQUID */
    .ripple {
        position: absolute;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        animation: liquidRipple 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    /* STYLING SPESIFIK TOMBOL COPY */
    .btn-copy { 
        background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #b45309 100%) !important; 
        color: #000000 !important; 
        box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }

    .btn-copy .ripple {
        background: rgba(255, 255, 255, 0.65);
    }

    .btn-copy:hover, .btn-copy:focus {
        box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6) !important;
    }

    /* STYLING SPESIFIK TOMBOL RESET */
    .btn-reset { 
        background-color: rgba(255, 255, 255, 0.05) !important; 
        color: #cbd5e1 !important; 
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        backdrop-filter: blur(6px);
    }

    .btn-reset .ripple {
        background: rgba(244, 63, 94, 0.5);
    }

    .btn-reset:hover, .btn-reset:focus {
        background-color: rgba(225, 29, 72, 0.25) !important;
        color: #fecdd3 !important;
        border-color: #f43f5e !important;
        box-shadow: 0 0 20px rgba(244, 63, 94, 0.4) !important;
    }

    .vibrate-text {
        position: relative;
        z-index: 2;
        display: inline-block !important;
        will-change: transform;
    }

    /* KOTAK TABEL DENGAN LAPISAN AIR (RAIN GLASS CONTAINER) */
    .table-container { 
        position: relative;
        overflow-x: auto; 
        max-height: 400px;
        border-radius: 14px;
        border: 1px solid rgba(245, 158, 11, 0.35) !important;
        background: rgba(5, 8, 15, 0.35) !important;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6), 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    /* CANVAS AIR DI ATAS TABEL */
    #rainCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* Agar klik/seleksi teks tabel tetap bisa dilakukan */
        z-index: 2;
    }
    
    table {
        position: relative;
        z-index: 1; /* Di bawah canvas air namun di atas background */
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
    }
    
    th, td {
        padding: 16px 20px;
        text-align: left;
        white-space: nowrap;
        user-select: text;
    }
    
    th { 
        position: sticky;
        top: 0;
        z-index: 3;
        font-weight: 700;
        background: rgba(15, 23, 42, 0.95) !important; 
        color: #fef08a !important; 
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        border-bottom: 2px solid rgba(245, 158, 11, 0.5) !important;
        text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }
    
    td {
        color: #f1f5f9 !important;
        border-bottom: 1px solid rgba(245, 158, 11, 0.12) !important;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        transition: background-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    tr {
        transition: transform 0.2s ease;
    }

    tr:hover td {
        background-color: rgba(245, 158, 11, 0.18) !important;
        color: #ffffff !important;
        box-shadow: inset 0 0 12px rgba(245, 158, 11, 0.2);
    }

    tr:last-child td {
        border-bottom: none !important;
    }
</style>
</head>
<body>

<!-- VIDEO BACKGROUND MP4 -->
<video class="bg-video" autoplay loop muted playsinline disablepictureinpicture>
    <source src="./gb.mp4" type="video/mp4">
</video>

<div class="container">
    <h1>Rumus Flop Kasir</h1>
    <div class="sub-title">Ultra Luxury Edition</div>

    <div class="label-header">
        <label for="rawInput">Tempel Log Transaksi</label>
    </div>
    <textarea id="rawInput" tabindex="1" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
    
    <div class="btn-group">
        <button id="btnCopy" class="btn-copy" 
                tabindex="2"
                onmouseenter="mulaiGetar('txtCopy'); buatEfekAir(event, this)" 
                onmouseleave="stopGetar('txtCopy')" 
                onfocus="mulaiGetar('txtCopy'); buatEfekAirPusat(this)" 
                onblur="stopGetar('txtCopy')"
                onclick="salinHasil()">
            <span class="vibrate-text" id="txtCopy">SALIN DATA</span>
        </button>
        <button id="btnReset" class="btn-reset" 
                tabindex="3"
                onmouseenter="mulaiGetar('txtReset'); buatEfekAir(event, this)" 
                onmouseleave="stopGetar('txtReset')" 
                onfocus="mulaiGetar('txtReset'); buatEfekAirPusat(this)" 
                onblur="stopGetar('txtReset')"
                onclick="resetData()">
            <span class="vibrate-text" id="txtReset">RESET</span>
        </button>
    </div>

    <div class="label-header">
        <label>Hasil Konversi</label>
        <span class="badge-count" id="dataCounter">0 DATA</span>
    </div>
    
    <div class="table-container" id="tableBox">
        <!-- CANVAS ANIMASI TETESAN AIR HUJAN DI KACA -->
        <canvas id="rainCanvas"></canvas>

        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>USER ID</th>
                    <th>TUJUAN BANK</th>
                    <th>CREDIT</th>
                    <th>JUMLAH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";
    let timerGetar = {};

    /* EFEK EFEK TETESAN AIR PADA KACA TABEL (CANVAS EFEK) */
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tableBox');

    function aturUkuranCanvas() {
        canvas.width = container.scrollWidth;
        canvas.height = container.scrollHeight;
    }
    aturUkuranCanvas();
    window.addEventListener('resize', aturUkuranCanvas);

    class TetesAir {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * -canvas.height;
            this.len = Math.random() * 12 + 6;
            this.speed = Math.random() * 2 + 1;
            this.radius = Math.random() * 1.8 + 0.8;
            this.opacity = Math.random() * 0.4 + 0.2;
        }

        update() {
            this.y += this.speed;
            if (this.y > canvas.height) {
                this.reset();
            }
        }

        draw() {
            // Badan tetesan air (jejak halus)
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x, this.y - this.len);
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity * 0.4})`;
            ctx.lineWidth = this.radius * 0.8;
            ctx.stroke();

            // Kepala tetesan air berbentuk bulatan jernih
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
            ctx.shadowBlur = 4;
            ctx.shadowColor = "rgba(245, 158, 11, 0.5)"; // Pendar kilau emas transparan
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow
        }
    }

    const daftarTetesAir = Array.from({ length: 40 }, () => new TetesAir());

    function animasiAir() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        daftarTetesAir.forEach(tetes => {
            tetes.update();
            tetes.draw();
        });

        requestAnimationFrame(animasiAir);
    }
    animasiAir();

    /* EFEK GELOMBANG AIR MENGIKUTI POSISI MOUSE */
    function buatEfekAir(event, btn) {
        let rect = btn.getBoundingClientRect();
        let x = event.clientX - rect.left;
        let y = event.clientY - rect.top;

        let ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;

        btn.appendChild(ripple);

        setTimeout(() => {
            ripple.remove();
        }, 800);
    }

    /* EFEK GELOMBANG AIR DARI PUSAT (UNTUK NAVIGASI TAB KEYBOARD) */
    function buatEfekAirPusat(btn) {
        let ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.left = `50%`;
        ripple.style.top = `50%`;

        btn.appendChild(ripple);

        setTimeout(() => {
            ripple.remove();
        }, 800);
    }

    /* EFEK GETAR TEKS TOMBOL */
    function mulaiGetar(elementId) {
        const el = document.getElementById(elementId);
        if (!el) return;

        if (timerGetar[elementId]) clearInterval(timerGetar[elementId]);
        const warnaGlitch = ['#ff0055', '#00ffff', '#ffff00', '#ffffff', '#f59e0b'];

        timerGetar[elementId] = setInterval(() => {
            const randomX = (Math.random() * 8 - 4).toFixed(1);
            const randomY = (Math.random() * 4 - 2).toFixed(1);
            const color = warnaGlitch[Math.floor(Math.random() * warnaGlitch.length)];

            el.style.transform = `translate(${randomX}px, ${randomY}px)`;
            el.style.color = color;
        }, 50);
    }

    function stopGetar(elementId) {
        if (timerGetar[elementId]) {
            clearInterval(timerGetar[elementId]);
            delete timerGetar[elementId];
        }
        const el = document.getElementById(elementId);
        if (el) {
            el.style.transform = 'translate(0, 0)';
            el.style.color = '';
        }
    }

    /* FUNGSI KONVERSI LOG LENGKAP */
    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        const counter = document.getElementById('dataCounter');
        
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) {
            counter.innerText = "0 DATA";
            aturUkuranCanvas();
            return;
        }

        let parsedLogList = [];
        let lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');

        if (lines.length === 1 && !lines[0].includes('\t')) {
            let rawChunk = lines[0].replace(/(ACCEPT|REJECT|PENDING|SUCCESS|FAILED)[a-zA-Z0-9]*/gi, "$&\n");
            lines = rawChunk.split('\n').map(l => l.trim()).filter(l => l !== '');
        }

        lines.forEach(line => {
            let matchTime = line.match(/(\d{2}:\d{2}:\d{2})/);
            if (!matchTime) return;
            let waktu = matchTime[1];

            let parts = line.split(/\t|\s{2,}/).map(p => p.trim()).filter(p => p !== '');
            
            if (parts.length >= 5) {
                let userId = parts[2] || "-";
                let bankInfo = parts[4] || "-";
                let jumlah = parts[6] || parts[5] || "0";
                
                jumlah = jumlah.replace(/^-/, '').trim();

                parsedLogList.push({
                    waktu: waktu,
                    userId: userId,
                    tujuanBank: bankInfo,
                    creditStatus: "0",
                    jumlah: jumlah
                });
            } else {
                let timeIndex = line.indexOf(waktu);
                let textAfterTime = line.substring(timeIndex + waktu.length);
                let matchType = textAfterTime.match(/(Withdraw|Deposit)/i);

                if (matchType) {
                    let typeIndex = textAfterTime.search(/(Withdraw|Deposit)/i);
                    let userId = textAfterTime.substring(0, typeIndex).trim();
                    let textAfterType = textAfterTime.substring(typeIndex + matchType[0].length);

                    let matchAmount = textAfterType.match(/-?([0-9.,]+)(?:\s|\t|ACCEPT|REJECT|PENDING|SUCCESS|FAILED|$)/i);
                    let jumlah = "0";
                    let bankSection = textAfterType;

                    if (matchAmount) {
                        jumlah = matchAmount[1].replace(/^-/, '');
                        let amountIndex = textAfterType.indexOf(matchAmount[0]);
                        bankSection = textAfterType.substring(0, amountIndex).trim();
                    }

                    bankSection = bankSection.replace(/-\s*$/, '').trim();

                    parsedLogList.push({
                        waktu: waktu,
                        userId: userId,
                        tujuanBank: bankSection,
                        creditStatus: "0",
                        jumlah: jumlah
                    });
                }
            }
        });

        parsedLogList.reverse();

        let barisDataDisalin = [];

        parsedLogList.forEach((item) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${item.waktu}</td><td>${item.userId}</td><td>${item.tujuanBank}</td><td>${item.creditStatus}</td><td>${item.jumlah}</td>`;
            tbody.appendChild(tr);

            barisDataDisalin.push(`${item.waktu}\t${item.userId}\t${item.tujuanBank}\t\t${item.jumlah}`);
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
        counter.innerText = `${parsedLogList.length} DATA`;

        // Sesuaikan kembali ukuran canvas saat tinggi tabel bertambah
        setTimeout(aturUkuranCanvas, 50);
    }

    /* FUNGSI RESET */
    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        document.getElementById('dataCounter').innerText = "0 DATA";
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
        aturUkuranCanvas();
    }

    /* FUNGSI SALIN TEKS KE CLIPBOARD */
    function salinHasil() {
        const txt = document.getElementById('txtCopy');
        
        if (!hasilTeksUntukDisalin) {
            txt.innerText = "DATA KOSONG!";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1000);
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            txt.innerText = "BERHASIL DISALIN";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
        });
    }

    /* SHORTCUT KEYBOARD HARIAN */
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            resetData();
        }
        if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            salinHasil();
        }
    });
</script>
</body>
</html>
