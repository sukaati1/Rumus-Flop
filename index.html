<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - GEAR 5 NIKA ULTRA GLOW</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=400;700;900&family=Rajdhani:wght=500;600;700&display=swap" rel="stylesheet">
    
<style>
    /* JURUS PAMUNGKAS: Mengakali Force Dark Mode Browser */
    html {
        background-color: #000000 !important;
    }

    body {
        font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #ffffff !important;
        background: #0d0714 !important; /* Latar belakang asli ungu sangat gelap */
        overflow-x: hidden;
    }
    
    /* KOTAK CASIR DENGAN DOUBLE NEON GLOW ANTI DARK-MODE */
    .container {
        background: #120a1c !important; 
        border: 4px solid #a855f7 !important; /* Border tebal ungu benderang */
        border-radius: 16px; 
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-sizing: border-box;
        
        /* Efek paksa bayangan menyala tebal murni */
        box-shadow: 
            0 0 30px #a855f7, 
            0 0 60px rgba(168, 85, 247, 0.8),
            inset 0 0 20px #2e104d !important;
        
        animation: nikaLightning 2.5s ease-in-out infinite alternate;
    }

    /* Efek kedip petir yang dipaksa lolos sensor browser */
    @keyframes nikaLightning {
        0% {
            border-color: #a855f7 !important;
            box-shadow: 0 0 25px #a855f7, 0 0 50px rgba(168, 85, 247, 0.6);
        }
        100% {
            border-color: #ffffff !important;
            box-shadow: 0 0 40px #ffffff, 0 0 80px #a855f7;
        }
    }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: #ffffff !important;
        font-size: 36px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 8px;
        margin: 0;
        text-shadow: 0 0 20px #a855f7, 0 0 10px #ffffff !important;
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 13px;
        color: #d8b4fe !important;
        letter-spacing: 5px;
        font-weight: 900;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 35px;
        text-shadow: 0 0 10px #a855f7;
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 12px;
        color: #e9d5ff !important; 
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    
    /* INPUT AREA */
    textarea {
        width: 100%;
        height: 140px;
        background: #000000 !important;
        border: 2px solid #a855f7 !important; 
        border-radius: 10px;
        color: #ffffff !important;
        padding: 18px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 30px;
    }
    
    textarea:focus {
        outline: none;
        border-color: #ffffff !important;
        box-shadow: 0 0 20px #a855f7 !important;
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 40px;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        padding: 18px; 
        font-size: 13px;   
        font-weight: 900;
        border: none;
        border-radius: 10px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2.5px;
        transition: all 0.2s ease;
    }
    
    .btn-submit { 
        background: #ffffff !important; 
        color: #000000 !important; 
        box-shadow: 0 4px 25px rgba(255, 255, 255, 0.6);
    }
    .btn-submit:hover {
        background: #e9d5ff !important;
        transform: translateY(-2px);
    }
    
    .btn-copy { 
        background: #000000 !important; 
        color: #ffffff !important; 
        border: 2px solid #a855f7 !important;
    }
    .btn-copy:hover { 
        background: #a855f7 !important;
        color: #ffffff !important;
        transform: translateY(-2px);
        box-shadow: 0 0 20px #a855f7;
    }
    
    .btn-reset { 
        background: #25123e !important; 
        color: #ffffff !important; 
        border: 1px solid #a855f7 !important;
    }
    .btn-reset:hover { 
        background: #3b1d62 !important;
        transform: translateY(-2px);
    }
    
    /* TABEL DATA */
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 12px;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
    }
    
    th, td {
        padding: 16px 20px;
        text-align: left;
        font-size: 14px;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background-color: #201135 !important; 
        color: #ffffff !important; 
        font-weight: 900; 
        letter-spacing: 2px;
        text-transform: uppercase;
        border-bottom: 3px solid #a855f7 !important;
    }
    
    td {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        color: #f3e8ff !important;
        border-bottom: 1px solid rgba(168, 85, 247, 0.1) !important;
    }

    td:nth-child(4) {
        font-family: 'Orbitron', sans-serif;
        color: #ffffff !important; 
        text-shadow: 0 0 10px #ffffff;
        font-weight: 900;
    }
    
    tr:nth-child(even) {
        background-color: rgba(168, 85, 247, 0.05) !important;
    }

    tr:hover {
        background-color: rgba(168, 85, 247, 0.2) !important;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">JOY BOY MODE - KONOHA KASIR v7.0</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="DRUMS OF LIBERATION DETECTED... READY TO TRANSLATE LOGS..."></textarea>
    
    <div class="btn-group">
        <button id="btnSubmit" class="btn-submit" onclick="konversiLog()">Submit</button>
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                // Kolom Credit sudah dibuang sepenuhnya dari baris tabel
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin! Silakan submit log terlebih dahulu.");
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            const btnCopy = document.getElementById('btnCopy');
            const teksAwal = btnCopy.innerText;
            
            btnCopy.innerText = "GOMU GOMU COPY SUKSES!";
            btnCopy.style.background = "#a855f7 !important";
            btnCopy.style.color = "#ffffff !important";
            
            setTimeout(() => {
                btnCopy.innerText = teksAwal;
                btnCopy.style.background = "#000000 !important";
                btnCopy.style.color = "#ffffff !important";
            }, 1500);
        }).catch(err => {
            console.error("Error: ", err);
            alert("Gagal menyalin data, pastikan izin clipboard aktif.");
        });
    }
</script>
</body>
</html>
