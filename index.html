<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>Rumus Flop Kasir - Ultra Light Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only dark !important;
        --blue-electric: #00d2ff;
        --purple-neon: #a855f7;
        --purple-bright: #d8b4fe;
        --pink-neon: #ff007f;
        --cyan-neon: #00f0ff;
        
        --lavender-bg: rgba(147, 112, 219, 0.15); 
        --lavender-border: #c89eff;               
        --lavender-text: #e8d7ff;                 
        --lavender-glow: #b57edc; 
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #030308;
        overflow-x: hidden;
    }

    body {
        padding: 40px 15px;
        font-family: 'Rajdhani', sans-serif;
        color: #ffffff !important;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* VIDEO BACKGROUND FULLSCREEN */
    .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
        pointer-events: none;
    }

    /* BINGKAI UTAMA */
    .container {
        position: relative;
        z-index: 2;
        background: rgba(10, 8, 25, 0.55) !important; 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 65px 0px 65px 0px !important;
        border: 2px solid var(--lavender-border) !important;
        width: 100%;
        max-width: 900px;
        padding: 45px 40px;
        margin: auto;
        box-shadow: 
            0 0 15px rgba(200, 158, 255, 0.6),
            0 0 35px rgba(168, 85, 247, 0.4),
            inset 0 0 20px rgba(200, 158, 255, 0.25);
    }

    /* JUDUL UTAMA */
    h1 {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 4px;
        margin: 0;
        background: linear-gradient(
            90deg, 
            var(--cyan-neon), 
            var(--blue-electric), 
            var(--pink-neon), 
            var(--purple-neon), 
            var(--cyan-neon)
        );
        background-size: 200% auto;
        color: transparent !important;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shineText 3s linear infinite;
        filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.5));
    }

    @keyframes shineText {
        to { background-position: 200% center; }
    }

    /* SUBTITLE */
    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        color: var(--purple-bright) !important;
        letter-spacing: 6px;
        font-weight: 800;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 4px;
    }

    /* WATERMARK FAJAR */
    .watermark-fajar-sub {
        text-align: center;
        font-family: 'Dancing Script', cursive;
        font-size: 14px;
        font-weight: 600;
        color: rgba(243, 232, 255, 0.6);
        text-shadow: 0 0 6px rgba(181, 126, 220, 0.4);
        margin-bottom: 28px;
        letter-spacing: 1px;
    }

    .label-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }
    
    label {
        display: block;
        font-family: 'Orbitron', sans-serif;
        font-weight: 800;
        color: var(--purple-bright) !important; 
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    /* BADGE COUNTER DIJADIKAN TOMBOL CHAT */
    .badge-count {
        font-size: 11px;
        font-weight: 800;
        padding: 4px 12px;
        border-radius: 15px;
        background: rgba(0, 210, 255, 0.15);
        color: var(--cyan-neon) !important;
        border: 1px solid rgba(0, 240, 255, 0.5);
        font-family: 'Orbitron', sans-serif;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-block;
    }

    .badge-count:hover {
        background: rgba(0, 210, 255, 0.35);
        border-color: #ffffff;
        color: #ffffff !important;
        box-shadow: 0 0 12px var(--cyan-neon);
        transform: scale(1.05);
    }
    
    /* TEXTAREA */
    textarea {
        width: 100%;
        height: 120px;
        background: rgba(0, 0, 0, 0.3) !important;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: 1.5px solid rgba(168, 85, 247, 0.3) !important; 
        border-radius: 12px;
        color: var(--cyan-neon) !important;
        padding: 14px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 13.5px;
        margin-bottom: 20px;
        user-select: text;
        transition: border-color 0.2s ease, background 0.2s ease;
    }

    textarea:focus {
        outline: none;
        border-color: var(--blue-electric) !important;
        background: rgba(0, 0, 0, 0.5) !important;
        box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    textarea::placeholder {
        color: rgba(255, 255, 255, 0.3);
    }

    .btn-group {
        display: flex;
        gap: 16px;
        margin-bottom: 28px;
    }

    button {
        position: relative;
        overflow: hidden;
        flex: 1;
        padding: 16px 20px; 
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;    
        font-weight: 900;
        cursor: pointer;
        letter-spacing: 2px;
        text-transform: uppercase;
        outline: none;
        border-radius: 65px 0px 65px 0px !important;
        border: 2px solid var(--lavender-border) !important;
        background: var(--lavender-bg) !important;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        color: var(--lavender-text) !important;
        text-shadow: 0 0 6px rgba(181, 126, 220, 0.6);
        box-shadow: 0 0 12px rgba(200, 158, 255, 0.5), inset 0 0 8px rgba(181, 126, 220, 0.2);
        transition: transform 0.1s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    button:hover {
        animation: shakeBtn 0.2s ease-in-out infinite alternate;
        background: rgba(147, 112, 219, 0.35) !important;
        border-color: #ffffff !important;
        box-shadow: 0 0 20px #b57edc, inset 0 0 12px rgba(255, 255, 255, 0.4);
    }

    @keyframes shakeBtn {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        25% { transform: translate(-1px, -1px) rotate(-0.5deg); }
        50% { transform: translate(-1px, 1px) rotate(0.5deg); }
        75% { transform: translate(1px, -1px) rotate(0deg); }
        100% { transform: translate(1px, 1px) rotate(0.5deg); }
    }

    button:active {
        transform: scale(0.96) !important;
        animation: none !important;
    }

    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        transform: scale(0);
        animation: ripple-animation 0.6s linear;
        pointer-events: none;
    }

    @keyframes ripple-animation {
        to {
            transform: scale(4);
            opacity: 0;
        }
    }

    /* TABEL CONTAINER */
    .table-container { 
        position: relative;
        overflow-x: auto; 
        max-height: 380px;
        border-radius: 12px;
        border: 1.5px solid rgba(168, 85, 247, 0.3) !important;
        background: rgba(0, 0, 0, 0.25) !important;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }
    
    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
    }
    
    th, td {
        padding: 12px 16px;
        text-align: left;
        white-space: nowrap;
        user-select: text;
    }
    
    th { 
        position: sticky;
        top: 0;
        z-index: 3;
        font-family: 'Orbitron', sans-serif;
        font-weight: 800;
        background: rgba(13, 10, 30, 0.75) !important; 
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        color: var(--purple-bright) !important; 
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border-bottom: 2px solid var(--purple-neon) !important;
    }
    
    td {
        color: #ffffff !important;
        border-bottom: 1px solid rgba(168, 85, 247, 0.12) !important;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 13px;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    td:nth-child(1) { color: var(--blue-electric) !important; }
    td:nth-child(2) { color: #ffffff !important; }
    td:nth-child(3) { color: var(--purple-bright) !important; }
    td:nth-child(4) { color: var(--pink-neon) !important; }
    td:nth-child(5) { color: var(--cyan-neon) !important; }

    tr:hover td { background-color: rgba(168, 85, 247, 0.25) !important; }
    tr:last-child td { border-bottom: none !important; }

    /* MODAL TEAM CHAT */
    .chat-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(3, 3, 8, 0.82);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        z-index: 999;
        display: none;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .chat-modal {
        position: relative;
        width: 100%;
        max-width: 580px;
        background: rgba(10, 8, 25, 0.85) !important;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 65px 0px 65px 0px !important;
        border: 2px solid var(--lavender-border) !important;
        box-shadow: 
            0 0 15px rgba(200, 158, 255, 0.6),
            0 0 35px rgba(168, 85, 247, 0.4),
            inset 0 0 20px rgba(200, 158, 255, 0.25);
        padding: 35px 30px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1.5px solid rgba(200, 158, 255, 0.3);
        padding-bottom: 12px;
    }

    .chat-header h3 {
        margin: 0;
        font-family: 'Orbitron', sans-serif;
        color: var(--lavender-text);
        font-size: 15px;
        letter-spacing: 3px;
        text-shadow: 0 0 8px var(--lavender-glow);
    }

    .header-controls {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-reset-chat {
        background: rgba(255, 0, 127, 0.2) !important;
        border: 1px solid var(--pink-neon) !important;
        color: var(--pink-neon) !important;
        font-size: 10px !important;
        padding: 6px 12px !important;
        border-radius: 20px !important;
        font-family: 'Orbitron', sans-serif;
        cursor: pointer;
        box-shadow: 0 0 8px rgba(255, 0, 127, 0.3) !important;
        transition: all 0.2s ease;
    }

    .btn-reset-chat:hover {
        background: rgba(255, 0, 127, 0.45) !important;
        box-shadow: 0 0 14px var(--pink-neon) !important;
        color: #ffffff !important;
    }

    .btn-close-chat {
        background: transparent !important;
        border: none !important;
        color: var(--pink-neon) !important;
        font-size: 20px;
        font-weight: 900;
        cursor: pointer;
        padding: 0 6px !important;
        box-shadow: none !important;
        text-shadow: 0 0 8px var(--pink-neon);
    }

    .chat-body {
        height: 280px;
        overflow-y: auto;
        border: 1.5px solid rgba(168, 85, 247, 0.3);
        border-radius: 15px;
        padding: 12px;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .chat-msg {
        position: relative;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        border-left: 3px solid var(--lavender-border);
        user-select: text;
        word-break: break-word;
    }

    .chat-msg .sender {
        font-weight: 800;
        margin-right: 6px;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.2);
    }

    .chat-msg .time-stamp {
        color: rgba(255, 255, 255, 0.4);
        font-size: 10.5px;
        margin-right: 6px;
    }

    .chat-msg .msg-content {
        color: #f1f5f9;
        white-space: pre-wrap;
    }

    .chat-msg .msg-content a {
        color: var(--cyan-neon);
        text-decoration: underline;
    }

    .chat-msg .msg-content code {
        background: rgba(0, 210, 255, 0.15);
        color: var(--cyan-neon);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
    }

    .chat-footer {
        display: flex;
        gap: 8px;
    }

    .chat-footer input {
        background: rgba(0, 0, 0, 0.4) !important;
        border: 1.5px solid rgba(168, 85, 247, 0.4) !important;
        color: #fff !important;
        padding: 12px;
        border-radius: 12px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        outline: none;
    }

    .chat-footer input:focus {
        border-color: var(--cyan-neon) !important;
        box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }

    #chatUser { width: 120px; }
    #chatText { flex: 1; }

    .btn-send-chat {
        padding: 12px 16px !important;
        border-radius: 12px !important;
        border: 1.5px solid var(--lavender-border) !important;
        background: var(--lavender-bg) !important;
        color: var(--lavender-text) !important;
        font-size: 11px !important;
        letter-spacing: 1.5px !important;
    }
</style>
</head>
<body>

<!-- VIDEO BACKGROUND MP4 -->
<video class="bg-video" autoplay loop muted playsinline disablepictureinpicture>
    <source src="./gb.mp4" type="video/mp4">
</video>

<!-- CONTAINER UTAMA -->
<div class="container">
    <h1>Rumus Flop Kasir</h1>
    <div class="sub-title">Ultra Light Edition</div>
    <div class="watermark-fajar-sub">Fajar</div>

    <div class="label-header">
        <label for="rawInput">Tempel Log Transaksi</label>
    </div>
    <textarea id="rawInput" tabindex="1" placeholder="Tempelkan log transaksi di sini..." oninput="konversiLog()" onpaste="setTimeout(konversiLog, 50)"></textarea>
    
    <div class="btn-group">
        <button id="btnCopy" class="btn-copy" tabindex="2" onclick="salinHasil()">
            <span id="txtCopy">SALIN DATA</span>
        </button>
        <button id="btnReset" class="btn-reset" tabindex="3" onclick="resetData()">
            <span id="txtReset">RESET</span>
        </button>
    </div>

    <div class="label-header">
        <label>Hasil Konversi</label>
        <span class="badge-count" id="dataCounter" onclick="openTeamChat()">0 DATA (CHAT)</span>
    </div>
    
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>USER ID</th>
                    <th>TUJUAN BANK</th>
                    <th>CREDIT</th>
                    <th>JUMLAH</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- MODAL TEAM CHAT -->
<div class="chat-modal-overlay" id="chatModal">
    <div class="chat-modal">
        <div class="chat-header">
            <h3>TEAM CHAT 💬 <span id="chatCountBadge" style="font-size:11px; opacity:0.7;">(0)</span></h3>
            <div class="header-controls">
                <button class="btn-reset-chat" onclick="clearAllChat()">🗑️ RESET CHAT</button>
                <button class="btn-close-chat" onclick="closeTeamChat()">X</button>
            </div>
        </div>
        <div class="chat-body" id="chatLogs"></div>
        <div class="chat-footer">
            <input type="text" id="chatUser" placeholder="Nama..." onchange="saveUserName(this.value)" />
            <input type="text" id="chatText" placeholder="Tulis pesan..." onkeypress="handleChatKey(event)" />
            <button class="btn-send-chat" onclick="sendChatMessage()">KIRIM 🔥</button>
        </div>
    </div>
</div>

<!-- FIREBASE REALTIME SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    let hasilTeksUntukDisalin = "";
    let isInitialLoad = true;

    /* AUDIO SYNTHESIZER UNTUK SOUND EFFECT CHAT */
    function playBeepSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'send') {
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'receive') {
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1174.66, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            }
        } catch(e) {}
    }

    /* KOLEKSI WARNA WARNI CYBER DYNAMIC FOR USERNAME */
    const userColors = [
        '#00f0ff', '#ff007f', '#00ff88', '#ffb703', 
        '#a855f7', '#ff4d6d', '#3a86ff', '#fb5607', 
        '#70e000', '#ff006e', '#8338ec', '#00b4d8'
    ];

    /* KOLEKSI EMOJI UNIK UNTUK PENGGUNA */
    const userEmojis = ['⚡', '🔥', '🚀', '👾', '👑', '🐱‍💻', '🎯', '💎', '🦊', '💥', '👻', '🐉'];

    function getUserColor(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        return userColors[Math.abs(hash) % userColors.length];
    }

    function getUserEmoji(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        return userEmojis[Math.abs(hash) % userEmojis.length];
    }

    /* FORMATTER TEXT CHAT: MARKDOWN & LINK */
    function formatChatMessage(text) {
        if (!text) return '';
        let formatted = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        // Format Markdown Sederhana
        formatted = formatted.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
        formatted = formatted.replace(/_(.*?)_/g, '<em>$1</em>');
        formatted = formatted.replace(/`(.*?)`/g, '<code>$1</code>');

        // Auto-link URL
        const urlPattern = /(https?:\/\/[^\s]+)/g;
        formatted = formatted.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener">$1</a>');

        return formatted;
    }

    /* URL FIREBASE LENGKAP */
    const firebaseConfig = {
        databaseURL: "https://kasir-flop-chat-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    
    const dbChat = firebase.database().ref("team_chat_messages");

    /* SIMPAN & LOAD NAMA DARI LOCALSTORAGE */
    document.addEventListener("DOMContentLoaded", () => {
        const savedUser = localStorage.getItem("chat_username");
        if (savedUser) {
            document.getElementById('chatUser').value = savedUser;
        }
    });

    function saveUserName(val) {
        if (val.trim()) {
            localStorage.setItem("chat_username", val.trim());
        }
    }

    function openTeamChat() {
        document.getElementById('chatModal').style.display = 'flex';
        document.getElementById('chatText').focus();
    }

    function closeTeamChat() {
        document.getElementById('chatModal').style.display = 'none';
    }

    function renderMessage(key, data) {
        const chatLogs = document.getElementById('chatLogs');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-msg';
        msgDiv.id = `msg-${key}`;
        
        const username = data.user || 'User';
        const color = getUserColor(username);
        const emoji = getUserEmoji(username);

        msgDiv.innerHTML = `
            <span class="time-stamp">[${data.timestamp || ''}]</span>
            <span class="sender" style="color: ${color};">${emoji} ${username}:</span>
            <span class="msg-content">${formatChatMessage(data.msg)}</span>
        `;
        
        chatLogs.appendChild(msgDiv);
        chatLogs.scrollTop = chatLogs.scrollHeight;
    }

    function sendChatMessage() {
        const userInput = document.getElementById('chatUser');
        const textInput = document.getElementById('chatText');
        const messageText = textInput.value.trim();

        if (userInput.value.trim() && messageText) {
            saveUserName(userInput.value);
            
            const payload = {
                user: userInput.value.trim(),
                msg: messageText,
                timestamp: new Date().toLocaleTimeString('id-ID')
            };

            dbChat.push(payload);
            playBeepSound('send');
            textInput.value = '';
        } else if (!userInput.value.trim()) {
            userInput.focus();
        }
    }

    /* FUNGSI RESET CHAT LANGSUNG HAPUS TANPA POPUP NOTIFIKASI */
    function clearAllChat() {
        dbChat.remove();
        document.getElementById('chatLogs').innerHTML = '';
    }

    function handleChatKey(e) {
        if (e.key === 'Enter') sendChatMessage();
    }

    // Mendengarkan pesan baru dari Firebase secara Realtime
    dbChat.limitToLast(50).on('child_added', (snapshot) => {
        const data = snapshot.val();
        renderMessage(snapshot.key, data);
        
        if (!isInitialLoad) {
            playBeepSound('receive');
        }
    });

    dbChat.on('child_removed', (snapshot) => {
        const el = document.getElementById(`msg-${snapshot.key}`);
        if (el) el.remove();
    });

    // Otomatis bersihkan tampilan saat database direset & update counter
    dbChat.on('value', (snapshot) => {
        isInitialLoad = false;
        const chatLogs = document.getElementById('chatLogs');
        const badge = document.getElementById('chatCountBadge');
        if (!snapshot.exists()) {
            chatLogs.innerHTML = '';
            badge.innerText = '(0)';
        } else {
            badge.innerText = `(${snapshot.numChildren()})`;
        }
    });

    /* EFEK GELOMBANG (RIPPLE) */
    document.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', function(e) {
            const circle = document.createElement('span');
            const diameter = Math.max(this.clientWidth, this.clientHeight);
            const radius = diameter / 2;

            const rect = this.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - rect.left - radius}px`;
            circle.style.top = `${e.clientY - rect.top - radius}px`;
            circle.classList.add('ripple');

            const ripple = this.querySelector('.ripple');
            if (ripple) ripple.remove();

            this.appendChild(circle);
        });
    });

    /* FUNGSI KONVERSI LOG RINGAN */
    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        const counter = document.getElementById('dataCounter');
        
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) {
            counter.innerText = "0 DATA (CHAT)";
            return;
        }

        let parsedLogList = [];
        let lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');

        if (lines.length === 1 && !lines[0].includes('\t')) {
            let rawChunk = lines[0].replace(/(ACCEPT|REJECT|PENDING|SUCCESS|FAILED)[a-zA-Z0-9]*/gi, "$&\n");
            lines = rawChunk.split('\n').map(l => l.trim()).filter(l => l !== '');
        }

        lines.forEach(line => {
            let matchTime = line.match(/(\d{2}:\d{2}:\d{2})/);
            if (!matchTime) return;
            let waktu = matchTime[1];

            let parts = line.split(/\t|\s{2,}/).map(p => p.trim()).filter(p => p !== '');
            
            if (parts.length >= 5) {
                let userId = parts[2] || "-";
                let bankInfo = parts[4] || "-";
                let jumlah = parts[6] || parts[5] || "0";
                
                jumlah = jumlah.replace(/^-/, '').trim();

                parsedLogList.push({
                    waktu: waktu,
                    userId: userId,
                    tujuanBank: bankInfo,
                    creditStatus: "0",
                    jumlah: jumlah
                });
            } else {
                let timeIndex = line.indexOf(waktu);
                let textAfterTime = line.substring(timeIndex + waktu.length);
                let matchType = textAfterTime.match(/(Withdraw|Deposit)/i);

                if (matchType) {
                    let typeIndex = textAfterTime.search(/(Withdraw|Deposit)/i);
                    let userId = textAfterTime.substring(0, typeIndex).trim();
                    let textAfterType = textAfterTime.substring(typeIndex + matchType[0].length);

                    let matchAmount = textAfterType.match(/-?([0-9.,]+)(?:\s|\t|ACCEPT|REJECT|PENDING|SUCCESS|FAILED|$)/i);
                    let jumlah = "0";
                    let bankSection = textAfterType;

                    if (matchAmount) {
                        jumlah = matchAmount[1].replace(/^-/, '');
                        let amountIndex = textAfterType.indexOf(matchAmount[0]);
                        bankSection = textAfterType.substring(0, amountIndex).trim();
                    }

                    bankSection = bankSection.replace(/-\s*$/, '').trim();

                    parsedLogList.push({
                        waktu: waktu,
                        userId: userId,
                        tujuanBank: bankSection,
                        creditStatus: "0",
                        jumlah: jumlah
                    });
                }
            }
        });

        parsedLogList.reverse();

        let barisDataDisalin = [];

        parsedLogList.forEach((item) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${item.waktu}</td><td>${item.userId}</td><td>${item.tujuanBank}</td><td>${item.creditStatus}</td><td>${item.jumlah}</td>`;
            tbody.appendChild(tr);

            barisDataDisalin.push(`${item.waktu}\t${item.userId}\t${item.tujuanBank}\t\t${item.jumlah}`);
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
        counter.innerText = `${parsedLogList.length} DATA (CHAT)`;
    }

    /* FUNGSI RESET DATA TABLE */
    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        document.getElementById('dataCounter').innerText = "0 DATA (CHAT)";
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    /* FUNGSI SALIN TEKS */
    function salinHasil() {
        const txt = document.getElementById('txtCopy');
        
        if (!hasilTeksUntukDisalin) {
            txt.innerText = "DATA KOSONG!";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1000);
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            txt.innerText = "BERHASIL DISALIN";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
        });
    }

    /* SHORTCUT KEYBOARD */
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeTeamChat();
            resetData();
        }
        if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            salinHasil();
        }
    });
</script>
