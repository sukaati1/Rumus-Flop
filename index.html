<script>
    // --- LOGIKA LIVE WALLPAPER (PERCIKAN API & SILUET) ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    // Mengambil Gambar Siluet Naruto dari Imgur
    const narutoImg = new Image();
    narutoImg.src = 'https://i.imgur.com/vHwzYgL.png'; 

    class Particle {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.size = Math.random() * 2.5 + 1; // Ukuran partikel disesuaikan agar smooth
            this.speedY = Math.random() * 1.5 + 0.8;
            this.speedX = Math.random() * 1.6 - 0.8;
            this.alpha = 1;
            this.fade = Math.random() * 0.01 + 0.005;
            this.color = Math.random() > 0.35 ? '#ff4500' : '#ff9f00';
        }
        update() {
            this.y -= this.speedY;
            this.x += this.speedX;
            this.alpha -= this.fade;
            if (this.alpha <= 0 || this.y < 0) {
                this.reset();
            }
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    const particles = [];
    for (let i = 0; i < 50; i++) {
        particles.push(new Particle());
    }

    function animate() {
        // 1. Bersihkan kanvas total setiap frame (Mencegah layar jadi putih / menumpuk)
        ctx.clearRect(0, 0, width, height);

        // 2. Gambar Siluet Naruto secara statis di pojok kanan bawah
        if (narutoImg.complete && narutoImg.naturalWidth !== 0) {
            const imgW = width * 0.35 > 380 ? 380 : width * 0.35;
            const imgH = imgW * (narutoImg.height / narutoImg.width);
            ctx.save();
            ctx.globalAlpha = 0.12; // Transparansi siluet agar tabel tetap kontras
            ctx.drawImage(narutoImg, width - imgW - 20, height - imgH, imgW, imgH);
            ctx.restore();
        }

        // 3. Gambar dan update animasi partikel api
        particles.forEach(p => {
            p.update();
            p.draw();
        });

        requestAnimationFrame(animate);
    }

    // Jalankan animasi langsung
    animate();

    // --- LOGIKA KONVERSI TRANSAKSI ---
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            const kolom = line.split(/\t| {2,}/);

            if (kolom.length >= 7) {
                const fullDateTime = kolom[1]; 
                const waktu = fullDateTime.includes(' ') ? fullDateTime.split(' ')[1] : fullDateTime;
                const userId = kolom[2];
                const tujuanBank = kolom[4];
                const creditStatus = ""; 
                const jumlah = kolom[6]; 

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${creditStatus}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${creditStatus}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) return;
        navigator.clipboard.writeText(hasilTeksUntukDisalin);
    }
</script>
