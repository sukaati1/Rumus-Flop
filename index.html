<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>Rumus Flop Kasir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only dark !important;
        --primary-accent: #00f5d4;
        --secondary-accent: #7b2cbf;
        --border-purple: #9d4edd;
        --text-lavender: #e0aaff;
        --bright-cyan: #560bad;
        
        --glass-bg: rgba(13, 10, 25, 0.88); 
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #06040a;
        overflow-x: hidden;
    }

    body {
        padding: 30px 15px;
        font-family: 'Rajdhani', sans-serif;
        color: #ffffff !important;
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(123, 44, 191, 0.2) 0%, transparent 40%),
            radial-gradient(circle at 90% 80%, rgba(0, 245, 212, 0.12) 0%, transparent 40%);
    }

    .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
        pointer-events: none;
        opacity: 0.85;
    }

    @property --border-angle {
        syntax: '<angle>';
        inherits: false;
        initial-value: 0deg;
    }

    @keyframes spinBorder {
        to {
            --border-angle: 360deg;
        }
    }

    .container {
        position: relative;
        z-index: 2;
        background: var(--glass-bg) !important; 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 20px !important;
        width: 100%;
        max-width: 900px;
        padding: 40px;
        margin: auto;

        border: 2px solid transparent !important;
        background-image: 
            linear-gradient(rgba(13, 10, 25, 0.92), rgba(13, 10, 25, 0.92)), 
            conic-gradient(
                from var(--border-angle), 
                rgba(0, 245, 212, 0.2) 0%, 
                var(--border-purple) 50%, 
                rgba(0, 245, 212, 0.2) 100%
            ) !important;
        background-origin: border-box !important;
        background-clip: padding-box, border-box !important;
        
        animation: spinBorder 6s linear infinite;
        box-shadow: 0 0 30px rgba(123, 44, 191, 0.25);
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .container.hidden-for-chat {
        display: none !important;
    }

    h1 {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 3px;
        margin: 0;
        color: var(--primary-accent) !important;
        text-transform: uppercase;
        filter: drop-shadow(0 0 10px rgba(0, 245, 212, 0.4));
    }

    .sub-title {
        text-align: center;
        font-family: 'Rajdhani', sans-serif;
        font-size: 13px;
        color: var(--text-lavender) !important;
        letter-spacing: 5px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 6px;
        margin-bottom: 28px;
    }

    .label-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    .label-actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    label {
        display: block;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        color: var(--text-lavender) !important; 
        font-size: 14px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }

    .badge-count, .btn-swap-pos {
        font-size: 11px;
        font-weight: 700;
        padding: 5px 14px;
        border-radius: 6px;
        background: rgba(0, 245, 212, 0.1);
        color: var(--primary-accent) !important;
        border: 1px solid rgba(0, 245, 212, 0.4);
        font-family: 'Rajdhani', sans-serif;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-block;
        letter-spacing: 1px;
    }

    .btn-swap-pos {
        background: rgba(157, 78, 221, 0.15);
        color: var(--text-lavender) !important;
        border: 1px solid rgba(157, 78, 221, 0.4);
    }

    .badge-count:hover, .btn-swap-pos:hover {
        background: rgba(0, 245, 212, 0.25);
        border-color: var(--primary-accent);
        color: #ffffff !important;
    }

    .btn-swap-pos:hover {
        background: rgba(157, 78, 221, 0.3);
        border-color: var(--border-purple);
    }
    
    textarea#rawInput {
        width: 100%;
        height: 120px;
        background: rgba(8, 5, 15, 0.8) !important;
        border: 1.5px solid rgba(157, 78, 221, 0.3) !important; 
        border-radius: 10px;
        color: var(--primary-accent) !important;
        padding: 14px 16px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 20px;
        user-select: text;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    textarea#rawInput:focus {
        outline: none;
        border-color: var(--primary-accent) !important;
        box-shadow: 0 0 12px rgba(0, 245, 212, 0.25);
    }

    textarea#rawInput::placeholder {
        color: rgba(224, 170, 255, 0.3);
    }

    .btn-group {
        display: flex;
        gap: 16px;
        margin-bottom: 28px;
    }

    .btn-group.swapped {
        flex-direction: row-reverse;
    }

    button {
        position: relative;
        overflow: hidden;
        flex: 1;
        padding: 14px 20px; 
        font-family: 'Rajdhani', sans-serif;
        font-size: 14px;    
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 2px;
        text-transform: uppercase;
        outline: none;
        border-radius: 8px !important;
        border: 1px solid var(--primary-accent) !important;
        background: rgba(0, 245, 212, 0.1) !important;
        color: var(--primary-accent) !important;
        transition: all 0.2s ease;
    }

    button#btnReset {
        border-color: var(--border-purple) !important;
        background: rgba(157, 78, 221, 0.1) !important;
        color: var(--text-lavender) !important;
    }

    button:hover {
        background: rgba(0, 245, 212, 0.25) !important;
        box-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
        color: #ffffff !important;
    }

    button#btnReset:hover {
        background: rgba(157, 78, 221, 0.25) !important;
        box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
        color: #ffffff !important;
    }

    button:active {
        transform: scale(0.98);
    }

    .table-container { 
        position: relative;
        overflow-x: auto; 
        max-height: 380px;
        border-radius: 10px;
        border: 1px solid rgba(157, 78, 221, 0.25) !important;
        background: rgba(8, 5, 15, 0.6) !important;
    }
    
    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
    }
    
    th, td {
        padding: 12px 16px;
        text-align: left;
        white-space: nowrap;
        user-select: text;
    }
    
    th { 
        position: sticky;
        top: 0;
        z-index: 3;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        background: rgba(15, 10, 28, 0.95) !important; 
        color: var(--text-lavender) !important; 
        font-size: 13px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border-bottom: 2px solid var(--border-purple) !important;
    }
    
    td {
        color: #ffffff !important;
        border-bottom: 1px solid rgba(157, 78, 221, 0.12) !important;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        font-size: 13px;
    }

    td:nth-child(1) { color: var(--primary-accent) !important; }
    td:nth-child(2) { color: #ffffff !important; }
    td:nth-child(3) { color: var(--text-lavender) !important; }
    td:nth-child(4) { color: rgba(224, 170, 255, 0.7) !important; }
    td:nth-child(5) { color: #ffb703 !important; }

    tr:hover td { background-color: rgba(157, 78, 221, 0.12) !important; }
    tr:last-child td { border-bottom: none !important; }

    /* MODALS */
    .chat-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(4, 2, 8, 0.85);
        backdrop-filter: blur(6px);
        z-index: 999;
        display: none;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    #profileModal, #registerModal, #friendsModal {
        z-index: 1002 !important;
    }

    #imageViewerModal {
        z-index: 1003 !important;
    }

    .auth-modal {
        position: relative;
        width: 100%;
        max-width: 400px;
        background: rgba(13, 10, 25, 0.95) !important;
        border-radius: 12px !important;
        border: 1.5px solid var(--border-purple) !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .auth-input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .auth-input-group label {
        font-size: 12px;
    }

    .auth-input-group input {
        background: rgba(8, 5, 15, 0.9) !important;
        border: 1px solid rgba(157, 78, 221, 0.4) !important;
        color: #fff !important;
        padding: 10px 12px;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        outline: none;
    }

    .auth-input-group input:focus {
        border-color: var(--primary-accent) !important;
    }

    .avatar-selection-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 5px;
        margin-bottom: 5px;
    }

    .avatar-preview-img {
        width: 75px;
        height: 75px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--primary-accent);
    }

    .btn-upload-avatar {
        font-size: 11px !important;
        padding: 8px 14px !important;
        border-radius: 6px !important;
    }

    .btn-auth-submit {
        padding: 12px !important;
        border-radius: 6px !important;
        margin-top: 10px;
    }

    .btn-admin-reg {
        background: rgba(157, 78, 221, 0.2) !important;
        border: 1px solid var(--border-purple) !important;
        color: #ffffff !important;
        margin-top: 5px;
    }

    .auth-close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: transparent !important;
        border: none !important;
        color: var(--text-lavender) !important;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
    }

    .chat-modal {
        position: relative;
        width: 100%;
        max-width: 650px;
        height: 90vh;
        max-height: 720px;
        background: rgba(13, 10, 25, 0.96) !important;
        border-radius: 12px !important;
        border: 1.5px solid var(--border-purple) !important;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: hidden;
    }

    .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(157, 78, 221, 0.25);
        padding-bottom: 12px;
        flex-shrink: 0;
    }

    .chat-header h3 {
        margin: 0;
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 2px;
        color: var(--primary-accent) !important;
    }

    .header-controls {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-hdr-action {
        font-size: 11px !important;
        padding: 6px 12px !important;
        border-radius: 6px !important;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.2s ease;
        flex: none !important;
    }

    .btn-reset-chat {
        background: rgba(255, 77, 109, 0.15) !important;
        border: 1px solid rgba(255, 77, 109, 0.4) !important;
        color: #ff4d6d !important;
    }

    .btn-logout-chat {
        background: rgba(0, 245, 212, 0.15) !important;
        border: 1px solid rgba(0, 245, 212, 0.4) !important;
        color: var(--primary-accent) !important;
    }

    .btn-profile-chat {
        background: rgba(157, 78, 221, 0.15) !important;
        border: 1px solid rgba(157, 78, 221, 0.4) !important;
        color: var(--text-lavender) !important;
    }

    .btn-friends-chat {
        background: rgba(224, 170, 255, 0.15) !important;
        border: 1px solid rgba(224, 170, 255, 0.4) !important;
        color: var(--text-lavender) !important;
    }

    .btn-close-chat {
        background: transparent !important;
        border: none !important;
        color: var(--text-lavender) !important;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        padding: 0 6px !important;
    }

    .chat-body {
        flex: 1;
        overflow-y: auto;
        border: 1px solid rgba(157, 78, 221, 0.2);
        border-radius: 8px;
        padding: 14px;
        background: rgba(6, 4, 12, 0.8) !important;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .chat-msg-wrapper {
        display: flex;
        gap: 10px;
        width: 100%;
        align-items: flex-start;
    }

    .chat-msg-wrapper.other-msg { flex-direction: row; }
    .chat-msg-wrapper.own-msg { flex-direction: row-reverse; }

    .msg-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
        border: 1.5px solid var(--border-purple);
        flex-shrink: 0;
        cursor: pointer;
    }

    .msg-content-container {
        display: flex;
        flex-direction: column;
        max-width: 80%;
    }

    .chat-msg-wrapper.own-msg .msg-content-container {
        align-items: flex-end;
    }

    .msg-header-info {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 3px;
        font-size: 11px;
    }

    .chat-msg-wrapper.own-msg .msg-header-info {
        flex-direction: row-reverse;
    }

    .sender {
        font-weight: 700;
        font-family: 'Rajdhani', sans-serif;
        letter-spacing: 0.5px;
    }

    .time-stamp {
        color: rgba(224, 170, 255, 0.4);
        font-size: 10px;
        font-family: 'JetBrains Mono', monospace;
    }

    .msg-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        opacity: 0.5;
        transition: opacity 0.2s ease;
    }

    .chat-msg-wrapper:hover .msg-actions { opacity: 1; }

    .btn-action-msg {
        color: rgba(255, 255, 255, 0.7);
        cursor: pointer;
        font-size: 11px;
        font-weight: bold;
    }

    .btn-action-msg:hover {
        color: var(--primary-accent);
    }

    .chat-msg {
        position: relative;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        user-select: text;
        word-break: break-word;
        width: fit-content;
        display: flex;
        flex-direction: column;
        line-height: 1.4;
    }

    .chat-msg-wrapper.other-msg .chat-msg {
        background: rgba(22, 16, 40, 0.9) !important;
        border: 1px solid rgba(157, 78, 221, 0.3) !important;
    }

    .chat-msg-wrapper.own-msg .chat-msg {
        background: rgba(35, 20, 58, 0.95) !important;
        border: 1px solid rgba(0, 245, 212, 0.3) !important;
    }

    .chat-msg .chat-media-img {
        max-width: 220px;
        max-height: 220px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 4px;
        border: 1px solid rgba(157, 78, 221, 0.3);
    }

    .chat-msg .chat-media-video {
        max-width: 240px;
        max-height: 220px;
        border-radius: 6px;
        margin-top: 4px;
        outline: none;
    }

    .msg-reactions-container {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
    }

    .chat-msg-wrapper.own-msg .msg-reactions-container {
        justify-content: flex-end;
    }

    .reaction-badge {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: rgba(18, 12, 32, 0.9);
        border: 1px solid rgba(157, 78, 221, 0.3);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 10px;
        cursor: pointer;
    }

    .reaction-badge.active-user {
        border-color: var(--primary-accent);
    }

    .reaction-badge .reaction-count {
        font-size: 10px;
        color: var(--primary-accent);
        font-weight: bold;
    }

    .reply-quote-box {
        background: rgba(0, 0, 0, 0.3);
        border-left: 2px solid var(--primary-accent);
        padding: 4px 8px;
        border-radius: 4px;
        margin-bottom: 6px;
        font-size: 10px;
    }

    .reply-quote-box .reply-author {
        color: var(--primary-accent);
        font-weight: bold;
    }

    .reply-quote-box .reply-text {
        color: rgba(255, 255, 255, 0.8);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
    }

    .chat-msg .msg-content {
        color: #f0f0f0 !important;
        white-space: pre-wrap;
    }

    .chat-msg .msg-content a {
        color: var(--primary-accent);
        text-decoration: underline;
    }

    .reply-preview-container {
        display: none;
        justify-content: space-between;
        align-items: center;
        background: rgba(157, 78, 221, 0.15);
        border-left: 3px solid var(--border-purple);
        padding: 6px 12px;
        border-radius: 6px;
        font-family: 'Rajdhani', sans-serif;
        font-size: 12px;
        flex-shrink: 0;
    }

    .reply-preview-text {
        color: #ffffff;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        max-width: 90%;
    }

    .btn-cancel-reply {
        color: var(--text-lavender);
        cursor: pointer;
        font-weight: bold;
    }

    .chat-footer {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
    }

    .user-profile-thumb {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        object-fit: cover;
        border: 1.5px solid var(--primary-accent);
        cursor: pointer;
    }

    .chat-footer input#chatUser {
        width: 110px;
        background: rgba(8, 5, 15, 0.9) !important;
        border: 1px solid rgba(157, 78, 221, 0.4) !important;
        color: var(--primary-accent) !important;
        padding: 8px 10px;
        border-radius: 6px;
        font-family: 'Rajdhani', sans-serif;
        font-size: 12px;
        outline: none;
        height: 38px;
        text-transform: uppercase;
        font-weight: bold;
    }

    .chat-footer textarea#chatText {
        flex: 1;
        background: rgba(8, 5, 15, 0.9) !important;
        border: 1px solid rgba(157, 78, 221, 0.4) !important;
        color: #fff !important;
        padding: 8px 12px;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        outline: none;
        resize: none;
        height: 38px;
        max-height: 80px;
        line-height: 1.3;
    }

    .chat-footer input:focus, .chat-footer textarea:focus {
        border-color: var(--primary-accent) !important;
    }

    .btn-attach-media {
        width: 38px !important;
        padding: 0 !important;
        flex: none !important;
        border-radius: 6px !important;
        border: 1px solid rgba(157, 78, 221, 0.4) !important;
        background: rgba(8, 5, 15, 0.9) !important;
        color: var(--text-lavender) !important;
        font-size: 11px !important;
        font-weight: bold;
        cursor: pointer;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .btn-send-chat {
        padding: 0 16px !important;
        flex: none !important;
        border-radius: 6px !important;
        border: 1px solid var(--primary-accent) !important;
        background: rgba(0, 245, 212, 0.15) !important;
        color: var(--primary-accent) !important;
        font-size: 12px !important;
        font-family: 'Rajdhani', sans-serif !important;
        letter-spacing: 1px !important;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .friends-nav-tabs {
        display: flex;
        gap: 6px;
        border-bottom: 1px solid rgba(157, 78, 221, 0.2);
        padding-bottom: 8px;
        margin-bottom: 10px;
    }

    .tab-btn {
        flex: 1;
        padding: 8px !important;
        font-size: 11px !important;
        border-radius: 6px !important;
    }

    .tab-btn.active {
        background: var(--border-purple) !important;
        color: #fff !important;
        border-color: var(--text-lavender) !important;
    }

    .friends-list-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 250px;
        overflow-y: auto;
    }

    .friend-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(8, 5, 15, 0.8);
        border: 1px solid rgba(157, 78, 221, 0.2);
        padding: 8px 12px;
        border-radius: 6px;
    }

    .friend-info {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .friend-name {

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const NAMA_ADMIN_RESMI = "JAKA SEMBUNG";

    let hasilTeksUntukDisalin = "";
    let isInitialLoad = true;
    let selectedReplyData = null; 
    let currentDataCount = 0;

    let activeUser = null; 
    let tempEditAvatar = "";

    let currentChatMode = "GLOBAL"; 
    let activeDMPartner = "";
    let activeRefPath = "team_chat_messages";

    const firebaseConfig = {
        databaseURL: "https://kasir-flop-chat-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    
    let dbChat = firebase.database().ref("team_chat_messages");
    const dbAccounts = firebase.database().ref("chat_accounts");
    const dbFriends = firebase.database().ref("user_friends");

    document.addEventListener("DOMContentLoaded", () => {
        const savedAccount = localStorage.getItem("chat_active_account");
        if (savedAccount) {
            const parsedAccount = JSON.parse(savedAccount);
            if (parsedAccount && parsedAccount.username) {
                activeUser = parsedAccount;
            } else {
                localStorage.removeItem("chat_active_account");
                activeUser = null;
            }
        }
    });

    function handleChatClick() {
        if (activeUser) {
            openTeamChat();
        } else {
            openAuthModal();
        }
    }

    function openAuthModal() {
        document.getElementById('mainContainer').classList.add('hidden-for-chat');
        document.getElementById('authModal').style.display = 'flex';
    }

    function closeAuthModal() {
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('mainContainer').classList.remove('hidden-for-chat');
    }

    function submitLogin() {
        const user = document.getElementById('loginUser').value.trim().toUpperCase();
        const pass = document.getElementById('loginPass').value.trim();

        if (!user || !pass) {
            alert("Nama dan Password wajib diisi!");
            return;
        }

        dbAccounts.child(user).once('value', (snapshot) => {
            if (snapshot.exists()) {
                const accData = snapshot.val();
                if (accData.password === pass) {
                    activeUser = { 
                        username: user,
                        avatar: accData.avatar || ("https://api.dicebear.com/7.x/bottts/svg?seed=" + user)
                    };
                    localStorage.setItem("chat_active_account", JSON.stringify(activeUser));
                    
                    document.getElementById('loginUser').value = '';
                    document.getElementById('loginPass').value = '';
                    
                    closeAuthModal();
                    openTeamChat();
                } else {
                    alert("Akses Ditolak: Password Salah");
                }
            } else {
                alert("Akses Ditolak: User ID Tidak Ditemukan");
            }
        });
    }

    function openRegisterModal() {
        if (!activeUser || activeUser.username !== NAMA_ADMIN_RESMI) {
            alert("Akses Ditolak: Hanya Admin yang dapat mendaftarkan akun baru.");
            return;
        }
        
        closeProfileModal();
        document.getElementById('regUser').value = '';
        document.getElementById('regPass').value = '';
        document.getElementById('registerModal').style.display = 'flex';
    }

    function closeRegisterModal() {
        document.getElementById('registerModal').style.display = 'none';
    }

    function submitRegisterNewUser() {
        if (!activeUser || activeUser.username !== NAMA_ADMIN_RESMI) {
            alert("Akses Ditolak!");
            return;
        }

        const newUser = document.getElementById('regUser').value.trim().toUpperCase();
        const newPass = document.getElementById('regPass').value.trim();

        if (!newUser || !newPass) {
            alert("Username dan Password baru tidak boleh kosong!");
            return;
        }

        dbAccounts.child(newUser).once('value', (snapshot) => {
            if (snapshot.exists()) {
                alert("Username tersebut sudah digunakan!");
            } else {
                dbAccounts.child(newUser).set({
                    password: newPass,
                    avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=" + newUser,
                    createdAt: new Date().toISOString()
                }, (error) => {
                    if (error) {
                        alert("Gagal membuat akun: " + error.message);
                    } else {
                        alert("Berhasil membuat akun baru untuk: " + newUser);
                        closeRegisterModal();
                    }
                });
            }
        });
    }

    function openProfileModal() {
        if (!activeUser) return;
        tempEditAvatar = activeUser.avatar;
        document.getElementById('editAvatarPreview').src = tempEditAvatar;
        document.getElementById('editUserName').value = activeUser.username;
        document.getElementById('editUserPass').value = '';
        
        const regBtn = document.getElementById('btnAdminOpenReg');
        if (activeUser.username === NAMA_ADMIN_RESMI) {
            regBtn.style.display = 'block';
        } else {
            regBtn.style.display = 'none';
        }

        document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfileModal() {
        document.getElementById('profileModal').style.display = 'none';
    }

    function handleEditAvatarUpload(event) {
        const file = event.target.files[0];
        if (file) {
            if (file.size > 500 * 1024) { 
                alert("Ukuran foto terlalu besar! Maksimal 500 KB.");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                tempEditAvatar = e.target.result;
                document.getElementById('editAvatarPreview').src = tempEditAvatar;
            };
            reader.readAsDataURL(file);
        }
    }

    function saveProfileChanges() {
        if (!activeUser) return;
        const newName = document.getElementById('editUserName').value.trim().toUpperCase();
        const newPass = document.getElementById('editUserPass').value.trim();

        if (!newName) {
            alert("Nama User tidak boleh kosong!");
            return;
        }

        const oldName = activeUser.username;

        dbAccounts.child(oldName).once('value', (snapshot) => {
            if (snapshot.exists()) {
                const currentData = snapshot.val();
                const updatedPass = newPass ? newPass : currentData.password;

                if (newName !== oldName) {
                    dbAccounts.child(newName).once('value', (checkSnap) => {
                        if (checkSnap.exists()) {
                            alert("Nama baru sudah digunakan pengguna lain!");
                        } else {
                            dbAccounts.child(newName).set({
                                password: updatedPass,
                                avatar: tempEditAvatar,
                                createdAt: currentData.createdAt || new Date().toISOString()
                            });
                            dbAccounts.child(oldName).remove();
                            
                            activeUser.username = newName;
                            activeUser.avatar = tempEditAvatar;
                            localStorage.setItem("chat_active_account", JSON.stringify(activeUser));
                            
                            updateChatHeaderProfile();
                            closeProfileModal();
                            alert("Profil berhasil diperbarui!");
                        }
                    });
                } else {
                    dbAccounts.child(oldName).update({
                        password: updatedPass,
                        avatar: tempEditAvatar
                    });
                    
                    activeUser.avatar = tempEditAvatar;
                    localStorage.setItem("chat_active_account", JSON.stringify(activeUser));
                    
                    updateChatHeaderProfile();
                    closeProfileModal();
                    alert("Profil berhasil diperbarui!");
                }
            }
        });
    }

    function updateChatHeaderProfile() {
        if (activeUser) {
            document.getElementById('chatUser').value = activeUser.username;
            document.getElementById('myChatAvatar').src = activeUser.avatar;
        }
    }

    function viewFullsizeImage(avatarUrl, username) {
        document.getElementById('fullsizeImage').src = avatarUrl;
        document.getElementById('fullsizeUsername').innerText = username;
        document.getElementById('imageViewerModal').style.display = 'flex';
    }

    function closeImageViewer() {
        document.getElementById('imageViewerModal').style.display = 'none';
    }

    function logoutChat() {
        if (confirm("Yakin ingin logout dari akun chat?")) {
            activeUser = null;
            localStorage.removeItem("chat_active_account");
            closeTeamChat();
        }
    }

    function openFriendsModal() {
        if (!activeUser) return;
        document.getElementById('friendsModal').style.display = 'flex';
        switchFriendsTab('friends');
    }

    function closeFriendsModal() {
        document.getElementById('friendsModal').style.display = 'none';
    }

    function switchFriendsTab(tab) {
        document.getElementById('tabFriendsBtn').classList.remove('active');
        document.getElementById('tabRequestsBtn').classList.remove('active');
        document.getElementById('tabAddBtn').classList.remove('active');

        document.getElementById('tabFriendsContent').style.display = 'none';
        document.getElementById('tabRequestsContent').style.display = 'none';
        document.getElementById('tabAddContent').style.display = 'none';

        if (tab === 'friends') {
            document.getElementById('tabFriendsBtn').classList.add('active');
            document.getElementById('tabFriendsContent').style.display = 'flex';
            loadFriendsList();
        } else if (tab === 'requests') {
            document.getElementById('tabRequestsBtn').classList.add('active');
            document.getElementById('tabRequestsContent').style.display = 'flex';
            loadFriendRequests();
        } else if (tab === 'add') {
            document.getElementById('tabAddBtn').classList.add('active');
            document.getElementById('tabAddContent').style.display = 'flex';
        }
    }

    function sendFriendRequest() {
        const targetUser = document.getElementById('targetFriendUser').value.trim().toUpperCase();
        if (!targetUser) return alert("Masukkan User ID!");
        if (targetUser === activeUser.username) return alert("Tidak bisa menambahkan diri sendiri!");

        dbAccounts.child(targetUser).once('value', (snapshot) => {
            if (snapshot.exists()) {
                dbFriends.child(targetUser).child('requests').child(activeUser.username).set(true, (err) => {
                    if (!err) {
                        alert("Permintaan pertemanan terkirim ke " + targetUser);
                        document.getElementById('targetFriendUser').value = '';
                    }
                });
            } else {
                alert("User ID tidak ditemukan!");
            }
        });
    }

    function loadFriendsList() {
        const container = document.getElementById('tabFriendsContent');
        container.innerHTML = 'Loading...';

        dbFriends.child(activeUser.username).child('list').once('value', (snapshot) => {
            container.innerHTML = '';
            if (!snapshot.exists()) {
                container.innerHTML = '<div style="font-size:11px; text-align:center;">Belum ada teman.</div>';
                return;
            }

            snapshot.forEach((child) => {
                const friendName = child.key;
                const card = document.createElement('div');
                card.className = 'friend-card';
                card.innerHTML = `
                    <div class="friend-info">
                        <span class="friend-name">${friendName}</span>
                    </div>
                    <button class="btn-action-friend" onclick="startPrivateChat('${friendName}')">CHAT PRIVATE</button>
                `;
                container.appendChild(card);
            });
        });
    }

    function loadFriendRequests() {
        const container = document.getElementById('tabRequestsContent');
        container.innerHTML = 'Loading...';

        dbFriends.child(activeUser.username).child('requests').once('value', (snapshot) => {
            container.innerHTML = '';
            if (!snapshot.exists()) {
                container.innerHTML = '<div style="font-size:11px; text-align:center;">Tidak ada permintaan.</div>';
                return;
            }

            snapshot.forEach((child) => {
                const requester = child.key;
                const card = document.createElement('div');
                card.className = 'friend-card';
                card.innerHTML = `
                    <div class="friend-info">
                        <span class="friend-name">${requester}</span>
                    </div>
                    <div style="display:flex; gap:4px;">
                        <button class="btn-action-friend" style="background:var(--primary-accent); color:#000;" onclick="acceptFriend('${requester}')">TERIMA</button>
                        <button class="btn-action-friend" style="background:#ff4d6d;" onclick="rejectFriend('${requester}')">TOLAK</button>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    }

    function acceptFriend(requester) {
        dbFriends.child(activeUser.username).child('list').child(requester).set(true);
        dbFriends.child(requester).child('list').child(activeUser.username).set(true);
        dbFriends.child(activeUser.username).child('requests').child(requester).remove();
        alert("Sekarang Anda berteman dengan " + requester);
        loadFriendRequests();
    }

    function rejectFriend(requester) {
        dbFriends.child(activeUser.username).child('requests').child(requester).remove();
        loadFriendRequests();
    }

    function startPrivateChat(targetUser) {
        closeFriendsModal();
        currentChatMode = "PERSONAL";
        activeDMPartner = targetUser;

        const sorted = [activeUser.username, targetUser].sort();
        const roomId = `${sorted[0]}_${sorted[1]}`;
        activeRefPath = `direct_messages/${roomId}`;

        document.getElementById('chatTitleHeader').innerText = `DM: ${targetUser}`;
        switchChatRoom(activeRefPath);
    }

    function switchChatRoom(path) {
        if (dbChat) dbChat.off();
        document.getElementById('chatLogs').innerHTML = '';
        dbChat = firebase.database().ref(path);

        dbChat.limitToLast(60).on('child_added', (snapshot) => {
            renderMessage(snapshot.key, snapshot.val());
        });

        dbChat.limitToLast(60).on('child_changed', (snapshot) => {
            renderMessage(snapshot.key, snapshot.val());
        });

        dbChat.on('child_removed', (snapshot) => {
            const el = document.getElementById(`msg-${snapshot.key}`);
            if (el) el.remove();
        });
    }

    function handleMediaUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) { 
            alert("File terlalu besar! Maksimal ukuran 2 MB.");
            return;
        }

        const isVideo = file.type.startsWith('video/');
        const reader = new FileReader();

        reader.onload = function(e) {
            const base64Data = e.target.result;
            const payload = {
                user: activeUser.username,
                avatar: activeUser.avatar,
                mediaData: base64Data,
                isMedia: true,
                mediaType: isVideo ? 'video' : 'image',
                timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
            };

            if (selectedReplyData) {
                payload.replyTo = selectedReplyData;
            }

            dbChat.push(payload);
            cancelReply();
        };

        reader.readAsDataURL(file);
        event.target.value = ''; 
    }

    function openTeamChat() {
        if (!activeUser) {
            alert("Akses Ditolak: Silakan login terlebih dahulu.");
            openAuthModal();
            return;
        }
        document.getElementById('mainContainer').classList.add('hidden-for-chat');
        updateChatHeaderProfile();

        currentChatMode = "GLOBAL";
        activeRefPath = "team_chat_messages";
        document.getElementById('chatTitleHeader').innerText = "T-Chat";
        switchChatRoom(activeRefPath);

        document.getElementById('chatModal').style.display = 'flex';
        document.getElementById('chatText').focus();
    }

    function closeTeamChat() {
        document.getElementById('chatModal').style.display = 'none';
        document.getElementById('mainContainer').classList.remove('hidden-for-chat');
    }

    function toggleBtnPosition() {
        const btnGroup = document.getElementById('btnGroup');
        btnGroup.classList.toggle('swapped');
    }

    const userColors = [
        '#00f5d4', '#e0aaff', '#70e000', '#ffb703', 
        '#00b4d8', '#ff4d6d', '#3a86ff', '#fb5607'
    ];

    function getUserColor(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        return userColors[Math.abs(hash) % userColors.length];
    }

    function formatChatMessage(text) {
        if (!text) return '';
        let formatted = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        formatted = formatted.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
        formatted = formatted.replace(/_(.*?)_/g, '<em>$1</em>');
        formatted = formatted.replace(/`(.*?)`/g, '<code>$1</code>');

        const urlPattern = /(https?:\/\/[^\s]+)/g;
        formatted = formatted.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener">$1</a>');

        return formatted;
    }

    function setReplyToMessage(user, text) {
        selectedReplyData = { user: user.toUpperCase(), text };
        const previewBox = document.getElementById('replyPreview');
        const previewText = document.getElementById('replyPreviewText');
        
        previewText.innerHTML = `Membalas <b>${user.toUpperCase()}</b>: "${text}"`;
        previewBox.style.display = 'flex';
        document.getElementById('chatText').focus();
    }

    function cancelReply() {
        selectedReplyData = null;
        document.getElementById('replyPreview').style.display = 'none';
    }

    function renderMessage(key, data) {
        const chatLogs = document.getElementById('chatLogs');
        const currentUser = activeUser ? activeUser.username : '';
        
        const username = (data.user || 'USER').toUpperCase();
        const isSelf = (username === currentUser && currentUser !== '');
        const avatarUrl = data.avatar || ("https://api.dicebear.com/7.x/bottts/svg?seed=" + username);

        let wrapperDiv = document.getElementById(`msg-${key}`);
        
        if (!wrapperDiv) {
            wrapperDiv = document.createElement('div');
            wrapperDiv.className = `chat-msg-wrapper ${isSelf ? 'own-msg' : 'other-msg'}`;
            wrapperDiv.id = `msg-${key}`;
        } else {
            wrapperDiv.innerHTML = ''; 
        }

        const color = getUserColor(username);
        const isAdmin = (username === NAMA_ADMIN_RESMI);
        const badgeAdmin = isAdmin 
            ? `<span style="background: var(--border-purple); color: #ffffff; font-size: 8px; padding: 1px 5px; border-radius: 3px; margin-left: 5px; font-weight: bold;">ADMIN</span>` 
            : '';

        const safeUser = username.replace(/'/g, "\\'");
        const safeText = (data.msg || (data.isMedia ? '[Media]' : '')).replace(/'/g, "\\'").replace(/\n/g, ' ');

        const avatarImg = document.createElement('img');
        avatarImg.className = 'msg-avatar';
        avatarImg.src = avatarUrl;
        avatarImg.alt = username;
        avatarImg.onclick = () => viewFullsizeImage(avatarUrl, username);

        const contentContainer = document.createElement('div');
        contentContainer.className = 'msg-content-container';

        const headerInfoDiv = document.createElement('div');
        headerInfoDiv.className = 'msg-header-info';
        headerInfoDiv.innerHTML = `
            <span class="sender" style="color: ${color};">${username}${badgeAdmin}</span>
            <span class="time-stamp">${data.timestamp || ''}</span>
            <div class="msg-actions">
                <span class="btn-action-msg" title="Balas Pesan Ini" onclick="setReplyToMessage('${safeUser}', '${safeText}')">REPLY</span>
            </div>
        `;

        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-msg';

        let replyHTML = '';
        if (data.replyTo) {
            replyHTML = `
                <div class="reply-quote-box">
                    <span class="reply-author">${data.replyTo.user.toUpperCase()}</span>
                    <span class="reply-text">${formatChatMessage(data.replyTo.text)}</span>
                </div>
            `;
        }

        let contentHTML = '';
        if (data.isMedia) {
            if (data.mediaType === 'image') {
                contentHTML = `<img class="chat-media-img" src="${data.mediaData}" onclick="viewFullsizeImage('${data.mediaData}', '${username}')" />`;
            } else if (data.mediaType === 'video') {
                contentHTML = `<video class="chat-media-video" src="${data.mediaData}" controls></video>`;
            }
        } else {
            contentHTML = `<span class="msg-content">${formatChatMessage(data.msg)}</span>`;
        }

        msgDiv.innerHTML = `${replyHTML}${contentHTML}`;

        contentContainer.appendChild(headerInfoDiv);
        contentContainer.appendChild(msgDiv);

        wrapperDiv.appendChild(avatarImg);
        wrapperDiv.appendChild(contentContainer);

        if (!document.getElementById(`msg-${key}`)) {
            chatLogs.appendChild(wrapperDiv);
        }
        
        chatLogs.scrollTop = chatLogs.scrollHeight;
    }

    function sendChatMessage() {
        if (!activeUser) return;
        const textInput = document.getElementById('chatText');
        const messageText = textInput.value.trim();

        if (messageText) {
            const payload = {
                user: activeUser.username,
                avatar: activeUser.avatar,
                msg: messageText,
                timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
            };

            if (selectedReplyData) {
                payload.replyTo = selectedReplyData;
            }

            dbChat.push(payload);
            textInput.value = '';
            textInput.style.height = '38px';
            cancelReply();
        }
    }

    function clearAllChat() {
        if (!activeUser || activeUser.username !== NAMA_ADMIN_RESMI) {
            alert("Akses Ditolak: Hanya Admin yang bisa mereset obrolan.");
            return;
        }

        if (confirm("Yakin ingin menghapus seluruh obrolan chat ini?")) {
            dbChat.remove();
            document.getElementById('chatLogs').innerHTML = '';
        }
    }

    function handleChatKey(e) {
        if (e.key === 'Enter') {
            if (e.shiftKey) {
                return;
            } else {
                e.preventDefault();
                sendChatMessage();
            }
        }
    }

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        const counter = document.getElementById('dataCounter');
        
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) {
            currentDataCount = 0;
            counter.innerText = "DATA";
            return;
        }

        let parsedLogList = [];
        let lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');

        if (lines.length === 1 && !lines[0].includes('\t')) {
            let rawChunk = lines[0].replace(/(ACCEPT|REJECT|PENDING|SUCCESS|FAILED)[a-zA-Z0-9]*/gi, "$&\n");
            lines = rawChunk.split('\n').map(l => l.trim()).filter(l => l !== '');
        }

        lines.forEach(line => {
            let matchTime = line.match(/(\d{2}:\d{2}:\d{2})/);
            if (!matchTime) return;
            let waktu = matchTime[1];

            let parts = line.split(/\t|\s{2,}/).map(p => p.trim()).filter(p => p !== '');
            
            if (parts.length >= 5) {
                let userId = parts[2] || "-";
                let bankInfo = parts[4] || "-";
                let jumlah = parts[6] || parts[5] || "0";
                
                jumlah = jumlah.replace(/^-/, '').trim();

                parsedLogList.push({
                    waktu: waktu,
                    userId: userId,
                    tujuanBank: bankInfo,
                    creditStatus: "0",
                    jumlah: jumlah
                });
            } else {
                let timeIndex = line.indexOf(waktu);
                let textAfterTime = line.substring(timeIndex + waktu.length);
                let matchType = textAfterTime.match(/(Withdraw|Deposit)/i);

                if (matchType) {
                    let typeIndex = textAfterTime.search(/(Withdraw|Deposit)/i);
                    let userId = textAfterTime.substring(0, typeIndex).trim();
                    let textAfterType = textAfterTime.substring(typeIndex + matchType[0].length);

                    let matchAmount = textAfterType.match(/-?([0-9.,]+)(?:\s|\t|ACCEPT|REJECT|PENDING|SUCCESS|FAILED|$)/i);
                    let jumlah = "0";
                    let bankSection = textAfterType;

                    if (matchAmount) {
                        jumlah = matchAmount[1].replace(/^-/, '');
                        let amountIndex = textAfterType.indexOf(matchAmount[0]);
                        bankSection = textAfterType.substring(0, amountIndex).trim();
                    }

                    bankSection = bankSection.replace(/-\s*$/, '').trim();

                    parsedLogList.push({
                        waktu: waktu,
                        userId: userId,
                        tujuanBank: bankSection,
                        creditStatus: "0",
                        jumlah: jumlah
                    });
                }
            }
        });

        parsedLogList.reverse();

        let barisDataDisalin = [];

        parsedLogList.forEach((item) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${item.waktu}</td><td>${item.userId}</td><td>${item.tujuanBank}</td><td>${item.creditStatus}</td><td>${item.jumlah}</td>`;
            tbody.appendChild(tr);

            barisDataDisalin.push(`${item.waktu}\t${item.userId}\t${item.tujuanBank}\t\t${item.jumlah}`);
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
        currentDataCount = parsedLogList.length;
        counter.innerText = `${currentDataCount} DATA`;
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        currentDataCount = 0;
        document.getElementById('dataCounter').innerText = "0 DATA";
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        const txt = document.getElementById('txtCopy');
        
        if (!hasilTeksUntukDisalin) {
            txt.innerText = "DATA KOSONG!";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1000);
            return;
        }
        
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            txt.innerText = "BERHASIL DISALIN";
            setTimeout(() => { txt.innerText = "SALIN DATA"; }, 1200);
        }).catch(err => {
            console.error("Error: ", err);
        });
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            if (document.getElementById('imageViewerModal').style.display === 'flex') {
                closeImageViewer();
            } else if (document.getElementById('friendsModal').style.display === 'flex') {
                closeFriendsModal();
            } else if (document.getElementById('registerModal').style.display === 'flex') {
                closeRegisterModal();
            } else if (document.getElementById('profileModal').style.display === 'flex') {
                closeProfileModal();
            } else if (document.getElementById('chatModal').style.display === 'flex') {
                closeTeamChat();
            } else if (document.getElementById('authModal').style.display === 'flex') {
                closeAuthModal();
            } else {
                resetData();
            }
        }
        if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            salinHasil();
        }
    });
</script>
