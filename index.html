<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Reaction System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .chat-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* Gelembung Pesan - Murni Teks */
    .message-bubble {
      background-color: #0084ff;
      color: white;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      max-width: 80%;
      word-wrap: break-word;
    }

    /* Reaksi Dipisah di Luar Gelembung */
    .active-reactions {
      display: none;
      margin-top: -10px;
      margin-left: 12px;
      z-index: 2;
    }

    .reaction-badge {
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 2px 6px;
      font-size: 13px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.12);
      display: inline-block;
      animation: pop 0.15s ease-out;
    }

    /* Pilihan Emot Lengkap */
    .reaction-picker {
      display: flex;
      gap: 6px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      padding: 6px 10px;
      border-radius: 20px;
      margin-top: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow-x: auto;
      max-width: 100%;
    }

    .reaction-picker span {
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
    }

    .reaction-picker span:hover {
      transform: scale(1.3);
    }

    @keyframes pop {
      0% { transform: scale(0.5); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="message-wrapper">
      <div class="message-bubble">
        Halo! Klik emot untuk pasang reaksi. Klik lagi emot yang sama untuk hapus.
      </div>
      <div class="active-reactions" id="reaction-display-1"></div>
      
      <!-- List Emot yang Lebih Banyak -->
      <div class="reaction-picker">
        <span onclick="toggleReaction(1, '👍')">👍</span>
        <span onclick="toggleReaction(1, '❤️')">❤️</span>
        <span onclick="toggleReaction(1, '😂')">😂</span>
        <span onclick="toggleReaction(1, '😮')">😮</span>
        <span onclick="toggleReaction(1, '😢')">😢</span>
        <span onclick="toggleReaction(1, '😡')">😡</span>
        <span onclick="toggleReaction(1, '🔥')">🔥</span>
        <span onclick="toggleReaction(1, '🎉')">🎉</span>
        <span onclick="toggleReaction(1, '🙏')">🙏</span>
        <span onclick="toggleReaction(1, '💩')">💩</span>
        <span onclick="toggleReaction(1, '👀')">👀</span>
        <span onclick="toggleReaction(1, '💯')">💯</span>
      </div>
    </div>
  </div>

  <script>
    const messageReactions = {};

    function toggleReaction(messageId, emoji) {
      if (!messageReactions[messageId]) {
        messageReactions[messageId] = null;
      }

      // Hapus jika emot yang diklik sama (Klik 2x)
      if (messageReactions[messageId] === emoji) {
        messageReactions[messageId] = null;
      } else {
        messageReactions[messageId] = emoji;
      }

      renderReaction(messageId);
    }

    function renderReaction(messageId) {
      const displayElement = document.getElementById(`reaction-display-${messageId}`);
      const currentEmoji = messageReactions[messageId];

      if (currentEmoji) {
        displayElement.innerHTML = `<span class="reaction-badge">${currentEmoji}</span>`;
        displayElement.style.display = 'block';
      } else {
        displayElement.innerHTML = '';
        displayElement.style.display = 'none';
      }
    }
  </script>

</body>
</html>
