<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP KASIR - GEAR 5 REVERSE MODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=400;700;900&family=Rajdhani:wght=500;600;700&display=swap" rel="stylesheet">
    
<style>
    /* TRUMF CARD: MEMAKSA BROWSER LU YANG MEMBUATKAN TEMA GELAPNYA */
    html, body {
        background-color: #ffffff !important; /* Sengaja dibikin putih total */
        color: #000000 !important;            /* Sengaja dibikin hitam total */
        font-family: 'Rajdhani', sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    
    /* KOTAK UTAMA KASIR */
    .container {
        background-color: #f5f5f5 !important; /* Abu-abu terang, nanti bakal diubah jadi abu gelap oleh browser */
        border: 4px solid #000000 !important; /* Border hitam, nanti bakal diubah jadi putih/terang oleh browser */
        border-radius: 16px; 
        width: 100%;
        max-width: 950px;
        padding: 40px;
        box-sizing: border-box;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    
    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        color: #000000 !important; /* Nanti otomatis jadi teks putih besar */
        font-size: 36px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 8px;
        margin: 0;
    }

    .sub-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 13px;
        color: #555555 !important; /* Nanti otomatis jadi teks terang */
        letter-spacing: 5px;
        font-weight: 900;
        text-transform: uppercase;
        margin-top: 8px;
        margin-bottom: 35px;
    }
    
    label {
        display: block;
        font-weight: 700;
        margin-bottom: 12px;
        color: #222222 !important; 
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    
    /* INPUT AREA */
    textarea {
        width: 100%;
        height: 140px;
        background: #ffffff !important;
        border: 2px solid #000000 !important; 
        border-radius: 10px;
        color: #000000 !important;
        padding: 18px;
        box-sizing: border-box;
        resize: vertical;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 30px;
    }
    
    .btn-group {
        display: flex;
        gap: 15px;
        margin-bottom: 40px;
    }
    
    button {
        font-family: 'Orbitron', sans-serif;
        flex: 1;
        padding: 18px; 
        font-size: 13px;   
        font-weight: 900;
        border: 2px solid #000000 !important;
        border-radius: 10px; 
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2.5px;
    }
    
    .btn-submit { 
        background: #000000 !important; 
        color: #ffffff !important; 
    }
    
    .btn-copy { 
        background: #ffffff !important; 
        color: #000000 !important; 
    }
    
    .btn-reset { 
        background: #dddddd !important; 
        color: #000000 !important; 
    }
    
    /* TABEL DATA (TANPA CREDIT) */
    .table-container { 
        overflow-x: auto; 
        margin-top: 5px; 
        border-radius: 12px;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
    }
    
    th, td {
        padding: 16px 20px;
        text-align: left;
        font-size: 14px;
    }
    
    th { 
        font-family: 'Orbitron', sans-serif;
        background-color: #eeeeee !important; 
        color: #000000 !important; 
        font-weight: 900; 
        letter-spacing: 2px;
        text-transform: uppercase;
        border-bottom: 3px solid #000000 !important;
    }
    
    td {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        color: #111111 !important;
        border-bottom: 1px solid #e0e0e0 !important;
    }

    td:nth-child(4) {
        font-family: 'Orbitron', sans-serif;
        color: #000000 !important; 
        font-weight: 900;
    }
    
    tr:nth-child(even) {
        background-color: #f9f9f9 !important;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Rumus Flop</h1>
    <div class="sub-title">JOY BOY REVERSE MODE - v8.0</div>
    
    <label for="rawInput">Tempel log transaksi disini:</label>
    <textarea id="rawInput" placeholder="READY TO TRANSLATE LOGS..."></textarea>
    
    <div class="btn-group">
        <button id="btnSubmit" class="btn-submit" onclick="konversiLog()">Submit</button>
        <button id="btnCopy" class="btn-copy" onclick="salinHasil()">Salin Data</button>
        <button id="btnReset" class="btn-reset" onclick="resetData()">Reset</button>
    </div>

    <label>Hasil Konversi:</label>
    <div class="table-container">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>WAKTU</th>
                    <th>Used ID</th>
                    <th>Tujuan Bank</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let hasilTeksUntukDisalin = "";

    function konversiLog() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        hasilTeksUntukDisalin = ""; 

        if (!input) return;

        let baris = input.split('\n');
        baris.reverse(); 

        let barisDataDisalin = [];

        baris.forEach(line => {
            if (line.trim() === '') return;

            let kolom = line.split(/\s{2,}|\t/).filter(item => item.trim() !== '');
            if (kolom.length < 4) {
                kolom = line.split(/\s+/).filter(item => item.trim() !== '');
            }

            if (kolom.length >= 3) {
                let waktu = "00:00:00";
                let userId = "-";
                let tujuanBank = "-";
                let jumlah = "0";

                let waktuDitemukan = kolom.find(k => k.includes(':'));
                if (waktuDitemukan) {
                    let matchWaktu = waktuDitemukan.match(/\d{2}:\d{2}(:\d{2})?/);
                    if (matchWaktu) waktu = matchWaktu[0];
                }

                for (let i = kolom.length - 1; i >= 0; i--) {
                    let nilaiBersih = kolom[i].replace(/[,.-]/g, '').trim();
                    if (nilaiBersih !== '' && !isNaN(nilaiBersih) && nilaiBersih.length >= 3) {
                        jumlah = kolom[i];
                        break;
                    }
                }

                let bankDitemukan = kolom.find(k => {
                    let upper = k.toUpperCase();
                    return upper.includes('BCA') || upper.includes('MANDIRI') || upper.includes('BRI') || upper.includes('BNI') || upper.includes('CIMB') || upper.includes('DANAMON') || upper.includes(',');
                });
                if (bankDitemukan) tujuanBank = bankDitemukan;

                let kandidatUser = kolom.filter(k => k !== waktuDitemukan && k !== bankDitemukan && k !== jumlah && isNaN(k.replace(/[,.-]/g, '')));
                if (kandidatUser.length > 0) {
                    userId = kandidatUser[0]; 
                } else {
                    userId = kolom[1] || "-";
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${waktu}</td><td>${userId}</td><td>${tujuanBank}</td><td>${jumlah}</td>`;
                tbody.appendChild(tr);

                barisDataDisalin.push(`${waktu}\t${userId}\t${tujuanBank}\t${jumlah}`);
            }
        });

        hasilTeksUntukDisalin = barisDataDisalin.join('\n');
    }

    function resetData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('tableBody').innerHTML = '';
        hasilTeksUntukDisalin = "";
        document.getElementById('rawInput').focus();
    }

    function salinHasil() {
        if (!hasilTeksUntukDisalin) {
            alert("Tidak ada data untuk disalin!");
            return;
        }
        navigator.clipboard.writeText(hasilTeksUntukDisalin).then(() => {
            alert("Berhasil menyalin data!");
        });
    }
</script>
</body>
</html>
